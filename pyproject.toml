# pyproject.toml

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flagquantum"
dynamic = ["version"]
description = "A distributed quantum computing framework built on PyTorch"
authors = [
    {name = "FlagQuantum Team", email = "flagquantum@gmail.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5,<2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.0",
    "build>=1.2.0",
    "pre-commit>=3.7.0",
    "tomli>=2.0; python_version < '3.11'",
    # The lane-policy tests read `.github/workflows/*.yml` as documents rather
    # than as text, so that a job's runner labels and its concurrency block are
    # compared as structure. `pre-commit` also pulls PyYAML in, but a test that
    # imports a library should say so itself.
    "pyyaml>=6.0",
]

jax = [
    "jax>=0.10,<0.11",
]

cotengra = [
    "cotengra>=0.8,<0.9",
]

cuda = [
    "triton>=3.1,<4",
]

braket = [
    "amazon-braket-sdk>=1.117,<2",
]

quafu = [
    "quarkcircuit>=0.5.13,<0.6; python_version >= '3.12'",
]

qiskit = [
    "qiskit[qasm3-import]>=2,<3",
    "qiskit-aer>=0.17,<1",
    "sympy>=1.13,<2",
]

pennylane = [
    "pennylane>=0.44.1,<0.46; python_version >= '3.11'",
]

interop-all = [
    "amazon-braket-sdk>=1.117,<2",
    "pennylane>=0.44.1,<0.46; python_version >= '3.11'",
    "quarkcircuit>=0.5.13,<0.6; python_version >= '3.12'",
    "qiskit[qasm3-import]>=2,<3",
    "qiskit-aer>=0.17,<1",
    "sympy>=1.13,<2",
]

examples = [
    "datasets>=2.20.0",
    "transformers>=4.40.0",
]

viz = [
    "matplotlib>=3.5.0",
]

invertible = [
    "torch>=2.5,<2.14",
]

all = [
    "pytest>=7.0.0",
     "pytest-cov>=4.0.0",
     "pytest-xdist>=3.0.0",
     "ruff>=0.1.0",
     "black>=23.0",
     "mypy>=1.0",
     "build>=1.2.0",
     "pre-commit>=3.7.0",
     "tomli>=2.0; python_version < '3.11'",
     "pyyaml>=6.0",
     "matplotlib>=3.5.0",
     "jax>=0.10,<0.11",
     "datasets>=2.20.0",
     "transformers>=4.40.0",
     "triton>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/flagos-ai/FlagQuantum"
Repository = "https://github.com/flagos-ai/FlagQuantum"
Issues = "https://github.com/flagos-ai/FlagQuantum/issues"

[project.scripts]
flagquantum-benchmark = "flagquantum.benchmarking.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flagquantum*"]
exclude = ["tests*", "docs*", "scripts*", "examples*"]

[tool.setuptools.package-data]
flagquantum = [
    "simulation/numerics/double-single-contract.toml",
    "runtime/profiles/*.json",
]

[tool.setuptools.dynamic]
version = {attr = "flagquantum.version.__version__"}

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Families are selected rule by rule rather than wholesale. A family gains
# members when ruff is upgraded, and a gate that widens without a reviewer
# seeing it is worse than one that stays put. Every entry below is either fully
# mechanical (`ruff --fix` alone reaches zero) or a defect class this change
# fixed by hand.
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    # Move the deprecated `typing` aliases to `collections.abc`.
    "UP035",
    # Remove parentheses that do not group anything.
    "UP034",
    # Declarations and suppressions that stopped doing anything.
    "RUF010",
    "RUF100",
    # Comprehension, idiom, and dead-branch cleanups.
    "C420",
    "PIE808",
    "RET501",
    "RET505",
    "SIM114",
    "SIM117",
    "SIM300",
    # Every `zip` states whether it pairs sequences of equal length or truncates
    # the longer one. `strict=True` turns a length mismatch into an error instead
    # of a silent short result; `strict=False` records that the truncation is
    # intended, as in the adjacent-pair idiom `zip(x, x[1:])`.
    "B905",
    # Every `raise` inside an `except` clause names the cause it is re-raising,
    # so a refusal or a wrap keeps the condition that produced it. Without the
    # cause, a wrapped failure reads as if it were raised on the happy path.
    "B904",
    # A function defined inside a loop reads its loop variables when it runs,
    # not when it is defined, so a nested function that outlives its iteration
    # silently reads the last value the loop left behind. Binding the variable
    # as a parameter freezes it to the iteration that created the function.
    "B023",
    # Defect classes: mutable state shared between instances, and a default or
    # class body that evaluates a call once at import instead of once per use.
    "B008",
    "B039",
    "RUF009",
    "RUF012",
]
# E501 stays ignored: the formatter owns line width, and the remaining long
# lines are URLs and contract strings that carry no useful break points.
#
# Five rules that look like good candidates stay off, because each rewrites
# text this repository pins and would spend a contract change on cosmetics.
#
# RUF022 sorts `__all__`, and `__all__` order is pinned: the API migration
# records compare it element by element (`test_public_api_candidate.py`,
# `test_interop_protocol_candidate.py`), so sorting one namespace reads as a
# namespace change.
#
# RUF036 sorts `None` to the end of a union, and RUF009-adjacent union order
# appears in public signatures, which `tools/public_api_snapshot.py` pins as
# text. Reordering them turns a style fix into an "authorized API signature
# changed" entry that a reviewer has to wave through.
#
# UP006, UP037, and UP045 rewrite annotation source text. Every module here
# imports `from __future__ import annotations`, so the annotation *string* is
# the source text, and the pinned signature records compare that string.
# Removing a pair of quotes from `-> "TwinCircuitSupport"` is invisible at
# runtime and a diff in the record.
#
# B009 and B010 rewrite `getattr(owner, "policy")` and
# `setattr(owner, "precision", ...)`. This codebase writes those on purpose, to
# mark an attribute the stubs do not carry: `torch.flagos` is registered at
# import, `torch.linalg.LinAlgError` has no typed export, and `nn.Module`
# resolves an undeclared attribute to `Tensor | Module` through its own
# `__getattr__`. Rewriting them removes the marker and, now that the whole
# package is checked under `--strict`, fails the type gate at four of them.
#
# The rules are right in general and wrong for these conventions, so the
# conventions win. Each stays available to a change that edits the pinned text
# for a real reason.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"flagquantum/__init__.py" = ["F401", "F403"]
"flagquantum/observables/__init__.py" = ["E743", "N802"]
"flagquantum/simulation/tensor.py" = ["F822"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
