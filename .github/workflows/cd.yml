name: CD

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to validate, build, and publish
        required: true
        type: string

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.event.release.tag_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: pr-default
            extras: dev
          - tier: pr-runtime
            extras: dev
          - tier: pr-distributed
            extras: dev,jax

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release candidate dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "torch>=2.13,<2.14" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-build-isolation -e ".[${{ matrix.extras }}]"
      - name: Run ${{ matrix.tier }} release validation
        run: python tools/ci_tier.py "${{ matrix.tier }}"

  build-sdist:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build setuptools wheel
      - run: python -m pip install "torch>=2.13,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - name: Build source distribution
        run: python -m build --sdist --no-isolation
      - name: Verify source distribution
        run: python tools/verify_distribution_artifacts.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: flagquantum-release-sdist
          path: dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-wheels:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: manylinux-x86_64
          - os: macos-14
            artifact: macos-arm64
          - os: windows-2022
            artifact: windows-amd64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Build and test CPython 3.10-3.12 wheels
        uses: pypa/cibuildwheel@v4.3.0
        with:
          output-dir: wheelhouse
      - name: Verify wheel contents
        run: python tools/verify_distribution_artifacts.py wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: flagquantum-release-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@v4
        with:
          pattern: flagquantum-release-*
          path: dist
          merge-multiple: true
      - name: Verify the complete release matrix
        run: python tools/verify_distribution_artifacts.py --release-matrix dist
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
