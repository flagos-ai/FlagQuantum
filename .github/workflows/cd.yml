name: CD

on:
  release:
    types: [published]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and validate release candidate
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "torch>=2.13,<2.14" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-build-isolation -e '.[dev]'
          python tools/ci_tier.py pr-default
          python tools/ci_tier.py pr-runtime
          python tools/ci_tier.py pr-distributed

  build-sdist:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build setuptools wheel
      - run: python -m pip install "torch>=2.13,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - name: Build source distribution
        run: python -m build --sdist --no-isolation
      - name: Verify source distribution
        run: python tools/verify_distribution_artifacts.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: flagquantum-release-sdist
          path: dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-wheels:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: manylinux-x86_64
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: windows-2022
            artifact: windows-amd64

    steps:
      - uses: actions/checkout@v4
      - name: Build and test CPython 3.10-3.12 wheels
        uses: pypa/cibuildwheel@v4.3.0
        with:
          output-dir: wheelhouse
      - name: Verify wheel contents
        run: python tools/verify_distribution_artifacts.py wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: flagquantum-release-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: flagquantum-release-*
          path: dist
          merge-multiple: true
      - name: Verify the complete release matrix
        run: python tools/verify_distribution_artifacts.py --release-matrix dist
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
