name: Security Scorecard

on:
  schedule:
    - cron: "19 20 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flagquantum-scorecard-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: flagquantum-gh-2
      queue: max
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Analyze repository security practices
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload the produced SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d
        with:
          sarif_file: results.sarif
