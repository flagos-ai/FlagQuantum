name: FlagOS Hardware Regression

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Provisioned native hardware lane
        type: choice
        options: [cuda, ascend-910c]
        default: cuda

permissions:
  contents: read

jobs:
  statevector-local-p0:
    if: ${{ inputs.platform != 'ascend-910c' }}
    runs-on: [self-hosted, linux, gpu, flagos-cuda-reference]
    # This job holds device 0, which the local gate benchmarks and the scheduled
    # lane sweeps, so it joins the same group. The label it waits on may name a
    # host none of those lanes use, in which case the group costs it nothing.
    concurrency:
      group: flagquantum-accelerator
      queue: max
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      CUDA_VISIBLE_DEVICES: "0"
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    steps:
      # The clone belongs to the runner and outlives this job, and so does a
      # sparse checkout another job left in it: `actions/checkout` cannot undo
      # one on this runner's git, and either way it reports success. This job
      # reads `artifacts/`, which more than one lane's pattern list omits. See
      # tests/unit/test_shared_runner_checkout_policy.py.
      - name: Clear a sparse checkout a previous job left in this clone
        run: |
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v4
      - name: Require provisioner-owned environment identity
        run: >-
          python -c "import os;
          required = ('FLAGQUANTUM_FLAGOS_CONTAINER_IMAGE',
          'FLAGQUANTUM_TORCH_FL_COMMIT', 'FLAGQUANTUM_TORCH_FL_BUILD',
          'FLAGQUANTUM_ACCELERATOR_MODEL');
          missing = [name for name in required if not os.environ.get(name)];
          assert not missing, f'FlagOS reference provisioner identity missing: {missing}'"
      - name: Validate checked-in development evidence
        run: >-
          python tools/validate_flagos_reference_evidence.py
          artifacts/flagos_cuda_reference_a800_20260824.json
      - name: Run focused CPU contract tests
        run: >-
          python -m pytest
          tests/unit/test_flagos_reference_evidence.py
          tests/unit/test_platform_runtime.py
          tests/unit/test_statevector_numerical_validation.py
          tests/unit/test_statevector_operator_profile.py -q
      - name: Execute locked FlagOS CUDA reference
        run: |
          mkdir -p hardware-run
          python tools/run_with_watchdog.py \
            --phase flagos-cuda-reference \
            --stall-seconds 240 \
            --timeout-seconds 1200 \
            --diagnostics hardware-run/watchdog \
            -- python tools/validate_flagos_cuda_reference.py \
              --strict-environment \
              --output hardware-run/flagos-cuda-reference.json
      - name: Enforce development-only evidence gate
        run: >-
          python tools/validate_flagos_reference_evidence.py
          hardware-run/flagos-cuda-reference.json
      - name: Upload raw reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagos-cuda-reference-${{ github.sha }}
          path: hardware-run/

  prepare-ascend-source:
    if: ${{ inputs.platform == 'ascend-910c' }}
    runs-on: ubuntu-latest
    concurrency:
      group: flagquantum-gh-${{ github.ref_name }}-light-c
      queue: max
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pack this exact hardware regression commit
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ascend-source"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/ascend-source/source.sha"
          git rev-list --objects --no-walk HEAD | git pack-objects --stdout > "$RUNNER_TEMP/ascend-source/source.pack"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ascend-source
          path: ${{ runner.temp }}/ascend-source/
          retention-days: 1
          compression-level: 0

  ascend-910c-native:
    if: ${{ inputs.platform == 'ascend-910c' }}
    needs: prepare-ascend-source
    runs-on: [self-hosted, linux, ARM64, ascend-910c, flagquantum-ascend-910c]
    concurrency:
      group: flagquantum-ascend-910c
      queue: max
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: ascend-source
          path: ${{ runner.temp }}/ascend-source
      - name: Restore and verify this run's exact source commit
        run: |
          sha="$(cat "$RUNNER_TEMP/ascend-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ascend-source/source.pack"
          printf '%s\n' "$sha" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git config --worktree core.sparseCheckout false
          git config --worktree core.sparseCheckoutCone false
          rm -f .git/info/sparse-checkout
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install this checkout in the provisioned Python environment
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Native circuit, training, QEC and dynamics regressions
        run: >-
          python tools/ci/run_ascend_910c.py
          --output-dir "${RUNNER_TEMP}/ascend-910c"
          --expected-devices 2
      - name: Retain native environment, watchdog and per-case reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ascend-910c-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ascend-910c/
          retention-days: 14
