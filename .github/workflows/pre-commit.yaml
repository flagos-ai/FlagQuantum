name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

# Same two constraints as CI -- cancel a superseded run of the same pull request,
# never a superseded run of `main`, and hold the job to one of the
# pull-request-scoped buckets for hosted fallback. Trusted A100 work gets a
# distinct group per run and job instead. See the capacity and cancellation
# notes in ci.yml.
concurrency:
  group: flagquantum-precommit-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || github.event.merge_group.head_sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'flagquantum-a100-cpu' || 'ubuntu-latest' }}
    concurrency:
      group: flagquantum-${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('a100-cpu-{0}-pre-commit-{1}', github.run_id, strategy.job-index || 0) || 'gh' }}-${{ github.event.pull_request.number || github.ref_name }}-light-c
      queue: max

    steps:
      - name: Clear sparse checkout state from a previous job
        run: |
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/isolated-python
      - name: Install source-hygiene tooling
        run: python -m pip install pre-commit

      # The CI quality job owns Ruff, Black, mypy, architecture, generated
      # contracts, and repository-wide policy checks. Repeating them here added
      # a second full project install and several minutes without adding an
      # independent signal. Keep this required check focused on the source-file
      # hygiene hooks that quality does not run.
      - name: Run source-hygiene hooks
        shell: bash
        run: |
          hooks=(trailing-whitespace end-of-file-fixer check-docstring-first check-yaml debug-statements check-ast)
          for hook in "${hooks[@]}"; do
            pre-commit run "$hook" --all-files --show-diff-on-failure
          done
