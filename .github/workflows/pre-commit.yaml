name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Same two constraints as CI: cancel a superseded run of the same branch, and
# hold the job to one of the pull-request-scoped buckets that bound one run's
# share of the organisation's GitHub-hosted pool. See the capacity note in
# ci.yml.
concurrency:
  group: flagquantum-precommit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-c
      queue: max

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install source-hygiene tooling
        run: python -m pip install pre-commit

      # The CI quality job owns Ruff, Black, mypy, architecture, generated
      # contracts, and repository-wide policy checks. Repeating them here added
      # a second full project install and several minutes without adding an
      # independent signal. Keep this required check focused on the source-file
      # hygiene hooks that quality does not run.
      - name: Run source-hygiene hooks
        shell: bash
        run: |
          hooks=(trailing-whitespace end-of-file-fixer check-docstring-first check-yaml debug-statements check-ast)
          for hook in "${hooks[@]}"; do
            pre-commit run "$hook" --all-files --show-diff-on-failure
          done
