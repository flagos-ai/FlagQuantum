name: pre-commit

# Manual source-hygiene diagnostics reuse the same action as the PR gate.
on:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-c
      queue: max

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/source-hygiene
