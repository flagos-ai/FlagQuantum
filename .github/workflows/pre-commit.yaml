name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Same two constraints as CI: cancel a superseded run of the same branch, and
# hold the job to one of the buckets that bound this repository's share of the
# organisation's GitHub-hosted pool. See the capacity note in ci.yml.
concurrency:
  group: flagquantum-precommit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    concurrency:
      group: flagquantum-gh-light-c
      queue: max

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and pre-commit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' pre-commit nbformat nbconvert

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
