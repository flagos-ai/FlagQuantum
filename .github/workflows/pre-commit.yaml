name: pre-commit

on:
  workflow_dispatch:

jobs:
  pre-commit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    concurrency:
      group: flagquantum-gh-2
      queue: max

    steps:
      - name: Clear sparse checkout state from a previous job
        run: |
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/isolated-python
      - uses: ./.github/actions/source-hygiene
