name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install project and pre-commit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' pre-commit nbformat nbconvert

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
