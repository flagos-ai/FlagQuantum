name: Main smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/main-smoke.yml
      - tests/smoke/test_smoke_baseline.py
      - tools/release/check_main_smoke_qec_wheel.py
      - examples/qec/ai_predecoder.py

permissions:
  contents: read

jobs:
  installed-wheel-smoke:
    # Match the Linux package lane's Ubuntu and GCC baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # Share the repository-wide hosted capacity limit.
    concurrency:
      group: flagquantum-gh-0
      queue: max
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MAX_JOBS: "2"
      PYTHONPATH: ""
    steps:
      - name: Clear sparse checkout state from a previous job
        run: |
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/isolated-python
        with:
          torch-spec: "torch>=2.10,<2.11"
      - name: Install the CPU build floor and smoke tooling
        run: |
          python -m pip install --upgrade pip 'setuptools>=77.0.3' wheel build
          python -m pip install 'torch>=2.10,<2.11' --index-url https://download.pytorch.org/whl/cpu
      - name: Build and inspect the wheel
        run: |
          python -m build --wheel --no-isolation
          python tools/verify_distribution_artifacts.py dist
      - name: Install and smoke-test the wheel in a clean runtime
        shell: bash
        run: |
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/main-smoke-tests.XXXXXX")"
          python -m venv "$smoke_dir/venv"
          smoke_python="$smoke_dir/venv/bin/python"
          "$smoke_python" -m pip install 'torch>=2.10,<2.11' --index-url https://download.pytorch.org/whl/cpu
          "$smoke_python" -m pip install pytest
          "$smoke_python" -m pip install --no-deps dist/*.whl
          "$smoke_python" -m pip check
          cp tests/smoke/test_smoke_baseline.py tools/release/check_main_smoke_qec_wheel.py \
            examples/qec/ai_predecoder.py "$smoke_dir/"
          cd "$smoke_dir"
          "$smoke_python" -I - <<'PYTHON'
          import sys
          from pathlib import Path
          import flagquantum as fq
          from flagquantum.simulation.native_cpu import adjoint

          assert Path(fq.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert adjoint.native_cpu_adjoint_available(), repr(adjoint._EXTENSION_ERROR)
          PYTHON
          "$smoke_python" -I -m pytest test_smoke_baseline.py -q
          "$smoke_python" -I check_main_smoke_qec_wheel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-smoke-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: ignore
          retention-days: 1
