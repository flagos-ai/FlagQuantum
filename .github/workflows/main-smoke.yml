name: BW1100 CPU runner pilot
run-name: BW1100-${{ inputs.node }} runner validation
on:
  workflow_dispatch:
    inputs:
      node:
        description: BW1100 pilot host
        required: true
        type: choice
        options: ['2', '10', '11', '12', '14', '15', '17']
permissions: {}
env:
  FQ_PILOT_SOURCE_SHA: eb04d9ffd36c40b167c9ebbd72eb66c11d39e43a
jobs:
  dispatch-probe:
    runs-on: fq-bw1100-${{ inputs.node }}-pilot
    timeout-minutes: 3
    steps:
      - run: test "$RUNNER_NAME" = fq-bw1100-${{ inputs.node }}-cpu-pilot
  offline-probe:
    needs: dispatch-probe
    runs-on: fq-bw1100-${{ inputs.node }}-pilot
    timeout-minutes: 4
    steps:
      - name: Verify rootless and the offline locked image
        run: |
          test "$RUNNER_NAME" = fq-bw1100-${{ inputs.node }}-cpu-pilot
          docker info --format '{{json .SecurityOptions}}' | grep -F '"name=rootless"'
          docker run --rm --pull never --network none --read-only --cap-drop ALL --security-opt no-new-privileges ghcr.io/flagos-ai/flagquantum-ci@sha256:1f5d6aa7b1b1d6313d787c7fbeaf269179a39d031b1010b1b521162baceb5ba6 /opt/ci/bin/python -c 'import socket; assert {n for _, n in socket.if_nameindex()} == {"lo"}'
  coverage-shard:
    needs: offline-probe
    runs-on: fq-bw1100-${{ inputs.node }}-pilot
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
      JAX_PLATFORMS: cpu
      COVERAGE_FILE: .coverage.${{ matrix.shard }}
    strategy:
      matrix:
        include:
          - {shard: 0}
    steps:
      - name: Restore the verified pilot source from the local Git cache
        run: |
          test -d .git
          printf '%s\n' "$FQ_PILOT_SOURCE_SHA" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git rev-list --objects --missing=error --no-walk "$FQ_PILOT_SOURCE_SHA" > /dev/null
          git checkout --force --detach "$FQ_PILOT_SOURCE_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$FQ_PILOT_SOURCE_SHA"
      - uses: ./.github/actions/offline-cpu
        with:
          profile: coverage-py3.12
          registry-token: ${{ github.token }}
      - name: Measure CPU and memory limits
        run: python -I tools/ci_cpu_budget.py
      - name: Verify dependency consistency and CPU frameworks
        run: |
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None"
          python -c "import jax; assert jax.default_backend() == 'cpu'"
      - name: Run maintained-runtime tests with coverage on pull requests
        # The two full P5 trajectory conformance tests already run in the
        # Python 3.12 cpu-core integration tier. Avoid repeating their 3+
        # instrumented minutes here; manual full validation measures them below.
        run: >-
          python -m pytest -m "(smoke or unit or integration or jax) and not slow and not qiskit and not cudaq and not triton"
          -n ${{ env.FQ_PYTEST_WORKERS }} --dist=worksteal --durations=50
          -p tools.pytest_shard
          --fq-shard-count 16 --fq-shard-index ${{ matrix.shard }}
          --cov=flagquantum
          --cov-report=
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}-${{ github.sha }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
      - name: Retain resource limits and pytest timing reports
        if: ${{ always() && env.FQ_CI_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-report-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: ${{ env.FQ_CI_REPORT_DIR }}
          retention-days: 7
