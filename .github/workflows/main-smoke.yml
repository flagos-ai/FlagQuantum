name: Offline coverage container pilot
on: workflow_dispatch
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  offline-coverage-pilot:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: mc550-rootless
            labels: '["self-hosted","fq-coverage-rootless-pilot"]'
          - node: a800-171
            labels: '["self-hosted","a800-171","flagquantum-a800-cpu"]'
          - node: a800-172
            labels: '["self-hosted","a800-172","flagquantum-a800-cpu"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-source-41824413461-1
          run-id: 41824413461
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pilot-source
      - name: Restore verified PR source from CI
        run: |
          sha="$(cat "$RUNNER_TEMP/pilot-source/source.sha")"
          git init .
          git index-pack --stdin < "$RUNNER_TEMP/pilot-source/source.pack"
          printf '%s\n' "$sha" > .git/shallow
          git config core.sparseCheckout false
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          printf '%s' '' | base64 -d > .github/actions/offline-cpu/action.yml
          printf '%s' '' | base64 -d > .github/actions/offline-cpu/run
          chmod +x .github/actions/offline-cpu/run
      - uses: ./.github/actions/offline-cpu
        with:
          profile: coverage-py3.12
          registry-token: ${{ github.token }}
      - name: Check locked Python and network isolation
        run: |
          python -m pip check
          python -c 'import os, torch, jax; assert set(os.listdir("/sys/class/net")) == {"lo"}; assert torch.version.cuda is None; assert jax.default_backend() == "cpu"'
