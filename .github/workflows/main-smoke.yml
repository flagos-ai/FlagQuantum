name: Seed locked coverage image from GHCR
on: workflow_dispatch
permissions:
  packages: read
jobs:
  seed:
    runs-on: [self-hosted, fq-coverage-rootless-pilot]
    timeout-minutes: 330
    steps:
      - name: Download and verify OCI content into persistent local storage
        shell: bash
        env:
          FQ_TOKEN: ${{ github.token }}
        run: |
          umask 077
          seed_dir="$HOME/.cache/flagquantum-ci/coverage-seed-1079"
          mkdir -p "$seed_dir"
          cd "$seed_dir"
          exec 9>seed.lock
          flock -w 20 9
          printf '%s' '' | base64 -d > fetch.py
          python3 fetch.py
          unset FQ_TOKEN
          printf 'verified\n' > ready
