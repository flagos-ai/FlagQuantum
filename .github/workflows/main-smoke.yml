name: BW1100 CPU runner pilot
on: workflow_dispatch
permissions: {}
env:
  FQ_PILOT_SOURCE_SHA: eb04d9ffd36c40b167c9ebbd72eb66c11d39e43a
jobs:
  dispatch-probe:
    runs-on: fq-bw1100-16-pilot
    timeout-minutes: 3
    steps:
      - run: test "$RUNNER_NAME" = fq-bw1100-16-cpu-pilot
  offline-probe:
    needs: dispatch-probe
    runs-on: fq-bw1100-16-pilot
    timeout-minutes: 4
    steps:
      - name: Verify rootless and the offline locked image
        run: |
          test "$RUNNER_NAME" = fq-bw1100-16-cpu-pilot
          docker info --format '{{json .SecurityOptions}}' | grep -F '"name=rootless"'
          docker run --rm --pull never --network none --read-only --cap-drop ALL --security-opt no-new-privileges ghcr.io/flagos-ai/flagquantum-ci@sha256:1f5d6aa7b1b1d6313d787c7fbeaf269179a39d031b1010b1b521162baceb5ba6 /opt/ci/bin/python -c 'import socket; assert {n for _, n in socket.if_nameindex()} == {"lo"}'
  prepare-source:
    outputs:
      artifact-key: ${{ steps.pack-source.outputs.artifact-key }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: flagquantum-gh-5
      queue: max
    steps:
      - name: Clear sparse checkout state from a previous job
        run: |
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
          ref: ${{ env.FQ_PILOT_SOURCE_SHA }}
      - name: Pack the exact commit and its complete tree for the A800 runners
        id: pack-source
        run: |
          set -o pipefail
          echo "artifact-key=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/ci-source"
          test "$(git rev-parse HEAD)" = "$FQ_PILOT_SOURCE_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-source/source.sha"
          git rev-list --objects --no-walk HEAD | git pack-objects --stdout > "$RUNNER_TEMP/ci-source/source.pack"
          mkdir "$RUNNER_TEMP/ci-source-incremental"
          cp "$RUNNER_TEMP/ci-source/source.sha" "$RUNNER_TEMP/ci-source-incremental/source.sha"
          base="$(git rev-list --first-parent --max-count=9 HEAD | tail -n 1)"
          {
            git rev-parse HEAD
            git rev-list --objects 'HEAD^{tree}' "^${base}^{tree}"
          } | git pack-objects --stdout > "$RUNNER_TEMP/ci-source-incremental/source.pack"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-source-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-source-incremental/
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ci-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-source/
          retention-days: 1
          compression-level: 0

  coverage-shard:
    needs: [prepare-source, offline-probe]
    runs-on: fq-bw1100-16-pilot
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
      JAX_PLATFORMS: cpu
      COVERAGE_FILE: .coverage.${{ matrix.shard }}
    strategy:
      matrix:
        include:
          - {shard: 0}
    steps:
      # Reuse the runner's verified Git objects before transferring a full tree.
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: error
          name: ci-source-incremental-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Check whether cached Git objects complete the source tree
        id: source-cache
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$FQ_PILOT_SOURCE_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          complete=false
          if objects="$(git rev-list --objects --missing=print --no-walk "$sha")"; then
            if ! printf '%s\n' "$objects" | grep -q '^?'; then
              complete=true
            fi
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        if: steps.source-cache.outputs.complete != 'true'
        with:
          digest-mismatch: error
          name: ci-source-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Restore and verify this run's exact source commit
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$FQ_PILOT_SOURCE_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          printf '%s\n' "$sha" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git config --worktree core.sparseCheckout false
          git config --worktree core.sparseCheckoutCone false
          rm -f .git/info/sparse-checkout
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$FQ_PILOT_SOURCE_SHA"
      - uses: ./.github/actions/offline-cpu
        with:
          profile: coverage-py3.12
          registry-token: ${{ github.token }}
      - name: Measure CPU and memory limits
        run: python -I tools/ci_cpu_budget.py
      - name: Verify dependency consistency and CPU frameworks
        run: |
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None"
          python -c "import jax; assert jax.default_backend() == 'cpu'"
      - name: Run maintained-runtime tests with coverage on pull requests
        # The two full P5 trajectory conformance tests already run in the
        # Python 3.12 cpu-core integration tier. Avoid repeating their 3+
        # instrumented minutes here; manual full validation measures them below.
        run: >-
          python -m pytest -m "(smoke or unit or integration or jax) and not slow and not qiskit and not cudaq and not triton"
          -n ${{ env.FQ_PYTEST_WORKERS }} --dist=worksteal --durations=50
          -p tools.pytest_shard
          --fq-shard-count 16 --fq-shard-index ${{ matrix.shard }}
          --cov=flagquantum
          --cov-report=
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}-${{ github.sha }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
      - name: Retain resource limits and pytest timing reports
        if: ${{ always() && env.FQ_CI_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-report-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: ${{ env.FQ_CI_REPORT_DIR }}
          retention-days: 7
