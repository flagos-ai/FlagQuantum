name: Direct OCI coverage cache pilot
on: workflow_dispatch
permissions:
  contents: read
  packages: read
jobs:
  offline-coverage-pilot:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: mc550-rootless
            labels: '["self-hosted","fq-coverage-rootless-pilot"]'
          - node: a800-171
            labels: '["self-hosted","a800-171","flagquantum-a800-cpu"]'
          - node: a800-172
            labels: '["self-hosted","a800-172","flagquantum-a800-cpu"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - name: Pull the locked image and verify the offline container
        shell: bash
        env:
          FQ_REGISTRY_TOKEN: ${{ github.token }}
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          image=ghcr.io/flagos-ai/flagquantum-ci@sha256:1f5d6aa7b1b1d6313d787c7fbeaf269179a39d031b1010b1b521162baceb5ba6
          lock_dir="${XDG_CACHE_HOME:-$HOME/.cache}/flagquantum-ci"
          mkdir -p -m 700 "$lock_dir"
          exec 9>"$lock_dir/${image##*@}.lock"
          flock -w 480 9
          scratch=$(mktemp -d "$RUNNER_TEMP/fq-pilot.XXXXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            (
              cd "$scratch"
              printf '%s' '' | base64 -d > fetch.py
              timeout 2100s python3 fetch.py
              tar -C oci -cf - . | docker load
            )
            docker image inspect "$image" >/dev/null
          fi
          unset FQ_REGISTRY_TOKEN
          exec 9>&-
          user="$(id -u):$(id -g)"
          if docker info --format '{{range .SecurityOptions}}{{println .}}{{end}}' | grep -Fxq name=rootless; then
            user=0:0
          fi
          if [[ "$EXPECTED_NODE" == mc550-rootless ]]; then
            test "$user" = 0:0
            test "$(id -u)" != 0
          fi
          docker run --rm --pull never --network none --read-only --tmpfs /tmp:exec --shm-size 1g --cap-drop ALL --security-opt no-new-privileges --user "$user" -v "$scratch:/pilot" "$image" /opt/ci/bin/python -c 'import os, pathlib, torch, jax; assert set(os.listdir("/sys/class/net")) == {"lo"}; assert torch.version.cuda is None; assert jax.default_backend() == "cpu"; pathlib.Path("/pilot/result").write_text("ok")'
          test "$(cat "$scratch/result")" = ok
          test "$(stat -c %u "$scratch/result")" = "$(id -u)"
