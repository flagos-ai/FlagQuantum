name: Offline coverage container pilot
on: workflow_dispatch
permissions:
  contents: read
  packages: read
jobs:
  offline-coverage-pilot:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: mc550-rootless
            labels: '["self-hosted","fq-coverage-rootless-pilot"]'
          - node: a800-171
            labels: '["self-hosted","a800-171","flagquantum-a800-cpu"]'
          - node: a800-172
            labels: '["self-hosted","a800-172","flagquantum-a800-cpu"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/offline-cpu
        with:
          profile: coverage-py3.12
          registry-token: ${{ github.token }}
      - name: Check locked Python and network isolation
        run: |
          python -m pip check
          python -c 'import os, torch, jax; assert set(os.listdir("/sys/class/net")) == {"lo"}; assert torch.version.cuda is None; assert jax.default_backend() == "cpu"'
