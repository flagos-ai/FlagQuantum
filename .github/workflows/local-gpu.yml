name: Local GPU Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      validate_mc550_pool:
        description: Validate all sixty-four isolated MC550 CPU runners
        type: boolean
        default: false
      validate_pool:
        description: Validate all sixteen CPU slots and the exclusive eight-GPU runner
        type: boolean
        default: false

concurrency:
  group: flagquantum-gpu-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare-source:
    outputs:
      artifact-key: ${{ steps.pack-source.outputs.artifact-key }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'flagquantum-a100-cpu-entry' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: flagquantum-${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('a100-cpu-{0}-prepare-source-{1}', github.run_id, strategy.job-index || 0) || 'gh' }}-${{ github.event.pull_request.number || github.ref_name }}-cpucore-3.12
      queue: max
    steps:
      - name: Clear sparse checkout state from a previous job
        run: |
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - name: Pack the exact commit and its complete tree for the A800 runners
        id: pack-source
        run: |
          set -o pipefail
          echo "artifact-key=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/ci-source"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-source/source.sha"
          git rev-list --objects --no-walk HEAD | git pack-objects --stdout > "$RUNNER_TEMP/ci-source/source.pack"
          mkdir "$RUNNER_TEMP/ci-source-incremental"
          cp "$RUNNER_TEMP/ci-source/source.sha" "$RUNNER_TEMP/ci-source-incremental/source.sha"
          base="$(git rev-list --first-parent --max-count=9 HEAD | tail -n 1)"
          {
            git rev-parse HEAD
            git rev-list --objects 'HEAD^{tree}' "^${base}^{tree}"
          } | git pack-objects --stdout > "$RUNNER_TEMP/ci-source-incremental/source.pack"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-source-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-source-incremental/
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ci-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-source/
          retention-days: 1
          compression-level: 0

  one-gpu-local:
    if: ${{ !inputs.validate_pool && !inputs.validate_mc550_pool }}
    needs: prepare-source
    runs-on: [self-hosted, linux, gpu, flagquantum-local, a800-171]
    # The multi-node lane uses both A800 hosts. Keep their local and scheduled
    # jobs in one group until that lane can reserve both hosts independently.
    concurrency:
      group: flagquantum-accelerator
      queue: max
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: error
          name: ci-source-incremental-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Check whether cached Git objects complete the source tree
        id: source-cache
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          complete=false
          if objects="$(git rev-list --objects --missing=print --no-walk "$sha")"; then
            if ! printf '%s\n' "$objects" | grep -q '^?'; then
              complete=true
            fi
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        if: steps.source-cache.outputs.complete != 'true'
        with:
          digest-mismatch: error
          name: ci-source-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Restore and verify this run's exact source commit
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          printf '%s\n' "$sha" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git config --worktree core.sparseCheckout false
          git config --worktree core.sparseCheckoutCone false
          rm -f .git/info/sparse-checkout
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install FlagQuantum without replacing the runner's framework stack
        run: |
          python -c "import pytest, torch"
          python -m pip install --no-deps --no-build-isolation -e .
      - name: One-GPU local behavior
        run: |
          mkdir -p hardware-run
          set -o pipefail
          CUDA_VISIBLE_DEVICES=0 python -c "import torch; assert torch.cuda.device_count() == 1"
          CUDA_VISIBLE_DEVICES=0 python tools/run_with_watchdog.py --phase one-gpu-correctness --stall-seconds 180 --timeout-seconds 600 --diagnostics hardware-run/watchdog-one-gpu-correctness -- python tests/distributed/correctness_hardware.py 2>&1 | tee hardware-run/one-gpu-correctness.json
          CUDA_VISIBLE_DEVICES=0 python tools/run_with_watchdog.py --phase one-gpu-tests --stall-seconds 180 --timeout-seconds 600 --diagnostics hardware-run/watchdog-one-gpu-tests -- python -m pytest tests/test_statevector_triton_gates.py tests/qec/test_ising_comparison.py::test_real_cuda_complete_hyperedge_correction_and_timing -q -rs 2>&1 | tee hardware-run/one-gpu.log
          CUDA_VISIBLE_DEVICES=0 python tools/run_with_watchdog.py --phase one-gpu-benchmark --stall-seconds 240 --timeout-seconds 900 --diagnostics hardware-run/watchdog-one-gpu-benchmark -- python benchmarks/continuous_performance.py --mode local-gpu --backend pytorch --warmup 10 --repetitions 30 --inner-loops 20 --output hardware-run/one-gpu-performance.json
          python tools/evaluate_performance_artifact.py --write hardware-run/one-gpu-performance.json
      - if: always()
        run: >-
          python tools/hardware_run_manifest.py
          --output hardware-run/one-gpu.json
          --command 'CUDA_VISIBLE_DEVICES=0 python -m pytest tests/test_statevector_triton_gates.py tests/qec/test_ising_comparison.py::test_real_cuda_complete_hyperedge_correction_and_timing -q -rs'
          --world-size 1
          --evidence-scope one_gpu_local
          --log hardware-run/one-gpu.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-gpu-${{ github.sha }}-${{ github.run_attempt }}
          path: hardware-run/

  two-gpu-distributed-required:
    if: ${{ !inputs.validate_pool && !inputs.validate_mc550_pool }}
    needs: prepare-source
    runs-on: [self-hosted, linux, gpu, flagquantum-local, a800-172]
    concurrency:
      group: flagquantum-accelerator
      queue: max
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: error
          name: ci-source-incremental-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Check whether cached Git objects complete the source tree
        id: source-cache
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          complete=false
          if objects="$(git rev-list --objects --missing=print --no-walk "$sha")"; then
            if ! printf '%s\n' "$objects" | grep -q '^?'; then
              complete=true
            fi
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        if: steps.source-cache.outputs.complete != 'true'
        with:
          digest-mismatch: error
          name: ci-source-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Restore and verify this run's exact source commit
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          printf '%s\n' "$sha" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git config --worktree core.sparseCheckout false
          git config --worktree core.sparseCheckoutCone false
          rm -f .git/info/sparse-checkout
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install FlagQuantum without replacing the runner's framework stack
        run: |
          python -c "import pytest, torch"
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Required two-GPU correctness and lifecycle gate
        run: |
          mkdir -p hardware-run
          set -o pipefail
          CUDA_VISIBLE_DEVICES=0,1 python -c "import torch; assert torch.cuda.device_count() == 2"
          CUDA_VISIBLE_DEVICES=0,1 python tools/run_with_watchdog.py --phase forward --stall-seconds 180 --timeout-seconds 600 --diagnostics hardware-run/watchdog-forward -- torchrun --standalone --nproc-per-node=2 tests/distributed/statevector_forward_executor.py --backend nccl 2>&1 | tee hardware-run/two-gpu-statevector-forward.log
          CUDA_VISIBLE_DEVICES=0,1 python tools/run_with_watchdog.py --phase backward --stall-seconds 180 --timeout-seconds 600 --diagnostics hardware-run/watchdog-backward -- torchrun --standalone --nproc-per-node=2 tests/distributed/statevector_reverse_executor.py --backend nccl 2>&1 | tee hardware-run/two-gpu-statevector-reverse.log
          CUDA_VISIBLE_DEVICES=0,1 python tools/run_with_watchdog.py --phase train --stall-seconds 240 --timeout-seconds 900 --diagnostics hardware-run/watchdog-train -- torchrun --standalone --nproc-per-node=2 tests/distributed/statevector_training_runtime.py --backend nccl --checkpoint-dir hardware-run/training-checkpoint --mode train 2>&1 | tee hardware-run/two-gpu-statevector-training.log
          CUDA_VISIBLE_DEVICES=0,1 python tools/run_with_watchdog.py --phase correctness --stall-seconds 180 --timeout-seconds 600 --diagnostics hardware-run/watchdog-correctness -- torchrun --standalone --nproc-per-node=2 tests/distributed/correctness_hardware.py 2>&1 | tee hardware-run/two-gpu-correctness.log
          CUDA_VISIBLE_DEVICES=0,1 python tools/run_with_watchdog.py --phase semantic-tests --stall-seconds 180 --timeout-seconds 600 --diagnostics hardware-run/watchdog-semantics -- python -m pytest tests/distributed/test_mps_reverse.py::test_explicit_rank_owned_mps_reverse_nccl -q -rs 2>&1 | tee hardware-run/two-gpu-torch.log
          CUDA_VISIBLE_DEVICES=0,1 python tools/run_with_watchdog.py --phase mps-backward --stall-seconds 240 --timeout-seconds 900 --diagnostics hardware-run/watchdog-mps-backward -- python -m pytest tests/distributed/test_mps_accelerator_backward_evidence.py -q -rs -s 2>&1 | tee hardware-run/two-gpu-jax.log
          CUDA_VISIBLE_DEVICES=0,1 python tools/run_with_watchdog.py --phase mps-forward --stall-seconds 180 --timeout-seconds 600 --diagnostics hardware-run/watchdog-mps-forward -- python -m pytest tests/distributed/test_mps_forward.py::test_rank_owned_mps_forward_nccl -q -rs 2>&1 | tee hardware-run/two-gpu-mps-forward.log
          # Batch enough unchanged iterations to average host scheduling jitter;
          # the former 50-iteration samples lasted only about 6-19 ms.
          CUDA_VISIBLE_DEVICES=0,1 python tools/run_with_watchdog.py --phase distributed-benchmark --stall-seconds 300 --timeout-seconds 1200 --diagnostics hardware-run/watchdog-distributed-benchmark -- torchrun --standalone --nproc-per-node=2 benchmarks/continuous_performance.py --mode distributed-shard --warmup 10 --repetitions 30 --inner-loops 2000 --output hardware-run/two-gpu-performance.json
          python tools/evaluate_performance_artifact.py --write hardware-run/two-gpu-performance.json
      - if: always()
        run: >-
          CUDA_VISIBLE_DEVICES=0,1 python tools/hardware_run_manifest.py
          --output hardware-run/two-gpu.json
          --command 'two local GPUs torchrun native correctness/autograd plus JAX MPS backward/optimizer'
          --world-size 2
          --evidence-scope two_gpu_semantic_regression
          --log hardware-run/two-gpu-torch.log
          --log hardware-run/two-gpu-jax.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-gpu-required-${{ github.sha }}-${{ github.run_attempt }}
          path: hardware-run/

  validate-cpu-pool:
    if: ${{ inputs.validate_pool }}
    runs-on: [self-hosted, linux, x64, a100-cpu, "${{ matrix.slot }}"]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot: [cpu01, cpu02, cpu03, cpu04, cpu05, cpu06, cpu07, cpu08, cpu09, cpu10, cpu11, cpu12, cpu13, cpu14, cpu15, cpu16]
    steps:
      - name: Clear sparse checkout state from a previous job
        run: |
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify account, CPU allocation, and CPU-only environment
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          import torch
          assert os.geteuid() != 0
          assert len(os.sched_getaffinity(0)) == 8
          assert torch.cuda.device_count() == 0
          assert torch.version.cuda is None
          status = Path('/proc/self/status').read_text()
          assert 'CapEff:\t0000000000000000' in status
          assert 'NoNewPrivs:\t1' in status
          own_slot = os.environ['FQ_RUNNER_NAME']
          other_slot = 'cpu02' if own_slot != 'cpu02' else 'cpu01'
          private_files = ['/root', '/opt/flagquantum-runners/admin',
                           '/opt/flagquantum-runners/homes/' + other_slot]
          for path in private_files:
              try:
                  fd = os.open(path, os.O_RDONLY)
              except PermissionError:
                  pass
              else:
                  os.close(fd)
                  raise AssertionError('Unexpected access: ' + path)
          print('runner:', os.environ['RUNNER_NAME'], 'CPU affinity:', sorted(os.sched_getaffinity(0)), 'torch:', torch.__version__)
          PYCODE
      - name: Install FlagQuantum into the isolated job environment
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: CPU circuit and backend regressions
        run: python -m pytest tests/test_native_circuit.py tests/test_backends.py -q

  validate-eight-gpus:
    if: ${{ inputs.validate_pool }}
    runs-on: [self-hosted, linux, x64, gpu, flagquantum-a100]
    concurrency:
      group: flagquantum-accelerator-a100
      queue: max
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - name: Clear sparse checkout state from a previous job
        run: |
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify eight visible GPUs
        run: |
          python - <<'PYCODE'
          import os
          import torch
          assert os.geteuid() != 0
          assert torch.cuda.is_available()
          assert torch.cuda.device_count() == 8
          for i in range(8):
              print(i, torch.cuda.get_device_name(i))
              x = torch.ones(256, device=f'cuda:{i}')
              assert x.sum().item() == 256
          print('torch:', torch.__version__, 'CUDA:', torch.version.cuda)
          PYCODE
      - name: Install FlagQuantum into the isolated job environment
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Eight-GPU sharded forward differential
        run: >-
          python tools/run_with_watchdog.py --phase eight-gpu-forward
          --stall-seconds 180 --timeout-seconds 600
          --diagnostics hardware-run/watchdog-eight-gpu-forward --
          torchrun --standalone --nproc-per-node=8
          tests/distributed/statevector_forward_executor.py --backend nccl
      - name: Eight-GPU sharded gradient differential
        run: >-
          python tools/run_with_watchdog.py --phase eight-gpu-reverse
          --stall-seconds 180 --timeout-seconds 600
          --diagnostics hardware-run/watchdog-eight-gpu-reverse --
          torchrun --standalone --nproc-per-node=8
          tests/distributed/statevector_reverse_executor.py --backend nccl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a100-pool-validation-${{ github.run_id }}
          path: hardware-run/

  validate-mc550-pool:
    if: ${{ inputs.validate_mc550_pool }}
    needs: prepare-source
    runs-on: [self-hosted, linux, x64, flagquantum-mc550-cpu, "${{ matrix.host }}", "${{ matrix.slot }}"]
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: [mc550-111, mc550-112, mc550-121, mc550-122]
        slot: [cpu01, cpu02, cpu03, cpu04, cpu05, cpu06, cpu07, cpu08, cpu09, cpu10, cpu11, cpu12, cpu13, cpu14, cpu15, cpu16]
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: error
          name: ci-source-incremental-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Check whether cached Git objects complete the source tree
        id: source-cache
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          complete=false
          if objects="$(git rev-list --objects --missing=print --no-walk "$sha")"; then
            if ! printf '%s\n' "$objects" | grep -q '^?'; then
              complete=true
            fi
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        if: steps.source-cache.outputs.complete != 'true'
        with:
          digest-mismatch: error
          name: ci-source-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Restore and verify this run's exact source commit
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          printf '%s\n' "$sha" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git config --worktree core.sparseCheckout false
          git config --worktree core.sparseCheckoutCone false
          rm -f .git/info/sparse-checkout
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/isolated-python
      - name: Prepare isolated build tooling
        run: python -m pip install --upgrade pip "setuptools>=77.0.3" wheel
      - name: Verify host, account, device, filesystem and cgroup isolation
        run: python tools/ci/verify_mc550_runner.py
      - name: Install the CPU-only framework
        uses: ./.github/actions/install-cpu-torch
      - name: Install the project and test dependencies in the private environment
        run: python -m pip install --no-build-isolation -e ".[dev]"
      - name: Verify CPU-only PyTorch and exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -c "import torch; assert torch.version.cuda is None; assert torch.cuda.device_count() == 0"
      - name: Run CPU circuit and backend regressions on this exact slot
        run: python -m pytest tests/test_native_circuit.py tests/test_backends.py -q
