name: R300 scale set validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-tsinghua-paths:
    runs-on: flagcicd-r300-cpu01
    timeout-minutes: 10
    steps:
      - name: Compare configured and direct paths to the same public Tsinghua endpoints
        shell: bash
        timeout-minutes: 7
        run: |
          set +e
          printf 'UTC: '; date -u +%FT%TZ
          printf 'Runner: %s\n' "$RUNNER_NAME"
          for name in HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy; do
            if [ -n "${!name:-}" ]; then printf '%s=configured\n' "$name"; else printf '%s=unset\n' "$name"; fi
          done
          for host in mirrors.tuna.tsinghua.edu.cn pypi.tuna.tsinghua.edu.cn; do
            timeout 5 getent ahostsv4 "$host"
          done
          for round in 1 2 3; do
            for url in https://mirrors.tuna.tsinghua.edu.cn/ubuntu/dists/noble/InRelease https://pypi.tuna.tsinghua.edu.cn/simple/pip/; do
              host="${url#https://}"; host="${host%%/*}"
              for route in configured direct; do
                options=()
                if [ "$route" = direct ]; then options=(--noproxy "$host"); fi
                printf '\nround=%s route=%s url=%s\n' "$round" "$route" "$url"
                curl "${options[@]}" --fail --silent --show-error --location --output /dev/null --connect-timeout 10 --max-time 30 --max-filesize 4194304 --write-out 'http=%{http_code} ip=%{remote_ip} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} first_byte=%{time_starttransfer} total=%{time_total} bytes=%{size_download} bytes_per_second=%{speed_download} tls_verify=%{ssl_verify_result}\n' "$url"
                printf 'curl_exit=%s\n' "$?"
              done
            done
          done
