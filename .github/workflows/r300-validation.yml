name: R300 scale set validation

on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: Inspect runner and existing Kubernetes read access without running workloads
        type: boolean
        default: false

      qualify_pool:
        description: Qualify the next four candidates for workflow-level R300 routing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare-source:
    outputs:
      qualification-targets: ${{ steps.pool.outputs.qualification-targets }}
    if: ${{ !inputs.audit_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-c
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pack the exact validation commit
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/r300-source"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/r300-source/source.sha"
          git rev-list --objects --no-walk HEAD | git pack-objects --stdout > "$RUNNER_TEMP/r300-source/source.pack"
      - name: Select the next bounded pool qualification batch
        id: pool
        run: python3 tools/ci/r300_pool.py --seed "$GITHUB_RUN_ID" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: r300-source
          path: ${{ runner.temp }}/r300-source/
          retention-days: 1
          compression-level: 0

  resources:
    if: ${{ !inputs.audit_only && !inputs.qualify_pool }}
    runs-on: ${{ matrix.scale_set }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix:
        scale_set:
          - flagcicd-r300-cpu01
          - flagcicd-r300-cpu02
          - flagcicd-r300-cpu03
          - flagcicd-r300-cpu04
          - flagcicd-r300-cpu05
          - flagcicd-r300-cpu06
          - flagcicd-r300-cpu07
          - flagcicd-r300-cpu08
          - flagcicd-r300-cpu09
          - flagcicd-r300-cpu10
          - flagcicd-r300-cpu11
          - flagcicd-r300-cpu12
          - flagcicd-r300-cpu13
          - flagcicd-r300-cpu14
          - flagcicd-r300-cpu15
          - flagcicd-r300-cpu16
          - flagcicd-r300-cpu115
    steps:
      # Keep inventory independent of GitHub source/action download latency.
      # Workload jobs below use ci_cpu_budget.py for effective limits and workers.
      - name: Record host visibility and every enclosing cgroup limit
        run: |
          uname -a
          cat /etc/os-release
          nproc
          free -b
          df -B1 "$RUNNER_TEMP"
          grep Cpus_allowed_list /proc/self/status
          cat /proc/self/cgroup
          for tool in git python3 gcc g++; do
            if command -v "$tool"; then
              "$tool" --version
            else
              echo "::warning::$tool is absent from the base image"
            fi
          done
          membership="$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)"
          test -n "$membership"
          directory="/sys/fs/cgroup${membership%/}"
          if [ ! -d "$directory" ]; then
            directory=/sys/fs/cgroup
          fi
          while [[ "$directory" == /sys/fs/cgroup* ]]; do
            for controller in cpu.max memory.max memory.current cpuset.cpus.effective; do
              if [ -f "$directory/$controller" ]; then
                printf '%s: %s\n' "$directory/$controller" "$(cat "$directory/$controller")"
              fi
            done
            [ "$directory" != /sys/fs/cgroup ] || break
            directory="$(dirname "$directory")"
          done

  cpu-workload:
    needs: prepare-source
    if: ${{ !inputs.audit_only && !inputs.qualify_pool }}
    runs-on: ${{ matrix.scale_set }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - scale_set: flagcicd-r300-cpu01
            python: '3.12'
          - scale_set: flagcicd-r300-cpu08
            python: '3.10'
          - scale_set: flagcicd-r300-cpu16
            python: '3.11'
    env:
      MAX_JOBS: '2'
      PIP_DEFAULT_TIMEOUT: '30'
      PIP_RETRIES: '1'
    steps:
      - name: Provision the native CPU compiler when absent
        run: |
          if ! command -v gcc || ! command -v g++; then
            sudo -n timeout --kill-after=10s 240s apt-get update
            sudo -n timeout --kill-after=10s 240s apt-get install -y --no-install-recommends build-essential
          fi
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: error
          name: r300-source
          path: ${{ runner.temp }}/ci-source
      - name: Restore and verify this run's exact source commit
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          printf '%s\n' "$sha" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git config --worktree core.sparseCheckout false
          git config --worktree core.sparseCheckoutCone false
          rm -f .git/info/sparse-checkout
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/isolated-python
      - run: python -m pip install --upgrade pip 'setuptools>=77.0.3' wheel
      - uses: ./.github/actions/install-cpu-torch
      - name: Build the native extension and install CI dependencies
        run: python -m pip install --no-build-isolation -e '.[dev]'
      - name: Require native CPU execution
        run: |
          python - <<'PY'
          import torch
          from flagquantum.simulation.native_cpu import adjoint

          assert torch.version.cuda is None
          assert adjoint.native_cpu_adjoint_available(), repr(adjoint._EXTENSION_ERROR)
          print('CPU PyTorch:', torch.__version__)
          PY
      - name: Run portable CPU and workflow regressions
        run: >-
          python -m pytest tests/test_native_circuit.py tests/test_backends.py
          tests/smoke/test_smoke_baseline.py tests/unit/test_ci_cpu_budget.py
          tests/unit/test_cpu_runner_routing.py
          tests/unit/test_cpu_runner_isolation.py
          tests/unit/test_github_hosted_capacity_policy.py
          tests/unit/test_shared_runner_checkout_policy.py -q
      - name: Run the default PR tier on Python 3.12
        if: matrix.python == '3.12'
        run: >-
          PYTEST_ADDOPTS="-n $FQ_PYTEST_WORKERS --dist=worksteal --durations=25"
          python tools/ci_tier.py pr-default
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.FQ_CI_REPORT_DIR != '' }}
        with:
          name: r300-workload-${{ matrix.scale_set }}
          path: ${{ env.FQ_CI_REPORT_DIR }}
          retention-days: 7

  cluster-audit:
    if: inputs.audit_only
    runs-on: ${{ matrix.scale_set }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scale_set: [flagcicd-r300-cpu03, flagcicd-r300-cpu04, flagcicd-r300-cpu05]
    steps:
      - name: Inspect existing cluster access without downloading source
        shell: bash
        run: |
          node_binary=""
          for candidate in "$(command -v node || true)" /home/runner/externals/node24/bin/node /home/runner/externals/node20/bin/node; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              node_binary="$candidate"
              break
            fi
          done
          test -n "$node_binary"
          "$node_binary" <<'JS'
          const fs = require('node:fs');
          const https = require('node:https');
          const os = require('node:os');
          const emit = (kind, data) => console.log(JSON.stringify({kind, ...data}));
          const account = '/var/run/secrets/kubernetes.io/serviceaccount';
          const read = (name) => fs.existsSync(`${account}/${name}`) ? fs.readFileSync(`${account}/${name}`, 'utf8').trim() : null;
          const namespace = read('namespace');
          emit('runner', {name: process.env.RUNNER_NAME, hostname: os.hostname(), architecture: os.arch(), namespace, serviceAccountMounted: fs.existsSync(`${account}/token`)});
          if (!namespace || !fs.existsSync(`${account}/token`) || !process.env.KUBERNETES_SERVICE_HOST) {
            emit('clusterAccess', {available: false, reason: 'No existing in-cluster service-account access; an operator context is required.'});
            process.exit(0);
          }
          // Use only the pod's existing permissions; never emit credentials or list Secrets.
          const request = (path) => new Promise((resolve) => {
            const req = https.get({host: process.env.KUBERNETES_SERVICE_HOST, port: process.env.KUBERNETES_SERVICE_PORT_HTTPS || 443, path,
              ca: read('ca.crt'), headers: {Authorization: `Bearer ${read('token')}`}}, (res) => {
              let body = '';
              res.on('data', (chunk) => {body += chunk; if (body.length > 8000000) req.destroy(new Error('response_too_large'));});
              res.on('end', () => {
                if (res.statusCode !== 200) {emit('clusterRead', {path, status: res.statusCode}); resolve(null); return;}
                try {resolve(JSON.parse(body));} catch {emit('clusterRead', {path, error: 'invalid_json'}); resolve(null);}
              });
            });
            req.setTimeout(15000, () => req.destroy(new Error('request_timeout')));
            req.on('error', (error) => {emit('clusterRead', {path, error: error.code || 'request_failed'}); resolve(null);});
          });
          (async () => {
            const version = await request('/version');
            if (version) emit('kubernetes', {version: version.gitVersion});
            const deployments = await request(`/apis/apps/v1/namespaces/${encodeURIComponent(namespace)}/deployments`);
            for (const item of deployments?.items || []) {
              if (!/arc|runner-scale-set/.test(item.metadata.name)) continue;
              emit('controller', {name: item.metadata.name, namespace: item.metadata.namespace,
                chart: item.metadata.labels?.['helm.sh/chart'], images: item.spec.template.spec.containers.map((c) => c.image)});
            }
            const sets = await request(`/apis/actions.github.com/v1alpha1/namespaces/${encodeURIComponent(namespace)}/autoscalingrunnersets`);
            for (const item of sets?.items || []) {
              if (!String(item.spec.runnerScaleSetName || item.metadata.name).startsWith('flagcicd-r300-')) continue;
              emit('scaleSet', {name: item.metadata.name, namespace: item.metadata.namespace, chart: item.metadata.labels?.['helm.sh/chart'],
                labels: item.spec.runnerScaleSetLabels, minRunners: item.spec.minRunners, maxRunners: item.spec.maxRunners,
                nodeSelector: item.spec.template?.spec?.nodeSelector,
                containers: item.spec.template?.spec?.containers?.map((c) => ({name: c.name, image: c.image, resources: c.resources}))});
            }
            const pod = await request(`/api/v1/namespaces/${encodeURIComponent(namespace)}/pods/${encodeURIComponent(os.hostname())}`);
            if (pod) emit('pod', {node: pod.spec.nodeName, serviceAccount: pod.spec.serviceAccountName,
              chart: pod.metadata.labels?.['helm.sh/chart'], appVersion: pod.metadata.labels?.['app.kubernetes.io/version'],
              containers: pod.spec.containers.map((c) => ({name: c.name, image: c.image, resources: c.resources}))});
            const pods = await request(`/api/v1/namespaces/${encodeURIComponent(namespace)}/pods`);
            for (const item of pods?.items || []) {
              if (!item.metadata.name.startsWith('flagcicd-r300-')) continue;
              emit('r300Pod', {name: item.metadata.name, phase: item.status.phase,
                chart: item.metadata.labels?.['helm.sh/chart'], appVersion: item.metadata.labels?.['app.kubernetes.io/version'],
                ownerKinds: item.metadata.ownerReferences?.map((owner) => owner.kind),
                containers: item.spec.containers.map((c) => ({name: c.name, image: c.image, resources: c.resources}))});
            }
          })().catch(() => {emit('clusterRead', {error: 'audit_failed'}); process.exitCode = 1;});
          JS

  pool-qualification:
    needs: prepare-source
    if: inputs.qualify_pool && !inputs.audit_only && needs.prepare-source.outputs.qualification-targets != '[]'
    runs-on: ${{ matrix.scale_set }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scale_set: ${{ fromJSON(needs.prepare-source.outputs.qualification-targets) }}
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PIP_DEFAULT_TIMEOUT: '30'
      PIP_RETRIES: '1'
    steps:
      - uses: actions/download-artifact@v8.0.2
        id: source
        timeout-minutes: 3
        continue-on-error: ${{ startsWith(runner.name, 'flagcicd-r300-') }}
        with:
          digest-mismatch: error
          name: r300-source
          path: ${{ runner.temp }}/ci-source
      - name: Restore and verify this run's exact source commit
        if: steps.source.outcome == 'success'
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          printf '%s\n' "$sha" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git config --worktree core.sparseCheckout false
          git config --worktree core.sparseCheckoutCone false
          rm -f .git/info/sparse-checkout
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare exact-commit checkout after an R300 artifact failure
        if: startsWith(runner.name, 'flagcicd-r300-') && steps.source.outcome == 'failure'
        run: |
          echo "::warning::Source artifact transfer failed; fetching the same commit through GitHub checkout"
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v4
        if: startsWith(runner.name, 'flagcicd-r300-') && steps.source.outcome == 'failure'
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the checked-out fallback commit
        if: steps.source.outcome == 'failure'
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: ./.github/actions/prepare-r300-cpu
        if: startsWith(runner.name, 'flagcicd-r300-')
      - uses: actions/setup-python@v5
        if: ${{ !startsWith(runner.name, 'flagcicd-r300-') }}
        with:
          python-version: "3.12"
      - uses: ./.github/actions/isolated-python
      - run: python -m pip install --upgrade pip 'setuptools>=77.0.3' wheel
      - uses: ./.github/actions/install-cpu-torch
        timeout-minutes: 8
      - run: python -m pip install --no-build-isolation -e '.[dev]'
      - name: Validate the CPU runtime before SDK certification
        run: |
          python -c "import torch; from flagquantum.simulation.native_cpu import adjoint; assert torch.version.cuda is None; assert adjoint.native_cpu_adjoint_available(), repr(adjoint._EXTENSION_ERROR)"
          python -m pytest tests/test_native_circuit.py tests/test_backends.py tests/smoke/test_smoke_baseline.py -q
      - name: Validate workflow pool planning and source isolation
        run: >-
          python -m pytest tests/unit/test_r300_pool.py
          tests/unit/test_ci_cpu_budget.py
          tests/unit/test_cpu_runner_routing.py
          tests/unit/test_shared_runner_checkout_policy.py -q
      - name: Retain measured resources and timing
        if: ${{ always() && env.FQ_CI_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: r300-pool-${{ matrix.scale_set }}
          path: ${{ env.FQ_CI_REPORT_DIR }}
          retention-days: 7
