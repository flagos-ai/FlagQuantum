      # lane runs the gates, because the strict type check targets 3.12.
      - name: Install the declared development floor
        if: matrix.python == '3.12'
        run: >-
          python -m pip install
          $(python tools/check_dependency_policy.py --print-floor)
      - name: Run the Python gates on the declared development floor
        if: matrix.python == '3.12'
        run: |
          ruff check flagquantum tests tools
          black --check flagquantum tests tools
          mypy --strict --python-version 3.12 --ignore-missing-imports flagquantum
      - name: Retain resource limits and pytest timing reports
        if: ${{ always() && env.FQ_CI_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-report-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: ${{ env.FQ_CI_REPORT_DIR }}
          retention-days: 7

  package:
    needs: prepare-source
    # Ubuntu 22.04 keeps the distributable native extension honest on GCC 11,
    # which is still the default compiler on a maintained Linux LTS release.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # One of the five GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-a
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build setuptools wheel
      # Reproducible artifacts are compiled against PyTorch's 2.10 Stable ABI.
      # The cold-install steps below validate the resulting artifacts against
      # the declared runtime range, including preinstalled vendor baselines.
      - run: python -m pip install "torch>=2.10,<2.11" --index-url https://download.pytorch.org/whl/cpu
      - name: Reproducible wheel and sdist builds
        run: |
          SOURCE_DATE_EPOCH=1767225600 python -m build --no-isolation --outdir dist-a
          SOURCE_DATE_EPOCH=1767225600 python -m build --no-isolation --outdir dist-b
          python tools/verify_reproducible_builds.py dist-a dist-b
          mkdir -p dist
          cp dist-a/* dist/
      - name: Verify artifact contents
        run: python tools/verify_distribution_artifacts.py dist
      - name: Verify one wheel on older PyTorch runtimes
        timeout-minutes: 15
        run: |
          python -m venv /tmp/fq-torch-compat
          /tmp/fq-torch-compat/bin/python -m pip install packaging
          for version in 2.10 2.11 2.12; do
            /tmp/fq-torch-compat/bin/python -m pip install "torch==${version}.*" --index-url https://download.pytorch.org/whl/cpu
            /tmp/fq-torch-compat/bin/python -m pip install dist/*.whl
            (
              cd /tmp
              /tmp/fq-torch-compat/bin/python -c "import torch; from importlib.metadata import requires; from packaging.requirements import Requirement; r=next(Requirement(x) for x in requires('flagquantum') if Requirement(x).name == 'torch'); assert r.specifier.contains(torch.__version__), (r, torch.__version__); from flagquantum.simulation.native_cpu import adjoint; assert adjoint.native_cpu_adjoint_available(), repr(adjoint._EXTENSION_ERROR); import flagquantum as fq; assert fq.Circuit(2).h(0).cx(0,1).state().shape[-1] == 4"
            )
          done
      - name: Build and test the publishable manylinux wheel
        uses: pypa/cibuildwheel@v4.3.0
        with:
          # cp310-abi3 is the single wheel for every supported CPython.
          # cibuildwheel builds it against torch 2.10 and tests it on 2.14.
          only: cp310-manylinux_x86_64
          output-dir: wheelhouse
      - name: Verify publishable manylinux wheel contents
        run: python tools/verify_distribution_artifacts.py wheelhouse
      - name: Cold-install CPU wheel and run quick start
        timeout-minutes: 5
        env:
          PIP_CACHE_DIR: /tmp/fq-user-install-cache
        run: |
          python -m venv /tmp/fq-wheel
          install_started=$SECONDS
          /tmp/fq-wheel/bin/python -m pip install "torch>=2.13,<2.14" --index-url https://download.pytorch.org/whl/cpu
          /tmp/fq-wheel/bin/python -m pip install dist/*.whl
          install_elapsed=$((SECONDS - install_started))
          echo "Cold Linux CPU wheel install: ${install_elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          pushd /tmp
          /tmp/fq-wheel/bin/python -c "import flagquantum as fq; c=fq.Circuit(2).h(0).cx(0,1); assert c.state().shape[-1] == 4"
          /tmp/fq-wheel/bin/python -c "from flagquantum.simulation.native_cpu import adjoint; assert adjoint.native_cpu_adjoint_available(), repr(adjoint._EXTENSION_ERROR)"
          /tmp/fq-wheel/bin/python -c "from flagquantum.runtime.capabilities import load_operator_profile; assert load_operator_profile('statevector_local_p0').name == 'statevector_local_p0'"
          /tmp/fq-wheel/bin/python -c "from flagquantum import services; assert callable(services.search_research_capabilities); assert callable(services.execute_research_capability); assert any(item.capability_id == 'ground_state.solve.vqe' for item in services.search_research_capabilities({}))"
          /tmp/fq-wheel/bin/python -c "from flagquantum.simulation.numerics.conformance import run_double_single_conformance; assert run_double_single_conformance().passed"
          /tmp/fq-wheel/bin/python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('jax', 'datasets', 'transformers', 'matplotlib', 'cirq', 'cudaq', 'pennylane', 'qiskit', 'qiskit_aer', 'braket', 'quark'))"
          popd
          rm -rf /tmp/fq-wheel
      - name: Clean-install sdist and run quick start
        run: |
          python -m venv /tmp/fq-sdist
          /tmp/fq-sdist/bin/python -m pip install setuptools wheel
          /tmp/fq-sdist/bin/python -m pip install "torch>=2.13,<2.14" --index-url https://download.pytorch.org/whl/cpu
          /tmp/fq-sdist/bin/python -m pip install --no-build-isolation dist/*.tar.gz
          pushd /tmp
          /tmp/fq-sdist/bin/python -c "import flagquantum as fq; c=fq.Circuit(2).h(0).cx(0,1); assert c.state().shape[-1] == 4"
          /tmp/fq-sdist/bin/python -c "from flagquantum.simulation.numerics.conformance import run_double_single_conformance; assert run_double_single_conformance().passed"
          popd
      - name: Write checksummed artifact manifest
        run: python tools/artifact_manifest.py --output dist/manifest.json dist/*.whl dist/*.tar.gz
      - name: Verify real QEC optional installations outside the checkout
        id: qec-installed
        timeout-minutes: 15
        run: >-
          python tools/check_qec_installed_profiles.py
          --dist-dir dist
          --report-dir "${{ runner.temp }}/qec-installed-reports"
      - name: Retain installed QEC evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qec-installed-${{ github.sha }}
          path: ${{ runner.temp }}/qec-installed-reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: flagquantum-distributions-${{ github.sha }}
          path: dist/

  release-wheel-platform:
    needs: prepare-source
    # Linux is exercised by `package`; these are the two native toolchains that
    # cannot be represented by an Ubuntu source build.  Keeping the exact
    # cibuildwheel route in pull-request CI prevents a release tag from being
    # the first time MSVC or the macOS artifact verifier is exercised.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
            identifier: cp310-macosx_arm64
          - os: windows-2022
            artifact: windows-amd64
            identifier: cp310-win_amd64
    # Reuse an existing light bucket rather than increasing the repository's
    # share of the organisation-wide runner pool.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-c
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test the release wheel
        uses: pypa/cibuildwheel@v4.3.0
        with:
          only: ${{ matrix.identifier }}
          output-dir: wheelhouse
      - name: Verify release wheel contents
        run: python tools/verify_distribution_artifacts.py wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: flagquantum-${{ matrix.artifact }}-${{ github.sha }}
          path: wheelhouse/

  distributed-cpu-shard:
    needs: prepare-source
    runs-on: >-
      ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","flagquantum-cpu"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {command: 0, shard: 0, shards: 4}
          - {command: 0, shard: 1, shards: 4}
          - {command: 0, shard: 2, shards: 4}
          - {command: 0, shard: 3, shards: 4}
          - {command: 1, shard: 0, shards: 2}
          - {command: 1, shard: 1, shards: 2}
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
      JAX_PLATFORMS: cpu
    concurrency:
      group: flagquantum-${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('self-hosted-{0}-distributed-cpu-shard-{1}', github.run_id, strategy.job-index || 0) || 'gh' }}-${{ github.event.pull_request.number || github.ref_name }}-distributed
      queue: max
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: error
          name: ci-source-incremental-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Check whether cached Git objects complete the source tree
        id: source-cache
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          complete=false
          if objects="$(git rev-list --objects --missing=print --no-walk "$sha")"; then
            if ! printf '%s\n' "$objects" | grep -q '^?'; then
              complete=true
            fi
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        if: steps.source-cache.outputs.complete != 'true'
        with:
          digest-mismatch: error
          name: ci-source-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Restore and verify this run's exact source commit
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          printf '%s\n' "$sha" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git config --worktree core.sparseCheckout false
          git config --worktree core.sparseCheckoutCone false
          rm -f .git/info/sparse-checkout
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/isolated-python
      - name: Budget launchers for this isolated CPU service
        run: python -I tools/ci_cpu_budget.py --dedicated
      - uses: ./.github/actions/install-cpu-torch
      - run: python -m pip install --no-build-isolation -e '.[dev,jax]'
      - name: Verify dependency consistency and CPU frameworks
        run: |
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None"
          python -c "import jax; assert jax.default_backend() == 'cpu'"
      - name: Run this partition of the complete distributed CPU contract selections
        env:
          PYTEST_ADDOPTS: -vv -n ${{ env.FQ_DISTRIBUTED_WORKERS }} --dist=worksteal --durations=50
        run: |
          # The shared platform may set RANK=0 for its own one-process job.
          # Only an explicit torchrun child may define the tested rank topology.
          unset RANK WORLD_SIZE LOCAL_RANK LOCAL_WORLD_SIZE MASTER_ADDR MASTER_PORT GROUP_RANK NODE_RANK
          python tools/ci_tier.py pr-distributed --command-index ${{ matrix.command }} --shard-count ${{ matrix.shards }} --shard-index ${{ matrix.shard }}
      - name: Verify the JAX rank-local gradient contract under two actual ranks
        if: matrix.command == 0 && matrix.shard == 0
        timeout-minutes: 10
        run: torchrun --standalone --nproc-per-node=2 -m pytest tests/distributed/test_hybrid_jax_runtime.py -q
      - name: Retain resource limits and pytest timing reports
        if: ${{ always() && env.FQ_CI_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-report-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: ${{ env.FQ_CI_REPORT_DIR }}
          retention-days: 7


  distributed-cpu:
    if: ${{ always() }}
    needs: distributed-cpu-shard
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'flagquantum-cpu-general' || 'ubuntu-latest' }}
    timeout-minutes: 5
    concurrency:
      group: flagquantum-${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('a100-cpu-{0}-distributed-cpu-{1}', github.run_id, strategy.job-index || 0) || 'gh' }}-${{ github.event.pull_request.number || github.ref_name }}-distributed
