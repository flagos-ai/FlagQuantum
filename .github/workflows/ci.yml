          digest-mismatch: error
          name: ci-source-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Restore and verify this run's exact source commit
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          printf '%s\n' "$sha" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git config --worktree core.sparseCheckout false
          git config --worktree core.sparseCheckoutCone false
          rm -f .git/info/sparse-checkout
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/isolated-python
      - run: python -m pip install --upgrade pip 'setuptools>=77.0.3' wheel
      - uses: ./.github/actions/install-cpu-torch
      - name: Install project and security tooling
        run: >-
          python -m pip install --no-build-isolation -e '.[dev]'
          pip-audit bandit cyclonedx-bom
      - name: Audit installed dependencies
        timeout-minutes: 8
        # Snapshot the installed environment and remove only PEP 440 local build
        # suffixes such as PyTorch's `+cpu`. `--disable-pip --no-deps` prevents
        # the audit from resolving or downloading a different environment.
        run: |
          python tools/write_audit_requirements.py audit-requirements.txt
          # Vulnerability queries contact PyPI directly, even on mirror-backed
          # runners. Allow slow responses while bounding the complete audit step.
          pip-audit --strict --disable-pip --no-deps --requirement audit-requirements.txt --timeout 60
      - name: Static security analysis
        run: bandit -q -lll -r flagquantum -x flagquantum/testing
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Validate SBOM
        run: python tools/validate_sbom.py sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
      - name: Retain resource limits and pytest timing reports
        if: ${{ always() && env.FQ_CI_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-report-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: ${{ env.FQ_CI_REPORT_DIR }}
          retention-days: 7

  ci-complete:
    name: CI complete
    needs:
      - pre-commit
      - prepare-source
      - quality
      - cpu-core
      - cpu-core-3-12-tests
      - cpu-runtime
      - cpu-core-3-12
      - jax-optional
      - azure-optional
      - triton-optional
      - qiskit-optional
      - qiskit-compat
      - cirq-optional
      - braket-optional
      - cudaq-optional
      - pennylane-optional
      - dependency-bounds
      - package
      - release-wheel-platform
      - distributed-cpu
      - distributed-cpu-shard
      - coverage-shard
      - coverage
      - supply-chain
    if: ${{ always() }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'flagquantum-cpu-general' || 'ubuntu-latest' }}
    concurrency:
      group: flagquantum-${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('a100-cpu-{0}-ci-complete-{1}', github.run_id, strategy.job-index || 0) || 'gh' }}-${{ github.event.pull_request.number || github.ref_name }}-light-a
      queue: max
    steps:
      - name: Require every CI job to succeed before merging
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_JSON"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if not results or failed:
              print("CI did not complete successfully:", failed or "no job results", file=sys.stderr)
              sys.exit(1)
          print("All", len(results), "CI jobs succeeded")
          PYTHON
