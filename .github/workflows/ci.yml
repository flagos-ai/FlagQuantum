name: CI

on:
  push:
    # `develop` and the `refactor/flagquantum-vnext-architecture` integration branch
    # were listed here as well. Neither has ever existed in this repository or in the
    # private integration checkout, so those two entries could never fire. A `push`
    # trigger that cannot run is worse than an absent one: it reads as coverage.
    branches: [main]
  pull_request:
    branches: [main]

# flagos-ai runs every repository from one pool of 20 concurrent GitHub-hosted
# jobs, and this workflow fans out beyond the share one repository should hold.
# Two constraints bound this repository's share of it.
#
# The block below cancels a superseded run of the same pull request, so a push to
# a branch under review does not queue a second full matrix behind it, and it
# deliberately does not cancel a superseded run of `main`. A pull request's older
# tree is a tree nobody will merge, so its reading is replaceable. A revision of
# `main` has already been merged, so cancelling its run leaves a merge commit that
# no gate ever read, and nothing here reports the difference between that and a
# passing revision: on 2026-10-08 the merges of #590 and #591 landed 17 seconds
# apart and all 23 check runs attached to the first of them were `cancelled`,
# `quality` among them (issue #579). A push run is therefore keyed to its own
# commit and allowed to finish. The cost is a queued matrix per push to `main`
# rather than a dropped one, and that is the trade this file makes knowingly.
#
# Every job below then joins one of nine named buckets scoped to this pull
# request or pushed branch -- `cpucore-3.1x`, two `coverage` shards,
# `distributed`, and
# `light-a`/`b`/`c`. The scope is essential: repository-global buckets made an
# unrelated pull request wait behind every older run in the same bucket, so a
# healthy 15-minute matrix regularly took an hour to report. A concurrency
# group admits one job at a time, so the nine bucket suffixes remain the
# per-run ceiling while the organisation's 20-runner pool remains the aggregate
# ceiling across repositories and pull requests.
#
# `queue: max` is what makes a bucket a cap instead of a drop: the default
# keeps only the newest waiting job and cancels the ones behind it, which would
# report nothing at all for the job that was dropped.
concurrency:
  group: flagquantum-ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-a
      queue: max
    steps:
      # The evidence provenance gates below ask whether each recorded source
      # revision is present in this repository and whether a ref of it reaches
      # the commit. A depth-1 clone cannot answer either question about a
      # revision it did not fetch: it cannot tell one it never fetched from one
      # the repository never contained, nor list the refs reaching a commit, and
      # tools/evidence_provenance.py fails closed on that ambiguity rather than
      # reading it as a pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: English repository content
        run: python tools/check_repository_language.py
      - name: Ruff production and test surface
        run: ruff check flagquantum tests tools
      - name: Black production and test surface
        run: black --check flagquantum tests tools
      - name: Strict type check of the whole package
        # Target 3.12 because numpy's bundled stubs use PEP 695 ``type``
        # statements, which mypy only parses at 3.12. The 3.10 and 3.11
        # interpreters are enforced by the cpu-core matrix, not here.
        run: >-
          mypy --strict --python-version 3.12 --ignore-missing-imports
          flagquantum
      - name: Strict type check of the CI tooling
        run: >-
          mypy --strict --python-version 3.12 --ignore-missing-imports
          --follow-imports skip
          tools/ci_tier.py
          tools/check_evidence_revisions.py
      - name: Enforce package boundaries and module budgets
        run: python tools/check_architecture.py
      - name: Validate multi-team ownership policy
        run: python tools/check_team_scope.py --validate
      # `--validate` reads the policy; it never resolves a path. A pull request
      # that adds a file no rule covers therefore passes that step and only
      # fails later in `cpu-core`, as an assertion diff from
      # `tests/unit/test_team_scope_policy.py`. This step answers the same
      # question about the changed paths directly, and names the owning teams so
      # a reviewer can see a cross-team pull request at a glance. Crossing teams
      # is reported, not rejected: 8 of the last 30 merges on `main` touched two
      # teams, mostly `simulation` with `verification`, and that is a review
      # question rather than a defect.
      - name: Require every changed path to have an owner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base revision is available for this event; skipping"
            exit 0
          fi
          python tools/check_team_scope.py --require-classified --base "$BASE_SHA"
      - name: Enforce core, extras, interop, and external-platform dependencies
        run: python tools/check_dependency_policy.py
      - name: Verify Amazon Braket circuit interoperability contract
        run: python tools/check_braket_interop_contract.py
      - name: Verify Cirq interoperability contract
        run: python tools/check_cirq_interop_contract.py
      - name: Verify CUDA-Q export contract
        run: python tools/check_cudaq_export_contract.py
      - name: Verify Qiskit interoperability contract
        run: python tools/check_qiskit_interop_contract.py
      - name: Verify PennyLane interoperability contract
        run: python tools/check_pennylane_interop_contract.py
      - name: Verify construction-time composition contract
        run: python tools/check_circuit_composition_contract.py
      - name: Verify the density-matrix output contract
        run: python tools/check_density_matrix_output_contract.py
      - name: Verify the von Neumann entropy output contract
        run: python tools/check_vn_entropy_output_contract.py
      - name: Verify primitives admission contract
        run: python tools/check_primitives_admission_contract.py
      - name: Verify construction-layer acceptance contract
        run: python tools/check_construction_acceptance_contract.py
      - name: Verify interoperability capability-gap matrix
        run: python tools/check_interop_capability_gap_matrix.py
      - name: Verify OpenQASM import contract
        run: python tools/check_openqasm_import_contract.py
      - name: Verify the qubit-vocabulary ledgers
        run: python tools/check_qubit_vocabulary.py
      - name: Verify CUDA-Q parity matrix and its generated scoreboard
        run: python tools/parity_matrix.py --check
      - name: Verify the CUDA-Q QEC alignment checklist against this checkout
        run: python tools/check_qec_cudaq_alignment.py
      - name: Verify Double-Single FP32 numerical contract
        run: python tools/check_double_single_contract.py
      - name: Verify split real/imag statevector P0 contract
        run: python tools/check_split_real_imag_contract.py
      - name: Verify split real/imag statevector P1 contract
        run: python tools/check_split_real_imag_p1_contract.py
      - name: Verify split real/imag P1 A800 reference evidence
        run: python tools/validate_split_real_imag_training_evidence.py
      - name: Verify split real/imag statevector P2 precision contract
        run: python tools/check_split_real_imag_p2_precision_contract.py
      - name: Verify split real/imag P2 A800 reference evidence
        run: python tools/validate_split_real_imag_precision_evidence.py
      - name: Verify split real/imag statevector P3 Double-Single contract
        run: python tools/check_split_real_imag_p3_double_single_contract.py
      - name: Verify split real/imag P3 A800 reference evidence
        run: python tools/validate_split_real_imag_double_single_evidence.py
      - name: Verify split real/imag statevector P4 device Double-Single contract
        run: python tools/check_split_real_imag_p4_device_double_single_contract.py
      - name: Verify split real/imag P4 A800 reference evidence
        run: python tools/validate_split_real_imag_device_double_single_evidence.py
      - name: Verify split real/imag statevector P5 autograd/optimizer contract
        run: python tools/check_split_real_imag_p5_autograd_optimizer_contract.py
      - name: Verify split real/imag P5 optimizer A800 reference evidence
        run: python tools/validate_split_real_imag_optimizer_evidence.py
      - name: Verify domestic single-card certification contract
        run: python tools/check_domestic_single_card_contract.py
      - name: Verify operator capability manifest
        run: python tools/operator_manifest.py --check
      - name: Verify batch parameter-shift coverage against the opcode declaration
        run: python tools/check_parameter_shift_coverage_contract.py
      - name: Verify parameter-shift Hessian against central differences
        run: python tools/check_parameter_shift_hessian_contract.py
      - name: Verify every differentiable opcode against an independent difference scheme
        run: python tools/check_opcode_gradient_exactness.py
      - name: Verify the gradient method and execution mode matrix by re-measuring it
        run: python tools/check_gradient_methods_contract.py
      - name: Verify the native gradient capability registration
        run: python tools/check_native_gradients_contract.py
      - name: Verify the metric tensor against its independent routes
        run: python tools/check_metric_tensor_contract.py
      - name: Verify runtime contract schema
        run: python tools/runtime_contract_schema.py --check
      - name: Verify documentation sources of truth
        run: python tools/docs_source_of_truth.py --check
      # `docs_source_of_truth.py --check` also resolves relative links, but only
      # for the ten documents listed under `stable_documents` in
      # `docs/source_of_truth.json`, and it never resolves anchors. A rename
      # elsewhere in the tree therefore breaks a reader's link without failing
      # any check. This step covers every tracked markdown file instead.
      - name: Verify documentation links and anchors
        run: python tools/check_docs_links.py
      - name: Verify retained Stable Core against migration baseline
        run: python tools/public_api_snapshot.py
      - name: Verify proposed Stable Core classification
        run: python -m pytest tests/unit/test_public_api_candidate.py -q
      - name: Reject legacy root API in user-facing files
        run: python tools/check_legacy_root_api_usage.py
      - name: Verify correctness certification matrix
        run: python tools/correctness_certification.py --check
      - name: Verify capability maturity claims
        run: python tools/check_capability_maturity.py
      # The two modules below resolve each performance claim's recorded
      # `code_version` against this repository's history. A depth-1 clone cannot
      # separate a revision it never fetched from one the repository never
      # contained, so those tests skip in every other lane rather than read that
      # silence as a pass -- which leaves this job, the only one that fetches
      # full history, as the only place they can reach a verdict. Running them
      # here is what keeps the pin check live instead of nominally present.
      - name: Verify performance claim provenance where history resolves
        run: >-
          python -m pytest
          tests/unit/test_capability_maturity.py
          tests/unit/test_docs_source_of_truth.py
          tests/unit/test_evidence_revisions.py
          -q
      # Three two-node probe contract tests recompute the digest of the contract
      # each checked-in artifact recorded, from the revision the artifact names.
      # That needs the commit, so those three assertions skip in a depth-1 lane
      # rather than read a clone that never fetched the revision as a mismatch.
      # They ran in the unit tier and errored there for exactly that reason,
      # which is why the skip has to be paired with somewhere it reaches a
      # verdict: this job, the only one that fetches full history. The rest of
      # each module is about the artifact's own content and runs everywhere.
      - name: Verify checked-in probe artifacts against their recorded contracts
        run: >-
          python -m pytest
          tests/team/runtime/test_cuda_multinode_tn_probe.py
          tests/team/runtime/test_cuda_multinode_mps_probe.py
          tests/team/runtime/test_cuda_multinode_statevector_probe.py
          -q
      # The six artifact validators in this job resolve the revision of the one
      # artifact each of them names, so an artifact no validator names was never
      # asked -- which is how nineteen artifacts under `artifacts/` came to record
      # revisions this repository does not contain. This step asks a directory
      # instead of a list, and asks two questions: every full-length revision at
      # any depth in an artifact under `artifacts/` or `benchmarks/results/` must
      # be obtainable here -- this repository holds the commit and a ref reaches
      # it -- or be accounted for by an origin, either declared in
      # `evidence-revision-origins.toml` or stated inside the artifact as
      # `<field>_origin` beside the field that records the revision. An artifact
      # whose two records disagree fails rather than passing twice. Presence alone
      # is not enough, because a commit only a deleted branch pointed at stays in
      # the object database of the checkout that made it and no clone obtains it.
      # It needs the full history this job already fetches.
      - name: Verify evidence revision origins
        run: python tools/check_evidence_revisions.py
      - name: Verify checked-in FlagOS reference evidence
        run: >-
          python tools/validate_flagos_reference_evidence.py
          artifacts/flagos_cuda_reference_a800_20260824.json
      - name: Verify branch-protection required-check contract
        run: python tools/validate_required_checks.py
      - name: Repository size and forbidden artifacts
        run: python tools/check_repository_hygiene.py
      - name: Lazy import budget
        run: python tools/check_import_time.py

  cpu-core:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-cpucore-${{ matrix.python-version }}
      queue: max
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Run smoke and unit tests with bounded workers
        # Keep the two-worker memory/capacity bound, but allow an idle worker
        # to steal tests from a worker that received a slow module. Grouping a
        # whole module with loadscope created a long single-worker tail here.
        env:
          PYTEST_ADDOPTS: -n 2 --dist=worksteal --durations=50
        run: python tools/ci_tier.py pr-default
      - name: Run integration tests with bounded workers
        # The smoke/unit tier exercises every supported interpreter. The
        # integration tier proves runtime behavior rather than interpreter
        # compatibility, so run that repository-wide suite once on the newest
        # supported Python instead of repeating it three times.
        if: matrix.python-version == '3.12'
        env:
          PYTEST_ADDOPTS: -n 2 --dist=worksteal --durations=50
        run: python tools/ci_tier.py pr-runtime
      - name: Prove JAX is absent from the PyTorch-only environment
        run: python -c "import importlib.util; assert importlib.util.find_spec('jax') is None"
      - name: Prove NumPy and the 3.11 standard library are absent
        # NumPy is not an external quantum framework, so it does not belong in
        # the list below; it gets its own assertion because its absence is what
        # makes a collected module that says `import numpy` fail on this lane
        # and nowhere else. torch declares no NumPy requirement, so the absence
        # is real -- every leg reports `Failed to initialize NumPy` and the
        # suite still passes -- and asserting it turns that coincidence into a
        # checked property.
        #
        # `tomllib` is the 3.11 standard library, so the oldest supported
        # interpreter does not have it at all. A module that imports it behind
        # `sys.version_info` passes on 3.11 and 3.12 and fails to collect on
        # 3.10; the `try`/`except ModuleNotFoundError` form is the one that
        # survives both this lane and a stripped standard library, and
        # `tools/check_dependency_policy.py` holds every site to it. This step
        # proves the lane is what that fallback assumes: the standard library
        # module is there exactly where the version says, and where it is not,
        # the substitute the fallback imports is installed.
        run: >-
          python -c "import importlib.util as u, sys;
          has_stdlib = u.find_spec('tomllib') is not None;
          assert u.find_spec('numpy') is None, 'NumPy must be absent from this lane';
          assert has_stdlib == (sys.version_info >= (3, 11)),
          'tomllib must be present exactly where the interpreter provides it';
          assert has_stdlib or u.find_spec('tomli') is not None,
          'the tomllib fallback must be installed where the standard library lacks it'"
      - name: Prove external quantum frameworks are absent from core
        run: >-
          python -c "import importlib.util;
          assert all(importlib.util.find_spec(name) is None
          for name in ('cirq', 'cudaq', 'pennylane', 'qiskit', 'qiskit_aer', 'braket', 'quark'))"
      - name: Prove core import does not load JAX
        run: python -m pytest tests/smoke/test_no_jax_core.py -q
      - name: Prove native distributed runtime does not require JAX
        if: matrix.python-version == '3.12'
        run: torchrun --standalone --nproc-per-node=2 tests/distributed/runtime_modes.py
      - name: Run the launched distributed tests under a real launcher
        if: matrix.python-version == '3.12'
        run: torchrun --standalone --nproc-per-node=2 -m pytest -m distributed_launch -q

  jax-optional:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-a
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,jax]'
      - run: python -m pytest tests/test_hybrid_jax.py tests/test_jax_distributed_plan.py -q

  azure-optional:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-a
      queue: max
    env:
      OPTIONAL_VERSIONS: "1.32.3 1.32.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - name: Install the declared Azure extra
        run: python -m pip install -e '.[dev,azure]'
      - name: Verify the certified QDK Azure versions and the offline provider suite
        # No Azure credential, workspace resource id, or network submission is
        # used here. The suite exercises the fake workspace and target path plus
        # the fail-closed diagnostics, and proves the extra stays out of the
        # core import.
        run: |
          set -euxo pipefail
          for version in ${OPTIONAL_VERSIONS}; do
            python -m pip install --upgrade "qdk[azure]==${version}"
            python -m pytest tests/test_azure_quantum_provider.py -m azure -q
            python -c "import sys, flagquantum; assert not any(name == 'qdk' or name.startswith('qdk.') or name == 'azure' or name.startswith('azure.') for name in sys.modules)"
          done

  triton-optional:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-b
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,cuda]'
      - name: Run the Triton kernels that do not need a device
        run: python -m pytest tests/test_statevector_triton_gates.py tests/unit/test_hva_forward_tangent_triton.py tests/unit/test_mps_two_site_triton.py tests/unit/test_real_imag_kernels.py tests/unit/test_single_qubit_loop_triton.py tests/unit/test_statevector_pauli_expectation_triton.py tests/unit/test_statevector_probabilities_triton.py tests/unit/test_statevector_triton.py tests/unit/test_triton_complex_bmm.py tests/unit/test_two_qubit_pauli_tangent_triton.py -m triton -q -rs

  qiskit-optional:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-b
      queue: max
    env:
      OPTIONAL_VERSIONS: "2.0.* 2.5.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Verify both certified Qiskit and Aer versions
        run: |
          set -euxo pipefail
          for version in ${OPTIONAL_VERSIONS}; do
            python -m pip install --upgrade \
              "qiskit[qasm3-import]==${version}" \
              'qiskit-aer==0.17.*' \
              'sympy>=1.13,<2'
            python tools/check_qiskit_interop_contract.py
            python -m pytest tests/api_contract/test_open_source_golden_paths.py tests/team/ecosystem/test_qiskit_boundary_semantics.py tests/test_dynamic_conformance.py tests/test_qiskit_interop.py tests/test_qiskit_interop_conformance.py tests/optional/test_qiskit_aer_backend.py -m qiskit -q
            # Ten of the fifteen compiler benchmark contracts do not check this
            # repository against itself. Each builds its payload in-process, reads
            # a Qiskit anchor out of it, and compares the two, so the comparison
            # exists only where Qiskit is importable and the file skips when it is
            # not. The only lane that collected these files is `distributed-cpu`,
            # which installs no Qiskit, so all ten comparisons skipped on every
            # pull request and were reported as passes by the tier that owns their
            # marker; a skipped agreement check reads exactly like an agreement.
            # They are read here instead, on both certified lanes, because an
            # anchor is only comparable with a release this repository certifies.
            # `tests/benchmark_contract/qiskit_lane.py` holds that rule and fails
            # rather than skips when a host is outside it.
            python -m pytest tests/benchmark_contract/test_compiler_*.py -m benchmark_contract -q
            python -c "import sys, flagquantum; assert not any(name == 'qiskit' or name.startswith('qiskit.') or name == 'qiskit_aer' or name.startswith('qiskit_aer.') for name in sys.modules)"
          done

  cirq-optional:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-b
      queue: max
    env:
      OPTIONAL_VERSIONS: "1.6.1 1.7.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Verify both certified Cirq Core versions
        run: |
          set -euxo pipefail
          for version in ${OPTIONAL_VERSIONS}; do
            python -m pip install --upgrade "cirq-core==${version}"
            python tools/check_cirq_interop_contract.py --verify-sdk
            python -m pytest tests/test_cirq_interop.py tests/test_cirq_interop_conformance.py -m cirq -q
            python -c "import sys, flagquantum; assert not any(name == 'cirq' or name.startswith('cirq.') for name in sys.modules)"
          done

  braket-optional:
    runs-on: ubuntu-latest
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-c
      queue: max
    env:
      OPTIONAL_VERSIONS: "1.117.0 1.127.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Verify both certified Amazon Braket SDK versions
        run: |
          set -euxo pipefail
          for version in ${OPTIONAL_VERSIONS}; do
            python -m pip install --upgrade "amazon-braket-sdk==${version}"
            python tools/check_braket_interop_contract.py --verify-sdk
            python -m pytest tests/test_amazon_braket_provider.py tests/test_braket_iqm_dynamic.py tests/test_braket_interop.py tests/test_braket_interop_conformance.py -m braket -q
            python -c "import sys, flagquantum; assert not any(name == 'braket' or name.startswith('braket.') for name in sys.modules)"
          done

  cudaq-optional:
    runs-on: ubuntu-latest
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-c
      queue: max
    env:
      OPTIONAL_VERSIONS: "0.15.1 0.16.0.post1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Verify both certified CUDA-Q versions
        run: |
          set -euxo pipefail
          for version in ${OPTIONAL_VERSIONS}; do
            python -m pip install --upgrade "cudaq==${version}"
            python tools/check_cudaq_export_contract.py --verify-sdk
            python -m pytest tests/test_cudaq_export.py tests/test_cudaq_export_conformance.py -m cudaq -q
            python -c "import sys, flagquantum; assert not any(name == 'cudaq' or name.startswith('cudaq.') for name in sys.modules)"
          done

  pennylane-optional:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-b
      queue: max
    env:
      OPTIONAL_VERSIONS: "0.44.1 0.45.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Verify both certified PennyLane versions
        run: |
          set -euxo pipefail
          for version in ${OPTIONAL_VERSIONS}; do
            python -m pip install --upgrade "pennylane==${version}"
            python tools/check_pennylane_interop_contract.py
            python -m pytest tests/team/ecosystem/test_pennylane_boundary_semantics.py tests/test_pennylane_interop.py tests/test_pennylane_interop_conformance.py tests/benchmark_contract/test_batched_statevector_corpus.py -m pennylane -q
            python -c "import sys, flagquantum; assert not any(name == 'pennylane' or name.startswith('pennylane.') for name in sys.modules)"
          done

  dependency-bounds:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-c
      queue: max
    strategy:
      matrix:
        include:
          - python: "3.10"
            torch: "torch==2.5.*"
          - python: "3.12"
            torch: "torch>=2.5,<2.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '${{ matrix.torch }}' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/smoke tests/test_native_circuit.py -q
      # The declared development floor is a claim about this repository's own
      # toolchain, so it is installed and run rather than trusted. Only the 3.12
      # lane runs the gates, because the strict type check targets 3.12.
      - name: Install the declared development floor
        if: matrix.python == '3.12'
        run: >-
          python -m pip install
          $(python tools/check_dependency_policy.py --print-floor)
      - name: Run the Python gates on the declared development floor
        if: matrix.python == '3.12'
        run: |
          ruff check flagquantum tests tools
          black --check flagquantum tests tools
          mypy --strict --python-version 3.12 --ignore-missing-imports flagquantum

  package:
    # Ubuntu 22.04 keeps the distributable native extension honest on GCC 11,
    # which is still the default compiler on a maintained Linux LTS release.
    runs-on: ubuntu-22.04
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-a
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build setuptools wheel
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - name: Reproducible wheel and sdist builds
        run: |
          SOURCE_DATE_EPOCH=1767225600 python -m build --no-isolation --outdir dist-a
          SOURCE_DATE_EPOCH=1767225600 python -m build --no-isolation --outdir dist-b
          python tools/verify_reproducible_builds.py dist-a dist-b
          mkdir -p dist
          cp dist-a/* dist/
      - name: Verify artifact contents
        run: python tools/verify_distribution_artifacts.py dist
      - name: Clean-install wheel and run quick start
        run: |
          python -m venv /tmp/fq-wheel
          /tmp/fq-wheel/bin/python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
          /tmp/fq-wheel/bin/python -m pip install dist/*.whl
          pushd /tmp
          /tmp/fq-wheel/bin/python -c "import flagquantum as fq; c=fq.Circuit(2).h(0).cx(0,1); assert c.state().shape[-1] == 4"
          /tmp/fq-wheel/bin/python -c "from flagquantum.simulation.native_cpu import adjoint; assert adjoint.native_cpu_adjoint_available(), repr(adjoint._EXTENSION_ERROR)"
          /tmp/fq-wheel/bin/python -c "from flagquantum.runtime.capabilities import load_operator_profile; assert load_operator_profile('statevector_local_p0').name == 'statevector_local_p0'"
          /tmp/fq-wheel/bin/python -c "from flagquantum.simulation.numerics.conformance import run_double_single_conformance; assert run_double_single_conformance().passed"
          /tmp/fq-wheel/bin/python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('jax', 'datasets', 'transformers', 'matplotlib', 'cirq', 'cudaq', 'pennylane', 'qiskit', 'qiskit_aer', 'braket', 'quark'))"
          popd
          rm -rf /tmp/fq-wheel
      - name: Clean-install sdist and run quick start
        run: |
          python -m venv /tmp/fq-sdist
          /tmp/fq-sdist/bin/python -m pip install setuptools wheel
          /tmp/fq-sdist/bin/python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
          /tmp/fq-sdist/bin/python -m pip install --no-build-isolation dist/*.tar.gz
          pushd /tmp
          /tmp/fq-sdist/bin/python -c "import flagquantum as fq; c=fq.Circuit(2).h(0).cx(0,1); assert c.state().shape[-1] == 4"
          /tmp/fq-sdist/bin/python -c "from flagquantum.simulation.numerics.conformance import run_double_single_conformance; assert run_double_single_conformance().passed"
          popd
      - name: Write checksummed artifact manifest
        run: python tools/artifact_manifest.py --output dist/manifest.json dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: flagquantum-distributions-${{ github.sha }}
          path: dist/

  distributed-cpu:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-distributed
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,jax]'
      - run: python tools/ci_tier.py pr-distributed

  coverage-shard:
    runs-on: ubuntu-latest
    # Two of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-coverage-${{ matrix.shard }}
      queue: max
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      COVERAGE_FILE: .coverage.${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "torch>=2.5,<2.14" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,jax,viz,braket,cirq,pennylane,cotengra,stim,pymatching,kaiwu]'
      - name: Run maintained-runtime tests with coverage on pull requests
        if: github.event_name == 'pull_request'
        # The two full P5 trajectory conformance tests already run in the
        # Python 3.12 cpu-core integration tier. Avoid repeating their 3+
        # instrumented minutes here; pushes to main still measure them below.
        run: >-
          python -m pytest -m "(smoke or unit or integration or jax) and not slow and not qiskit and not cudaq and not triton"
          -n 2 --dist=worksteal --durations=50
          -p tools.pytest_shard
          --fq-shard-count 2 --fq-shard-index ${{ matrix.shard }}
          --cov=flagquantum
          --cov-report=
      - name: Run complete maintained-runtime tests with coverage after merge
        if: github.event_name != 'pull_request'
        run: >-
          python -m pytest -m "(smoke or unit or integration or jax) and not qiskit and not cudaq and not triton"
          -n 2 --dist=worksteal --durations=50
          -p tools.pytest_shard
          --fq-shard-count 2 --fq-shard-index ${{ matrix.shard }}
          --cov=flagquantum
          --cov-report=
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}-${{ github.sha }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true

  coverage:
    needs: coverage-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Reuse shard zero's bucket after it finishes. Aggregation is serial
    # metadata work, so it needs no tenth runner slot.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-coverage-0
      queue: max
    steps:
      - name: Require every coverage shard to pass
        run: test '${{ needs.coverage-shard.result }}' = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install 'pytest-cov>=4.0.0,<8'
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*-${{ github.sha }}
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage shards
        run: |
          python -m coverage combine coverage-data
          python -m coverage xml
      - name: Enforce coverage policy
        run: python tools/check_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml

  supply-chain:
    runs-on: ubuntu-latest
    # One of the nine GitHub-hosted buckets -- see the capacity note above.
    concurrency:
      group: flagquantum-gh-${{ github.event.pull_request.number || github.ref_name }}-light-c
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and security tooling
        run: >-
          python -m pip install -e '.[dev]'
          pip-audit bandit cyclonedx-bom
      - name: Audit installed dependencies
        run: |
          python -m pip list --format freeze --exclude flagquantum > audit-requirements.txt
          pip-audit --strict --no-deps --requirement audit-requirements.txt
      - name: Static security analysis
        run: bandit -q -lll -r flagquantum -x flagquantum/testing
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Validate SBOM
        run: python tools/validate_sbom.py sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
