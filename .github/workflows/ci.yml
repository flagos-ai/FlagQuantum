  coverage:
    needs: coverage-shard
    if: ${{ always() }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'flagquantum-a100-cpu' || 'ubuntu-latest' }}
    concurrency:
      group: flagquantum-${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('a100-cpu-{0}-coverage-{1}', github.run_id, strategy.job-index || 0) || 'gh' }}-${{ github.event.pull_request.number || github.ref_name }}-coverage-0
      queue: max
    steps:
      - name: Require every coverage shard to pass
        run: test '${{ needs.coverage-shard.result }}' = success
      - name: Clear sparse checkout state from a previous job
        run: |
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/isolated-python
      - run: python -m pip install 'pytest-cov>=4.0.0,<8'
      - name: Clear previous coverage inputs
        run: rm -rf coverage-data
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: error
          pattern: coverage-shard-*-${{ github.sha }}
          path: coverage-data
          merge-multiple: true
      - name: Validate complete coverage inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3

          directory = Path("coverage-data")
          expected = {f".coverage.{i}" for i in range(16)}
          actual = {p.name for p in directory.iterdir()}
          if actual != expected:
              raise SystemExit(f"coverage inputs differ: missing={sorted(expected - actual)}, unexpected={sorted(actual - expected)}")
          for name in sorted(expected):
              path = directory / name
              try:
                  with sqlite3.connect(path.resolve().as_uri() + "?mode=ro", uri=True) as connection:
                      result = connection.execute("PRAGMA integrity_check").fetchall()
                      if result != [("ok",)]:
                          raise ValueError(result)
              except (sqlite3.Error, ValueError) as error:
                  raise SystemExit(f"invalid coverage input {name}: {error}") from error
          print("Validated all 16 coverage inputs")
          PY
      - name: Combine coverage shards
        run: |
          python -m coverage combine coverage-data
          python -m coverage xml
      - name: Enforce coverage policy
        run: python tools/check_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
      - name: Retain resource limits and pytest timing reports
        if: ${{ always() && env.FQ_CI_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-report-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: ${{ env.FQ_CI_REPORT_DIR }}
          retention-days: 7

