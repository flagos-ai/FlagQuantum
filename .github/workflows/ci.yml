name: CI
on: workflow_dispatch

jobs:
  prepare-source:
    outputs:
      artifact-key: ${{ steps.pack-source.outputs.artifact-key }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'flagquantum-a100-cpu-entry' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: flagquantum-${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('a100-cpu-{0}-prepare-source-{1}', github.run_id, strategy.job-index || 0) || 'gh' }}-${{ github.event.pull_request.number || github.ref_name }}-cpucore-3.12
      queue: max
    steps:
      - name: Clear sparse checkout state from a previous job
        run: |
          if [ -d .git ]; then
            git sparse-checkout disable
            rm -f .git/info/sparse-checkout
            git config --local --unset core.sparseCheckout || true
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - name: Pack the exact commit and its complete tree for the A800 runners
        id: pack-source
        run: |
          set -o pipefail
          echo "artifact-key=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/ci-source"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-source/source.sha"
          git rev-list --objects --no-walk HEAD | git pack-objects --stdout > "$RUNNER_TEMP/ci-source/source.pack"
          mkdir "$RUNNER_TEMP/ci-source-incremental"
          cp "$RUNNER_TEMP/ci-source/source.sha" "$RUNNER_TEMP/ci-source-incremental/source.sha"
          base="$(git rev-list --first-parent --max-count=9 HEAD | tail -n 1)"
          {
            git rev-parse HEAD
            git rev-list --objects 'HEAD^{tree}' "^${base}^{tree}"
          } | git pack-objects --stdout > "$RUNNER_TEMP/ci-source-incremental/source.pack"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-source-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-source-incremental/
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ci-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-source/
          retention-days: 1
          compression-level: 0

  cpu-core:
    needs: prepare-source
    runs-on: [self-hosted, linux, x64, flagquantum-a800-cpu, a800-171]
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
      PIP_INDEX_URL: https://pypi.org/simple
    concurrency:
      group: flagquantum-${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('self-hosted-{0}-cpu-core-{1}', github.run_id, strategy.job-index || 0) || 'gh' }}-${{ github.event.pull_request.number || github.ref_name }}-cpucore-${{ matrix.python-version }}
      queue: max
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: error
          name: ci-source-incremental-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Check whether cached Git objects complete the source tree
        id: source-cache
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          complete=false
          if objects="$(git rev-list --objects --missing=print --no-walk "$sha")"; then
            if ! printf '%s\n' "$objects" | grep -q '^?'; then
              complete=true
            fi
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        if: steps.source-cache.outputs.complete != 'true'
        with:
          digest-mismatch: error
          name: ci-source-${{ needs.prepare-source.outputs.artifact-key }}
          path: ${{ runner.temp }}/ci-source
      - name: Restore and verify this run's exact source commit
        run: |
          sha="$(cat "$RUNNER_TEMP/ci-source/source.sha")"
          test "$sha" = "$GITHUB_SHA"
          if [ ! -d .git ]; then
            git init .
          fi
          git index-pack --stdin < "$RUNNER_TEMP/ci-source/source.pack"
          printf '%s\n' "$sha" >> .git/shallow
          sort -u .git/shallow -o .git/shallow
          git config --worktree core.sparseCheckout false
          git config --worktree core.sparseCheckoutCone false
          rm -f .git/info/sparse-checkout
          git read-tree --empty
          git checkout --force --detach "$sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      # Persistent A800 hosts already retain pip downloads locally.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/metax-core-dependencies
        id: core-seed
      - name: Create an isolated environment for this job
        if: steps.core-seed.outputs.attached != 'true'
        run: |
          python -m venv "${RUNNER_TEMP}/venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "${RUNNER_TEMP}/venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/bin" >> "$GITHUB_PATH"
      - name: Measure dedicated CPU service limits
        run: python -I tools/ci_cpu_budget.py --dedicated
      - if: steps.core-seed.outputs.attached != 'true'
        run: python -m pip install --upgrade pip 'setuptools>=77.0.3' wheel
      - name: Install CPU PyTorch through the shared mirror policy
        if: steps.core-seed.outputs.attached != 'true'
        uses: ./.github/actions/install-cpu-torch
        timeout-minutes: 8
        with:
          torch-spec: "torch>=2.13,<2.14"
      - if: steps.core-seed.outputs.attached != 'true'
        run: python -m pip install --no-build-isolation -e '.[dev]'
      - if: steps.core-seed.outputs.attached == 'true'
        run: python -m pip install --no-index --no-build-isolation --no-deps -e .
      - name: Require the host-local A800 profile
        if: steps.core-seed.outputs.attached != 'true'
        run: exit 1
      - name: Verify dependency consistency and the CPU-only PyTorch build
        run: |
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None"
      - name: Compile the package on the supported interpreter
        run: python -m compileall -q flagquantum
      - name: Run pull-request compatibility smoke tests
        env:
          PYTEST_ADDOPTS: -n ${{ env.FQ_PYTEST_WORKERS }} --dist=worksteal --durations=50 --junitxml=${{ env.FQ_CI_REPORT_DIR }}/pytest.xml
        run: python -m pytest -m smoke -q
      - name: Prove JAX is absent from the PyTorch-only environment
        run: python -c "import importlib.util; assert importlib.util.find_spec('jax') is None"
      - name: Prove NumPy and the 3.11 standard library are absent
        # NumPy is not an external quantum framework, so it does not belong in
        # the list below; it gets its own assertion because its absence is what
        # makes a collected module that says `import numpy` fail on this lane
        # and nowhere else. torch declares no NumPy requirement, so the absence
        # is real -- every leg reports `Failed to initialize NumPy` and the
        # suite still passes -- and asserting it turns that coincidence into a
        # checked property.
        #
        # `tomllib` is the 3.11 standard library, so the oldest supported
        # interpreter does not have it at all. A module that imports it behind
        # `sys.version_info` passes on 3.11 and 3.12 and fails to collect on
        # 3.10; the `try`/`except ModuleNotFoundError` form is the one that
        # survives both this lane and a stripped standard library, and
        # `tools/check_dependency_policy.py` holds every site to it. This step
        # proves the lane is what that fallback assumes: the standard library
        # module is there exactly where the version says, and where it is not,
        # the substitute the fallback imports is installed.
        run: >-
          python -c "import importlib.util as u, sys;
          has_stdlib = u.find_spec('tomllib') is not None;
          assert u.find_spec('numpy') is None, 'NumPy must be absent from this lane';
          assert has_stdlib == (sys.version_info >= (3, 11)),
          'tomllib must be present exactly where the interpreter provides it';
          assert has_stdlib or u.find_spec('tomli') is not None,
          'the tomllib fallback must be installed where the standard library lacks it'"
      - name: Prove external quantum frameworks are absent from core
        run: >-
          python -c "import importlib.util;
          assert all(importlib.util.find_spec(name) is None
          for name in ('cirq', 'cudaq', 'pennylane', 'qiskit', 'qiskit_aer', 'braket', 'quark'))"
      - name: Prove core import does not load JAX
        run: python -m pytest tests/smoke/test_no_jax_core.py -q
      - name: Retain resource limits and pytest timing reports
        if: ${{ always() && env.FQ_CI_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-report-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: ${{ env.FQ_CI_REPORT_DIR }}
          retention-days: 7
