name: Attach MetaX core dependencies
description: Reuse a host-local read-only core environment with a job-private install target
outputs:
  attached:
    description: Whether an exact compatible MetaX dependency seed was attached
    value: ${{ steps.attach.outputs.attached }}
runs:
  using: composite
  steps:
    - id: attach
      shell: bash
      run: |
        if [[ "${RUNNER_ENVIRONMENT:-}" != self-hosted || ! "${FQ_MC550_SLOT:-}" =~ ^cpu[0-9]{2}$ ]]; then
          echo "attached=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        python_version="$(python -c 'import platform; print(platform.python_version())')"
        project_hash="$(sha256sum pyproject.toml | cut -d' ' -f1)"
        seed="/liuwei01/flagquantum-runners/tools/ci-envs/core-$python_version/$project_hash"
        python_minor="${python_version%.*}"
        packages="$seed/lib/python$python_minor/site-packages"
        if [[ ! -d "$packages" || ! -r "$seed/requirements.lock" || -w "$packages" ]]; then
          echo "attached=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        job_venv="$(mktemp -d "$RUNNER_TEMP/fq-core.XXXXXXXX")"
        python -m venv --without-pip "$job_venv"
        echo "$packages" > "$job_venv/lib/python$python_minor/site-packages/fq-core-seed.pth"
        echo "$job_venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$job_venv" >> "$GITHUB_ENV"
        echo "attached=true" >> "$GITHUB_OUTPUT"
        echo "Attached read-only MetaX core seed for Python $python_version ($project_hash)"
