# Callers must use a job-unique name. Retries replace only that artifact,
# including a partial upload whose creation response was lost.
name: Upload artifact with bounded retries
description: Retry transient artifact service failures twice; persistent failures fail the job.
inputs:
  name:
    description: Job-unique artifact name.
    required: true
  path:
    description: Files to upload.
    required: true
  if-no-files-found:
    description: Behavior when no files match.
    default: warn
  retention-days:
    description: Retention in days; zero uses the repository default.
    default: '0'
  compression-level:
    description: Compression level.
    default: '6'
  overwrite:
    description: Replace an existing artifact on the first attempt.
    default: 'false'
  include-hidden-files:
    description: Include hidden files.
    default: 'false'
outputs:
  artifact-id:
    description: Successful upload artifact-id.
    value: ${{ steps.third.outputs.artifact-id || steps.second.outputs.artifact-id || steps.first.outputs.artifact-id
      }}
  artifact-url:
    description: Successful upload artifact-url.
    value: ${{ steps.third.outputs.artifact-url || steps.second.outputs.artifact-url || steps.first.outputs.artifact-url
      }}
  artifact-digest:
    description: Successful upload artifact-digest.
    value: ${{ steps.third.outputs.artifact-digest || steps.second.outputs.artifact-digest || steps.first.outputs.artifact-digest
      }}
runs:
  using: composite
  steps:
  - id: first
    if: ${{ !cancelled() }}
    uses: actions/upload-artifact@v4
    continue-on-error: true
    with:
      name: ${{ inputs.name }}
      path: ${{ inputs.path }}
      if-no-files-found: ${{ inputs.if-no-files-found }}
      retention-days: ${{ inputs.retention-days }}
      compression-level: ${{ inputs.compression-level }}
      overwrite: ${{ inputs.overwrite }}
      include-hidden-files: ${{ inputs.include-hidden-files }}
  - id: second
    if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
    uses: actions/upload-artifact@v4
    continue-on-error: true
    with:
      name: ${{ inputs.name }}
      path: ${{ inputs.path }}
      if-no-files-found: ${{ inputs.if-no-files-found }}
      retention-days: ${{ inputs.retention-days }}
      compression-level: ${{ inputs.compression-level }}
      overwrite: 'true'
      include-hidden-files: ${{ inputs.include-hidden-files }}
  - id: third
    if: ${{ !cancelled() && steps.second.outcome == 'failure' }}
    uses: actions/upload-artifact@v4
    with:
      name: ${{ inputs.name }}
      path: ${{ inputs.path }}
      if-no-files-found: ${{ inputs.if-no-files-found }}
      retention-days: ${{ inputs.retention-days }}
      compression-level: ${{ inputs.compression-level }}
      overwrite: 'true'
      include-hidden-files: ${{ inputs.include-hidden-files }}
