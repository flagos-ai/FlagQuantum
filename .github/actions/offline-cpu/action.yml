name: Attach locked offline CPU environment
description: Pull a prebuilt image and run all Python commands without external networking
inputs:
  profile:
    description: Image profile and Python version
    required: true
  registry-token:
    description: Read-only GitHub package token
    required: true
  wheel-directory:
    description: Optional read-only SDK wheel cache mounted into the job container
    default: ""
runs:
  using: composite
  steps:
    - name: Capture the runner service budget before entering Docker
      shell: bash
      run: python3 -I tools/ci_cpu_budget.py
    - shell: bash
      env:
        FQ_CI_PROFILE: ${{ inputs.profile }}
        FQ_REGISTRY_TOKEN: ${{ inputs.registry-token }}
        FQ_CI_WHEEL_DIRECTORY: ${{ inputs.wheel-directory }}
      run: |
        image="$(awk -v profile="$FQ_CI_PROFILE" '$1 == profile { print $2 }' docker/ci/images.lock)"
        [[ "$image" =~ ^ghcr\.io/flagos-ai/flagquantum-ci@sha256:[a-f0-9]{64}$ ]]
        # Concurrent runners using the same daemon share one pull of a cold image.
        lock_dir="${XDG_CACHE_HOME:-$HOME/.cache}/flagquantum-ci"
        mkdir -p -m 700 "$lock_dir"
        exec 9>"$lock_dir/${image##*@}.lock"
        flock -w 480 9
        if ! docker image inspect "$image" >/dev/null 2>&1; then
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/fq-registry.XXXXXXXX")"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$FQ_REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          timeout --kill-after=15s 450s docker pull "$image"
          rm -rf "$DOCKER_CONFIG"
          unset DOCKER_CONFIG
          trap - EXIT
        fi
        exec 9>&-
        unset FQ_REGISTRY_TOKEN

        # Container UID 0 maps to the unprivileged daemon user in rootless Docker.
        container_user="$(id -u):$(id -g)"
        if docker info --format '{{range .SecurityOptions}}{{println .}}{{end}}' | grep -Fxq name=rootless; then
          container_user=0:0
        fi
        export FQ_CI_CONTAINER_USER="$container_user"
        export FQ_CI_WHEEL_DIRECTORY
        echo "FQ_CI_WHEEL_DIRECTORY=$FQ_CI_WHEEL_DIRECTORY" >> "$GITHUB_ENV"
        echo "FQ_CI_CONTAINER_USER=$container_user" >> "$GITHUB_ENV"
        echo "Using locked CPU CI image $image"

        export FQ_CI_IMAGE="$image"
        export FQ_CI_PRIVATE
        FQ_CI_PRIVATE="$(mktemp -d "$RUNNER_TEMP/fq-offline.XXXXXXXX")"
        mkdir "$FQ_CI_PRIVATE/bin"
        for command in python torchrun; do
          ln -s "$GITHUB_WORKSPACE/.github/actions/offline-cpu/run" "$FQ_CI_PRIVATE/bin/$command"
        done
        "$FQ_CI_PRIVATE/bin/python" --prepare
        echo "FQ_CI_IMAGE=$FQ_CI_IMAGE" >> "$GITHUB_ENV"
        echo "FQ_CI_PRIVATE=$FQ_CI_PRIVATE" >> "$GITHUB_ENV"
        echo "$FQ_CI_PRIVATE/bin" >> "$GITHUB_PATH"
