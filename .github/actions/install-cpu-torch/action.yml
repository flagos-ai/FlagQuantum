name: Install CPU PyTorch
description: Install CPU-only PyTorch from a verified cache or the official CPU index
inputs:
  torch-spec:
    description: Requested CPU PyTorch requirement, including dependency-bound matrix lanes
    default: "torch>=2.13,<2.14"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        FQ_TORCH_SPEC: ${{ inputs.torch-spec }}
      run: |
        export FQ_TORCH_SPEC="${FQ_TORCH_SPEC:-torch>=2.13,<2.14}"
        cpu_wheel_cache="${FQ_CPU_WHEEL_CACHE:-/root/liuwei/fq-ci-bootstrap/cpu-wheels}"
        if python -c 'import os, torch; from packaging.requirements import Requirement; assert torch.version.cuda is None; assert "+cpu" in torch.__version__; assert torch.__version__ in Requirement(os.environ["FQ_TORCH_SPEC"]).specifier' 2>/dev/null; then
          echo "Using the verified CPU PyTorch wheel already installed in this private environment"
        elif [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] && \
          [ -d "$cpu_wheel_cache" ] && \
          python -m pip install --no-index --no-deps --find-links "$cpu_wheel_cache" "$FQ_TORCH_SPEC"; then
          echo "CPU PyTorch installed from the local A800 wheel cache"
        else
          # Restrict Torch itself to the CPU index; ordinary dependencies retain
          # the job's PyPI configuration (Tsinghua on trusted self-hosted jobs).
          timeout --kill-after=10s 300s python -m pip install --no-deps "$FQ_TORCH_SPEC" \
            --index-url https://download.pytorch.org/whl/cpu
          echo "CPU PyTorch installed from the official CPU index"
        fi
        python -m pip install "$FQ_TORCH_SPEC"
        python -c "import torch; assert torch.version.cuda is None, torch.version.cuda; assert '+cpu' in torch.__version__, torch.__version__; print('CPU PyTorch:', torch.__version__)"
