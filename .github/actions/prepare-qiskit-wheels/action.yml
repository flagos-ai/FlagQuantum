name: Prepare certified Qiskit wheels
description: Reuse private wheel bytes while resolving the current certified version range
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        : "${FQ_QISKIT_WHEEL_DIRECTORY:?Set the private Qiskit wheel directory}"
        : "${QISKIT_VERSION:?Set the certified Qiskit version range}"
        mkdir -p "$FQ_QISKIT_WHEEL_DIRECTORY"
        links=(--find-links "$FQ_QISKIT_WHEEL_DIRECTORY")
        public_cache="${FQ_QISKIT_PUBLIC_WHEELS:-/opt/flagquantum-runners/tools/public-wheels}"
        if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && [ -d "$public_cache" ]; then
          links+=(--find-links "$public_cache")
        fi
        requirements=("qiskit[qasm3-import]==${QISKIT_VERSION}" 'qiskit-aer==0.17.*' 'sympy>=1.13,<2')
        index="${PIP_INDEX_URL:-https://pypi.org/simple}"
        # Resolve against the live index even on cache hits: wildcard lanes must
        # still discover certified patch releases and dependency updates.
        if ! timeout --kill-after=15s 180s python -m pip wheel \
          --index-url "$index" "${links[@]}" \
          --wheel-dir "$FQ_QISKIT_WHEEL_DIRECTORY" "${requirements[@]}"; then
          if [ "${index%/}" = https://pypi.org/simple ]; then
            exit 1
          fi
          echo "::warning::Qiskit mirror resolution failed; trying official PyPI"
          timeout --kill-after=15s 300s python -m pip wheel \
            --index-url https://pypi.org/simple "${links[@]}" \
            --wheel-dir "$FQ_QISKIT_WHEEL_DIRECTORY" "${requirements[@]}"
        fi
        python -m pip install --dry-run --ignore-installed --no-index \
          --find-links "$FQ_QISKIT_WHEEL_DIRECTORY" "${requirements[@]}"
