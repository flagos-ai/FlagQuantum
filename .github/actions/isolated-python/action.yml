name: Isolated Python environment
description: Keep job dependencies out of the persistent Python tool cache
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        unset PYTHONPATH PYTHONHOME
        job_venv="$(mktemp -d "$RUNNER_TEMP/fq-python.XXXXXX")"
        python -m venv "$job_venv"
        echo "$job_venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$job_venv" >> "$GITHUB_ENV"
        echo "PYTHONPATH=" >> "$GITHUB_ENV"
        echo "PYTHONHOME=" >> "$GITHUB_ENV"
        echo "PYTHONNOUSERSITE=1" >> "$GITHUB_ENV"
