[capabilities.detector_error_matching_decoder]
title = "Minimum-weight matching decoder over a detector error model"
summary = "Turn the detector error model of a memory circuit into a weighted graph and decode a syndrome exactly by minimum-weight matching, reporting the mechanisms selected and the logical observables they flip."
category = "simulation_and_training"
user_goals = ["Decode a detection-event syndrome with a detector error model", "Inspect the weighted decoding graph a model defines", "Cross-check the matcher against an independent implementation over the same graph", "Compare a matcher's prediction against the observables a model sampled", "Select a decoder by name instead of by import"]
public_apis = ["flagquantum.qec.DecodingGraph", "flagquantum.qec.DecodingGraphEdge", "flagquantum.qec.MinimumWeightMatchingDecoder", "flagquantum.qec.MatchingDecodeResult", "flagquantum.qec.PyMatchingDecoder", "flagquantum.qec.get_decoder", "flagquantum.qec.register_decoder", "flagquantum.qec.decoder_names", "flagquantum.qec.DetectorErrorModelDecoder", "flagquantum.qec.AUTHORITY_NAME", "flagquantum.qec.CROSS_CHECK_NAME", "flagquantum.qec.SLIDING_WINDOW_NAME", "flagquantum.qec.SlidingWindowMatchingDecoder"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "flagquantum/qec/IMPLEMENTATION.md"
documentation = "flagquantum/qec/IMPLEMENTATION.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "One decoder, for graphlike detector error models only, on one detector error model at a time, with no threshold, no logical-suppression, no real-time, and no performance claim. A decoding graph is built from the model's mechanisms and nothing else: a mechanism becomes an edge whose weight is log((1 - p) / p), a mechanism flipping one detector becomes an edge to a boundary node one past the last detector, a mechanism flipping three or more detectors is a hyperedge and is refused with a stated reason rather than projected onto a pair, a mechanism of probability zero contributes no edge because its weight would be infinite, and two mechanisms that share a detector pair but disagree on their observable labels stay two edges because merging them would either lose a logical flip or invent a weight neither mechanism has. Two mechanisms that agree on both are the different case and are refused: one fault stated twice would become two parallel edges and the matcher would charge the cheaper of them, log 4 for mechanisms of 0.1 and 0.2 where the fault's own combined parity 0.26 has weight log(0.74 / 0.26), so the matcher would prefer a longer chain of other mechanisms over the mechanism that actually fired. The decoder therefore requires a unique signature before it builds a graph, names both mechanisms and the merge that resolves the duplicate, and leaves the graph's parallel edges intact so the refusal is a decoder decision and not a representation one. A model that states two mechanisms are alternatives is refused for the neighbouring reason: one weight per mechanism is the weight of a fault that fires alone, while a group of alternatives is one fault whose weight is the negative log-likelihood of the group, so the graph refuses such a model and names the groups rather than weighing each member as though the others could fire with it. Whatever the model states is what the graph holds, so the decoder inherits every scope limit of the detector error model it consumes. The width of the patch is not one of them any more, because the construction route derives a signature from the circuit's layouts rather than forcing one through an execution; what bounds this decoder is its own enumeration, and the budget below is where that shows. The matcher is exact and self-implemented: it searches each defective detector for the cheapest chain of mechanisms to every other detector and to the boundary, and then enumerates the ways to pair the defects and to route any number of them to the boundary, which is a minimum-weight perfect matching on the metric closure. The boundary is a sink rather than a waypoint, which is what makes a syndrome's parity irrelevant, and chains may pass through defective detectors because edges two chains share cancel in the symmetric difference. Because the pairing is enumerated, the decoder accepts at most twenty detection events per syndrome by default and refuses a larger syndrome as a capability boundary rather than returning a pairing that only looks cheapest; the budget is a constructor argument because the cost is in that enumeration, so a distance-three patch at ordinary noise decodes while a much larger syndrome is declined. Detectors that no chain of mechanisms connects are refused with a stated reason rather than answered partially. The prediction is the exclusive-or of the selected mechanisms' observable labels, so it is a decision about which cheapest explanation the decoder adopts and not an estimate of the probability that the observable flipped, and it is not calibrated: two mechanisms that share a detector pair and disagree on their label are indistinguishable from the syndrome alone, so the decoder cannot always recover the more likely value. Its failure rate is therefore at or above the optimal decoder's on every model and strictly above it once rounds exceed one. A single-round repetition model has no such pair, and there the matcher reaches the exhaustive optimum exactly, which is the only optimality claim made here. The sliding window is no longer one of the absences and it is not a second decoder either: flagquantum.qec.SlidingWindowMatchingDecoder decides a syndrome a band of detectors at a time and calls this matcher on each window, so the budget above bounds a window's syndrome rather than a whole history's, which is what lets a long-lived memory experiment be decoded at all. Its own limits are stated rather than folded in here: it is exact only in the limit of one window over the whole graph, its default band is the model's measured widest mechanism and its default window is three bands, a window narrower than a band plus that span is refused by name, the observables it predicts can differ from this matcher's at a narrow width, and no threshold or logical error rate is estimated from a windowed decode. It is recorded inside this entry rather than as an entry of its own, because it is this decoder read through a window and not a numerical core beside it: the graph, the weights, the mechanism set and the refusal set are this entry's, and what the window adds is an argument about how much of a history one call reads at once. Absent here: a union-find or belief-finding decoder, and the plugin boundary upstream ships, which remains a precedent rather than a protocol. The hyperedge scope this entry does not cover is covered by a decoder that is not this one and is recorded separately, so it is a gap against the baseline and not an unowned one: the capability qec_belief_propagation_osd_decoder states the belief-propagation decoder with ordered statistics, flagquantum.qec.BeliefPropagationOsdDecoder, that answers a three-detector mechanism this graphlike scope refuses, and that decoder stays outside the name-keyed registry because a model with such a mechanism has no pair-graph for the registry's protocol to promise. Batching, streaming, and a per-detector error-rate vector are also absent, and the decoder is not connected to the stim sampling path. The matrix route that DetectorErrorModel.from_code_matrices provides is inside this decoder's graphlike domain only while it stays inside one round: at two rounds the middle data wire of the distance-3 repetition code flips the same check in both detector bands, which is a four-detector mechanism, and the decoder refuses it as a hyperedge rather than projecting it onto a pair. The observable prediction has no consumer yet: no logical-error-rate estimator, no threshold scan, and no integration with the memory-experiment result records. The result record is deliberately not the repetition-code DecodeResult, whose correction carries a wire in {0, 1, 2} and an X basis only and therefore cannot express a surface-code correction. A second decoder exists behind the pymatching extra and is a cross-check rather than the authority: flagquantum.qec.adapters translates the same decoding graph, reports the same two records, and is imported lazily, so the core install and the decoder neither need nor load it. What the comparison establishes is stated narrowly, because the two instruments are not equal: PyMatching reports 3.9020747171643912 for a mechanism this package states as 3.9020746947749574, so the graph it minimizes over is not exactly this one and two explanations closer than that difference can be ordered differently on the two sides. The two decoders are therefore compared on the cheapest weight of every syndrome with a tolerance of one single-precision rounding per selected mechanism, on the observables wherever the cheapest explanation is unique, and on their refusals as the same set; a tie is uncomparable rather than evidence against either implementation, and one tie of the distance-three repetition code is pinned by hand so that the clause is a demonstrated fact rather than a place a disagreement could hide. The translation refuses two graphs instead of approximating them, and both are graphs the matcher itself answers: a detector pair carrying two mechanisms, which PyMatching's independent merge strategy would collapse and thereby lose a logical-label difference, and a detector that no mechanism flips, which PyMatching cannot represent because it infers its detector count from its edges. The cross-check's domain is therefore narrower than the authority's and never the reverse. The matcher is checked against brute force on syndromes small enough to enumerate, against the exhaustive enumeration of a model's own mechanism distribution, and against that second decoder over the same graph, so its correctness rests on the detector error model all three read and on the authority of no external decoder. A name reaches a decoder through flagquantum.qec.get_decoder, and the name is not a promise about the implementation: the registry returns the class a name is registered against and never prefers one because it is available, so the authority is returned for its own name wherever the optional extra happens to be installed. The registry is narrower than the CUDA-Q QEC decoder surface it is aligned to. Its source argument takes the three carriers a caller can hold a model in -- the detector error model, stim's text for one, and the decoding graph the model defines -- and not a parity-check matrix, because lifting a matrix would also mean choosing the noise model and round count that DetectorErrorModel.from_code_matrices reads rather than defaults. It holds the detector-error-model family alone: the repetition-code decoders take an ordered syndrome history rather than detection events, so registering both under one name space would make a name mean one of two things, and they stay directly constructed. It fails closed rather than falling back: an unregistered name raises and lists the registered names, a class missing decode or from_detector_error_model is refused while the registering module is imported rather than at the first caller, a source that is not one of the three carriers is refused by type, and a second registration of one name is refused unless the caller asks to replace it. The optional implementation is registered whether or not PyMatching is installed, so its name is part of this package's surface rather than the extra's and asking for it without the extra raises the error naming the extra. The registry selects among decoders; it does not add one, so the hyperedge model that belief propagation with ordered statistics decoding now answers is reached by constructing that decoder directly rather than by name; the plugin boundary upstream ships remains a precedent rather than a protocol here."
focused_tests = "tests/qec/test_decoding_graph.py"
integration_tests = "tests/qec/test_matching_decoder.py"
development_artifact = "flagquantum/qec/IMPLEMENTATION.md"

[capabilities.qec_belief_propagation_osd_decoder]
title = "Belief-propagation decoder with ordered statistics over a detector error model"
summary = "Decode a syndrome a minimum-weight matcher refuses, by iterating min-sum messages over the model's mechanisms and then solving the syndrome over the most error-prone independent ones, so a mechanism flipping three or more detectors is answered rather than declined."
