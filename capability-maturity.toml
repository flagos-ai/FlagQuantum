limitations = "A code-independent declaration layer, not a decoder and not an experiment runner. build_memory_circuit emits bounded hybrid source text plus detector and observable layouts; executing that source is the Runtime's dynamic hybrid path and carries that path's own limits. Three code records exist: the repetition code, the rotated surface code and the Steane code, the last of which is the first record carrying both a Z-type and an X-type logical observable. A check states one ancilla and one CNOT direction chosen by the check's type, so a mixed X-and-Z stabilizer is refused; a code needing a second ancilla per stabilizer requires the record to grow first. Both the initial state and the terminal data readout are in the Z basis, so a code whose declared logical observable is not Z-type is refused rather than measured under premises that do not hold for it. Detector counts follow the two check classes, z_checks * (rounds + 1) + x_checks * (rounds - 1), and are validated against the code's checks and the configured rounds, but the validation is membership-based: it does not check that a detector names the same check in every round, that a terminal detector's data wires are the support of the check it belongs to, or that the emitted source is the program the layouts describe, so a hand-built layout can be semantically wrong while passing every check. The rotated surface code's declared logical observable is Z on one data row; which weight-d logical operator a patch uses is a convention, and this record states the one it uses rather than deriving all of them. Agreement with stim's generated rotated-memory circuit is on the declared detector and observable count at distances two through eight and rounds one through four, which fixes the shape and not a mechanism-level correspondence. Execution evidence covers the distance-three patch only, because the dynamic hybrid simulator draws each shot from the full output distribution and a distance-five patch needs 2**49 categories. No decoding, no threshold, no logical-suppression, no fault-tolerance, no real-time and no hardware-feedback claim follows from a declared code, a detector layout, or a syndrome trace."
focused_tests = "tests/qec/test_surface_code.py"
integration_tests = "tests/qec/test_memory_circuit_execution.py"
development_artifact = "flagquantum/qec/IMPLEMENTATION.md"

[capabilities.detector_error_model]
title = "Detector error model and stim text interchange"
summary = "Build the exact Pauli-noise detector error model of a memory circuit or of a code-capacity CSS record, sample it, and exchange it with stim as text in both directions."
category = "simulation_and_training"
user_goals = ["Build the detector error model a memory circuit defines under phenomenological noise", "Build the model of a code whose parity-check and logical matrices are known, without writing a circuit", "Read a stim detector error model and sample its detection events", "Emit stim text for an external decoder or matcher"]
public_apis = ["flagquantum.qec.DetectorErrorModel", "flagquantum.qec.DemError", "flagquantum.qec.DemMergeRule", "flagquantum.qec.DemSample", "flagquantum.qec.css_code_matrices"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "flagquantum/qec/IMPLEMENTATION.md"
documentation = "flagquantum/qec/IMPLEMENTATION.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "An exact construction for Pauli noise over the reference Clifford gate set, and a text reader for the stim detector error model format. Construction does not sample: a mechanism's signature comes from one forced execution whose two shots must agree on the detector and observable flips they produce, and a non-Pauli channel is refused with a stated reason rather than approximated. The agreement is required of the flip set and not of the raw register: an X-type ancilla is prepared in |+>, so its round-zero outcome is a coin toss, while the steady-state X-type detector it feeds is deterministic because the first round projected both compared rounds into the same eigenstate. Demanding register agreement refused every code with an X-type check, so the rotated surface code could not be modelled at all. Because the signature comes from an execution, construction is bounded by the statevector amplitude ceiling: a distance-2 patch is 7 wires and a distance-3 patch is 17, both of which build in seconds, while distance 4 is 31 wires (2**31 amplitudes) and did not complete in 45 minutes, and distance 5 is 49 wires and fails on the allocator outright. The modelled rotated-surface distance is therefore 3 on the circuit route, and that ceiling is a property of forcing a signature through an execution rather than of the construction contract: reading a matrix support costs one pass over its nonzero entries per round, so a distance-5 or distance-7 patch reaches a model as easily as a distance-2 one. A second construction route reads a code-capacity experiment rather than a memory circuit. DetectorErrorModel.from_code_matrices takes a CssCodeMatrices record -- the four CSS blocks hz, hx, lz and lx -- and derives every mechanism combinatorially, and css_code_matrices lifts a code record into that record, refusing a logical observable that is neither pure X nor pure Z rather than half-reading a CSS code. Its geometry is not the memory circuit's and the difference is pinned rather than glossed: a fault in round r reaches the detector band of round r and of round r + 1, the final round has no band after it, and there is no terminal data readout, so the detector count is num_rounds * num_checks where a memory circuit gains one terminal detector per Z-type check. Both geometries are asserted against their own stim transcription, and the same suite asserts that the two counts differ. The matrix route is compared to stim one readout basis at a time, because lz and lx anti-commute and no one state has both as a deterministic value: the reference experiment is run twice against the model restricted to the matching basis, and each run's observable rows are the ones the Pauli character of that fault family predicts. A fault that is still in the data at the end of the run is still seen by the logical readout, so a physical fault spans one detector band while the model gives it two; that single divergence is pinned as the exact relation between the two mechanism sets rather than as a tolerance. The fault family is the three single-qubit Pauli faults plus a check's syndrome bit flipped at readout, so an X fault flips Z-type checks, a Z fault flips X-type checks and a Y fault flips both, and the X detector band and the lx observable rows exist on the matrix route. The rate record is what remains narrower than upstream's: it states uniform scalars, so an independent px/py/pz/pm split and per-qubit or per-check rates are not expressible. A matrix that is not binary, is not two-dimensional, or is not indexed by the same data qubits as another non-empty block is refused rather than coerced. The matrix route is graphlike only while it stays inside one round; at two rounds the middle data wire of the distance-3 repetition code flips the same check in both bands, which is a four-detector mechanism, and the matching decoder refuses it as a hyperedge. The model is built on the memory circuit without in-circuit feedback, because it describes the noise-to-detection mapping a decoder inverts, so the frozen profile's compiled-feedback path is unmodelled. Detector rates are cross-checked against rates sampled from the circuit simulator, but the cross-check shares the injection helper with construction, so it is not an independent re-derivation of the signatures. An independent check does exist and runs against the optional stim distribution: the memory circuit is transcribed into a stim circuit and stim's own error analysis builds the model, which agrees with this one on shape, mechanism count and detector marginals at distance 2 and 3. That check shares nothing but the circuit's gate sequence and the noise model. The text reader accepts everything stim 1.16.0 wrote in a 240-model developer-time sweep except a repeat block, a # comment, a declaration that skips an index, and a malformed line; str(detector_error_model.flattened()) is a complete route around the repeat refusal. The printed text is lossy in the last digit because stim prints 17 significant digits, so a round-trip comparison must compare against a re-read of the text rather than against the in-memory model. A CodeCheck states one ancilla and one CNOT direction fixed by the check's type, so a code with both check types is expressible while a mixed X-and-Z stabilizer is refused; the detector grammar is therefore z_checks * (rounds + 1) + x_checks * (rounds - 1) rather than one detector per check per round, and a code family needing a second ancilla per stabilizer still requires that record to grow first. dem_sampling reports a DEM-sampled rate and is labelled as one wherever it is reported; no decoder, no threshold, no logical-suppression, no real-time or hardware-feedback, and no performance claim follows from a detector error model or from any rate it reports. DemSample carries tensors and is deliberately unhashable. The merge is a stated operation and not only a construction step: DemMergeRule names its two rules for what they compute, INDEPENDENT_PARITY being the probability that an odd number of a duplicated group fires and CLAMPED_LINEAR_SUM the sum of the group clamped at one, mechanisms_are_unique and require_unique_mechanisms are the predicate and the refusal, and the parity rule is exact rather than approximate because a detector's rate is a product of 1 - 2p factors over the mechanisms touching it, so a group's combined prior is the single p whose factor is that product and regrouping the factors cannot change any detector or observable rate; the sum rule does not preserve them and is offered only for a caller who means it. Construction is additionally covered by tests/qec/test_dem_records.py, test_dem_rates.py, test_dem_signatures.py, test_dem_sampling.py, test_dem_cross_check.py, test_dem_from_memory_circuit.py, test_dem_public_surface.py, test_dem_merge.py, and tests/qec/test_dem_code_matrices.py, whose stim cross-check is tests/qec/test_dem_code_matrices_stim.py."
focused_tests = "tests/qec/test_dem_stim_text.py"
integration_tests = "tests/qec/test_dem_stim_interop.py"
development_artifact = "flagquantum/qec/IMPLEMENTATION.md"

[capabilities.detector_error_matching_decoder]
title = "Minimum-weight matching decoder over a detector error model"
summary = "Turn the detector error model of a memory circuit into a weighted graph and decode a syndrome exactly by minimum-weight matching, reporting the mechanisms selected and the logical observables they flip."
category = "simulation_and_training"
user_goals = ["Decode a detection-event syndrome with a detector error model", "Inspect the weighted decoding graph a model defines", "Cross-check the matcher against an independent implementation over the same graph", "Compare a matcher's prediction against the observables a model sampled"]
public_apis = ["flagquantum.qec.DecodingGraph", "flagquantum.qec.DecodingGraphEdge", "flagquantum.qec.MinimumWeightMatchingDecoder", "flagquantum.qec.MatchingDecodeResult", "flagquantum.qec.PyMatchingDecoder"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "flagquantum/qec/IMPLEMENTATION.md"
documentation = "flagquantum/qec/IMPLEMENTATION.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "One decoder, for graphlike detector error models only, on one detector error model at a time, with no threshold, no logical-suppression, no real-time, and no performance claim. A decoding graph is built from the model's mechanisms and nothing else: a mechanism becomes an edge whose weight is log((1 - p) / p), a mechanism flipping one detector becomes an edge to a boundary node one past the last detector, a mechanism flipping three or more detectors is a hyperedge and is refused with a stated reason rather than projected onto a pair, a mechanism of probability zero contributes no edge because its weight would be infinite, and two mechanisms that share a detector pair but disagree on their observable labels stay two edges because merging them would either lose a logical flip or invent a weight neither mechanism has. Two mechanisms that agree on both are the different case and are refused: one fault stated twice would become two parallel edges and the matcher would charge the cheaper of them, log 4 for mechanisms of 0.1 and 0.2 where the fault's own combined parity 0.26 has weight log(0.74 / 0.26), so the matcher would prefer a longer chain of other mechanisms over the mechanism that actually fired. The decoder therefore requires a unique signature before it builds a graph, names both mechanisms and the merge that resolves the duplicate, and leaves the graph's parallel edges intact so the refusal is a decoder decision and not a representation one. Whatever the model states is what the graph holds, so the decoder inherits every scope limit of the detector error model it consumes, including the modelled rotated-surface distance of 3. The matcher is exact and self-implemented: it searches each defective detector for the cheapest chain of mechanisms to every other detector and to the boundary, and then enumerates the ways to pair the defects and to route any number of them to the boundary, which is a minimum-weight perfect matching on the metric closure. The boundary is a sink rather than a waypoint, which is what makes a syndrome's parity irrelevant, and chains may pass through defective detectors because edges two chains share cancel in the symmetric difference. Because the pairing is enumerated, the decoder accepts at most twenty detection events per syndrome by default and refuses a larger syndrome as a capability boundary rather than returning a pairing that only looks cheapest; the budget is a constructor argument because the cost is in that enumeration, so a distance-three patch at ordinary noise decodes while a much larger syndrome is declined. Detectors that no chain of mechanisms connects are refused with a stated reason rather than answered partially. The prediction is the exclusive-or of the selected mechanisms' observable labels, so it is a decision about which cheapest explanation the decoder adopts and not an estimate of the probability that the observable flipped, and it is not calibrated: two mechanisms that share a detector pair and disagree on their label are indistinguishable from the syndrome alone, so the decoder cannot always recover the more likely value. Its failure rate is therefore at or above the optimal decoder's on every model and strictly above it once rounds exceed one. A single-round repetition model has no such pair, and there the matcher reaches the exhaustive optimum exactly, which is the only optimality claim made here. Absent: belief propagation with ordered statistics decoding, a sliding-window decoder, a union-find or belief-finding decoder, a decoder registry or plugin protocol, and any hyperedge-decomposition front end that would widen the graphlike scope. Batching, streaming, a per-detector error-rate vector, and per-mechanism identifiers are also absent, and the decoder is not connected to the stim sampling path. The matrix route that DetectorErrorModel.from_code_matrices provides is inside this decoder's graphlike domain only while it stays inside one round: at two rounds the middle data wire of the distance-3 repetition code flips the same check in both detector bands, which is a four-detector mechanism, and the decoder refuses it as a hyperedge rather than projecting it onto a pair. The observable prediction has no consumer yet: no logical-error-rate estimator, no threshold scan, and no integration with the memory-experiment result records. The result record is deliberately not the repetition-code DecodeResult, whose correction carries a wire in {0, 1, 2} and an X basis only and therefore cannot express a surface-code correction. A second decoder exists behind the pymatching extra and is a cross-check rather than the authority: flagquantum.qec.adapters translates the same decoding graph, reports the same two records, and is imported lazily, so the core install and the decoder neither need nor load it. What the comparison establishes is stated narrowly, because the two instruments are not equal: PyMatching reports 3.9020747171643912 for a mechanism this package states as 3.9020746947749574, so the graph it minimizes over is not exactly this one and two explanations closer than that difference can be ordered differently on the two sides. The two decoders are therefore compared on the cheapest weight of every syndrome with a tolerance of one single-precision rounding per selected mechanism, on the observables wherever the cheapest explanation is unique, and on their refusals as the same set; a tie is uncomparable rather than evidence against either implementation, and one tie of the distance-three repetition code is pinned by hand so that the clause is a demonstrated fact rather than a place a disagreement could hide. The translation refuses two graphs instead of approximating them, and both are graphs the matcher itself answers: a detector pair carrying two mechanisms, which PyMatching's independent merge strategy would collapse and thereby lose a logical-label difference, and a detector that no mechanism flips, which PyMatching cannot represent because it infers its detector count from its edges. The cross-check's domain is therefore narrower than the authority's and never the reverse. The matcher is checked against brute force on syndromes small enough to enumerate, against the exhaustive enumeration of a model's own mechanism distribution, and against that second decoder over the same graph, so its correctness rests on the detector error model all three read and on the authority of no external decoder."
focused_tests = "tests/qec/test_decoding_graph.py"
integration_tests = "tests/qec/test_matching_decoder.py"
development_artifact = "flagquantum/qec/IMPLEMENTATION.md"

[capabilities.qec_memory_circuit_sampling]
title = "Sampled detection events from a memory circuit"
summary = "Sample a memory experiment's detection events and observable flips from the circuit itself under phenomenological noise, so a decoding claim has a route that does not depend on the statevector ceiling."
category = "simulation_and_training"
user_goals = ["Sample detection events from a noisy memory experiment", "Reproduce a sampling run from a seed", "Decode a sampled syndrome with the model built from the same circuit"]
public_apis = ["flagquantum.qec.sample_memory_circuit", "flagquantum.simulation.stabilizer.sample_noisy_measurements"]
runtime_modes = ["stabilizer"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "flagquantum/qec/README.md"
documentation = "flagquantum/qec/README.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "One experiment shape and one noise grammar. The circuit must be a MemoryCircuit, so the sampler is reachable from a code record and not from an arbitrary annotated circuit; the noise must be a PhenomenologicalNoise, so a data flip at a round boundary and a measurement flip at a check's readout are the only two locations that exist, and a channel placed after a named gate, an asymmetric X/Z rate, a per-qubit or per-check rate, and a depolarizing or damping channel have no location to be placed at. Placement is derived from the lowered program rather than written into the experiment, because the bounded hybrid capture refuses a channel call in the source; the derivation requires the program to lower to `rounds` identical round blocks that measure every check once in the code's declared check order, and refuses a program that does not, so an experiment whose round structure differs is declined rather than sampled. The sampler executes on the stabilizer engine, so it requires the optional `stim` distribution and inherits the engine's opcode set: exactly the thirteen Clifford opcodes, with a non-Clifford gate refused by name. It shares the code record's Z-memory limit, so an X-type logical observable has no route here. Sampling is not differentiable and returns no gradients. The result is a DemSample like the model's own sampler returns, and the two are deliberately different code paths: the model derives a mechanism's signature from the source while this sampler derives its instruction position from the lowered program, and the tests pin the two to each other rather than having one call the other. A seed reproduces a run on one engine version and one machine instruction set; it does not pin a bit pattern across machines or engine versions. No threshold, no logical-suppression, no fault-tolerance, no real-time and no performance claim follows. The rate this sampler reports is a circuit-sampled rate, and the model's own sampler reports a DEM-sampled one; neither may be reported as the other."
focused_tests = "tests/qec/test_sampling_memory_circuit.py"
integration_tests = "tests/qec/test_sampling_memory_circuit.py"
development_artifact = "flagquantum/qec/sampling.py"

