[capabilities.program_compilation]
title = "Program optimization and target-aware compilation"
summary = "Transform one FlagQuantum IR program without executing it: canonical optimization, logical layer scheduling, and lowering onto an explicit coupling topology."
category = "build_and_compile"
user_goals = ["Optimize a program without changing its numerical result", "Compile a program onto a constrained connectivity", "Inspect schedule layers and routing decisions before execution"]
public_apis = ["flagquantum.compiler.optimize", "flagquantum.compiler.compile", "flagquantum.compiler.route_to_topology", "flagquantum.compiler.schedule_layers", "flagquantum.compiler.CouplingMap", "flagquantum.compiler.plan_trivial_layout", "flagquantum.compiler.plan_dense_layout"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "not_applicable"
quick_start = "examples/compiler_optimize.py"
documentation = "flagquantum/compiler/README.md"
level = "production_supported"
owner = "compiler maintainers"
limitations = "In-process transformation of one FlagQuantum IR v1 program on CPU; the compiler never executes a program or certifies hardware behavior. optimize() removes identity gates, merges self-inverse runs, and merges adjacent rotations to a fixed point. compile() runs that same fixed point, optionally routes onto one explicit CouplingMap, optimizes again, and records post-routing optimization. Routing offers four caller-selected strategies: restore_after_each_gate, persistent_layout, sabre, and sabre_layout. All four restore the identity logical order at the program output, so a caller cannot ask for an unrestored final permutation, and the cost-estimate automatic selection covers only restore_after_each_gate and persistent_layout because the two SABRE strategies plan SWAPs instead of estimating them; the topology is always caller-supplied and never discovered. Initial placement is planned separately: plan_trivial_layout places logical qubit i on physical qubit i, and plan_dense_layout places the program on the most densely connected window of device qubits a breadth-first walk from every physical qubit finds, which is the only placement that can help on a device with unequal connectivity and the only one of the two that can reach a program the lowest qubits cannot hold at all. That walk is a heuristic and not an exact optimum: over 55 device and program-width combinations it matched an exhaustive search of every connected window 45 times and returned a window with one fewer internal connection the other 10 times. Both return a placement as a tuple of physical qubits, one per logical qubit, which is what route_to_directed_topology takes as initial_layout; final_layout reports the assignment a routed program ended on as a Layout, and a route that allocates workspace on a device wider than the program reports the device width there with its idle slots as None in physical_to_logical. Both placements collapse to the identity on a device no wider than the program. Neither reaches route_to_topology, which refuses an initial_layout because a plain CouplingMap routes only over qubits the program owns; a non-identity placement requires a DirectedCouplingMap, whose physical workspace owns the idle slots and is cleaned by the inverse routing SWAPs, and it is passed to route_to_directed_topology or to legalize_circuit_topology. remove_layout_restore drops the appended logical-restore phase from a program that was already routed, halving the SWAP count over a batch of random programs for persistent_layout because that strategy's restore is a full reverse replay of its forward SWAPs and leaving restore_after_each_gate unchanged because its restores are interleaved with the program, and its result is a program for a local simulator or a provider that accepts per-physical-qubit results rather than deployable routing evidence: the deployment routing contract rejects it and the deployment entry points treat it as unrouted and route it again. Window selection is greedy over device connectivity and never estimates routing cost, so it can cost more SWAPs than the trivial placement on a program whose interactions prefer a sparser window, and it is not noise- or calibration-aware. Scheduling constructs deterministic logical ASAP layers with explicit qubit and classical-data dependencies; it is not target timing or pulse scheduling. There is no directed acyclic graph intermediate, no composable pass manager, no pass analysis or preservation metadata, and no in-repository pass extension point: canonicalization functions are pipeline internals, and an installed external compiler is selected by name through the extension SDK rather than composed as a pass. Pulse-level, calibration-aware, and parameter-aware compilation, dynamic-circuit control flow, and noise-aware optimization beyond lower_noise_model are unsupported. The structured hybrid program slice under flagquantum/compiler/_hybrid is private and absent from public exports. Compilation is single-process; no distributed or multi-device compilation path exists."
focused_tests = "tests/integration/test_compiler_optimize_golden_path.py"
integration_tests = "tests/integration/test_target_aware_compilation_golden_path.py"
hardware_evidence = ".github/workflows/ci.yml"
operational_runbook = "flagquantum/compiler/README.md"

[capabilities.program_synthesis]
title = "Target-basis gate and state-preparation synthesis"
summary = "Spell gates and states a target cannot express in the gates that target publishes, and report a basis that cannot carry them instead of approximating it."
category = "build_and_compile"
user_goals = ["Rewrite a gate a target cannot run into gates it publishes", "Synthesize a one-qubit or two-qubit unitary into a target basis", "Prepare a state from its amplitude vector in a target basis", "Find out whether a target basis can carry a program at all"]
public_apis = ["flagquantum.compiler.native_gate_legalization.legalize_native_gates", "flagquantum.compiler.one_qubit_synthesis.synthesize_one_qubit", "flagquantum.compiler.two_qubit_synthesis.synthesize_two_qubit", "flagquantum.compiler.state_preparation_synthesis.synthesize_state_preparation", "flagquantum.compiler.basis_translation.translate"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "not_applicable"
quick_start = "examples/compiler_synthesis.py"
documentation = "flagquantum/compiler/README.md"
level = "development_evidence"
owner = "compiler maintainers"
limitations = "In-process target-basis rewriting of one FlagQuantum IR v1 program on CPU; it never executes a program, chooses a target, or certifies hardware behavior, and no performance, fidelity, or hardware claim is made. The synthesis entry points are deliberately not stable flagquantum.compiler exports: synthesize_one_qubit, synthesize_two_qubit and synthesize_state_preparation are reached by module path, and only legalize_native_gates applies them as a whole-program pass. A synthesized rewrite equals its source only up to one global phase, which FlagQuantum IR has no field to record, so every entry point refuses rather than approximating. The refusals are per entry point rather than uniform: synthesize_one_qubit declines z_rotation='u3' and pulse_opcode='ry' while it does accept z_rotation='phase' for a single gate, and the state-preparation ladder declines 'phase' and 'u1' at the same keyword because a ladder needs an entrywise-exact rz. synthesize_two_qubit declines any entangler outside the supercontrolled table, 'ecr' among them, and it is handed a matrix rather than an instruction because the matrix of a named two-qubit gate belongs to flagquantum.simulation, which this layer must not import; it holds only the three parameter-free entangler matrices and the closed form of the rotation family, so a named two-qubit opcode reaches it only after the equivalence table has rewritten it or has reported the gate the target is missing. That table declares eighteen identities from named opcodes to named opcodes and composes them recursively, because a named gate carries no matrix on this layer; an entry that is not itself exact therefore does not stay exact under further expansion, and cphase drops a global phase. For ccx the table's T-form was measured against Qiskit's MCXGrayCode statement and kept: the Gray-code form declares seven leaves against fifteen but costs eight two-qubit gates on the interaction basis against six, and its further expansion runs through cphase, the one table entry that is not exact. Multi-controlled decomposition above three controls is unsupported: FlagQuantum IR declares no arity above three, Qiskit builds MCXGrayCode from an ancilla chain only from five controls, and the V-chain and recursive forms that do cover four controls and above use fewer entanglers than Gray code but need caller-supplied ancillas the IR does not model. The one-qubit angle form and the two-qubit block form are exact only to the working precision of their own arithmetic, and a rewrite whose leaves leave the native set is reported as the opcode the target is missing rather than as the shortest near miss. Synthesis is single-process CPU work with no distributed, multi-device, pulse-level, calibration-aware, or noise-aware path."
focused_tests = "tests/integration/test_compiler_synthesis_golden_path.py"
development_artifact = "flagquantum/compiler/IMPLEMENTATION.md"

