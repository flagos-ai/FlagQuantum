limitations = "Scope is the recorded pair: two A800 hosts with one device per host, one six-wire complex128 circuit, and a bond limit that truncates nothing. Site-boundary exchange, an exact reverse gradient with the layer halo prefetched over the inter-node transport, an owner-sharded optimizer step, and a checkpoint resumed by a restarted run all executed on that pair, and the run reports scalability_claim_allowed and release_gate_allowed false with four blockers attached. The route was observed on the RoCE fabric and five synchronized forward samples were recorded after two warmups, so the fabric and a repeated measurement are evidence rather than assumptions; congestion and capacity were still not measured. The cut width was swept rather than declared: the recorded workload's Schmidt profile is flat at rank two, so the sweep binds a circuit of its own whose profile is not, and re-runs the same reverse under every site plan the launched shape can hold with a boundary moved, comparing each leg with the exact complex128 expectation and gradient. At two ranks that is five placements across widths two and four, each of which carried bytes over the inter-node transport; at a wider shape the same leg walks each rank boundary in turn, but a plan at more than two ranks carries several boundaries at once and is named by the heaviest of them, so no wider shape is recorded here and no leg claims a bond it did not carry. The tiny full MPS is gathered for validation only, the profiled measurement region contains explicit host transfers that keep a blocker of their own, and topologies wider than one device per host run on the lane but are not recorded, so this evidence does not establish behaviour as nodes are added. The layer halo crosses the host boundary only on the compiled site-kernel path, which the checkpointed training legs deliberately do not take, and the sweep therefore measures the compiled path."
