summary = "Translate supported Amazon Braket circuits to versioned FlagQuantum IR and back through an isolated, loss-aware control-plane adapter."
category = "deployment_and_extension"
user_goals = ["Import a supported Amazon Braket circuit", "Export FlagQuantum IR to Amazon Braket", "Audit semantic loss at a framework boundary"]
public_apis = ["flagquantum.ecosystem.braket.from_braket", "flagquantum.ecosystem.braket.to_braket", "flagquantum.ecosystem.braket.import_braket", "flagquantum.ecosystem.braket.export_braket"]
runtime_modes = ["control_plane_conversion"]
hardware = ["cpu_control_plane"]
gradient_support = "bound_parameters_only"
distribution_semantics = "not_applicable"
quick_start = "docs/reference/API.md"
documentation = "docs/reference/API.md"
level = "experimental"
owner = "interop maintainers"
limitations = "Certified against amazon-braket-sdk 1.117.0 and 1.127.1 on Python 3.11 or newer for bidirectional static circuit conversion, fail-closed unless allow_lossy is set. The Braket integer qubit index equals the FlagQuantum wire, and explicit identity preserves unreferenced FlagQuantum wires. Only bound finite real scalars are accepted; free parameters are rejected instead of converted, so no symbolic parameter expression survives the boundary. Global phase and measurement instructions are not represented, and measurements belong to the execution plan rather than to static circuit IR. Compiler directives, gate calibrations, noise instructions, pulse gates, verbatim boxes, result types, and wire-extent preservation are unsupported, and nine FlagQuantum opcodes have no Braket lowering. Core import, runtime execution, cloud submission, and autograd bridging are all prohibited at this boundary, and Braket objects never enter FlagQuantum runtime layers. docs/reference/API.md documents Braket through the adapter contract and the provider execution path only; it has no static-conversion section, so the contract file is the authoritative statement of scope."
focused_tests = "tests/test_braket_interop_conformance.py"

