[capabilities.algorithms_nelder_mead_optimizer]
title = "Nelder-Mead simplex search"
summary = "Minimize a scalar objective with no derivative and no random draw, by reflecting, expanding, contracting and shrinking a simplex of n + 1 vertices until two measured spreads fall under the caller's thresholds."
category = "simulation_and_training"
user_goals = ["Optimize a deterministic objective whose derivative is unavailable", "Replay a run bit for bit without seeding anything", "Place the starting simplex, because a local method's basin is the caller's choice", "Read the two spreads a run stopped on instead of trusting a flag"]
public_apis = ["flagquantum.algorithms.nelder_mead"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "not_applicable"
quick_start = "examples/algorithms/nelder_mead_optimizer.py"
documentation = "docs/guides/ALGORITHMS.md"
level = "development_evidence"
owner = "Algorithms maintainers"
limitations = "This is a local method and its converged flag is not a statement about a minimum. A run stops when the objective values across the simplex fall under atol and the vertex positions across the simplex fall under tolerance, and a simplex can collapse onto a point that is neither a local nor a global minimum; the widely used variant this unit implements has no complete convergence theory in more than one dimension, which the returned result carries in its own limitations rather than leaving to this field. The failure is measured and not merely described: on the two-well quartic (x**2 - 1)**2 + 0.1x started at 0.5 the run reports converged=True on a value 0.199984362162 above the value it reaches from -0.5, and tightening the thresholds does not repair it because the simplex is inside one basin. There is no restart, no multi-start, no basin hopping and no simulated annealing, so the basin the starting simplex is placed in is the only one a run can reach, which is why initial_simplex is public and why the (n + 1, n) simplex is the caller's to build. The premise is a deterministic objective: every decision the method makes is a comparison of two objective values, so an objective whose value moves between two evaluations of the same point turns each decision into noise and the trajectory into a walk, and a stochastic objective is the subject of the spsa unit beside this one rather than something this unit tolerates. A starting simplex that does not span all n parameter directions is refused by name, which is deliberate and is also a boundary: the collinear construction the published counterexample uses cannot be expressed through this entry point, so the counterexample is refused rather than reproduced, and what remains reachable is a local minimum. The cost is a count of objective evaluations and not a latency, a device cost or a parallel schedule: vertices are evaluated one at a time, one evaluation per call, with no vectorization of the simplex, and the count is bracketed by (n + 1) + iterations at the lower end and (n + 1) + (n + 1) * iterations at the upper end rather than being a function of the parameter count alone. No derivative, curvature or uncertainty is estimated or reported, because the method reads only the order of objective values and two objectives with the same ordering produce the same trajectory. Bounds, constraint handling, feasibility and penalty notions are absent, so a constrained problem is only as well posed as the caller's own transformation of it. The optimizer executes nothing itself: it calls a callable the caller supplies and never inspects it, so no runtime mode is selected, no circuit is built and no observable is measured. The four coefficients, the initial step, both thresholds and the iteration budget are the caller's, no checkpoint or resume protocol exists, and the one arithmetic deviation the unit does make is that a simplex not carrying the parameters' own dtype is refused rather than silently promoted. It adds no root-level fq name and leaves the Stable Core surface untouched."
focused_tests = "tests/unit/test_algorithms_nelder_mead.py"
development_artifact = "flagquantum/algorithms/README.md"

[capabilities.stabilizer_sampling]
title = "Clifford circuit sampling by Pauli stabilizer tracking"
summary = "Sample computational-basis outcomes from a Clifford circuit whose wire count puts a dense amplitude store out of reach, with or without positioned Pauli noise."
category = "simulation_and_training"
user_goals = ["Sample a wide Clifford circuit that has no representable amplitude store", "Reproduce a sampling run from a seed", "Measure a chosen subset of wires in a chosen output order", "Decide whether a noisy program is one the stabilizer regime can execute before sampling it", "Sample a noisy Clifford program through the routed mode"]
public_apis = ["flagquantum.simulation.stabilizer.require_clifford_program", "flagquantum.simulation.stabilizer.sample_stabilizer", "flagquantum.simulation.stabilizer.sample_noisy_measurements", "flagquantum.simulation.stabilizer.survey_stabilizer_program", "flagquantum.simulation.stabilizer.StabilizerSurvey"]
runtime_modes = ["stabilizer"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_device_fast_path"
quick_start = "examples/stabilizer_sampling.py"
documentation = "flagquantum/simulation/stabilizer/README.md"
level = "development_evidence"
owner = "simulation maintainers"
limitations = "Requires the optional `stim` distribution (Apache-2.0), installed with `pip install 'flagquantum[stim]'`; without it the entry point raises StabilizerDependencyError naming that command rather than falling back to an amplitude path. Accepted gates are exactly the thirteen Clifford opcodes in flagquantum.core.operator_schema -- i, x, y, z, h, s, sdg, sx, sxdg, cx, cy, cz, swap -- and every other opcode is refused with a CapabilityError naming it and the accepted set. ccx and cswap are refused because neither normalizes the Pauli group, so they are not Clifford gates despite being permutations; t, tdg, the rotation and controlled-rotation family, phase, u1, u2 and u3 are refused for the same reason. Circuits passed to sample_stabilizer must be noiseless: the four noise channels are refused rather than sampled as unitaries, so no readout error, depolarizing, damping or trajectory behavior is available. The second entry point, sample_noisy_measurements, is the exception, and it is not a widening of that refusal: it executes a channel at an explicit position a caller has already chosen, so the frame attribution is the caller's placement and not an inference the engine makes. What it accepts is the class its operators define -- a mixture of Pauli unitaries up to a global phase, on as many wires as the channel acts on -- and a channel outside that class is still refused by name, so a general damping channel, a thermal relaxation channel, and a coherent over-rotation remain refused rather than approximated. The engine names no channel instruction past two wires, so a wider frame is spelled as a chain of correlated-error instructions, one term per non-identity frame; a chain term is conditional on no earlier term having fired, so each weight is divided by the probability the frames before it did not fire, and a distribution whose non-identity frames carry more than all of the probability is refused because the identity could not otherwise be the remainder. The third entry point, survey_stabilizer_program, reports that same classification without executing anything: it counts gates, resets, recorded measurements and noise instructions, reports whether every channel in the program is a mixture of Pauli frames, and collects one blocker per instruction the sampling route would refuse, naming the instruction index and opcode. It reads the IR and never imports the engine, so it answers without the optional distribution, and it is a census rather than a promise: an empty blocker list says every instruction translated, not that the samples are correct. Neither entry point reads a lowered measurement node or returns detection events or observable flips, so a detector error model is read through `flagquantum.qec.sample_memory_circuit` rather than off a run; decoding, error-corrected logical operations and hardware-backed sampling are absent. Only computational-basis outcome sampling and exact Pauli expectations of a noiseless program are supported, and a noisy program is sampling-only: a frame draw answers outcomes rather than one Pauli, so an exact value is refused by name. The routed mode does reach the engine for a noisy program. It lowers a scene-level `NoiseModel` into positioned channel instructions the way the density-matrix route does, admits the program when the engine's own survey reports that every instruction translates, and refuses it while planning -- before a plan is published -- when a channel is not a mixture of Pauli frames or a gate is outside the Clifford set. Sampling is not differentiable and returns no gradients. The execution route is explicit: `fq.ExecutionOptions(mode='stabilizer')` reaches the engine through `fq.run`, the planner publishes a plan whose `state_mode` is `stabilizer` and whose `state_bytes` is the packed tableau rather than an amplitude count, and the result reports `execution_path='local_stabilizer'`. Automatic selection never chooses this mode, so no existing plan changes meaning. Planning refuses a non-Clifford gate, a batch, a non-CPU device, a gradient request, a target that asks for a state or an amplitude, a sharded world size and a program without shots, and a noisy program the engine's survey cannot frame; sampling refuses a lowered request it cannot reconcile with its own arguments and postselection, and a memory limit below the tableau. None of those refusals is a fallback, and none of them is a scalability claim. Runs are CPU-only single-device work with no GPU or distributed sharding. A seed reproduces a run on one engine version and one machine instruction set; it does not pin a bit pattern across machines or engine versions. The capacity statement is representational -- memory grows with the wire count squared rather than exponentially -- and no throughput, latency or scaling claim is made."
focused_tests = "tests/unit/test_stabilizer_execution_mode.py"
integration_tests = "tests/integration/test_stabilizer_execution_mode.py"
development_artifact = "flagquantum/simulation/stabilizer"

