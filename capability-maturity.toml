[capabilities.algorithms_gate_folding]
title = "Gate and circuit folding by an exact identity"
summary = "Lengthen a program by inserting each instruction's own inverse and then the instruction again, either distributed one instruction at a time or as whole repeated bodies, and report the length ratio the fold actually realized, the instructions it added, and the folded program."
category = "simulation_and_training"
user_goals = ["Lengthen a program by an exact identity so that the noise its instructions carry runs more times, without naming a channel parameter", "Read the scale factor the fold actually realized rather than the one requested", "Choose between distributing the pairs one instruction at a time and repeating whole bodies", "See which programs cannot be folded, by name, before anything is built"]
public_apis = ["flagquantum.algorithms.folding", "flagquantum.algorithms.fold_program", "flagquantum.algorithms.FoldingPlan", "flagquantum.algorithms.FOLDING_STRATEGIES"]
runtime_modes = ["local_statevector", "density_matrix"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "single_device_fast_path"
quick_start = "examples/algorithms/folding.py"
documentation = "docs/guides/ALGORITHMS.md"
level = "development_evidence"
owner = "Algorithms maintainers"
limitations = "Gate and circuit folding, whose premise is about the device and whose output is a length ratio rather than a noise estimate. The fold is U (U-dagger U)^m, so it is an exact identity for every unitary the body is made of and the only deviation it contributes is the dtype's own rounding: measured on the five-instruction body h, cx, rz, ry, t the amplitude gap at complex128 is 1.6e-16 for both strategies, which is the floor of the state comparison rather than a number the fold added. That is what makes the method different from the three units beside it -- nothing is approximated and nothing is fitted -- and it is also what makes a channel in the body a refusal rather than something to skip: a noise channel has no unitary inverse, a fold that dropped it would change the ideal signal rather than only the noise, and the refusal names the instruction and the reason. The assumption the method does rest on is not visible in the program and is not checked by it: repeating an instruction has to repeat that instruction's error and change no other instruction's error, so crosstalk, drift between the unfolded and folded points, and a calibration that moved between them all violate the premise while leaving the program looking correct. What the unit returns is therefore a ratio and not a strength: the realized scale factor is a length ratio, the conversion from a length ratio to a noise strength belongs to the extrapolation the caller runs, and a caller who reads the ratio as a measured error strength has substituted the device's behaviour for the model's. The realized factor is the abscissa flagquantum.algorithms.run_zne fits against, not the requested one, because it is the ratio the noise saw; the plain scaling of that unit multiplies a channel parameter and is a different unit of scale, so a call naming both a fold and a scaling callable is refused rather than composed. The two strategies are not interchangeable. A circuit fold repeats whole bodies, so its realized ratio is 1 + 2m and a request between two odd integers overshoots: on the five-instruction body a request of 1.4 is met by 3.0 in fifteen instructions. A gate fold distributes the same pairs one instruction at a time and reaches a request exactly whenever the arithmetic allows: the same request of 1.4 is met exactly in seven instructions, and a request of 2.2 is met exactly in eleven where the circuit strategy's next reachable ratio, 3.0, costs it fifteen, so the exact factor is also the cheaper one. Because both strategies reach a ratio in steps of two instructions, distinct requests can realize one length: under a circuit fold of the five-instruction body the requests 1.4 and 2.6 both realize 3.0, and a run handed such a set is refused by naming the duplicated ratio rather than by failing inside the linear solve, because repeated abscissas make that system singular. A gate fold spends its pairs leftmost first, so its added gates land where the strategy puts them rather than where the caller's observable is sensitive, and a readout blind to a pair reads a flat curve over a program whose noise genuinely grew: on the five-instruction body with depolarizing at 0.03 the added pair lands on the leading h, and a zz(0, 1) readout reads 0.672956129888 at both ratio 1.0 and ratio 1.4 while xx(0, 1) reads 0.242863810368 and 0.223823288052. Four further refusals are deliberate and each names what it measured: a scale factor below one, which would have to remove instructions and change the ideal signal; a non-finite factor; an empty program, which has no instruction to fold; and a custom instruction whose matrix is not unitary or not square, because the fold repeats it with its own conjugate transpose and the identity would not hold. A program carrying a noise channel is refused before any of that, and the fold preserves the body's measurement and observable nodes as well as its instructions, so a fold of a program that declares them keeps them. This is a program transform, not an execution path: it builds a flagquantum.core.ir.CircuitIR and the existing runtime executes it, so no new target, runtime option, result field or execution mode is added, and no Stable Core export follows. Not here: any estimate of the noise a fold amplifies, any fold of a noisy program, any strategy beyond the two named, any fold count beyond the realized ratio, and any noise-model-aware placement of the added pairs. Demonstration scale: two- to five-instruction circuits on the CPU statevector and density-matrix paths, with folds up to a ratio of seven. No performance, scaling, hardware or fault-tolerance claim follows from it."
