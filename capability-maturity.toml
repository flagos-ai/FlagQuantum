title = "Clifford data regression over near-Clifford training circuits"
summary = "Fit the affine relation between what a circuit should give and what the noise makes it give, on Clifford training circuits built by snapping each rotation of the target to its nearest quarter turn, then apply that relation to the target's own noisy expectation."
category = "simulation_and_training"
user_goals = ["Remove the noise a declared model contributes to one observable without inverting the model", "Read how far the training circuits had to move to become Clifford, and the residual the fit left", "See which programs this method cannot train on, by name, before it returns anything"]
public_apis = ["flagquantum.algorithms.cdr", "flagquantum.algorithms.run_cdr", "flagquantum.algorithms.clifford_variants"]
runtime_modes = ["density_matrix"]
hardware = ["cpu"]
