[capabilities.stabilizer_code_memory_circuit]
title = "Stabilizer-code memory circuit"
summary = "Declare a stabilizer code record and turn it into a memory-experiment source with the detector and observable layouts that experiment implies, in either Pauli readout basis, for the repetition code, the rotated surface code, the Steane code, the triangular colour code, the square-lattice toric code and the ZXXZ surface patch."
category = "simulation_and_training"
user_goals = ["Declare a stabilizer code with its distance, wires, checks and logical observables", "Build the circuit source and detection layouts of a memory experiment from a code", "Trace a detection event back to the check and round that produced it", "Read a declared code out in the Pauli basis its own declaration is not written in", "Certify a candidate logical operator against the code's own checks before measuring it", "Declare a triangular colour-code patch from its distance alone and build its memory experiment", "Declare a square-lattice torus from its linear size and read out both of its logical qubits", "Declare a ZXXZ surface patch whose every check is mixed and build its memory experiment"]
public_apis = ["flagquantum.qec.build_memory_circuit", "flagquantum.qec.RepetitionCode", "flagquantum.qec.RotatedSurfaceCode", "flagquantum.qec.SteaneCode", "flagquantum.qec.triangular_colour_code", "flagquantum.qec.toric_code", "flagquantum.qec.css_code_matrices", "flagquantum.qec.CssCodeMatrices", "flagquantum.qec.CodeCheck", "flagquantum.qec.Pauli", "flagquantum.qec.MemoryCircuit", "flagquantum.qec.DetectorLayout", "flagquantum.qec.ObservableLayout", "flagquantum.qec.certify_logical_product", "flagquantum.qec.derive_anticommuting_logical_product", "flagquantum.qec.ZxxzSurfaceCode"]
runtime_modes = ["local_statevector_dynamic_hybrid"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "flagquantum/qec/README.md"
documentation = "flagquantum/qec/IMPLEMENTATION.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "A code-independent declaration layer, not a decoder and not an experiment runner. build_memory_circuit emits bounded hybrid source text plus detector and observable layouts; executing that source is the Runtime's dynamic hybrid path and carries that path's own limits. Six code records exist: the repetition code, the rotated surface code, the Steane code, which is the first record carrying both a Z-type and an X-type logical observable, the triangular colour code, whose checks are the first here that reach weight six, the square-lattice toric code, which is the first record whose matrices leave more than one logical qubit and whose lattice is periodic rather than a patch, so its linear size is the distance the build must prove, and the ZXXZ surface patch, which is the first record whose every check is mixed and none is pure, so it is stated as the rotated patch conjugated by a Hadamard on the data checkerboard and is reached only through this route, never through the matrix route. The repetition, rotated-surface and Steane records keep the evidence their own test files carry unchanged; the colour record's own evidence is tests/qec/test_colour_code.py for the lattice and tests/qec/test_colour_memory_execution.py for the executed experiment, sampling and decoding of the patch, and the torus's is tests/qec/test_toric_code.py for the lattice algebra, including the logical-qubit count measured from the rank of its own rows, and tests/qec/test_toric_memory_execution.py for the executed experiment, the sampler comparison per observable index and a decode; the ZXXZ patch's is tests/qec/test_zxxz_code.py, which re-derives the conjugation from the rotated patch's own checks rather than repeating the record's claim, measures the family's distance by exhausting every pure operator below it, and shows the choice of checkerboard parity is load-bearing, and tests/qec/test_zxxz_memory_execution.py, which measures the readout limit from both sides and asserts the decoded-against-raw contrast against the rotated patch at the same distance, rate, budget and seed. Graphlikeness is not a property of a code here: the torus's one-round model is graphlike under any noise and its two-round model stops being graphlike once a Y data fault is declared, and the latter is measured beside the former rather than recorded as a refusal alone. A check states one ancilla and one coupling order: the Z-factor pairs first, each reading a data wire into the ancilla, then the X-factor pairs, each reading the ancilla out into a data wire. A mixed X-and-Z stabilizer is therefore measured by one ancilla and both CNOT directions, and the earlier reading that such a check would need a second ancilla is retracted; the second direction is what a mixture needs and the second ancilla is not, and a pure check is the case whose second run is empty. What that costs is recorded rather than hidden: a mixed check's outcome is deterministic neither at the all-zero preparation nor at a Z-basis readout, so the Z-basis memory experiment of a code whose checks are all mixed carries detectors only between syndrome rounds and none from a syndrome round to the data. Such an experiment has a mechanism at every distance that fires no detector and flips the observable -- the readout, merging the logical operator's d wires into one mechanism of probability (1 - (1 - 2p) ** d) / 2 -- whose probability grows with the distance and which no pairing decoder can suppress, because there is no detector to pair. On that code the matching decoder reproduces every syndrome it is handed and still leaves the decoded rate above raw / 1.5 at distances three and five, against raw / 4 or better for the rotated patch through the identical harness, so such a patch is not yet a distance-d memory experiment in the sense the rotated patch's is. Both the initial state and the terminal data readout are in the Z basis unless a logical product is declared, in which case build_memory_circuit inserts a Hadamard on exactly the product's X wires before the round loop and again before the terminal readout, so one code record can be read out in either Pauli basis without a second circuit shape. A declared product must be a pure X-type or a pure Z-type Pauli operator over declared data wires; a mixed X-and-Z product is refused, because a Y factor would need a second rotation axis on that wire, and so is a product that does not commute with every check, or that lies in the stabilizer span of the observables of its own type, because such a product is a stabilizer rather than an observable. The partner of a declared observable is derived rather than chosen: derive_anticommuting_logical_product solves the code's checks of the opposite type together with its declared observables of that type over GF(2) and refuses when the code has none, so a repetition patch of even distance offers no X-basis readout and states the reason instead of half-reading. Detector counts follow the two check classes, z_checks * (rounds + 1) + x_checks * (rounds - 1) in the default frame. A rotated readout frame keeps a boundary detector only for an X-type check whose support lies inside the rotated wires and for a Z-type check whose support is disjoint from them, and keeps every round-to-round detector either way; an experiment whose configured rounds leave no deterministic detector at all is refused with the round count named as the remedy rather than emitted empty. Counts are validated against the code's checks and the configured rounds, but the validation is membership-based: it does not check that a detector names the same check in every round, that a terminal detector's data wires are the support of the check it belongs to, or that the emitted source is the program the layouts describe, so a hand-built layout can be semantically wrong while passing every check. The rotated surface code's declared logical observable is Z on one data row; which weight-d logical operator a patch uses is a convention, and this record states the one it uses rather than deriving all of them, while its X-basis partner is derived and certified rather than chosen. Certification is a statement about the operator and not about a probability: a certified product is not thereby a corrected logical qubit, and no protocol that measures or protects it is built here. Agreement with stim's generated rotated-memory circuit is on the declared detector and observable count at distances two through eight and rounds one through four, which fixes the shape and not a mechanism-level correspondence. Execution evidence covers the distance-three patch of each family only, because the dynamic hybrid simulator draws each shot from the full output distribution and a distance-five rotated surface patch is 2**49 amplitudes per shot while a distance-five colour patch is 2**37. No decoding, no threshold, no logical-suppression, no fault-tolerance, no real-time and no hardware-feedback claim follows from a declared code, a detector layout, or a syndrome trace."
focused_tests = "tests/qec/test_surface_code.py"
integration_tests = "tests/qec/test_memory_circuit_execution.py"
development_artifact = "flagquantum/qec/IMPLEMENTATION.md"

[capabilities.css_code_from_matrices]
title = "Stabilizer code stated as parity-check matrices"
summary = "State a Calderbank-Shor-Steane code as its Z-type checks, its X-type checks and its logical operators, and get back the code record the declared families produce, with a distance computed from the matrices rather than read off the logical operator that was written down; the triangular colour patch and the square-lattice torus arrive this way, with their matrices derived from their lattice rather than written by the caller."
category = "simulation_and_training"
user_goals = ["State a stabilizer code this package does not declare, as parity-check matrices", "Have the code's distance computed from its matrices rather than declared", "Run a code stated as matrices through the memory circuit, detector error model, sampling and matching path", "Read the matrices back out of a code record the package already ships", "Derive a family's parity-check and logical matrices from its lattice instead of writing them out"]
public_apis = ["flagquantum.qec.CssCode", "flagquantum.qec.css_code_matrices", "flagquantum.qec.CssCodeMatrices", "flagquantum.qec.triangular_colour_code", "flagquantum.qec.toric_code"]
runtime_modes = ["local_statevector_dynamic_hybrid"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "examples/qec/css_code_from_matrices.py"
documentation = "flagquantum/qec/README.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "A declaration route, not a code library. It admits a code whose checks and logical operators can be written as 0-or-1 rows over the data wires, which is the CSS class and nothing outside it: a mixed X-and-Z stabilizer has no row, because stating one would mean writing it as a row of each family and the pair of matrices would then describe checks that do not commute. That is a limit of the matrix route and not of the check protocol, which measures a mixed stabilizer with one ancilla and both CNOT directions; a code whose checks are all mixed is declared as a record instead, and ZxxzSurfaceCode is the first one. The matrices are Python sequences of sequences, because this module holds no array dependency and states none; a tensor block reaches the route only through the `.tolist()` the refusal names. Every invariant is checked rather than assumed: the two check families commute, each declared logical operator commutes with the opposite check family while not lying in the span of its own, the declared logical operators of a family pair up non-degenerately, the blocks agree on a width that leaves at least one logical qubit, no row acts on no data qubit, and each family declares as many operators as the width and the two ranks leave logical qubits. The distance is searched for rather than read off the representative the caller wrote down, which is what makes it a property of the code: the same Steane record reports three whether its logical operator is written at weight three or at weight seven. That search is bounded, and the bound is the caller's to accept: it tries wire subsets in increasing weight up to `distance_search_weight`, which defaults to three, and refuses when the bound is exhausted instead of reporting the best it found. The cost of the bound grows with the data-qubit count, and the route is demonstrated from eight to fifty data qubits rather than claimed as a distance algorithm for a large code. A code whose two distances differ is where the bound bites hardest, and it was measured on the baseline's own punctured quantum Reed-Muller record: that convention's X distance is seven beside a Z distance of three, so the default bound of three refuses the code, the caller must ask for a bound the search reaches, and the record then reports the smaller number as the distance and both numbers separately. The refusal is per family and fail-closed rather than a fallback to the lightest operator it found, which is what makes the bound a statement about the search rather than about the code. Nothing here decodes, protects a logical qubit, or states a threshold, a logical-suppression figure or a family's error rate. Two routes reach a record and they are distinguished by where the matrices come from: a caller writes them, as the torus the golden path walks through does by hand, or the route derives them, as triangular_colour_code and toric_code do for families this package declares. The second is what keeps a declaration from being copied from another framework's source, and it now covers two families, one patch and one periodic lattice. The golden path holds the two descriptions of the torus against each other on everything the edge numbering cannot change -- the qubit and check counts, the distance, the logical-operator count and the full mechanism-weight histogram of the detector error model -- because the caller's numbering and the record's are different and no attempt is made to relabel one into the other. The qLDPC, Reichardt and Floquet families remain absent as records, so the route is demonstrated rather than general. Two refusals belong to the sibling routes rather than to this one and are inherited: a declared product that is not pure X or pure Z is refused by the memory circuit, and a model whose mechanisms flip three or more detectors is refused by the matching decoder, which is what a code whose lightest logical operator is not the lightest fault looks like from the decoder's side -- a refusal the colour code runs into deliberately, and which the belief-propagation decoder does not share."
focused_tests = "tests/qec/test_css_code.py"
integration_tests = "tests/qec/test_css_code_memory.py"
development_artifact = "flagquantum/qec/codes.py"

