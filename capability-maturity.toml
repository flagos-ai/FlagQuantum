distribution_semantics = "single_device_fast_path"
quick_start = "examples/gradient_methods/README.md"
documentation = "docs/reference/API.md"
level = "production_supported"
owner = "PyTorch runtime maintainers"
limitations = "Only statevector, MPS, and tensor-network mode can serve the expectation value a differentiable program needs; stabilizer mode samples outcomes and fails closed instead. method='autograd' and method='parameter_shift' are exact; method='finite_difference' and method='spsa' are declared approximations whose result reports exact=False together with the displacement actually used. method='adjoint' is refused, because FlagQuantum has no standalone adjoint entry point: the reversible sweep is reachable only as the backward pass behind PyTorch autograd, and no result reports whether backward used adjoint replay. method='auto' measures the program rather than declaring a route, so it probes for an autograd graph before it resorts to a shift rule or a difference."
focused_tests = "tests/test_gradient_api.py"
integration_tests = "tests/integration/test_gradient_modes.py"
