runtime_modes = ["local_statevector_compiled_feedback", "local_statevector_runtime_decoder", "local_statevector_runtime_pauli_frame", "local_statevector_runtime_temporal_decoder", "local_statevector_runtime_temporal_pauli_frame", "local_statevector_offline_pauli_frame", "local_statevector_noisy_trajectory"]
