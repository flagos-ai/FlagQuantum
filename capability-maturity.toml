documentation = "docs/guides/ALGORITHMS.md"
level = "development_evidence"
owner = "Algorithms maintainers"
limitations = "Probabilistic error cancellation whose premise is the declared noise model and only that model. The unit inverts the channel the model declares, at the location the model declares it: an error the model does not carry -- a miscalibrated gate, leakage, drift between the declaration and the run -- survives the inversion untouched, so a mitigated value close to the ideal is a statement about the model before it is a statement about a device. The decomposition is exact only for a channel whose Pauli transfer matrix is diagonal, which is what makes it a Pauli channel, and only while no transfer eigenvalue reaches zero, which is what makes the inverse exist at all. Both boundaries are checked at 1e-6 and refused by name rather than approximated, each refusal quoting the magnitude it measured: bit_flip, phase_flip, depolarizing, two_qubit_depolarizing and phase_damping are admitted at the probabilities tested, while amplitude_damping (1.000e-01 off-diagonal), coherent_overrotation (1.987e-01), reset_error (5.000e-02) and thermal_relaxation (1.000e+00) are refused, and bit_flip at one half is refused for a vanishing eigenvalue at Y rather than for being outside the family. The tolerance sits two orders above the complex64 floor a single-precision channel is measured at and five below the smallest refusal recorded here. The estimate is a quasi-probability average: it is not a physical density matrix and it can be non-positive, which is why the unit returns a value rather than a state. It carries no confidence interval, and sampling_overhead is gamma squared -- the shot cost a sampled implementation of the same combination would pay, because every signed weight carries its sign into the variance -- rather than a measurement of this path, which evaluates each term exactly and consumes no shot. gamma is at least one, equals one only for a channel that is itself a Pauli conjugation, and composes multiplicatively over locations, so the price of a model is the product of the prices of its sites. The cost is bounded: a combination needing more than 1024 exact programs is refused with the count it needed, which is four terms per single-qubit noise location and sixteen per two-qubit one. A model that declares a readout rule is refused rather than measured, because the observable is read as Tr(O rho) before measurement and classical readout confusion is not part of rho; mitigating readout is a separate unit beside this one, flagquantum.algorithms.plan_readout_mitigation, which inverts a declared confusion on a measured vector rather than a channel on a state. A circuit that declares its own input state is refused, because the unit re-executes the program from its IR once per term and a program built from an IR begins at the all-zero state. The circuit's batch size must be one, since one expectation is read per term. A noise model that puts no channel in the program is refused, because an identity model's mitigation is the unmitigated value under another name. Measured on h(0); cx(0, 1) with the observable zz(0, 1) and bit_flip at 0.1 on the cx: the two-location composite reads 0.639999995231628 unmitigated and 0.999999999999999 mitigated in complex128, at gamma 1.562500011642 over 16 terms and 17 exact programs, and the same run at the runtime's default precision reaches 0.999999866503455 from an unmitigated 0.639999806880951, so the floor the method leaves is the precision the channel was declared in. The one-location read of the same program is 0.799999997019768 unmitigated and 1.000000000000000 mitigated at gamma 1.250000004657 over four terms, and the two-location gamma is its square. Demonstration scale: two-wire circuits on the CPU density-matrix path, at most five noise locations. No performance, scaling, hardware or fault-tolerance claim follows from it, and no variance reduction is claimed."
