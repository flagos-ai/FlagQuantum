limitations = "An exact construction for Pauli noise over the reference Clifford gate set, and a text reader for the stim detector error model format. Construction derives a signature rather than asserting one. A mechanism's flip set is read off the circuit's own detector and observable layouts, from the code's check types and the frame the experiment is prepared and read out in: an X fault reaches the Z-type checks and the Z-basis readout, a Z fault reaches the X-type checks and the X-basis readout, and a Y fault reaches both. Nothing is lowered and nothing is executed, so no register and no trajectory enters the derivation, and a non-Pauli channel is refused with a stated reason rather than approximated. The round-zero coin toss of an X-type ancilla -- which is what made the executed route demand agreement on the flip set rather than on the register, and which is why a code with an X-type check was once refused -- is not a case the derivation has to handle at all. Because the derivation reads a layout, the number of wires does not bound it: a rotated surface patch at distance 3 is 17 wires and 45 mechanisms, at distance 5 is 49 wires and 225 mechanisms, and at distance 7 is 97 wires, 336 detectors and 637 mechanisms, and all three build in under a quarter of a second. The modelled rotated-surface distance is therefore 3 or 5 or 7 as the caller asks, and no distance is refused for its width. The route this replaced forced each location through an execution and read the same layouts off the result. It survives as _forced_signature, which still refuses a mechanism whose flip set is not deterministic across two trajectories and whose source does not carry the line the mechanism is injected at, and the suite holds the derivation against it rather than trusting it: the comparison is location by location, over every mechanism of a repetition code, a Steane code and a rotated surface patch, over every fault family, and in both readout frames. That executed route is bounded where the derivation is not -- a distance-4 patch is 31 wires and 2**31 amplitudes, and a distance-5 patch fails on the allocator outright -- and a test asserts that the distance-7 patch builds, which is what fails if the derivation is replaced by an execution again. What the derivation gives up is the executed route's guard against a hand-built record whose layouts misdescribe the program it stores. Three such shapes are still refused with the reason the injection engine stated -- a source missing the round loop anchor or a check's measurement anchor, and a detector whose syndrome reference names an ancilla no check owns -- but a layout that is merely wrong about a mechanism the program does contain is now read as the record states it, and nothing inside construction holds it; only the test-level oracle does. That is the narrowest honest statement of the route, and it is recorded rather than left silent. The matrix route is unbounded in the same way and for the same reason: reading a matrix support costs one pass over its nonzero entries per round. A second construction route reads a code-capacity experiment rather than a memory circuit. DetectorErrorModel.from_code_matrices takes a CssCodeMatrices record -- the four CSS blocks hz, hx, lz and lx -- and derives every mechanism combinatorially, and css_code_matrices lifts a code record into that record, refusing a logical observable that is neither pure X nor pure Z rather than half-reading a CSS code. Its geometry is not the memory circuit's and the difference is pinned rather than glossed: a fault in round r reaches the detector band of round r and of round r + 1, the final round has no band after it, and there is no terminal data readout, so the detector count is num_rounds * num_checks where a memory circuit gains one terminal detector per Z-type check. Both geometries are asserted against their own stim transcription, and the same suite asserts that the two counts differ. The matrix route is compared to stim one readout basis at a time, because lz and lx anti-commute and no one state has both as a deterministic value: the reference experiment is run twice against the model restricted to the matching basis, and each run's observable rows are the ones the Pauli character of that fault family predicts. A fault that is still in the data at the end of the run is still seen by the logical readout, so a physical fault spans one detector band while the model gives it two; that single divergence is pinned as the exact relation between the two mechanism sets rather than as a tolerance. The fault family is the three single-qubit Pauli faults plus a check's syndrome bit flipped at readout, so an X fault flips Z-type checks, a Z fault flips X-type checks and a Y fault flips both, and the X detector band and the lx observable rows exist on the matrix route. The rate record is no longer what is narrower than upstream's. PhenomenologicalNoise states upstream CssNoise's four families as four scalars -- data_flip, phase_flip, both_flip and measurement_flip, which are its px, pz, py and pm -- and the same four per element as data_flip_per_qubit, phase_flip_per_qubit, both_flip_per_qubit and measurement_flip_per_check, which are its px_per_qubit, pz_per_qubit, py_per_qubit and pm_per_check. A stated vector replaces its scalar wholesale rather than mixing with it, a vector that does not name every data qubit or every check is refused naming both counts instead of being partially applied, and an element whose effective rate is zero enumerates no mechanism at all, so a quiet location between two noisy ones is expressible and costs nothing to sample. The per-qubit vectors are indexed in the code's own data_wires order, which is the column order of every matrix, and the per-check vector by matrix row with the Z-type checks first; a code may declare its checks in any other order -- the rotated surface code interleaves the two types -- so the two orders are related by one named translation that all three readers share. What remains different from upstream is the carrier rather than the rates: upstream folds the record into the argument its matrix entry point takes, so the vectors are validated against matrices that arrive with it, where here the record is a standalone frozen dataclass and its vectors are resolved against a count the reader supplies. The sampler reads the two families the engine has a channel for, so the phase and Y data rates reach a model and not a sampled record. A matrix that is not binary, is not two-dimensional, or is not indexed by the same data qubits as another non-empty block is refused rather than coerced. The matrix route is graphlike only while it stays inside one round; at two rounds the middle data wire of the distance-3 repetition code flips the same check in both bands, which is a four-detector mechanism, and the matching decoder refuses it as a hyperedge. The model is built on the memory circuit without in-circuit feedback, because it describes the noise-to-detection mapping a decoder inverts, so the frozen profile's compiled-feedback path is unmodelled. Detector rates are cross-checked against rates sampled from the circuit simulator, and the two no longer share the signature computation: construction derives a mechanism's flip set from the layouts while the cross-check's oracle injects the mechanism into the stored program and executes it. tests/qec/test_dem_from_memory_circuit.py compares the two location by location over every mechanism of three codes and every fault family, and it is also where the distance-7 patch is asserted to build. tests/qec/test_dem_signatures.py pins the oracle's own readings against absolute detector indices looked up in the layout, so the oracle is not checked against the route it guards. An independent check does exist and runs against the optional stim distribution: the memory circuit is transcribed into a stim circuit and stim's own error analysis builds the model, which agrees with this one on shape, mechanism count and detector marginals at distance 2 and 3. That check shares nothing but the circuit's gate sequence and the noise model. The text reader accepts everything stim 1.16.0 wrote in a 240-model developer-time sweep except a repeat block, a # comment, a declaration that skips an index, and a malformed line; str(detector_error_model.flattened()) is a complete route around the repeat refusal. A line's ^ separators are read the way stim means them -- the signature is the symmetric difference of the targets, so a detector named twice cancels and the groups are not retained -- and the decomposition the separators suggest is available under upstream's own flag name as from_stim_text(text, use_decomp_suggestions=True), which returns one mechanism per component at the probability the line states and turns 536 mechanisms into 1042 on a distance-5, two-round rotated surface code. That second reading is a different distribution from the line rather than an equivalent statement of it, and it is measurably so: against stim's own sampler on the same text the default reading's worst marginal misses by 0.0016, inside the 0.004 tolerance, while the expanded reading misses the observable marginals by 0.048, twelve times outside it, which is what makes the tolerance evidence rather than decoration. A component that cancels to nothing is refused by the expanded reading alone, with the default reading named as the route that states the line. The text writer is exact on this side and stim's width is the platform's: stim prints at numeric_limits<long double>::digits10 + 1, so nineteen significant digits where long double is the x86 80-bit extended type (the Linux CI runners, where a reprint returned every swept probability unchanged) and sixteen where it is a double (arm64 macOS, where about a quarter of the same sample came back changed); seventeen digits name a double uniquely, so a round trip through stim must compare against a re-read of the text rather than against the in-memory model exactly where the width is the narrower one, and the drift there is bounded by one part in 10**15 and measured at 5.4e-16 worst case, while tests/qec/test_dem_stim_text_precision.py reads the width off stim's own output and pins the digit count, the direction of the loss and the bound against it. A CodeCheck states one ancilla and one CNOT direction fixed by the check's type, so a code with both check types is expressible while a mixed X-and-Z stabilizer is refused; the detector grammar is therefore z_checks * (rounds + 1) + x_checks * (rounds - 1) rather than one detector per check per round, and a code family needing a second ancilla per stabilizer still requires that record to grow first. dem_sampling reports a DEM-sampled rate and is labelled as one wherever it is reported; no decoder, no threshold, no logical-suppression, no real-time or hardware-feedback, and no performance claim follows from a detector error model or from any rate it reports. DemSample carries tensors and is deliberately unhashable. The merge is a stated operation and not only a construction step: DemMergeRule names its two rules for what they compute, INDEPENDENT_PARITY being the probability that an odd number of a duplicated group fires and CLAMPED_LINEAR_SUM the sum of the group clamped at one, mechanisms_are_unique and require_unique_mechanisms are the predicate and the refusal, and the parity rule is exact rather than approximate because a detector's rate is a product of 1 - 2p factors over the mechanisms touching it, so a group's combined prior is the single p whose factor is that product and regrouping the factors cannot change any detector or observable rate; the sum rule does not preserve them and is offered only for a caller who means it. A model may also state that mechanisms are alternatives rather than independent, which is the one statement its parity matrices cannot carry, because two columns of a parity matrix are independent by construction: DemError.error_id is an optional non-negative label, the mechanisms sharing one are mutually exclusive, and DetectorErrorModel.error_ids projects upstream's optional vector back out, None when no mechanism states an id, which is upstream's nullopt and the state stim's text always describes. Exclusivity is given a distribution rather than left as a bare flag: the members of a group are disjoint pieces of one shot and each keeps the probability it states, the left-over mass is the group firing none of them, and a group whose probabilities sum above one is refused rather than renormalized, because renormalizing would change every rate the caller read; a group summing to exactly one is admitted, and a lone id excludes nothing and behaves as if it were unstated. The model's own arithmetic honours the groups, so the marginal rate of a target sums the group members that touch it instead of composing them by parity -- 0.26 for two independent mechanisms of 0.1 and 0.2 against 0.30 for the same two stated as alternatives -- and sampling draws one uniform per group and lets at most one member fire, so a model with no ids, which is every model the construction routes here produce, keeps the arithmetic and the draws it had before the field existed. The statement is not transcribable, and the operations that would silently drop it refuse instead: to_stim_text names the ids it would lose rather than printing an independent model under the same probabilities, and merge_duplicate_mechanisms names them because either rule combines mechanisms by assuming independence and would invent a shot in which two alternatives both fired. What remains absent is an operation that folds a group under its exclusivity rather than merging by independence, which is the gap the canonicalize field row records. A decoder is handed both halves of what it needs, not only the model. detector_context_from_memory_circuit builds the model once and returns a DecoderContext whose full_component, x_component and z_component each return a DecoderInputs -- the model together with both maps -- and whose num_measurements states the width those maps index. A MeasurementMap is one row per detector or observable holding the measurements whose parity it is: dense() projects to the (rows, measurements) orientation upstream stores as D and O, and flattened() to the -1-terminated sparse form a realtime decoder configuration takes, the terminator being what keeps a row that reads nothing visible to a sparse reader. The map is closed rather than conventional -- a row is sorted because a parity is a set, it may not name one measurement twice because two reads of one measurement cancel, and an index outside the buffer is refused. The basis split is a projection of the model as built rather than a second construction: a detector belongs to the check whose ancilla it reads, so the Z component carries the terminal detectors and the union is the model itself, with no boundary-aware variant needed because the layout states its own boundary detectors. Two refusals keep the projection a reading rather than a rewrite: a component of a model that states error ids is refused, because projecting a group of alternatives would either drop the correlation or merge two of its members, and a component whose basis has no detector is refused rather than returned empty. The numbering the maps use is derived from the circuit's declaration and asserted equal to the numbering the sampler derives from the lowered program, so the two readings of one record convention are pinned to each other by measurement rather than by a shared constant. The context does not execute the circuit, costs one construction and no simulation, and carries no rates vector, no canonicalization and no chunk or seam helper. The other direction is stated beside construction rather than folded into it: dem_circuit.py writes a model as the detector-level realization it already is -- one wire per detector, one per observable, one Pauli-frame channel per fault -- and reads it back exactly, error ids included, because a frame's operators say which targets a fault flips and its declared masses say how often, so no mass is recovered by squaring a square root. What it returns is not the circuit the model was built from and cannot be, because a detector error model states which detector parities a fault flips and never which measurements compose a detector, so the syndrome-extraction circuit, its gate sequence, its depth and its ancilla layout are outside it and two different memory experiments of one distance under one noise record define the same model; the detector count is the caller's to state, and a mechanism at probability zero is refused rather than dropped. The realization samples on the stabilizer engine, so no statevector bounds it: a distance-7 rotated surface patch's model is 49 wires and 43 mechanisms. test_dem_circuit_round_trip.py, test_dem_signatures.py, test_dem_sampling.py, test_dem_cross_check.py, test_dem_from_memory_circuit.py, test_dem_public_surface.py, test_dem_merge.py, test_dem_error_ids.py, test_dem_rate_overrides.py, test_decoder_context.py, and tests/qec/test_dem_code_matrices.py, whose stim cross-check is tests/qec/test_dem_code_matrices_stim.py."
focused_tests = "tests/qec/test_dem_stim_text.py"
integration_tests = "tests/qec/test_dem_stim_interop.py"
