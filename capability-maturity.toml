[capabilities.algorithms_variational_solvers]
title = "Variational solvers over a checked cost operator"
summary = "Fit QAOA angles to a weighted MaxCut graph through one checked edge list that reaches both the cost layer and the operator the energy is scored against, and build the MaxCut cost operator itself, with the uniform superposition's stationary point and the finite-layer approximation carried on the result."
category = "simulation_and_training"
user_goals = ["Build the weighted MaxCut cost operator sum of w_ij Z_i Z_j for a graph, checked against the graph it describes", "Fit QAOA angles to a weighted MaxCut instance from a caller-chosen start, and read the energy, the trajectory and the fitted angles", "Score a QAOA circuit the caller assembled against the operator this unit builds, or against a Hamiltonian of their own", "Read the assumptions and limitations a fitted energy rests on rather than inferring them"]
public_apis = ["flagquantum.algorithms.variational", "flagquantum.algorithms.maxcut_hamiltonian", "flagquantum.algorithms.run_qaoa", "flagquantum.algorithms.QAOAResult", "flagquantum.algorithms.QAOA_ASSUMPTIONS", "flagquantum.algorithms.QAOA_LIMITATIONS"]
runtime_modes = ["local_statevector"]
hardware = ["cpu"]
gradient_support = "exact"
distribution_semantics = "single_device_fast_path"
quick_start = "examples/algorithms/variational_solvers.py"
documentation = "docs/guides/ALGORITHMS.md"
level = "development_evidence"
owner = "Algorithms maintainers"
limitations = "A solver family over one ansatz, and not a new simulator, a new cost model, or a sampled execution path. What run_qaoa adds to the primitives beside it is agreement: a QAOA circuit is built from a list of weighted ZZ edges while an energy is an expectation against some Hamiltonian, and nothing inside either one relates the two, so a caller can build the ansatz for one graph and score it against another and every number that comes back is then a number about a problem nobody posed. The edge list is checked once and reaches the circuit and the operator through the same tuple, which removes that freedom for this entry point and only for it: a caller who assembles qaoa_circuit and qaoa_loss themselves still has it, and nothing warns them. The operator is sum over edges of w_ij Z_i Z_j with no constant term, so its value on a computational basis state is the edge total less twice the cut and its minimum is W - 2 * (largest weighted cut); the QUBO route through max_cut_qubo and qubo_to_ising describes the same minimizers but is an affine image of it -- the constant changes no angle while the halving of every coefficient does -- so the operator here is the one whose coefficients the cost layer rotates by, and reusing the QUBO form for an angle sweep would search a rescaled landscape. A negative weight inverts that one edge's preference and is allowed; a self-loop is refused because Z on one qubit squares to the identity and the edge is then a constant shift rather than a cut; and a repeated undirected pair is refused rather than summed, because summing would count the edge twice in the objective while the cost layer rotated twice as well and the two errors would reinforce. The premise the method cannot check is where the start is: the first layer's cost and mixer both act on the uniform superposition, which is an eigenstate of every ZZ and every X, so the measured gradient at a zero start is exactly 0.0 for every parameter at every layer count -- measured on a triangle and a five-edge four-node graph, one gradient entry per parameter -- and a zero start therefore returns the zero start with the objective unchanged. The start is consequently a required argument and this unit does not perturb it, because a default displacement chosen here would be a claim about the caller's instance rather than a property of QAOA. A finite layer count is an approximation and not an exact solver: on the five-edge four-node graph at a constant start of 0.1, one layer reaches -1.4735270738601685, two layers -1.914364218711853 and three layers -2.9724555015563965 against an optimum of -3.0, so a larger layer count is not guaranteed to be closer in general even though it is here, and the energy is an expectation rather than a bound. The trajectory the result carries is a record and not a descent: Adam, the default, takes a step of the learning rate's size regardless of how flat the objective is, so history can rise, and only the final value is the result. Angles, the circuit and the objective are float32 because the circuit builder casts every angle to float32, so a float64 start is downcast rather than refused and the reported energy is float32-accurate. The update is autograd-based, so the gradient-free units this package ships -- SPSAOptimizer and NelderMeadOptimizer -- cannot be supplied, and a shot-based or hardware objective would need them. The result carries the fitted angles and the energy at them and nothing about the cut: sampling the optimized circuit, decoding a bitstring, ranking sampled cuts and comparing a sampled best against the optimum are all the caller's steps, and no cut value is returned. Not here: a cost Hamiltonian for a general QUBO or Ising instance, any constraint, penalty or slack term, a warm start from a classical heuristic, a multi-start or basin-hopping wrapper, a shots or hardware path, and the VQE entry points themselves, which remain flagquantum.algorithms.core.run_vqe and its adapt, hybrid and layerwise variants. Demonstration scale: weighted MaxCut instances of three to five edges on three to four qubits, fitted on the CPU statevector path for one hundred steps. No performance, scaling, hardware or fault-tolerance claim follows from it."
focused_tests = "tests/unit/test_variational_solvers.py"
integration_tests = "tests/test_algorithm_examples.py"
development_artifact = "flagquantum/algorithms/README.md"

[capabilities.algorithms_trotter_time_evolution]
title = "Trotterized time evolution of a Pauli sum"
summary = "Turn a weighted Pauli sum into the circuit a product formula applies, so exp(-i * t * H) becomes an ordinary Circuit, with the exact circuit for one Pauli word's exponential underneath it."
category = "simulation_and_training"
user_goals = ["Apply a Pauli sum's time evolution as a circuit the existing passes can route and differentiate", "Build the exact circuit for the exponential of one Pauli word", "Choose between the two product formulas the unit builds and know what each one's defect costs"]
public_apis = ["flagquantum.algorithms.trotter", "flagquantum.algorithms.pauli_exponential_circuit", "flagquantum.algorithms.trotter_circuit", "flagquantum.algorithms.TROTTER_ORDERS"]
runtime_modes = ["local_statevector"]
hardware = ["cpu"]
gradient_support = "exact"
distribution_semantics = "single_device_fast_path"
quick_start = "examples/algorithms/trotter.py"
documentation = "docs/guides/ALGORITHMS.md"
level = "development_evidence"
owner = "Algorithms maintainers"
limitations = "A product formula and the exact circuit for one Pauli word, and nothing about accuracy. The circuit approximates exp(-i * t * H) and the approximation is exact only when the Hamiltonian's terms commute; otherwise the defect falls off with the step length at the composition's own rate, measured as a ratio of 2.007 at order 1 and 4.027 at order 2 per doubling of the step count on a three-wire transverse-field Ising Hamiltonian at t = 0.4, coupling 0.7 and field 0.5. No bound on that defect is computed or reported, because a bound needs a commutator norm the caller has to supply, and nothing here knows the caller's Hamiltonian; the module says so where the number would be. The exact side of every comparison the tests make is torch.matrix_exp of the dense generator, which exists at the sizes this repository simulates, so no rate here is a sampling result and no scaling claim follows. order is limited to 1 and 2: the higher-order Yoshida and Suzuki compositions spend more exponentials than they buy until a caller measures otherwise, and the module records that rather than offering them. order=1 is the Lie-Trotter product and order=2 the symmetric one, so a caller who asks for order 2 pays twice the exponentials and gets one order more of cancellation per step. Four refusals are deliberate. A term that is a multiple of the identity exponentiates to a global phase, and no gate in this repository applies one -- Circuit and CircuitIR carry no global_phase field -- so such a term is refused by the index that names it rather than dropped, because dropping it leaves a circuit right about the observable and wrong about the state; a coefficient with an imaginary part is refused because it names a non-unitary step; a word addressing a wire outside the declared register is refused rather than the register widened; and an order, step count, time or coefficient outside the accepted domain is refused before any circuit is built, so a rejected call leaves nothing half-made. A word whose support is only identity characters is refused for having no support, and the register-width check precedes it, so a zero-width register reports the width rather than the word. The word reader underneath the primitive is flagquantum.simulation.pauli's own, promoted from private for this unit, and it owns the character set, the length match against the target list, the target-uniqueness and non-negativity checks; this unit adds no second copy of any of them. The declared term order is preserved and never sorted, because a product formula's value depends on the declaration order and sorting would be a second, silent parameterization. There is no exp_pauli opcode: CUDA-Q applies exp(-i * theta * P) as one opaque instruction and decomposes it in its compiler, while this unit emits the decomposition -- a basis change, a CX ladder anchored on the word's first supported wire, and one rz at twice the angle -- which is what lets the static resource estimator count the gates, a router move them, and autograd reach a tensor coefficient through them. Measured on one term with a tensor coefficient at 0.6 and order 2: the readout is 0.715813373694 and its derivative is -0.161660517061. The ladder emits its inverse CX run in the same wire order rather than the reverse, which is valid only because every CX shares one target and its controls are distinct. This is a circuit constructor, not an execution path: it produces a Circuit and the existing runtime executes it, so no new target, runtime option, result field or execution mode is added, and no Stable Core export follows. Not here: error bounds, time-dependent Hamiltonians, qubitization as a public walk object, QSVT, and double factorization. The block encoding this unit sits beside has since been promoted out of svd.py into flagquantum/algorithms/primitives/block_encoding.py, which carries its own capability entry."
focused_tests = "tests/unit/test_trotter.py"
integration_tests = "tests/test_algorithm_examples.py"
development_artifact = "flagquantum/algorithms/README.md"

