[capabilities.detector_error_matching_decoder]
title = "Minimum-weight matching decoder over a detector error model"
summary = "Turn the detector error model of a memory circuit into a weighted graph and decode a syndrome exactly by minimum-weight matching, reporting the mechanisms selected and the logical observables they flip."
category = "simulation_and_training"
user_goals = ["Decode a detection-event syndrome with a detector error model", "Inspect the weighted decoding graph a model defines", "Cross-check the matcher against an independent implementation over the same graph", "Compare a matcher's prediction against the observables a model sampled", "Select a decoder by name instead of by import"]
public_apis = ["flagquantum.qec.DecodingGraph", "flagquantum.qec.DecodingGraphEdge", "flagquantum.qec.MinimumWeightMatchingDecoder", "flagquantum.qec.MatchingDecodeResult", "flagquantum.qec.PyMatchingDecoder", "flagquantum.qec.get_decoder", "flagquantum.qec.register_decoder", "flagquantum.qec.decoder_names", "flagquantum.qec.DetectorErrorModelDecoder", "flagquantum.qec.AUTHORITY_NAME", "flagquantum.qec.CROSS_CHECK_NAME"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "flagquantum/qec/IMPLEMENTATION.md"
documentation = "flagquantum/qec/IMPLEMENTATION.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "One decoder, for graphlike detector error models only, on one detector error model at a time, with no threshold, no logical-suppression, no real-time, and no performance claim. A decoding graph is built from the model's mechanisms and nothing else: a mechanism becomes an edge whose weight is log((1 - p) / p), a mechanism flipping one detector becomes an edge to a boundary node one past the last detector, a mechanism flipping three or more detectors is a hyperedge and is refused with a stated reason rather than projected onto a pair, a mechanism of probability zero contributes no edge because its weight would be infinite, and two mechanisms that share a detector pair but disagree on their observable labels stay two edges because merging them would either lose a logical flip or invent a weight neither mechanism has. Two mechanisms that agree on both are the different case and are refused: one fault stated twice would become two parallel edges and the matcher would charge the cheaper of them, log 4 for mechanisms of 0.1 and 0.2 where the fault's own combined parity 0.26 has weight log(0.74 / 0.26), so the matcher would prefer a longer chain of other mechanisms over the mechanism that actually fired. The decoder therefore requires a unique signature before it builds a graph, names both mechanisms and the merge that resolves the duplicate, and leaves the graph's parallel edges intact so the refusal is a decoder decision and not a representation one. A model that states two mechanisms are alternatives is refused for the neighbouring reason: one weight per mechanism is the weight of a fault that fires alone, while a group of alternatives is one fault whose weight is the negative log-likelihood of the group, so the graph refuses such a model and names the groups rather than weighing each member as though the others could fire with it. Whatever the model states is what the graph holds, so the decoder inherits every scope limit of the detector error model it consumes, including the modelled rotated-surface distance of 3. The matcher is exact and self-implemented: it searches each defective detector for the cheapest chain of mechanisms to every other detector and to the boundary, and then enumerates the ways to pair the defects and to route any number of them to the boundary, which is a minimum-weight perfect matching on the metric closure. The boundary is a sink rather than a waypoint, which is what makes a syndrome's parity irrelevant, and chains may pass through defective detectors because edges two chains share cancel in the symmetric difference. Because the pairing is enumerated, the decoder accepts at most twenty detection events per syndrome by default and refuses a larger syndrome as a capability boundary rather than returning a pairing that only looks cheapest; the budget is a constructor argument because the cost is in that enumeration, so a distance-three patch at ordinary noise decodes while a much larger syndrome is declined. Detectors that no chain of mechanisms connects are refused with a stated reason rather than answered partially. The prediction is the exclusive-or of the selected mechanisms' observable labels, so it is a decision about which cheapest explanation the decoder adopts and not an estimate of the probability that the observable flipped, and it is not calibrated: two mechanisms that share a detector pair and disagree on their label are indistinguishable from the syndrome alone, so the decoder cannot always recover the more likely value. Its failure rate is therefore at or above the optimal decoder's on every model and strictly above it once rounds exceed one. A single-round repetition model has no such pair, and there the matcher reaches the exhaustive optimum exactly, which is the only optimality claim made here. Absent: a sliding-window decoder, a union-find or belief-finding decoder, and the plugin protocol the registry is not. Belief propagation with ordered statistics decoding is no longer among them: it is a decoder of its own, described in the capability that follows, and it reads the hyperedges this one refuses rather than projecting them. The hyperedge-decomposition front end that would widen the graphlike scope has landed on the construction side rather than here, because a hyperedge is a statement the model makes and the decoder can only refuse it: DetectorErrorModel.from_memory_circuit takes decompose_composite_faults, which reads the circuit route's one composite fault -- the Y family, an X flip and a Z flip at one location -- as those two parts at the parent's rate instead of as one mechanism whose signature is their exclusive-or. On a distance-three rotated surface code at two rounds the composite model states four mechanisms of three detectors and one of four and this decoder refuses it as a hyperedge, while the decomposed model states none above two and the same decoder builds on it and returns corrections for the syndromes those mechanisms explain. The option is not a relabelling and is not offered as one: the parts always fire together in the composite fault and independently when read apart, so each detector's and each observable's marginal rate is unchanged to floating-point rounding while the joint law is not, and the default stays the composite reading so no earlier caller's model changes. The matrix route states no such keyword deliberately, because there a fault's part spans two detector bands and still reaches four detectors at two rounds; a hyperedge from any other source is still refused by name. Batching, streaming, and a per-detector error-rate vector are also absent, and the decoder is not connected to the stim sampling path. The matrix route that DetectorErrorModel.from_code_matrices provides is inside this decoder's graphlike domain only while it stays inside one round: at two rounds the middle data qubit of the distance-3 repetition code flips the same check in both detector bands, which is a four-detector mechanism, and the decoder refuses it as a hyperedge rather than projecting it onto a pair. The observable prediction has no consumer yet: no logical-error-rate estimator, no threshold scan, and no integration with the memory-experiment result records. The result record is deliberately not the repetition-code DecodeResult, whose correction carries a qubit in {0, 1, 2} and an X basis only and therefore cannot express a surface-code correction. A second decoder exists behind the pymatching extra and is a cross-check rather than the authority: flagquantum.qec.adapters translates the same decoding graph, reports the same two records, and is imported lazily, so the core install and the decoder neither need nor load it. What the comparison establishes is stated narrowly, because the two instruments are not equal: PyMatching reports 3.9020747171643912 for a mechanism this package states as 3.9020746947749574, so the graph it minimizes over is not exactly this one and two explanations closer than that difference can be ordered differently on the two sides. The two decoders are therefore compared on the cheapest weight of every syndrome with a tolerance of one single-precision rounding per selected mechanism, on the observables wherever the cheapest explanation is unique, and on their refusals as the same set; a tie is uncomparable rather than evidence against either implementation, and one tie of the distance-three repetition code is pinned by hand so that the clause is a demonstrated fact rather than a place a disagreement could hide. The translation refuses two graphs instead of approximating them, and both are graphs the matcher itself answers: a detector pair carrying two mechanisms, which PyMatching's independent merge strategy would collapse and thereby lose a logical-label difference, and a detector that no mechanism flips, which PyMatching cannot represent because it infers its detector count from its edges. The cross-check's domain is therefore narrower than the authority's and never the reverse. The matcher is checked against brute force on syndromes small enough to enumerate, against the exhaustive enumeration of a model's own mechanism distribution, and against that second decoder over the same graph, so its correctness rests on the detector error model all three read and on the authority of no external decoder. A name reaches a decoder through flagquantum.qec.get_decoder, and the name is not a promise about the implementation: the registry returns the class a name is registered against and never prefers one because it is available, so the authority is returned for its own name wherever the optional extra happens to be installed. The registry is narrower than the CUDA-Q QEC decoder surface it is aligned to. Its source argument takes the three carriers a caller can hold a model in -- the detector error model, stim's text for one, and the decoding graph the model defines -- and not a parity-check matrix, because lifting a matrix would also mean choosing the noise model and round count that DetectorErrorModel.from_code_matrices reads rather than defaults. It holds the detector-error-model family alone: the repetition-code decoders take an ordered syndrome history rather than detection events, so registering both under one name space would make a name mean one of two things, and they stay directly constructed. It fails closed rather than falling back: an unregistered name raises and lists the registered names, a class missing decode, from_detector_error_model or from_decoding_graph is refused while the registering module is imported rather than at the first caller, a source that is not one of the three carriers is refused by type, and a second registration of one name is refused unless the caller asks to replace it. The optional implementation is registered whether or not PyMatching is installed, so its name is part of this package's surface rather than the extra's and asking for it without the extra raises the error naming the extra. The registry selects among decoders; the second one it selects is the belief-propagation decoder described in the capability that follows, and the hyperedge-decomposition front end is a construction option rather than a registry entry, so what remains unimplemented on the decoder side is the sliding window, and the plugin boundary upstream ships remains a precedent rather than a protocol here."
focused_tests = "tests/qec/test_decoding_graph.py"
integration_tests = "tests/qec/test_matching_decoder.py"
