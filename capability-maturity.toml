[capabilities.algorithms_kmedians]
title = "Quantum k-medians"
summary = "Assign points to their nearest centroids with a Grover-style minimum search over a centroid index register, then move each centroid to the classical coordinate-wise median of its cluster."
category = "simulation_and_training"
user_goals = ["Assign each point to its nearest centroid", "Read an assignment off sampled searches", "Update centroid positions to the medians of the points assigned to them"]
public_apis = ["flagquantum.algorithms.kmedians"]
runtime_modes = ["local_statevector"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "single_process"
quick_start = "docs/guides/ALGORITHMS.md"
documentation = "docs/guides/ALGORITHMS.md"
level = "experimental"
owner = "Algorithms maintainers"
limitations = "The advantage premise is Grover's oracle model, and it is not met: the oracle is not free here. The search's oracle is synthesized from the predicate's truth table at O(2**n) cost, so no end-to-end advantage follows at this scale, and the distance table the predicate compares is computed classically, one point at a time, before any circuit is built -- the register is capped at three wires, which is also what keeps the distances out of it. Nothing here reads a qRAM or runs an adiabatic evolution, so no conclusion that rests on either applies to this unit. Demonstration scale: the search is bounded at three evaluation wires, so at most eight centroids, and the assignment is sampled rather than read out, which is why a small sample can stop a point's search short. It makes no performance, convergence, or hardware claim."
focused_tests = "tests/unit/test_algorithms_kmedians.py"

[capabilities.algorithms_quantum_kernel]
title = "Quantum kernel estimation and kernel ridge classification"
summary = "Estimate a kernel matrix by swap test over an angle-encoded feature map, and fit a classical kernel ridge classifier on the estimated entries."
category = "simulation_and_training"
user_goals = ["Estimate the kernel matrix of a set of feature vectors", "Read a kernel entry off sampled swap tests", "Classify held-out rows with a kernel ridge classifier"]
public_apis = ["flagquantum.algorithms.quantum_kernel"]
runtime_modes = ["local_statevector"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "single_process"
quick_start = "docs/guides/ALGORITHMS.md"
documentation = "docs/guides/ALGORITHMS.md"
level = "experimental"
owner = "Algorithms maintainers"
limitations = "The advantage premise is the data-access model, and this unit does not meet it. The kernel-matrix circuit's cost statement assumes the two feature states are available, reached through a qRAM or an amplitude-encoding unitary whose cost the estimate does not count; here each feature state is built gate by gate from the classical feature vector on every run, so that cost is paid rather than assumed away and no end-to-end advantage follows. The sampling cost is the paper's own -- O(eps**-2) shots per kernel entry and O(m**2 / eps**2) for an m by m kernel matrix -- and no error bound, confidence interval or repetition scheme is computed or reported anywhere in this unit. Every entry is a sampled estimate, so the classifier's coefficients and its predictions inherit the sample, and an estimate of a near-zero overlap can come back slightly negative because the readout is 1 - 2 * share and is not clamped. The classical hardness of estimating these kernel entries is a conjecture in Havlicek et al. and not a theorem, and the rigorous speed-up results for quantum kernel methods require a fault-tolerant quantum computer (Liu, Arunachalam and Temme 2021). Demonstration scale: the feature map is a three-feature angle encoding of this package's own, and the classifier is classical kernel ridge regression whose only quantum part is the kernel. It makes no performance, convergence, or hardware claim."
focused_tests = "tests/unit/test_algorithms_quantum_kernel.py"

[capabilities.algorithms_feature_selection]
title = "Feature selection as a QUBO"
summary = "Build the binary objective of a feature-selection instance -- a subset's relevance and pairwise redundancy, scored with a penalty on the subset's size -- and evaluate or map it for a solver."
category = "simulation_and_training"
user_goals = ["Build the binary objective of a feature-selection instance", "Read the objective's value off an assignment", "Map the objective to an Ising Hamiltonian for a solver to consume"]
public_apis = ["flagquantum.algorithms.feature_selection"]
runtime_modes = ["local_statevector"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "single_process"
quick_start = "docs/guides/ALGORITHMS.md"
documentation = "docs/guides/ALGORITHMS.md"
level = "experimental"
owner = "Algorithms maintainers"
limitations = "This unit does not solve, and the repository has no annealer: it builds the objective of one feature-selection instance and evaluates that objective at an assignment the caller supplies. Which subset a solver returns, and at what cost, belongs to the solver the problem is handed to, so any advantage such a solver observes is the solver's and this construction carries none of its own -- the QUBO form and the Ising form are a polynomial classical transformation with no advantage of their own. Both scores are the caller's data: this unit defines no relevance measure and no redundancy measure and puts no interpretation on either. The penalty weight is the caller's too, with no default here and no weight at which the target size starts to bind computed or predicted, so a weight small enough against the scores can leave a subset of another size cheapest. Demonstration scale: the instance is a set of feature scores the caller brings, and the objective is an ordinary quadratic binary form whose quadratic terms are the pairwise scores folded together with the size penalty. It certifies no solver, convergence, performance, or hardware behavior, and it selects no runtime."
focused_tests = "tests/unit/test_algorithms_feature_selection.py"
