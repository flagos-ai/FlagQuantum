[capabilities.algorithms_probabilistic_error_cancellation]
title = "Probabilistic error cancellation over a declared Pauli channel"
summary = "Invert a noise channel the model declares exactly, by decomposing its inverse into a signed combination of Pauli words read off the channel's Pauli transfer matrix, and report the mitigated estimate beside the sampling overhead that combination implies."
category = "simulation_and_training"
user_goals = ["Remove the noise a declared Pauli channel contributes to one observable", "Read the sampling overhead the exact inversion implies before sampling anything", "See which declared channels have no finite Pauli inverse and why"]
public_apis = ["flagquantum.algorithms.pec", "flagquantum.algorithms.run_pec", "flagquantum.algorithms.pauli_twirl_decomposition"]
