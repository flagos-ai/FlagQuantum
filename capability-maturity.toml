[capabilities.observables_fermion_operator_algebra]
title = "Fermionic operator algebra and its fermion-to-qubit images"
summary = "Build and combine second-quantised fermionic operators with the canonical anticommutation relations applied at construction, and map a Hermitian operator to the Pauli Observable the existing execution path already measures, through either of two fermion-to-qubit encodings."
