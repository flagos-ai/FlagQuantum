limitations = "The driver covers what the integral engine underneath it covers, so the basis is STO-3G and the elements are H through Ne; there is no basis-set selection, no correlation-consistent basis, and no comparison with a value from one, because that would compare two different Hamiltonians. The Hartree-Fock solve is restricted and closed-shell, so it is a statement about a singlet and nothing else: a multiplicity other than one is refused rather than approximated by a solution of the wrong symmetry, and so is an odd electron count. It starts from the bare core Hamiltonian and converges to the fixed point nearest it, so the energy is stationary in the density and is not proven to be the lowest one; a second solution at a different energy is not searched for. It is undamped and needs a few tens of iterations at the standard geometries, and it fails closed with the largest density change it reached rather than returning an unconverged density. There is no point-group symmetry, no symmetry-adapted orbital, and no tapering of the qubit Hamiltonian, and no spin-orbit or relativistic correction. The frozen core is exact for the active space it defines and not an approximation of the full problem: the frozen orbitals are held doubly occupied, so the energy it gives is the energy of that reduced Hamiltonian. The exact energy is dense diagonalisation of the S_z = 0 sector, so it is available only at or below 1024 determinants and is None above that; a larger molecule still gets a Hamiltonian, an SCF energy, and a Hartree-Fock determinant, and what it does not get is an energy to compare an eigensolver against. That value is the active-space energy, where CUDA-Q's fci_energy comes from PySCF over the full space, so the two agree only when no orbital is frozen and no active space is chosen. Nothing here executes a circuit: the Hamiltonian is returned as an Observable and the energy is a number, and it is the caller who runs a variational ansatz on it."
