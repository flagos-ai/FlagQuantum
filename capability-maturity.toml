[capabilities.stabilizer_code_memory_circuit]
title = "Stabilizer-code memory circuit"
summary = "Declare a stabilizer code record -- directly, by name, or from the parity-check and logical matrices a caller already holds -- and turn it into a memory-experiment source with the detector and observable layouts that experiment implies, for the repetition code, the rotated surface code and the Steane code."
category = "simulation_and_training"
user_goals = ["Declare a stabilizer code with its distance, qubits, checks and logical observables", "Build the circuit source and detection layouts of a memory experiment from a code", "Trace a detection event back to the check and round that produced it", "Read one recorded measurement by the handle that names it rather than by its column index", "Build a code record from the parity-check and logical matrices you already hold, rather than from a code class", "Reach a code record by name, and read its X-type and Z-type ancilla bands and the two matching stabilizer counts rather than only their total"]
public_apis = ["flagquantum.qec.build_memory_circuit", "flagquantum.qec.RepetitionCode", "flagquantum.qec.RotatedSurfaceCode", "flagquantum.qec.SteaneCode", "flagquantum.qec.css_code_matrices", "flagquantum.qec.CssCodeMatrices", "flagquantum.qec.CssCode", "flagquantum.qec.CodeCheck", "flagquantum.qec.Pauli", "flagquantum.qec.MemoryCircuit", "flagquantum.qec.DetectorLayout", "flagquantum.qec.ObservableLayout", "flagquantum.qec.MeasurementRef", "flagquantum.qec.MeasurementSamples", "flagquantum.qec.sample_memory_measurements", "flagquantum.qec.ancilla_bands", "flagquantum.qec.get_code", "flagquantum.qec.code_names", "flagquantum.qec.register_code"]
runtime_modes = ["local_statevector_dynamic_hybrid"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "flagquantum/qec/README.md"
documentation = "flagquantum/qec/IMPLEMENTATION.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "A code-independent declaration layer, not a decoder and not an experiment runner. build_memory_circuit emits bounded hybrid source text plus detector and observable layouts; executing that source is the Runtime's dynamic hybrid path and carries that path's own limits. Three code records exist: the repetition code, the rotated surface code and the Steane code, the last of which is the first record carrying both a Z-type and an X-type logical observable. Each record is reachable by name through get_code, listed by code_names and added with register_code, which checks the protocol members at registration and refuses a duplicate name unless replace is set; the names are repetition, rotated_surface and steane, and the registry is the factory half of upstream's get_code and get_available_codes rather than a plugin boundary. A record declares its ancilla total and also the X-type and Z-type bands, and num_x_stabilizers and num_z_stabilizers beside them, which is the full accessor list upstream's code record carries as pure virtuals; the two bands are derived from the checks by ancilla_bands rather than declared beside them, and the two stabilizer counts read those same bands rather than recounting the checks, because each of the three code classes upstream ships answers the same number to a stabilizer count as to the band count of that basis: the builder refuses a record whose stated counts disagree with the bands its own checks define, so a record cannot report a split that contradicts it, while a flag or idle ancilla measures neither basis and is in neither band, leaving the two bands free not to cover the total. The colour code is not among the records, and it is not a gap: upstream's headers declare no colour code and no concrete code type at all, only the abstract code interface and the three families its own factory names, Steane, repetition and surface, of which this repository now carries one of each. A check states one ancilla and one CNOT direction chosen by the check's type, so a mixed X-and-Z stabilizer is refused; a code needing a second ancilla per stabilizer requires the record to grow first. The readout basis is a field of the record and defaults to the Z one, so one code record can describe two experiments: the basis states which of the code's logical observables the terminal readout measures, and it is checked against the observables the code declares rather than assumed from them, so a code declaring no logical observable in the requested basis is refused rather than measured under premises that do not hold for it. Upstream derives the same basis from the preparation kernel it is handed, where here it is stated on the record, because the Steane code declares a logical observable of each type and the code alone would not say which of the two experiments was built. Upstream's separate x_ and z_ model entry points stay absent deliberately, because a basis is a component of the record here rather than a second way to ask for one thing. Detector counts follow the two check classes, the readout basis' own class contributing rounds + 1 and the other rounds - 1 -- z_checks * (rounds + 1) + x_checks * (rounds - 1) for the default Z basis -- and are validated against the code's checks and the configured rounds, but the validation is membership-based: it does not check that a detector names the same check in every round, that a terminal detector's data qubits are the support of the check it belongs to, or that the emitted source is the program the layouts describe, so a hand-built layout can be semantically wrong while passing every check. A detection event is a parity of recorded measurements, and the record is readable at the level underneath it: MemoryCircuit.measurement_refs is every measurement the experiment records -- one handle per check per round in round-major order, then one per data qubit for the terminal readout -- read off the code and the round count rather than collected from the layouts, and sample_memory_measurements returns those outcomes with MeasurementSamples.outcome, .vector and .integer reading one handle, a chosen sub-vector as booleans in the order asked for, and that same order packed with the first handle least significant. The two sets need not agree in either direction, and the reason the handle layer exists is the direction where the layouts are right to be smaller: round zero of a patch measures the check class its preparation does not stabilize -- an X-type check under the all-zero preparation, a Z-type check under the |+> one -- whose outcome is not deterministic, so no detector may name it, and it is still measured and still readable. A detector's parity recomputed from the handles that detector names equals the detector's parity shot for shot, which the tests assert per detector and per observable rather than assuming. The layer makes no claim about which handles are deterministic, and a test measures the border instead of stating it: a noiseless run reads the readout basis' own check class' ancilla as 0 in every round and the other class' ancilla as unbiased, the two swapping places under an X-basis preparation, and an individual terminal data qubit as unbiased, while every detector and every observable reads 0. A rate read off a single handle is therefore a rate read off the state and not a channel rate, and a detector is a parity and not a measurement. A reading that does not fit is refused rather than approximated: a handle the experiment does not record raises naming the handle, an empty reading raises, a reading addressed by anything but a MeasurementRef raises as a type error, and a record whose tensor is not two-dimensional or whose column count does not match its handle vector raises rather than being truncated. What the layer is not is a kernel annotation form -- detector, detectors and logical_observable as kernel calls are not implemented here, and identity is set in a layout record beside the source rather than in a kernel body the compiler would have to carry into IR. A code also does not have to be declared as a class: a caller holding the four CSS blocks -- hz, hx, lz and lx -- builds a code record out of them, and the data-qubit count, the ancilla total with its two bands, the checks with their CNOT direction, the stabilizers and the logical observables are read off those blocks, so an arbitrary parity-check matrix has a route in without a class for it and a code no class here declares, the nine-qubit Shor code for instance, reaches a memory circuit and a detector error model. Two things about that route are deliberate. Its distance is stated by the caller rather than derived, because a minimum-weight-codeword search is exponential in general and would refuse exactly the large matrices the route exists for, while the one direction a stated logical operator does prove is enforced: an operator of weight w bounds the distance above by w, so a record claiming more than the lightest operator it states is refused and one that understates its distance is accepted. And the blocks are held to the algebra a matrix record normally leaves unchecked: two check blocks that do not commute, a logical operator meeting the opposite basis' checks on an odd number of qubits, a logical operator inside its own checks' span, two dependent rows in one logical block, and a check or logical row with no support are each refused with the row and the reason named, which is a strengthening of the baseline rather than a copy of it. What the route still does not carry is identity: a record built this way is not registered by name, because its identity is the matrix rather than a string, so get_code reaches the declared three and not a matrix-built record. Nor is a code here a map from an operation to the kernel that performs it, which is upstream's shape: a record declares its checks and one source is built from them, so a code carrying its own preparation, measurement or logical-operation kernels would need a second shape, and an arbitrary non-CSS stabilizer list has no route in for the same reason a mixed X-and-Z stabilizer is refused, because the matrices route is CSS-shaped by construction. The rotated surface code's declared logical observable is Z on one data row; which weight-d logical operator a patch uses is a convention, and this record states the one it uses rather than deriving all of them. Agreement with stim's generated rotated-memory circuit is on the declared detector and observable count at distances two through eight and rounds one through four, which fixes the shape and not a mechanism-level correspondence. Execution evidence covers the distance-three patch only, because the dynamic hybrid simulator draws each shot from the full output distribution and a distance-five patch needs 2**49 categories. No decoding, no threshold, no logical-suppression, no fault-tolerance, no real-time and no hardware-feedback claim follows from a declared code, a detector layout, or a syndrome trace."
focused_tests = "tests/qec/test_surface_code.py"
integration_tests = "tests/qec/test_memory_circuit_execution.py"
