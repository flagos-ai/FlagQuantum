[capabilities.detector_error_model]
title = "Detector error model and stim text interchange"
summary = "Build the exact Pauli-noise detector error model of a memory circuit or of a code-capacity CSS record, sample it, and exchange it with stim as text in both directions."
category = "simulation_and_training"
user_goals = ["Build the detector error model a memory circuit defines under phenomenological noise", "Build the model of a code whose parity-check and logical matrices are known, without writing a circuit", "Read a stim detector error model and sample its detection events", "Emit stim text for an external decoder or matcher"]
public_apis = ["flagquantum.qec.DetectorErrorModel", "flagquantum.qec.DemError", "flagquantum.qec.DemMergeRule", "flagquantum.qec.DemSample", "flagquantum.qec.css_code_matrices", "flagquantum.qec.decoder_context_from_memory_circuit", "flagquantum.qec.DecoderContext", "flagquantum.qec.DecoderInputs", "flagquantum.qec.MeasurementMap"]
