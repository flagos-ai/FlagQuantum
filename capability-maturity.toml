limitations = "A construction and a protocol, and nothing about cost, accuracy, or scale. The subnormalisation is the sum of the coefficient magnitudes, stated from the caller's data before any circuit exists, and no matrix is formed to measure a norm: it is at least the spectral norm, so every eigenvalue of the encoded block lies in [-1, 1], but it is deliberately not the Frobenius norm the spectral construction uses and the two are not even ordered -- the Frobenius norm of a Pauli product on n wires is 2 ** (n / 2), so a one-wire sum can have a Frobenius norm above the sum of its magnitudes. The preparation is a dense classical precomputation over 2 ** k amplitudes, exponential in the index-ancilla count k = max(1, ceil(log2 m)), and the select is one multi-controlled Pauli per term, so this is a demonstration-scale encoding and not a gate-efficient synthesis: there is no amplitude amplification, no uniform-preparation trick, and no gate-count claim. The ancilla count is k + max(k - 2, 0) and not one wire per term. The walk identity is subspace-restricted: the construction is exactly block diagonal in the ladder register, but off the ladder-zero subspace it is not the identity there, so the arccosine spectrum with multiplicity two is asserted on the ladder-zero subspace, and the multiplicity is per eigenvector rather than per distinct eigenvalue -- a degenerate sum multiplies it, measured at 8 and 4 on two all-identity sums. The flagged block is read back at the emitted circuit's gate precision, so the measured residual against the exact sum is of order 1e-08 rather than machine epsilon, and that is precision and not approximation in the construction. A complex coefficient is refused by name rather than reduced to its real part, because the preparation primitive carries no relative phase and the sum would not be the operator the caller named. A coefficient that requires a gradient is read as the number it holds, so no gradient flows from the circuit back to the coefficients. No alpha parameter exists, because the factor is determined by the data and a caller who wants a larger subnormalisation scales the Hamiltonian. An all-identity term is carried here, where the Trotter module must refuse one, because the term only contributes to the factor and to the identity block. Two divergences from CUDA-Q are inherited from the protocol rather than chosen here: the flagged block is +H / alpha where CUDA-Q's qubitization folds the sign of H into the walk, and the flag register and the operator's wires are separate arguments because FlagQuantum addresses qubits individually. No Stable Core export follows from this entry."
