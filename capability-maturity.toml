[capabilities.algorithms_block_encoding]
title = "Block encoding of a Hermitian matrix, and its qubitization walk step"
summary = "Encode a Hermitian matrix into the flagged block of a unitary at a subnormalisation the caller chooses, and append one qubitization walk step whose eigenphases are the arccosines of the encoded eigenvalues."
category = "simulation_and_training"
user_goals = ["Encode a Hermitian matrix into the flagged block of a unitary at a chosen subnormalisation", "Read the block back out of the circuit and check it against the matrix over that factor", "Append one qubitization walk step, or its adjoint, whose eigenphases carry the encoded spectrum", "Write a consumer against the block-encoding protocol rather than against one construction"]
public_apis = ["flagquantum.algorithms.primitives.block_encoding", "flagquantum.algorithms.primitives.BlockEncoding", "flagquantum.algorithms.primitives.WalkEncoding", "flagquantum.algorithms.primitives.SpectralBlockEncoding", "flagquantum.algorithms.primitives.spectral_block_encoding", "flagquantum.algorithms.primitives.subnormalisation"]
runtime_modes = ["local_statevector"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "single_device_fast_path"
quick_start = "examples/algorithms/block_encoding.py"
documentation = "docs/guides/ALGORITHMS.md"
level = "development_evidence"
owner = "Algorithms maintainers"
limitations = "A construction and a protocol, and nothing about cost, accuracy, or scale. The construction is the direct spectral reflection U = [[A, sqrt(I - A**2)], [sqrt(I - A**2), -A]] with A = H / alpha, emitted as one dense matrix on n + 1 qubits and built from torch.linalg.eigh of the input; the cost is therefore diagonalising the caller's matrix, and there is no gate-efficient synthesis, no block encoding of a matrix whose dimension is not a power of two, and no sparsity or structure the construction exploits. No error bound is reported, because the construction is exact for a matrix that is exactly Hermitian and an approximate H is the caller's error rather than one this unit estimates. One implementation ships (the spectral one) and one flag wire is used; two protocols are the surface consumers are written against rather than a built family, and a Pauli linear-combination encoding -- whose preparation is a superposition over coefficients rather than the identity, and which needs a multi-wire flag reflection -- is a second implementation behind the same two protocols and is recorded as its own capability rather than left implicit here. The matrix is detached onto the CPU before anything else happens, so no gradient flows from a circuit back to the entries that produced it: this is a classical precomputation over a matrix the caller has already formed, and the module says so rather than leaving it to be discovered. Two divergences from CUDA-Q are deliberate and stated: the flagged block here is +H / alpha, where CUDA-Q's qubitization folds the sign of H into the walk and carries -H / alpha in the block, and the flag ancilla and the operator's qubits are separate arguments here because FlagQuantum addresses qubits individually rather than through a combined register; neither changes what the walk step computes, and the walk identity is asserted for the block this unit emits. The step is asserted twice: as the equality of spectra that is its content, and as the matrix identity W = Z_ancilla U that is its definition, because a spectrum alone does not pin a step -- this construction's step is Hermitian, so it is its own adjoint and its own encoding is a Hermitian unitary on the same register, and only the composed matrix witnesses that the flip is emitted at all. Eleven refusals are deliberate and each is taken before any gate is appended, so a rejected call leaves an empty circuit rather than a half-built encoding: a non-tensor, a non-square, a non-power-of-two, a non-floating-point, a non-finite, a non-Hermitian matrix, the zero matrix, a factor below the spectral norm, a non-positive factor, a non-real factor, and a register that repeats a qubit, has the wrong width, or contains the flag wire. The eigendecomposition is dense double precision and the tolerance of 1e-6 covers the digits sqrt(1 - w**2) loses as w approaches one; a complex Hermitian matrix is accepted and its reflection is complex. The walk step is exposed as two protocol methods rather than as a public walk object holding a moment count, and QSVT and double factorization -- the algorithms the walk step exists to serve -- are absent. This is a circuit constructor: it appends to an ordinary Circuit and adds no target, runtime option, result field, or execution mode, makes no performance, capacity, convergence, or hardware claim, and no Stable Core export follows from this entry."
focused_tests = "tests/unit/test_algorithms_block_encoding.py"
integration_tests = "tests/test_algorithm_examples.py"
development_artifact = "flagquantum/algorithms/primitives/README.md"

