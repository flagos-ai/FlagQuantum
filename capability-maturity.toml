[[capabilities.sharded_mps_training.performance_claims]]
id = "mps-capacity-131072-chi768-20260806"
title = "Sharded MPS exact-workload capacity"
artifact = "benchmarks/results/local/mps_capacity_131072q_chi768_16xa800_repeat_complete_20260806.json"
artifact_sha256 = "efb0d34c741d1196a7f7c89404cbf033c655f14bf5d575470bbe605bb93b0cbc"
code_version = "9d56a6ecd78b06f11b9ee6e8aadcbe9644f2c708"
maturity = "development_evidence"
scope = "One batch-one, complex64, χ768 MPS training step for the checked-in all-rank and all-boundary workload. This is not arbitrary statevector capacity, fixed-plan strong scaling, or release evidence."
environment_limitations = "The artifact records rank count, per-rank device memory, topology fingerprint, and CUDA allocator policy. It does not record the exact GPU model or Python, PyTorch, CUDA, NCCL, driver, host, and operating-system versions, so the claim is restricted to the recorded environment fields."

