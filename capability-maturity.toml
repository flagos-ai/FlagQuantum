level = "development_evidence"
owner = "QEC maintainers"
limitations = "One decoder over one detector error model at a time, on the CPU, with no threshold, no logical-suppression, no real-time and no performance claim, and no batching. The factor graph is the model as written and not a projection of it: a mechanism is one variable, a detector is one check, a mechanism touching three detectors joins three checks, and a mechanism of rate zero is refused rather than given a finite edge, because its log-likelihood ratio is not a number and a mechanism no shot can select is not evidence. The prior of a variable is the log-likelihood ratio log((1 - p) / p) of that mechanism's own rate, and not a marginal or a folded group rate. The exchange is sum-product in the log domain with each check's own syndrome bit in the update, so a check answers the complement of what it would answer with the bit left out, and the message a check sends a variable excludes that variable's own report, which is what separates the check's evidence about the variable from what the variable already said. A run that reaches an iterate whose hard decision explains the syndrome returns it and reports converged, and the empty syndrome is answered from the priors alone before any message is sent, with an iteration count of zero. Off a tree the exchange is approximate and this is stated rather than hidden: a model whose factor graph has cycles can settle on an explanation that flips the syndrome and is heavier than the cheapest one, so a caller who needs the cheapest explanation on a graphlike model wants the matcher and a caller who needs a mechanism of three detectors read needs this decoder and a heavier correction than the minimum. A syndrome that no set of mechanisms can produce is refused by name, because the mechanisms span a subspace of the detector space and a syndrome outside it did not come from this model; returning the least-bad set would be a correction that does not explain what it was asked about. A model that states its mechanisms are alternatives is refused for the neighbouring reason the matcher refuses one: the exchange weighs each variable as an independent fault, while a group of alternatives is one fault whose members cannot fire together, so reading the group as independent would invent shots in which two of its members both fired. When the exchange does not settle, the fallback orders the mechanisms by their posterior belief, takes a greedily chosen independent set of their columns as the information set, solves the reduced system over it, fixes every other mechanism at its belief decision, and refuses an inconsistent residual rather than returning a set that does not explain the syndrome; a caller who needs the exchange's own answer rather than a solve can turn the fallback off, and then an unsettled run is refused instead. The result record is the decoder's own and deliberately not the baseline's DecoderResult: it carries the convergence flag, the selected mechanisms, the logical observables they flip, the total weight and the iteration count, and it has no batch form, no async form and no optional-results channel, so a caller who needs the baseline's batch record is not served here. The decoder does not implement the sliding window, which needs the chunk seams the baseline expresses as DemChunkSpec with a window size, a step size and a per-round error-rate vector, so a long-lived experiment whose syndrome history exceeds one shot is outside this capability. It reads one model and does not sample: no logical-error-rate estimator, no threshold scan, no decoder configuration record and no consumer of the observables beyond the caller."
focused_tests = "tests/qec/test_belief_propagation.py"
integration_tests = "tests/qec/test_belief_propagation.py"
development_artifact = "flagquantum/qec/IMPLEMENTATION.md"

[capabilities.detector_error_model_chunking]
title = "Round-window decomposition of a detector error model"
summary = "Cut a detector error model into windows that each cover a few detector layers and share one boundary layer with the next, name each window's boundary seams, and stitch or close the windows back into the model they were cut from."
category = "simulation_and_training"
user_goals = ["Cut a detector error model into windows that each cover a few detector rounds", "Read which detector rows a window shares with its neighbours", "Rejoin the windows and recover the model exactly", "Tell whether a window size tiles the rounds the model has"]
public_apis = ["flagquantum.qec.SeamId", "flagquantum.qec.PhaseId", "flagquantum.qec.DemSeam", "flagquantum.qec.ChunkLayout", "flagquantum.qec.DemChunk", "flagquantum.qec.DemChunkSpec", "flagquantum.qec.DemChunksSpec", "flagquantum.qec.dem_chunk_from_spec", "flagquantum.qec.dem_chunks_from_spec", "flagquantum.qec.dem_stitch", "flagquantum.qec.dem_stitch_all", "flagquantum.qec.dem_stitch_merged", "flagquantum.qec.dem_close", "flagquantum.qec.dem_close_all"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "flagquantum/qec/IMPLEMENTATION.md"
documentation = "flagquantum/qec/IMPLEMENTATION.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "One model at a time, cut in memory on the CPU, with no decoder, no threshold, no streaming and no performance or memory claim. This is the substrate a sliding-window decoder slides over and not that decoder: nothing here decodes, and a window's matrices are deliberately not produced, so a caller who wants one window's detector matrix takes the whole model's through flagquantum.qec.dem_close_all first and projects it with the model's own detector_error_matrix. What a window is, is fixed by the model rather than chosen by the caller. A layer is the set of detectors with one round index, so the layer widths are the round sizes in detector order and their sum is the model's detector count; the layout that states them is read off a memory circuit by ChunkLayout.from_memory_circuit, which is also where the numbering is pinned: a terminal detector, whose parity references the terminal data readout and no round, is placed in the last layer rather than given a round of its own, and a numbering that reaches a layer after skipping one is refused rather than closed up, because renumbering the rounds after a missing one would silently move every window that follows it. A window is a contiguous run of layers and its bands are fixed rather than configurable: the leading boundary layer of its predecessor, its own interior, and the trailing boundary layer its successor shares, so a window of w layers spans w - 2 interior layers and the two end windows of a decomposition span one layer fewer than a middle one. The stride is fixed at the window width minus one, which is what makes the windows share exactly one layer each and therefore tile: a caller who wants to advance by less reads overlapping windows and simply does not stitch them. A window of one layer, a window wider than the layout, and a layer count that does not tile into windows at that stride are all refused with the layer count named, so a decomposition is a statement the caller can check rather than a best effort. Ownership makes the windows a partition rather than a cover. A mechanism spans exactly two adjacent layers, because a fault is placed at one location and flips that round's detectors and the round before's, and a mechanism whose detectors lie inside one layer does not exist here; so the first window that contains a mechanism whole owns it, every mechanism is owned exactly once, and the windows are disjoint in what they hold. A mechanism that no window contains whole is refused and never split, because splitting it would state two weaker faults where the model stated one; a mechanism that flips no detector is refused because an observable-only fault has no round to be placed in and choosing one would be inventing placement. Two operations follow from the fixed bands. A stitch contracts the shared layer of two adjacent windows and lays it out once, between their interiors, which is why the result spans one layer fewer than the sum of its parts; a close lays every window of a decomposition out at its own place in the model's own numbering, so a close of a decomposition is the model again and the two round trips are asserted as equalities in tests/qec/test_dem_chunks.py rather than assumed. A seam here is identified by its name text rather than by a hash of one, which is a deliberate difference from the baseline and is recorded in the alignment checklist: there is no name registry for a diagnostic to consult and no hash that can collide. A seam's rows carry the global detector index, not a position within the seam, so a stitch refuses two bands that merely have the same width and compares identities instead. A chunk may name only the two standard boundary seams, at most once each, ordered by row, with the leading band starting at local row zero and the trailing band ending at the last local row and the bands not overlapping; a stitch additionally refuses a non-adjacent pair, an observable count that differs between the two sides, a boundary either side does not carry, and a close of a sequence refuses a window count or an observable count that disagrees window by window. dem_stitch_merged is the stitch followed by the model's own merge under a stated rule, which is the only place in this capability where a probability is combined, and a close does not merge: closing a decomposition gives back the model it was cut from, duplicates and all. The spec layer is linear and not a phase graph. init, bulk and final label a window's position, and a single-window decomposition is bulk alone; a window carries no prev_round seam when no layer precedes it and no next_round seam when none follows, so an init window's leading edge and a final window's trailing edge are the cut rather than a seam. A caller may state a decomposition's phases directly instead of taking the derived sequence. The baseline's sparse spec shorthand and its separate matrix per seam have no form here because a chunk is cut from a model whose rows are already laid out in layers, so there is nothing to expand against a round count supplied at expansion time; and the baseline's per-seam tags, its straddle flags and its dem_chunks_to_d_sparse / dem_chunks_to_o_sparse / dem_chunks_to_pcm projections are absent, the projections because they are the input shape of the sliding-window decoder and land with it. Nothing here samples, nothing here decodes, and no window is offered as a smaller model a decoder may be run on in place of the whole: a window carries its boundary seams precisely because its own arithmetic at a shared layer is incomplete without its neighbour."
focused_tests = "tests/qec/test_dem_chunks.py"
integration_tests = "tests/qec/test_dem_chunks.py"
development_artifact = "flagquantum/qec/IMPLEMENTATION.md"

[capabilities.qec_memory_circuit_sampling]
title = "Sampled detection events from a memory circuit"
summary = "Sample a memory experiment's detection events and observable flips from the circuit itself under a phenomenological noise record or a gate-bound noise model, so a decoding claim has a route that does not depend on the statevector ceiling."
category = "simulation_and_training"
user_goals = ["Sample detection events from a noisy memory experiment", "Reproduce a sampling run from a seed", "Decode a sampled syndrome with the model built from the same circuit", "Read one recorded measurement of a sampled run by the handle that names it", "Bind a noise channel to a gate the program executes and sample that fault"]
public_apis = ["flagquantum.qec.sample_memory_circuit", "flagquantum.qec.sample_memory_measurements", "flagquantum.qec.MeasurementSamples", "flagquantum.qec.MeasurementRef", "flagquantum.simulation.stabilizer.sample_noisy_measurements"]
runtime_modes = ["stabilizer"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "flagquantum/qec/README.md"
documentation = "flagquantum/qec/README.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "One experiment shape and two noise grammars, selected by the record the caller states rather than by a second entry point. The circuit must be a MemoryCircuit, so the sampler is reachable from a code record and not from an arbitrary annotated circuit. A PhenomenologicalNoise states round boundaries, so a data fault opens a round and a measurement flip corrupts a check's readout, and each of those locations can be given its own rate through the record's per-qubit and per-check vectors, so a quiet qubit between two noisy ones is sampled as stated. A NoiseModel states gates, so a rule's fault follows the gate its rule matched and is placed in every round that gate appears in, which is one location per ruled gate rather than one per round boundary; a rule whose gate the program does not carry places nothing, because a record stated over a gate set says nothing about a gate outside it. All three Pauli data families are placed on both grammars, the Z and Y ones as the engine's single bit-flip channel conjugated by h or by sdg/s at a round boundary and by h,x,h after a named gate, which is one draw at that family's rate rather than a pair of independent bit flips, so a family the conjugation could not express would be refused rather than sampled as a nearby Pauli. A depolarizing or damping channel still has no location on either grammar, because a mixture is not one Pauli fault; a gate-bound rule naming a readout or a preparation, a one-qubit channel bound to two wires, and a fault that would follow the program's last instruction are each refused by name; and the per-check vector is resolved against the code's check count before any placement is derived, so a profile that names the wrong number of checks is refused rather than silently read against the wrong one. Placement is derived from the lowered program rather than written into the experiment, because the bounded hybrid capture refuses a channel call in the source; the derivation requires the program to lower to the experiment's own readout rotation around `rounds` identical round blocks that measure every check once in the code's declared check order, and refuses a program that does not, so an experiment whose round structure differs is declined rather than sampled. The sampler executes on the stabilizer engine, so it requires the optional `stim` distribution and inherits the engine's opcode set: exactly the thirteen Clifford opcodes, with a non-Clifford gate refused by name. It reads the record's readout basis, so an experiment prepared and read out in |+> is sampled here as directly as a Z-basis one: the basis contributes one rotation instruction per data qubit at each end of the lowered program, and the plan states that offset beside the round block rather than folding the two together, because the rotation belongs to the experiment and not to a round. Sampling is not differentiable and returns no gradients. Two entry points read one run: sample_memory_circuit returns the detection events and observable flips as a DemSample, and sample_memory_measurements returns the recorded measurements as a MeasurementSamples whose handle vector is the MemoryCircuit's measurement_refs, so a caller can read a bit that no detector names. A handle is addressed as a MeasurementRef rather than by column index, and reading one is refused with the handle named when the experiment does not record it, so the two entry points cannot disagree about which column is which. measurement_refs covers every measurement the experiment records rather than only the subset the layouts name, which is the wider set: round zero of a patch measures the check class its preparation does not stabilize, which is not deterministic, so no detector may name it and it is still readable. The measurements entry point therefore makes no claim that a handle is deterministic, and a noiseless run reads the check class its preparation does not stabilize as unbiased and an individual terminal data qubit as unbiased while every detector and observable reads 0, so a rate read off a single handle is a rate read off the state rather than a channel rate. The result is a DemSample like the model's own sampler returns, and the two are deliberately different code paths: the model derives a mechanism's signature from the source while this sampler derives its instruction position from the lowered program, and the tests pin the two to each other rather than having one call the other. A seed reproduces a run on one engine version and one machine instruction set; it does not pin a bit pattern across machines or engine versions. No threshold, no logical-suppression, no fault-tolerance, no real-time and no performance claim follows. The rate this sampler reports is a circuit-sampled rate, and the model's own sampler reports a DEM-sampled one; neither may be reported as the other."
focused_tests = "tests/qec/test_sampling_memory_circuit.py"
integration_tests = "tests/qec/test_sampling_memory_circuit.py"
development_artifact = "flagquantum/qec/sampling.py"

