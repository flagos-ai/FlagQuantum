[capabilities.algorithms_qarm]
title = "Frequent-item fractions by amplitude estimation"
summary = "Estimate the fraction of a binary incidence matrix's items whose support meets a threshold, with a support register the circuit fills one controlled increment per transaction-item membership."
category = "simulation_and_training"
user_goals = ["Estimate the fraction of a database's items whose support meets a threshold", "Read that fraction off an amplitude estimation counting register", "Compare the estimate against an enumerated frequent fraction"]
public_apis = ["flagquantum.algorithms.qarm"]
runtime_modes = ["local_statevector"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "single_process"
quick_start = "docs/guides/ALGORITHMS.md"
documentation = "docs/guides/ALGORITHMS.md"
level = "experimental"
owner = "Algorithms maintainers"
limitations = "The advantage premise is coherent entry-wise database access, and this unit does not meet it. The cited paper's speed-up is measured in calls to an oracle that returns one database entry per call, and it reaches the candidate itemset superpositions it prepares through a qRAM; neither is exercised here: the transactions are iterated over classically, one controlled increment of the support register per transaction-item membership, emitted from the incidence matrix as Python reads it, so the access cost is paid explicitly rather than assumed away and no end-to-end advantage follows. The improvement the paper claims is quadratic in the number of database queries and is stated conditionally, for the case M_f^(k) << M_c^(k); it is not exponential, and that wording appears only in an earlier arXiv listing of the same work. The support register must be wide enough to hold the largest support any database of that transaction count could produce: the increment is a permutation of the register's own values, so a narrower register wraps a support into another value and the readout can come back wrong with nothing raised, and a width that cannot hold every support is therefore refused rather than left to wrap. The item register is addressed by one wire per item-index bit, so the item count is a power of two. Demonstration scale: at most eight items and seven transactions, and the marking operator enumerates the support values at or above the threshold. It makes no performance, convergence, or hardware claim."
focused_tests = "tests/unit/test_algorithms_qarm.py"

[capabilities.algorithms_singular_values]
title = "Singular values by phase estimation over the Hermitian embedding"
summary = "Estimate a matrix's singular values from the phase of the Hermitian matrix that carries it as its off-diagonal block, with a private block encoding of that embedding under a stated subnormalisation."
category = "simulation_and_training"
user_goals = ["Estimate a matrix's singular values from a counting register", "Read one singular value off the register's mode", "Compare a read-out value against the matrix's own decomposition"]
public_apis = ["flagquantum.algorithms.svd"]
runtime_modes = ["local_statevector"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "single_process"
quick_start = "docs/guides/ALGORITHMS.md"
documentation = "docs/guides/ALGORITHMS.md"
level = "experimental"
owner = "Algorithms maintainers"
limitations = "The advantage premise is the input model, and this unit does not meet it. The cited algorithm's cost is counted in queries to a structure that returns the matrix's entries, and against that count the state the estimation is applied to is assumed to be preparable; neither is present here. The matrix is held as an ordinary tensor, its embedding is formed and exponentiated as a dense matrix, and the input state is built from the singular vectors a classical torch.linalg.svd returns -- the very decomposition the readout estimates -- so the access and the preparation are paid explicitly rather than assumed away and no end-to-end advantage follows. Dequantization is recorded rather than glossed over: Tang's classical algorithm for the recommendation problem removes the exponential speed-up and is only polynomially slower, its bound containing eps**-12, which the author calls a large slowdown in some exponents; it is not a classical algorithm that matches the quantum runtime. Arrazola et al. record the practical conditions the dequantized algorithms need, and Gharibian-Le Gall dequantize the quantum singular value transformation for sparse matrices at constant precision; their hardness result is for a different task, estimating a local Hamiltonian's ground-state energy at inverse-polynomial precision given a state close to the ground state. The block encoding is not free to read: a readout that post-selects the ancilla succeeds with probability ||(A/alpha)|psi>||**2 on a normalised input, whose greatest value over inputs is (||A||/alpha)**2, and where alpha is much larger than ||A|| that probability is exponentially small. The readout is the counting register's mode, and the unit does not claim that the mode's value is the largest singular value: the readout is a grid value at the register's own resolution, and within() is the whole of the accuracy contract. The counting width is the caller's and is at least one; at one wire the register can only return alpha itself, and a run whose mode falls in the register's lower half is refused rather than returning a value above alpha -- an outcome of the sample rather than a precondition on the arguments. The input state is prepared from the singular vectors, so the classical work includes the very decomposition the unit estimates. Demonstration scale: at most four rows and four columns, with the embedding, its exponential and the state preparation all classical. It makes no performance, convergence, or hardware claim."
focused_tests = "tests/unit/test_algorithms_svd.py"

[capabilities.algorithms_zero_noise_extrapolation]
title = "Zero-noise extrapolation over scaled noise models"
summary = "Measure an observable at several error strengths by scaling the one parameter each noise channel declares, continue the curve to zero noise by polynomial least squares or Richardson extrapolation, and report the residual and the variance amplification that qualify the estimate."
category = "simulation_and_training"
user_goals = ["Extrapolate an observable to zero noise from a model whose gate error strengths can be scaled", "Read the residual and the variance amplification that qualify the estimate", "Compare the unmitigated measurement against the mitigated estimate"]
public_apis = ["flagquantum.algorithms.error_mitigation", "flagquantum.algorithms.run_zne", "flagquantum.algorithms.scale_noise_model"]
runtime_modes = ["density_matrix"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_device_fast_path"
quick_start = "examples/algorithms/error_mitigation.py"
documentation = "docs/guides/ALGORITHMS.md"
level = "development_evidence"
owner = "Algorithms maintainers"
limitations = "Zero-noise extrapolation over exactly simulated state expectations. Noise is scaled by multiplying the single error-probability parameter a channel declares, so bit_flip, phase_flip, depolarizing, two_qubit_depolarizing, amplitude_damping and phase_damping are scalable, while coherent_overrotation, reset_error and thermal_relaxation are refused by name: multiplying an angle or two independent reset probabilities does not scale the noise, and thermal_relaxation's factory does not take its duration as one leading parameter. A caller who needs another scaling supplies a callable and owns the claim that the scaled model differs from the original only in noise strength, and the result records which of the two claims it rests on. The estimated quantity is the exact expectation Tr(O rho) of each scaled model, so no shot is consumed, no confidence interval is reported, and the estimate carries no measured uncertainty. variance_amplification is the factor by which the fitted weights would amplify the variance of a shot-based estimate of the same points; it is a property of the scale grid and the degree alone, and it is not a measured variance. A model that declares a readout rule is refused rather than measured without it, because classical readout confusion is applied after measurement and is not part of rho: extrapolating a curve that omits it would return a state-preparation estimate under the name of a measured one, and readout-error mitigation is absent. Probabilistic error cancellation, Clifford data regression, circuit folding and gate-folding scale factors are absent. The method's one assumption is that the measured curve is a polynomial of degree at most the fit order in the scale factor; nothing checks it and it is not checkable from the measurements alone. The diagnostic that exposes a violated assumption is the largest absolute residual the fit left. At one cx gate with depolarizing noise at 0.05, the four-point curve at scale factors 1, 3, 5 and 7 leaves 1.8e-2 at degree one and 4.2e-9 at degree two, while a coherent over-rotation over the same scale factors leaves 8.9e-2 at degree one and 2.9e-2 at degree two and its estimate stays 1.1e-1 away from the noiseless value, so a non-polynomial family is visible in the residual rather than silently extrapolated. A square fit's residual is zero by construction and is therefore not evidence, which the record enforces by reporting max_residual as absent when no degree of freedom is left rather than as an arithmetic zero. The observable must be a single number, so the circuit's batch size is one, and the channel parameters keep the runtime's precision, so against the analytic value 1.0 a single-precision run recovers it to 1.3e-7 where a double-precision run reaches 3.0e-9; the exactly simulated noiseless read that a comparison is usually taken against is itself 6.0e-8 away from that analytic value at the default precision, so a distance measured against it is dominated by that offset rather than by the extrapolation's error, and every distance recorded here names the precision and the reference it is measured from. Demonstration scale: two-qubit circuits on the CPU density-matrix path, with at most seven scale factors and a fitted degree in the low single digits. No performance, scaling, hardware or fault-tolerance claim follows from it."
focused_tests = "tests/unit/test_error_mitigation.py"
integration_tests = "tests/test_error_mitigation.py"
development_artifact = "flagquantum/algorithms/README.md"

[capabilities.stabilizer_sampling]
title = "Clifford circuit sampling by Pauli stabilizer tracking"
summary = "Sample computational-basis outcomes from a Clifford circuit whose wire count puts a dense amplitude store out of reach."
category = "simulation_and_training"
user_goals = ["Sample a wide Clifford circuit that has no representable amplitude store", "Reproduce a sampling run from a seed", "Measure a chosen subset of wires in a chosen output order"]
public_apis = ["flagquantum.simulation.stabilizer.require_clifford_program", "flagquantum.simulation.stabilizer.sample_stabilizer", "flagquantum.simulation.stabilizer.sample_noisy_measurements"]
runtime_modes = ["stabilizer"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_device_fast_path"
quick_start = "examples/stabilizer_sampling.py"
documentation = "flagquantum/simulation/stabilizer/README.md"
level = "development_evidence"
owner = "simulation maintainers"
limitations = "Requires the optional `stim` distribution (Apache-2.0), installed with `pip install 'flagquantum[stim]'`; without it the entry point raises StabilizerDependencyError naming that command rather than falling back to an amplitude path. Accepted gates are exactly the thirteen Clifford opcodes in flagquantum.core.operator_schema -- i, x, y, z, h, s, sdg, sx, sxdg, cx, cy, cz, swap -- and every other opcode is refused with a CapabilityError naming it and the accepted set. ccx and cswap are refused because neither normalizes the Pauli group, so they are not Clifford gates despite being permutations; t, tdg, the rotation and controlled-rotation family, phase, u1, u2 and u3 are refused for the same reason. Circuits passed to sample_stabilizer must be noiseless: the four noise channels are refused rather than sampled as unitaries, so no readout error, depolarizing, damping or trajectory behavior is available. The second entry point, sample_noisy_measurements, is the narrow exception, and it is not a widening of that refusal: it executes a bit-flip channel at an explicit position a caller has already chosen, so the frame tracking is the caller's placement and not an inference the engine makes, and a channel whose Kraus operators are not the two-element bit-flip pair is still refused by name. It reads no lowered measurement node, returns only the sampled bits with no detection events or observable flips, and is not reachable from the planner or the executor, so `mode='stabilizer'` keeps refusing a noisy program. Only computational-basis measurement sampling is supported; expectation values, detector error models, decoding, error-corrected logical operations and hardware-backed sampling are absent. Sampling is not differentiable and returns no gradients. The execution route is explicit: `fq.ExecutionOptions(mode='stabilizer')` reaches the engine through `fq.run`, the planner publishes a plan whose `state_mode` is `stabilizer` and whose `state_bytes` is the packed tableau rather than an amplitude count, and the result reports `execution_path='local_stabilizer'`. Automatic selection never chooses this mode, so no existing plan changes meaning. Planning refuses a non-Clifford gate, a noise channel, a batch, a non-CPU device, a gradient request, a non-sampling target, a sharded world size and a program without shots; sampling refuses a lowered request it cannot reconcile with its own arguments and postselection, and a memory limit below the tableau. None of those refusals is a fallback, and none of them is a scalability claim. Runs are CPU-only single-device work with no GPU or distributed sharding. A seed reproduces a run on one engine version and one machine instruction set; it does not pin a bit pattern across machines or engine versions. The capacity statement is representational -- memory grows with the wire count squared rather than exponentially -- and no throughput, latency or scaling claim is made."
focused_tests = "tests/unit/test_stabilizer_execution_mode.py"
integration_tests = "tests/integration/test_stabilizer_execution_mode.py"
development_artifact = "flagquantum/simulation/stabilizer"
