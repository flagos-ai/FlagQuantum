[capabilities.noisy_simulation]
title = "Exact and trajectory-based noisy simulation"
summary = "Write a channel into a circuit or lower a validated Kraus noise model into FlagQuantum IR, then execute exact density-matrix or MPS quantum-trajectory paths."
category = "simulation_and_training"
user_goals = ["Validate small noisy circuits exactly", "Write a channel directly in a circuit", "Evaluate low-entanglement noisy circuits with MPS trajectories", "Resume reproducible trajectory ensembles"]
public_apis = ["flagquantum.noise.NoiseModel", "flagquantum.noise.channel_from_parameters", "flagquantum.noise.noisy_density_matrix", "flagquantum.runtime.run_noisy_mps", "flagquantum.runtime.run_noisy_statevector"]
runtime_modes = ["density_matrix", "noisy_mps"]
hardware = ["cpu", "single_gpu"]
gradient_support = "unsupported"
distribution_semantics = "single_device_fast_path_or_rank_local_trajectory_partition"
quick_start = "examples/noisy_simulation_v1.py"
documentation = "docs/guides/NOISY_SIMULATION.md"
level = "experimental"
owner = "noise runtime maintainers"
limitations = "Validated Markovian Kraus channels, timestamped DeviceNoiseProfile input, ASAP gate/idle thermal lowering, classical readout confusion, exact density execution, and reproducible MPS trajectories with single-rank adaptive stopping are available. Four channel opcodes (bit_flip, phase_flip, depolarizing, amplitude_damping) declare the scalar their factory takes, so they can be written directly into a circuit as well as attached to a gate through a NoiseModel rule; the two routes lower to the same instruction, and a program is planned as noisy because it carries a channel, not because a model was passed. That same reading of the program decides the trajectory representation under mode='auto' and restores it from a saved plan, so an inline channel and an equivalent NoiseModel rule select the same route. A representation that holds amplitudes -- mps, tensor_network, and statevector -- refuses a channel instead of returning the noiseless number, and mode='stabilizer' names its own obstacle. A channel instruction's matrix field is the Kraus tuple, so consumers read it as a sequence rather than as one tensor. Only those four opcodes are reachable by name: the remaining flagquantum.noise callables, including thermal relaxation, readout error, and coherent overrotation, are NoiseModel rules only. Channel parameters are bound real scalars; a trainable channel probability has no gradient path. Lowering refuses a rule naming a qubit outside the program width and refuses a model whose rules match no instruction at all, so a misspelled gate name cannot yield a clean result; a model that matches some instructions stays legal. Pulse overlap, crosstalk, leakage, provider calibration adapters, distributed adaptive stopping, batched statevector trajectories, production multi-GPU scheduling, and noisy gradients remain unsupported. Multi-qubit MPS channels use an explicitly dense correctness fallback."
focused_tests = "tests/unit/test_channel_instruction_parameters.py"
integration_tests = "tests/test_noise.py"

