level = "development_evidence"
owner = "Algorithms maintainers"
limitations = "Zero-noise extrapolation over exactly simulated state expectations. Noise is scaled by multiplying the single error-probability parameter a channel declares, so bit_flip, phase_flip, depolarizing, two_qubit_depolarizing, amplitude_damping and phase_damping are scalable, while coherent_overrotation, reset_error and thermal_relaxation are refused by name: multiplying an angle or two independent reset probabilities does not scale the noise, and thermal_relaxation's factory does not take its duration as one leading parameter. A caller who needs another scaling supplies a callable and owns the claim that the scaled model differs from the original only in noise strength, and the result records which of the two claims it rests on. The estimated quantity is the exact expectation Tr(O rho) of each scaled model, so no shot is consumed, no confidence interval is reported, and the estimate carries no measured uncertainty. variance_amplification is the factor by which the fitted weights would amplify the variance of a shot-based estimate of the same points; it is a property of the scale grid and the degree alone, and it is not a measured variance. A model that declares a readout rule is refused rather than measured without it, because classical readout confusion is applied after measurement and is not part of rho: extrapolating a curve that omits it would return a state-preparation estimate under the name of a measured one. Readout-error mitigation is a separate unit beside this one rather than a mode of it: flagquantum.algorithms.plan_readout_mitigation inverts a declared classical confusion on a measured vector, after measurement, which is the other side of the same boundary. Probabilistic error cancellation is provided beside it by flagquantum.algorithms.run_pec, which inverts a declared Pauli channel exactly rather than measuring it at several error strengths, and Clifford data regression is provided beside it by flagquantum.algorithms.run_cdr, which fits the noise's effect on near-Clifford training circuits, and gate and circuit folding is provided beside it by flagquantum.algorithms.fold_program and this unit's own fold argument, which lengthen the program by an exact identity so that the noise its instructions carry runs more times. That third alternative is a different unit of scale rather than another scaling: a fold reports the length ratio it realized rather than a channel parameter, the realized ratio is the abscissa this fit is given rather than the requested factor, and a call naming both a fold and a scaling callable is refused because the product of a length ratio and a channel parameter names neither. A fold needs no noise model at all, so a folded run is admitted on a program whose channels cannot be scaled; what it assumes instead is that repeating an instruction repeats that instruction's error and changes no other instruction's error, and what it does not supply is any estimate of the noise it amplified. The method's one assumption is that the measured curve is a polynomial of degree at most the fit order in the scale factor; nothing checks it and it is not checkable from the measurements alone. The diagnostic that exposes a violated assumption is the largest absolute residual the fit left. At one cx gate with depolarizing noise at 0.05, the four-point curve at scale factors 1, 3, 5 and 7 leaves 1.8e-2 at degree one and 4.2e-9 at degree two, while a coherent over-rotation over the same scale factors leaves 8.9e-2 at degree one and 2.9e-2 at degree two and its estimate stays 1.1e-1 away from the noiseless value, so a non-polynomial family is visible in the residual rather than silently extrapolated. A square fit's residual is zero by construction and is therefore not evidence, which the record enforces by reporting max_residual as absent when no degree of freedom is left rather than as an arithmetic zero. The observable must be a single number, so the circuit's batch size is one, and the channel parameter