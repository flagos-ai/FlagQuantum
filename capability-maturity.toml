hardware = ["provider_dependent"]
gradient_support = "not_applicable"
distribution_semantics = "provider_dependent"
quick_start = "examples/remote/provider_roster.py"
documentation = "flagquantum/remote/qpu/README.md"
level = "experimental"
owner = "remote maintainers"
limitations = "No adapter has been exercised against a live provider, so there is no hardware evidence and none of this is release-certified. A device listing is external and untrusted: width, native gate set, and connectivity are the vendor's declared facts, and a listing that omits or mistypes one is refused by name rather than defaulted. Trapped-ion connectivity is all-to-all, so the profile carries no coupling map unless the listing states one and never a fabricated lattice; an IQM lattice is read as declared; a neutral-atom register's connectivity is derived from declared atom coordinates under an explicit caller-supplied interaction radius, because a default radius would invent a device. A preflight is this package's own policy, not a vendor's acceptance, and a real submission additionally needs a vendor account, credentials, and a live control plane. Neutral-atom submission is deliberately not implemented: such a machine executes an analog schedule this package does not emit, and the adapter names that gap instead of translating a circuit into a program the hardware would not run as declared. Photonic and quantum-control-system providers, an analog-schedule path, and a RuntimeEndpoint contract are absent. No adapter claims hardware-identical behaviour."
focused_tests = "tests/unit/test_hardware_provider_roster.py"
development_artifact = "flagquantum/remote/qpu"

