[capabilities.circuit_composition]
title = "Construction-time program composition"
summary = "Build a larger program out of smaller ones in place: place one program on chosen qubits, invert a program, apply a program a whole number of times, and run a program only when added control qubits are all set, without introducing a second IR."
category = "build_and_compile"
user_goals = ["Place a reusable block on chosen qubits of a wider circuit", "Undo a program by taking its inverse", "Apply a program a whole number of times", "Run a block only when a set of control qubits is all set", "Build a subroutine library and compose it into one circuit"]
public_apis = ["flagquantum.Circuit.compose", "flagquantum.Circuit.adjoint", "flagquantum.Circuit.power", "flagquantum.Circuit.control"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "not_applicable"
quick_start = "docs/reference/API.md"
documentation = "docs/reference/API.md"
level = "development_evidence"
owner = "FlagQuantum core maintainers"
limitations = "All four methods are Stable Core additions to the fq.Circuit type, approved by docs/api-changes/FQ-CIRCUIT-COMPOSITION-20261002.md, docs/api-changes/FQ-CIRCUIT-ADJOINT-20261003.md, docs/api-changes/FQ-CIRCUIT-POWER-20261021.md and docs/api-changes/FQ-CIRCUIT-CONTROL-20261022.md, and the four-member family is complete: every operation it names has an approved proposal. A noise channel, a dynamic operation, a classically conditioned instruction, a matrix without a conjugate transpose and an unknown opcode without a matrix are each refused with CapabilityError rather than copied forward. Composition, inversion, control and repetition are rewrites of qubit labels and not a second program description: none of the four changes IR_VERSION, each emits instructions the IR already describes, and none adds a root export, so no existing program changes meaning. Circuit.power returns a new circuit that applies the receiver's program an integer number of times, and it is exact for every instruction: the whole program is appended in order, so a gate with no angle, a custom operation carrying a matrix and a noise channel all work, and a negative exponent is adjoint().power(-k) so that the inverse rule keeps one implementation. One rewrite shortens the common case -- a receiver that is exactly one instruction declaring exactly one parameter has that parameter multiplied by the exponent instead of the gate being repeated -- and the rule belongs to the gate, declared as a power_rule on every opcode and measured through the dense operator by tools/check_circuit_composition_contract.py: 12 of the 35 registered opcodes take the closed form and the other 23 repeat, with u2 and u3 repeating because scaling all of their angles is a different operator. power(1) copies rather than multiplying by one, so a symbolic parameter or a trainable angle stays the same object, and power(0) is the empty program of the same shape, which keeps p.power(a).power(b) equal to p.power(a * b) at a = 0. A fractional exponent is an owned gap: the IR has no instruction form for a matrix root, so power(0.5) raises TypeError rather than approximating, while PennyLane 0.45.1 constructs and runs qml.Hadamard(0) ** 0.5; closing it needs a new Instruction form and is therefore an IR change rather than a composition change. Requests that would emit more than 4096 instructions are refused with ValueError naming the count. Circuit.control returns a new circuit in which every gate runs only when the control qubits it added are all set. The control qubits are added rather than borrowed, so each label must lie outside the receiver's own range and the result's width covers them, and an input state set on the receiver is carried into the wider register with every added qubit in |0>. The controlled form belongs to the opcode and is declared once in flagquantum/core/operator_schema.py next to the inversion and shift rules: 31 of the 35 registered opcodes declare one, the four that do not are the noise channels, and a channel, a dynamic operation, a classically conditioned instruction or an instruction carrying its own matrix is refused with CapabilityError rather than approximated. A gate the registry already has in controlled form is used directly, so x under one control is cx and swap under one control is cswap, and every wider control is emitted as an ancilla-free phase ladder of registered gates, which keeps a symbolic angle symbolic and the result inside the autograd graph. The price is depth and it is published: a w-qubit block under k controls needs a ladder of level k + w - 1, which emits on the order of 3 ** level instructions, MAX_LADDER_LEVEL is 10, and a request past the ceiling is refused by name. The surface is single-process CPU work on one program with no execution, compilation, routing, noise handling, or scalability claim, and it is not differentiable by itself because composition records instructions rather than evaluating them. contracts/circuit-composition-contract.toml is the authoritative list of these guarantees and of every refusal, and tests/unit/test_circuit_composition_contract.py reads it back against the implementation.\""
focused_tests = "tests/unit/test_circuit_composition_contract.py"
development_artifact = "contracts/circuit-composition-contract.toml"

