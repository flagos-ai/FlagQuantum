limitations = "Scope is the recorded pair: two A800 hosts with one device per host, one five-wire complex128 circuit with toy parameters, and a cut of exactly two labels declared by the workload. Slice-boundary reduction, the exact slice-gradient sum, an owner-sharded optimizer step, and a checkpoint generation resumed by a restarted run all executed on that pair, and the run reports scalability_claim_allowed and release_gate_allowed false with four blockers attached. The route was observed on the RoCE fabric and five synchronized amplitude samples were recorded after two warmups, so the fabric and a repeated measurement are evidence rather than assumptions. The cut width was swept across both labels of the declared cut, which retired the blockers that named an unswept cut and a fixed slice count. The cut is still declared rather than chosen by the automatic slicer, which selects by peak memory and would here pick a label carried only by state-copy nodes whose partial is zero on every rank but one; slicing such a label would report sharded execution while one rank did the arithmetic. Congestion and capacity were not measured, the profiled measurement region contains explicit host transfers that keep a blocker of their own, the sliced full state is gathered for validation only, and topologies wider than one device per host run on the lane but are not recorded, so this evidence does not establish behaviour as the cut widens or as nodes are added. This capability does not reach release_certified, and the reason is measured rather than inferred. Its release contract freezes a matched-speed acceptance configuration -- 180 trainable angles over eighteen wires and ten layers at six sliced labels -- and that configuration was measured on one A800 and exhausts it: 66.9 GiB peak and a further 16 GiB refused in 50.7 s, while the two narrower rungs of the same frozen ladder complete at 0.79 GiB and 8.53 GiB. The pair does not rescue it, because the reverse-mode peak is not slice-owned: the pair fails the rung with the same 58.9 GiB resident and the same 16 GiB refused. No matched-speed baseline or pair leg can be sealed from the frozen ladder while its reverse tape is unbounded, which is what 'missing_statistically_significant_speedup_artifact' reported for as long as every leg was run that way. Bounding the tape changes the peak without changing the arithmetic: one baseline leg at world one and one sharded leg at world two, both under a 4294967296-byte reverse-tape bound with the shape, slicing, parameters, steps and optimizer untouched, complete all three frozen rungs and seal as benchmarks/results/smoke/release_candidates/tensor_network_matched_speed_pair/tensor_network_matched_speed_pair.json, where the acceptance rung's interval [1.9821866944895041, 1.98656634565854] is wholly above one and the other two rungs report intervals that exclude one as well. The sealed candidate carries no claim flag, so the gate reads it as production evidence rather than as a release payload: with the four claim keys added it reports 'capacity_premise_not_established' alone, and without them it reports that blocker beside the four a claim-free payload cannot satisfy. The claim was measured rather than asserted -- a probe envelope sealed with --release-payload from the same two legs at the same revision passes the strict audit with no errors -- so a reader can reproduce the comparing verdict from the committed candidate by adding the claim keys the candidate deliberately omits, and tests/benchmark_contract/test_tensor_network_release_gate.py reads the committed artifact to assert both verdicts: that the claim-free candidate reports the four blockers a claim would answer beside the premise, and that the same evidence carrying those keys reports the premise alone while the strict audit accepts it with no errors. Those tests also rebuild the artifact's unsigned envelope and require the committed content_sha256 to be reproduced, so the file's own digest is what makes the comparison an observation rather than a transcription. The bound is a measurement condition the frozen speed_workload does not name: the payload records it as checkpoint_budget_bytes and its provenance command records it, but the release gate does not read it, so the candidate is evidence about this pair under a recorded bound rather than a certification of an unbounded ladder. Freezing that bound now would describe a protocol chosen to fit the hardware it was measured on, so the manifest is left naming no budget and the condition is disclosed here instead. The contract's capacity premise is unestablished for the same structural reason -- no measured shape both exhausts one device and completes sharded at one slicing -- so 'capacity_premise_not_established' cannot be cleared either. Both findings are recorded in the manifest rather than corrected by re-freezing the ladder after the measurement, which would let the freeze describe a protocol chosen to fit the hardware it was measured on. The host-staging and validation-only-gather blockers stand as recorded: the tensor-network producer has no production-materialization leg, so the sliced full state is still gathered to check an answer rather than because the workload needs it. Two later measurements widen the capacity finding rather than narrow it. First, the frozen capacity workload does not contract at its own default slicing at the revision the manifest declares: the executor's default slice-label selection picks the lowest-numbered contracted labels, which for the frozen 4x6x2 grid are its deepest, and the resulting operands exceed the twenty-five-dimension ceiling shared by torch.einsum and PyTorch's copy machinery, so the producer's capacity-failure role raises 'tensor has too many (>25) dims' before it measures any allocation. Spreading the label argument across the network instead completes the same rung in 4099927552 bytes, so the rung the ladder records as completing at 51191433216 bytes was measured with an explicit label argument the manifest does not name, and the ladder is not reproducible from the freeze. Second, every rung in the ladder was measured with an unbounded rematerialization tape, so the rungs that exhaust a device record the budget they ran under rather than the shape: bounding the reverse tape at 4294967296 bytes and holding shape, slicing, parameters and steps fixed turns the two-sliced-label 4x6x2 rung from 80930380288 bytes out-of-memory into a completion at 17160570368 bytes, and turns both 4x6x3 out-of-memory rungs into completions at 30072620032 and 27926225920 bytes. The budget is not monotone -- the four-sliced-label 4x6x2 rung completes unbounded and raises once bounded -- so neither the label choice nor the tape budget can be left implicit by a manifest that claims to have frozen a capacity premise. Both findings are recorded in the manifest's freeze_note and premise_established_note and in the runbook rather than folded into measured_ladder, which stays a record of what was run."
focused_tests = "tests/test_tensor_network.py"
integration_tests = "tests/team/runtime/test_cuda_multinode_tn_probe.py"
hardware_evidence = "artifacts/cuda_multinode_tn_a800_jp171_jp172_20260930.json"
operational_runbook = "docs/guides/MULTINODE_RUNBOOK.md"

