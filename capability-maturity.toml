[capabilities.openqasm_interchange]
title = "OpenQASM 2 and OpenQASM 3 interchange"
summary = "Write one FlagQuantum program as OpenQASM text and read that text back as the same program, with every other text refused by name."
category = "build_and_compile"
user_goals = ["Save a circuit as OpenQASM text", "Load OpenQASM text back into FlagQuantum", "Know exactly why a piece of OpenQASM was refused"]
public_apis = ["from_openqasm", "flagquantum.compiler.openqasm.emit_openqasm"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "bound_parameters_only"
distribution_semantics = "not_applicable"
quick_start = "flagquantum/compiler/README.md"
documentation = "flagquantum/compiler/README.md"
level = "production_supported"
owner = "compiler maintainers"
limitations = "Text interchange only; the importer never executes a program and does not make FlagQuantum an OpenQASM front end. Import accepts exactly the canonical subset the emitter writes and verifies that claim by re-emitting the parsed program and requiring statement equivalence, so text that denotes something the emitter would write differently is refused rather than interpreted approximately, and arbitrary third-party OpenQASM is out of scope. Both 2.0 and 3.0 are read; the version and its matching include statement are mandatory, so a program declaring any other version is refused as unsupported_version. One qreg or qubit register and one creg or bit register may be declared, and a program declaring more is malformed_statement. Because OpenQASM 3 spells the three-angle gate as U and has no two-angle gate, U is read as u3 unconditionally: u2(phi, lbd) and U(pi/2, phi, lbd) denote the same unitary and the emitter writes the same text for both. The inverse of sx is the one power accepted, spelled pow(-1) @ sx q[i]; every other power is unknown_gate. Parameters must be bound numbers, so rx(theta) q[0]; is unbound_parameter. barrier and reset are not opcodes and are refused. The measurement block must be terminal, must define every classical bit exactly once, each bit must read a distinct qubit, and a classical register wider than the quantum register or a partly defined measurement block is incomplete_measurement. Comments, blank lines, and spacing carry no meaning; any other textual difference from the canonical emission is not_canonical_text. Eleven refusal reasons form a closed vocabulary, each carried on OpenQASMImportError.issue_code, which is the first issue_code in the package. Import returns an OpenQASMImport rather than a Circuit because a Circuit cannot carry a measurement, and IR_VERSION stays 1.0 because import happens at construction time."
focused_tests = "tests/test_openqasm_compiler.py"
integration_tests = "tests/test_openqasm_import.py"
hardware_evidence = "not_applicable_pure_contract"
operational_runbook = "flagquantum/compiler/README.md"

