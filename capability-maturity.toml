[capabilities.algorithms_readout_error_mitigation]
title = "Readout-error mitigation over a declared classical confusion"
summary = "Correct a measured distribution for the classical misassignment a NoiseModel's readout rules declare, by grouping those rules into disjoint blocks and applying each block's transpose inverse, with the amplification the correction costs and the negative mass it may carry reported beside the corrected vector."
category = "simulation_and_training"
user_goals = ["Correct a measured distribution for a readout confusion a noise model declares", "Read the amplification the correction costs, in the same units a shot count is spent in", "See which qubits the model covers and which it leaves untouched, rather than assuming a confusion", "Read the negative mass a corrected vector carries instead of receiving it clipped", "See which confusions are refused, by measured quantity, before anything is inverted"]
public_apis = ["flagquantum.algorithms.readout_mitigation", "flagquantum.algorithms.plan_readout_mitigation", "flagquantum.algorithms.run_readout_mitigation", "flagquantum.algorithms.run_readout_mitigation_counts"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "not_applicable"
quick_start = "examples/algorithms/readout_mitigation.py"
documentation = "docs/guides/ALGORITHMS.md"
level = "development_evidence"
owner = "Algorithms maintainers"
limitations = "Readout-error mitigation over a declared classical confusion, which is a linear inverse rather than a fit: the correction is exact exactly when the declared confusion is the device's confusion, and nothing here checks that. A readout error that is miscalibrated, that drifts between calibration and use, or that is correlated in a way the model does not carry survives the inversion untouched, so a corrected vector that lands on the ideal distribution is a statement about the model before it is a statement about a device. The declared index convention and the runtime's flat index convention differ: a calibration table is written with the true outcome as the row index, while flagquantum.noise.model.NoiseModel.apply_readout_probabilities applies that table transposed to a vector whose qubit 0 is the most significant bit, so the correcting operator is the transpose inverse inv(P.T) and not inv(P). The two agree on a symmetric confusion and differ on every asymmetric one -- by 0.14285714 in the maximum entry on ((0.9, 0.1), (0.2, 0.8)) -- which is why the relation is asserted directly rather than through agreement with a symmetric table. The corrected vector is not a distribution and is not forced to be one: the inverse of a stochastic matrix has negative entries whenever the confusion is invertible and is not a permutation, so negative_mass is the sum of the negative entries, total_variation is the L1 distance to the observed vector, and is_physical states which side of the simplex the result landed on rather than asserting that it must be inside. Nothing here refits, smooths, or projects onto the simplex, and no maximum-likelihood correction is offered. The amplification is the price of the correction and it is the whole map's induced 1-norm: for a map that is the tensor product of disjoint blocks that norm is exactly the product of the blocks' own, not the worst block's, so sampling_overhead composes multiplicatively and equals the worst block's only when there is one block. The standard error bound the result carries is that amplification over the square root of the shot count, which follows because the transpose inverse's infinity norm is the inverse's 1-norm. That bounds the corrected weight's standard error rather than the correction's error against the truth, and the exact per-component variance is the full covariance (diag(d) - d d^T) / N with d the device distribution, not the sum over outcomes of v squared times d times (1 - d) that a per-outcome reading gives: the missing (v^T d)^2 term was measured 40 per cent low on the two-qubit case this unit is tested on, 0.046274639 against 0.064321607. A readout rule naming several qubits is inverted as one block rather than as its marginals, because inverting the marginals inverts a different operator; the correlated table this unit is measured on does not factorize, its joint form read as a matrix having a second singular value of 8.144e-03 where a tensor product leaves rank one. A qubit named by two readout rules is refused rather than composed, because the forward path would apply the confusion twice and the inverse of a doubled confusion is neither correction; an uncovered qubit is left exactly where it was and is named as uncovered rather than given a guessed confusion. A block whose smallest singular value reaches the declared floor is refused rather than inverted, because the inverse's magnitude grows as the reciprocal of that singular value and the correction would report weights no shot count can support; the floor is the caller's and the default SINGULAR_VALUE_FLOOR of 1e-6 is matched to the decomposition tolerance probabilistic error cancellation uses, so a tighter floor refuses more. A correlated block wider than MAX_CORRELATED_BLOCK_QUBITS of 10 qubits is refused before its matrix is built, because inverting it needs a 2048 by 2048 float64 matrix and its singular values. An observed distribution whose rows fall further from one than NORMALIZATION_TOLERANCE of 1e-6 is refused, and one inside that tolerance is corrected rather than rescaled silently; a histogram whose keys are not all the plan's width, whose total is zero, or whose counts are negative or boolean is refused. The plan's identity is a digest of the confusion and the width and nothing else, and the corrected distribution is a classical vector rather than a quantum state, so nothing here restores positivity, enforces a rank, or reports an entanglement property."
