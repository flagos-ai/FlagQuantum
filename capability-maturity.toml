[capabilities.algorithms_amplitude_estimation]
title = "Quantum amplitude estimation"
summary = "Estimate the probability a state-preparation unitary's marked subspace carries, by phase estimation over the Grover operator."
category = "simulation_and_training"
user_goals = ["Estimate the amplitude a marking operator selects", "Read an amplitude off the counting register", "Compare an estimate against a known amplitude"]
public_apis = ["flagquantum.algorithms.amplitude_estimation"]
runtime_modes = ["local_statevector"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "single_process"
quick_start = "docs/guides/ALGORITHMS.md"
documentation = "docs/guides/ALGORITHMS.md"
level = "experimental"
owner = "Algorithms maintainers"
limitations = "The quadratic speedup over classical sampling is real only given that the state-preparation unitary A is free: a real distribution needs QRAM, and this unit does not supply one, so it does not show that any Monte Carlo integral is estimated faster than classically. The estimate lies on the amplitude grid sin^2(pi j / 2**(m+1)) and is accurate to about one grid step; that is a resolution, not a coverage-calibrated confidence interval, and no confidence interval is reported. The operator must be able to apply A, its adjoint, the marking operator and the zero-state reflection each under control, which excludes state-preparation circuits that cannot be controlled. It makes no performance, convergence, or hardware claim."
