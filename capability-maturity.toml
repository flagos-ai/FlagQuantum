[capabilities.noisy_simulation]
title = "Exact and trajectory-based noisy simulation"
summary = "Write a channel into a circuit or lower a validated Kraus noise model into FlagQuantum IR, then execute exact density-matrix or MPS quantum-trajectory paths."
category = "simulation_and_training"
user_goals = ["Validate small noisy circuits exactly", "Write a channel directly in a circuit", "Evaluate low-entanglement noisy circuits with MPS trajectories", "Resume reproducible trajectory ensembles"]
public_apis = ["flagquantum.noise.NoiseModel", "flagquantum.noise.UnitaryMixture", "flagquantum.noise.channel_from_parameters", "flagquantum.noise.noisy_density_matrix", "flagquantum.runtime.run_noisy_mps", "flagquantum.runtime.run_noisy_statevector"]
runtime_modes = ["density_matrix", "noisy_statevector", "noisy_mps"]
hardware = ["cpu", "single_gpu"]
gradient_support = "unsupported"
distribution_semantics = "single_device_fast_path_or_rank_local_trajectory_partition"
quick_start = "examples/noisy_simulation_v1.py"
documentation = "docs/guides/NOISY_SIMULATION.md"
level = "experimental"
owner = "noise runtime maintainers"
limitations = "Validated Markovian Kraus channels, timestamped DeviceNoiseProfile input, ASAP gate/idle thermal lowering, classical readout confusion, exact density execution, batched statevector trajectories, and reproducible MPS trajectories with single-rank adaptive stopping are available. Four channel opcodes (bit_flip, phase_flip, depolarizing, amplitude_damping) declare the scalar their factory takes, so they can be written directly into a circuit as well as attached to a gate through a NoiseModel rule; the two routes lower to the same instruction, and a program is planned as noisy because it carries a channel, not because a model was passed. That same reading of the program decides the trajectory representation under mode='auto' and restores it from a saved plan, so an inline channel and an equivalent NoiseModel rule select the same route. A representation that holds amplitudes -- mps, tensor_network, and statevector -- refuses a channel instead of returning the noiseless number, and mode='stabilizer' samples the frames the channel defines rather than applying an operator it cannot hold, refusing only a request for an exact value on such a program or a channel outside the Pauli-frame class. A channel instruction's matrix field is the Kraus tuple, so consumers read it as a sequence rather than as one tensor. Only those four opcodes are reachable by name: the remaining flagquantum.noise callables, including thermal relaxation, readout error, and coherent overrotation, are NoiseModel rules only. Channel parameters are bound real scalars; a trainable channel probability has no gradient path. Lowering refuses a rule naming a wire outside the program width and refuses a model whose rules match no instruction at all, so a misspelled gate name cannot yield a clean result; a model that matches some instructions stays legal. A channel whose operators are non-negative real scales times unitaries is also reported as a probability distribution over unitaries: `KrausChannel.unitary_mixture` returns the branches and their weights, `is_unitary_mixture` answers the question alone, and a zero-weight operator is a branch of probability zero rather than a reason to call the channel general, so a channel at the edge of its parameter range stays classified. The distinction is decided by the operators and not by the channel's name, and three reading sites consume it: the stabilizer positioned-noise entry point accepts exactly the channels a Pauli frame reproduces on the wires the channel acts on and refuses the rest, including a coherent over-rotation, which is a unitary mixture whose branch is not a Pauli; the stabilizer survey reports that same verdict without executing the program; and the batched statevector trajectory kernel asks the classifier instead of an opcode table, so a channel that table never listed -- the two-qubit depolarizing channel, or any channel a caller writes -- draws one branch per trajectory row against the channel's own weights and applies only the branches it drew, where a channel that is not a mixture keeps the general Kraus kernel. The three kernels count their own events, so which one ran a channel is read from the result rather than assumed, and a route that asks the classifier takes the same estimator as the generic route: on this box the two routes return bit-identical states at the same seeds. The exact density-matrix route sums the whole channel whether or not it is a mixture, so it is the one consumer that does not read the classification, and no planning, scheduling, or memory-budget decision is taken from it. Pulse overlap, crosstalk, leakage, provider calibration adapters, distributed adaptive stopping, production multi-GPU scheduling, and noisy gradients remain unsupported. Multi-wire MPS channels use an explicitly dense correctness fallback. The exact density-matrix route contracts its operands through the kernel catalog: `flagquantum/simulation/density_matrix_dispatch.py` reads the operands' own declared device and precision and takes the fused implementation only where the catalog declares one, so on CPU and at every undeclared precision the route is `torch.bmm`. Which route ran is counted rather than assumed, and no measured comparison between the two is claimed for these shapes."
focused_tests = "tests/unit/test_channel_instruction_parameters.py"
integration_tests = "tests/test_noise.py"

[capabilities.continuous_time_lindblad]
title = "Continuous-time Lindblad density-matrix evolution"
summary = "Evolve small Markovian open systems on explicit time grids with physical collapse rates and time-resolved diagnostics."
category = "simulation_and_training"
user_goals = ["Simulate driven amplitude damping", "Inspect time-resolved populations and observables", "Audit trace drift and numerical provenance"]
public_apis = ["flagquantum.lindblad.run", "flagquantum.lindblad.plan", "flagquantum.lindblad.LindbladPlan", "flagquantum.lindblad.amplitude_damping", "flagquantum.lindblad.INTEGRATOR_NAMES", "flagquantum.lindblad.adjoint_gradient"]
runtime_modes = ["continuous_time_density_matrix"]
hardware = ["cpu"]
gradient_support = "exact_autograd_through_the_integrators"
distribution_semantics = "single_device_fast_path"
quick_start = "examples/lindblad_evolution.py"
documentation = "flagquantum/simulation/README.md"
level = "production_supported"
owner = "simulation maintainers"
limitations = "Time-independent Hamiltonian representations, dense or matrix-free Pauli sums, finite strictly increasing grids, Markovian Lindblad collapse operators, and CPU complex64/complex128 execution only. The integrator is selectable between explicit fourth-order Runge-Kutta, the second-order implicit Crank-Nicolson trapezoidal rule and a matrix-free exponential scheme. The two order-p schemes each take two substeps per output interval; the exponential scheme takes the interval whole, because the exponential of a time-independent generator is exact on the grid, so it reports no order and its accuracy is set by solve_tolerance instead. Both Krylov schemes apply the generator rather than forming it: Crank-Nicolson through restarted GMRES, the exponential through a single Arnoldi window whose projected exponential is the only exponential computed, so neither allocates the 16-to-the-n vectorized generator. The relative residual or defect target defaults to 1e-12 in complex128 and 1e-5 in complex64, it is refused for the explicit scheme rather than ignored, and a step that misses the target fails the evolution as integration_not_converged. For reference and for the properties that are statements about it, Liouvillian materializes the vectorized generator on demand but refuses to above a declared 16 MiB ceiling, which admits five wires and refuses six. A state may carry a batch axis -- a batch of statevectors as (batch, dim) or a batch of density matrices as (batch, dim, dim) -- with (dim, dim) keeping its reading as one density matrix; batch_size is refused when it contradicts the state, and the batch axis is folded into the solved Krylov vector rather than looping over members. The integrators are ordinary differentiable tensor operations, so a trajectory parameterized through either the Hamiltonian or the initial state carries an exact autograd graph, and the matrix-free solves keep the norms that scale their basis and result on that graph; require_gradients=True is decided on the returned trajectory and a detached one is refused as gradients_not_available. The gradient is that of the discretized evolution, not of the exact solution. flagquantum.lindblad.adjoint_gradient additionally returns a reverse-mode cotangent through that same discrete scheme: the forward sweep retains the output trajectory under no_grad and the reverse sweep applies the Hilbert-Schmidt adjoint of the vectorized generator, so no forward graph is kept and the cotangent is the conjugate transpose of the scheme the caller named rather than of the exact solution. The reverse map is the Hilbert-Schmidt adjoint of the generator that was assembled, `SuperOperator.adjoint()`, so the forward and reverse maps are one term list read in two directions; it is verified against the Liouvillian's own dense conjugate transpose and by the pairing identity between the two, and a matrix-free Pauli-sum Hamiltonian is reversed without being materialized, because `PauliSum.adjoint()` conjugates its coefficients and leaves the Hermitian strings alone. The route refuses require_gradients=True, a cost that is not callable, and a cost that does not return a scalar, and its cotangent follows the complex-gradient convention in which a perturbation pairs with it through the real part of the inner product of its conjugate with that perturbation. One measured property of the forward path is disclosed here rather than repaired: at a base point where the two routes differ most, the adjoint route reproduces the dense transpose of the scheme it was given to roundoff, while the backward pass through the matrix-free solve is an approximation of that transpose -- relative to a five-point stencil of the same scheme it is 3.5e-06 away for Crank-Nicolson and 1.7e-05 for the exponential scheme, where the adjoint route is 1.0e-10 and 8.9e-11 away, and a finite difference of one Crank-Nicolson interval agrees with that scheme's dense transpose to 4.6e-11 where autograd's cotangent is 5.7e-08 away from it. The explicit scheme, which takes no solve, is at roundoff on both. That gap is the conditioning of the discretized generator rather than a defective vector-Jacobian product, because the matrix-free solve's own backward is exact to 1.7e-15 on a well-conditioned system. Non-Markovian environments, stochastic trajectories, sparse solvers, GPU/distributed execution, hardware submission, and arbitrary time-dependent generators are unsupported. Integrator selection is covered by tests/unit/test_lindblad_integrators.py, the vectorized generator and exponential step by tests/unit/test_lindblad_vectorized_generator.py, and the batch axis and gradient path by tests/unit/test_lindblad_batching_and_gradients.py. The adjoint cotangent, its agreement with the dense transpose of each scheme and its retention claim are covered by tests/unit/test_lindblad_adjoint_gradient.py."
focused_tests = "tests/unit/test_lindblad_evolution.py"
integration_tests = "tests/unit/test_lindblad_evolution.py"
hardware_evidence = ".github/workflows/ci.yml"
operational_runbook = "flagquantum/simulation/README.md"

[capabilities.density_matrix_execution]
title = "Exact density-matrix execution"
summary = "Execute a circuit as a dense square density matrix so a channel acts on it exactly, then read probabilities, samples, counts and Pauli expectations off it through an exact autograd graph."
category = "simulation_and_training"
user_goals = ["Run a noisy circuit exactly instead of by trajectory sampling", "Read Pauli expectations and outcome counts off an exact density matrix", "Differentiate a parameterized circuit through its density matrix"]
public_apis = ["flagquantum.simulation.density_matrix.density_matrix", "flagquantum.simulation.density_matrix.density_matrix_from_ir", "flagquantum.simulation.density_matrix.apply_unitary_density", "flagquantum.simulation.density_matrix.apply_kraus_density", "flagquantum.simulation.density_matrix.expectation_z_density", "flagquantum.simulation.density_matrix.expand_operator"]
runtime_modes = ["density_matrix"]
hardware = ["cpu"]
gradient_support = "exact"
distribution_semantics = "single_device_fast_path"
quick_start = "examples/density_matrix_execution.py"
documentation = "flagquantum/simulation/README.md"
level = "development_evidence"
owner = "simulation maintainers"
limitations = "Exact evolution of a dense 2^n by 2^n square density matrix: the representation is exact and the cost is 4^n. Measured here up to 13 wires, where one complex128 density matrix is 8192 by 8192 and about 1.07 GB (4^13 times 16 bytes), and nothing above that is claimed. Readout has a separate and lower ceiling than storage, because probabilities over more than 8 wires are refused until max_marginal_wires is raised explicitly. Wire 0 is the highest-order index, so expand_operator of a one-wire gate on wire 0 of two wires is the gate tensored with the identity, not the identity tensored with the gate. mode='density_matrix' selects the route, and mode='auto' selects it exactly when the program carries a channel instruction; mode='statevector' and mode='mps' refuse such a program by name rather than approximating it. The engine is written in device-generic torch and reads the operands' own device and dtype, but accelerator execution is unverified because this checkout has no accelerator: device='meta' and device='mps' are refused at runtime backend admission, where the pytorch backend exposes cpu plus discovered accelerators, rather than by the engine, and the registry records cpu hardware only. The density matrix is not sharded: no rank and no second device partitions it. memory_limit_bytes is resolved and recorded in the plan's resolved options but is not enforced on this route, so a run whose dense state exceeds a declared limit still executes; enforcement lives in the advisory plan_runtime_selection cost selection, which this route does not consult. require_gradients is a planner admission and scoring input in the runtime, not a post-condition on the returned tensors, so a run that declares it with no differentiable parameter returns normally; the post-condition exists one layer up in flagquantum.lindblad, which raises gradients_not_available. The circuit IR carries no mid-circuit measurement, reset, or classically conditioned instruction at all, so this route cannot express them; mid-circuit measurement is reached through flagquantum.dynamic.DynamicCircuit on a statevector trajectory instead. The default precision is complex64, where an exact gradient reproduces its analytic value to about 1e-8; precision='complex128' reproduces it bit for bit, measured at zero difference from -sin(theta) at theta=0.7."
focused_tests = "tests/unit/test_density_matrix_execution_capability.py"
integration_tests = "tests/test_noise.py"
development_artifact = "flagquantum/simulation/README.md"

