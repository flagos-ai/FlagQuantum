level = "development_evidence"
owner = "QEC maintainers"
limitations = "One decoder, in-process, over one detector error model at a time, with no batching, no streaming, no threshold, no logical-error-rate estimator, and no performance claim. The colour code is the first shipped family whose decoding evidence is this route rather than the matcher's, because its faces carry a single fault into three detectors and the matcher refuses the model: tests/qec/test_colour_memory_execution.py decodes every single fault of the executed distance-three patch and every syndrome the distance-five model samples, and asserts of each that the correction reproduces the syndrome it was given. It is a decoder and not an optimal one: belief propagation is an estimate, and the ordered-statistics pass holds every mechanism outside the elected information set at zero, so an answer reproduces the syndrome and need not be its most likely explanation. The exact claims are the measured ones. On the one-round Steane model the decoder reaches the least weight and the most likely observable for all 64 syndromes. On the one-round rotated surface code it carries more weight than the least-weight explanation on five of the 256 syndromes, by 0.6904 on two and 2.9444 on three, and differs from the most likely observable on three of those five, so the whole of its gap to an optimal decoder on that model is those five syndromes and not a property of the code. The iteration is min-sum with a caller-set damping factor, runs a caller-set number of passes, and reports whether it converged rather than looping until it does. The magnitude of a check message is capped, so a detector only one mechanism can flip forces that mechanism without producing an infinite message, and a mechanism whose stated probability is one or zero is floored before its log-odds ratio is taken so that the ratio stays finite. The decoder is deliberately outside the name-keyed decoder registry. That registry's DetectorErrorModelDecoder protocol promises a DecodingGraph view of what was built, and a model carrying a three-detector mechanism has no pair-graph at all: DecodingGraph.from_detector_error_model refuses it as a hyperedge, so the promised property cannot be satisfied honestly and this class is constructed directly instead of being requested by name. The module imports torch and the standard library and nothing else, it is not wired to the stim sampling path, it reports the observables a mechanism set flips as a prediction rather than as a probability, and it is not calibrated."
focused_tests = "tests/qec/test_bposd_decoder.py"
development_artifact = "flagquantum/qec/bposd.py"

