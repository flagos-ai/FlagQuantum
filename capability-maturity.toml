title = "Realtime device-call messaging protocol"
summary = "Frame a device call into a fixed-size slot, type its payload against a handler schema, resolve it through a function table, and carry it over a channel chosen at runtime by name."
category = "deployment_and_extension"
user_goals = ["Describe a call between a running program and a service without hardware", "Give a hardware partner an exact slot, payload, and status layout to implement against", "Exercise the protocol end to end offline over an in-process transport"]
