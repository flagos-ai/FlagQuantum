owner = "FlagQuantum core maintainers"
limitations = "A symbolic algebra and two transforms, and nothing that executes on its own. Two fermion-to-qubit transforms ship, Jordan-Wigner and the parity encoding, and they are the same operator written in two qubit bases: the parity image is the Jordan-Wigner image conjugated by the change of basis that replaces each mode's occupation with the parity of the modes up to it, which is measured rather than asserted, so a consumer written against Observable reads either one without being told which it holds. What the second basis buys is locality of the occupied-parity information and not a smaller image. Jordan-Wigner runs a Z string over the modes strictly below a factor's mode, so the first mode is a single Pauli and the last spans every wire; the parity encoding runs an X string over the modes strictly above it, so the last mode is one X plus one Z on the mode below and the first spans every wire. The widest factor image therefore costs one wire per mode in both encodings, reached at opposite ends of the mode list, and the reduction in worst-case Pauli weight that motivates the Bravyi-Kitaev and ternary-tree encodings follows from neither; those two remain absent. Both transforms take the mode count as an argument rather than inferring it, so a caller who names fewer modes than the operator addresses is the caller's error and is refused rather than silently widened, and both refuse a non-Hermitian operator for the same reason. Operators are stored normal-ordered against the vacuum, so equality is structural and a Hermiticity test is exact rather than a tolerance; the consequence is that two operators equal as matrices but not as canonical sums compare unequal, which is the documented boundary rather than a bug. The image of a structurally Hermitian operator has real dyadic coefficients under either transform and the imaginary part is checked against a fail-closed bound of 1e-9 rather than a tuned threshold, so a coefficient outside it is reported instead of having its imaginary part dropped, and no input this algebra builds needs the bound. There is no matrix form of a fermionic operator: the only numerical value is the Pauli image, which exists at the sizes the statevector path simulates. There is no circuit-level exponential of a fermionic operator, no molecular Hamiltonian assembly, no integral handling, and no sparse or dense second-quantised Hamiltonian; expectation values, sampling, and gradients follow from the image and the existing Observable path rather than from this module, which therefore makes no claim of its own about any of them. Nothing here executes, allocates a device buffer, or reads a runtime option, so the runtime mode named is the path its image feeds rather than a mode this unit runs."
focused_tests = "tests/unit/test_observables_fermion.py"
development_artifact = "flagquantum/observables/README.md"

