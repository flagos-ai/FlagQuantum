distribution_semantics = "single_process"
quick_start = "flagquantum/qec/IMPLEMENTATION.md"
documentation = "flagquantum/qec/IMPLEMENTATION.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "An exact construction for Pauli noise over the reference Clifford gate set, and a text reader for the stim detector error model format. Construction does not sample: a mechanism's signature comes from one forced execution whose two shots must agree on the detector and observable flips they produce, and a non-Pauli channel is refused with a stated reason rather than approximated. The agreement is required of the flip set and not of the raw register: an X-type ancilla is prepared in |+>, so its round-zero outcome is a coin toss, while the steady-state X-type detector it feeds is deterministic because the first round projected both compared rounds into the same eigenstate. Demanding register agreement refused every code with an X-type check, so the rotated surface code could not be modelled at all. Because the signature comes from an execution, construction is bounded by the statevector amplitude ceiling: a distance-2 patch is 7 qubits and a distance-3 patch is 17, both of which build in seconds, while distance 4 is 31 qubits (2**31 amplitudes) and did not complete in 45 minutes, and distance 5 is 49 qubits and fails on the allocator outright. The modelled rotated-surface distance is therefore 3 on the circuit route, and that ceiling is a property of forcing a signature through an execution rather than of the construction contract: reading a matrix support costs one pass over its nonzero entries per round, so a distance-5 or distance-7 patch reaches a model as easily as a distance-2 one. A second construction route reads a code-capacity experiment rather than a memory circuit. DetectorErrorModel.from_code_matrices takes a CssCodeMatrices record -- the four CSS blocks hz, hx, lz and lx -- and derives every mechanism combinatorially, and css_code_matrices lifts a code record into that record, refusing a logical observable that is neither pure X nor pure Z rather than half-reading a CSS code. Its geometry is not the memory circuit's and the difference is pinned rather than glossed: a fault in round r reaches the detector band of round r and of round r + 1, the final round has no band after it, and there is no terminal data readout, so the detector count is num_rounds * num_checks where a memory circuit gains one terminal detector per check of the readout basis it is built in. Both geometries are asserted against their own stim transcription, and the same suite asserts that the two counts differ. The matrix route is compared to stim one readout basis at a time, because lz and lx anti-commute and no one state has both as a deterministic value: the reference experiment is run twice against the model restricted to the matching basis, and each run's observable rows are the ones the Pauli character of that fault family predicts. A fault that is still in the data at the end of the run is still seen by the logical readout, so a physical fault spans one detector band while the model gives it two; that single divergence is pinned as the exact relation between the two mechanism sets rather than as a tolerance. The fault family is the three single-qubit Pauli faults plus a check's syndrome bit flipped at readout, so an X fault flips Z-type checks, a Z fault flips X-type checks and a Y fault flips both, and the X detector band and the lx observable rows exist on the matrix route. The rate record is no longer what is narrower than upstream's. PhenomenologicalNoise states upstream CssNoise's four families as four scalars -- data_flip, phase_flip, both_flip and measurement_flip, which are its px, pz, py and pm -- and the same four per element as data_flip_per_qubit, phase_flip_per_qubit, both_flip_per_qubit and measurement_flip_per_check, which are its px_per_qubit, pz_per_qubit, py_per_qubit and pm_per_check. A stated vector replaces its scalar wholesale rather than mixing with it, a vector that does not name every data qubit or every check is refused naming both counts instead of being partially applied, and an element whose effective rate is zero enumerates no mechanism at all, so a quiet location between two noisy ones is expressible and costs nothing to sample. The per-qubit vectors are indexed in the code's own data_qubits order, which is the column order of every matrix, and the per-check vector by matrix row with the Z-type checks first; a code may declare its checks in any other order -- the rotated surface code interleaves the two types -- so the two orders are related by one named translation that all three readers share. What remains different from upstream is the carrier rather than the rates: upstream folds the record into the argument its matrix entry point takes, so the vectors are validated against matrices that arrive with it, where here the record is a standalone frozen dataclass and its vectors are resolved against a count the reader supplies. The sampler reads all four families, so a rate reaches a sampled record and a model alike: the engine executes one channel, so the Z and Y data families are placed as that bit flip conjugated by h and by sdg/s, one draw at that family's rate rather than a pair of independent bit flips. A matrix that is not binary, is not two-dimensional, or is not indexed by the same data qubits as another non-empty block is refused rather than coerced. The matrix route is graphlike only while it stays inside one round; at two rounds the middle data qubit of the distance-3 repetition code flips the same check in both bands, which is a four-detector mechanism, and the matching decoder refuses it as a hyperedge. The model is built on the memory circuit without in-circuit feedback, because it describes the noise-to-detection mapping a decoder inverts, so the frozen profile's compiled-feedback path is unmodelled. Detector rates are cross-checked against rates sampled from the circuit simulator, but the cross-check shares the injection helper with construction, so it is not an independent re-derivation of the signatures. An independent check does exist and runs against the optional stim distribution: the memory circuit is transcribed into a stim circuit and stim's own error analysis builds the model, which agrees with this one on shape, mechanism count and detector marginals at distance 2 and 3. That check shares nothing but the circuit's gate sequence and the noise model. The text reader accepts everything stim 1.16.0 wrote in a 240-model developer-time sweep except a repeat block, a # comment, a declaration that skips an index, and a malformed line; str(detector_error_model.flattened()) is a complete route around the repeat refusal. A line's ^ separators are read the way stim means them -- the signature is the symmetric difference of the targets, so a detector named twice cancels and the groups are not retained -- and the decomposition the separators suggest is available under upstream's own flag name as from_stim_text(text, use_decomp_suggestions=True), which returns one mechanism per component at the probability the line states and turns 536 mechanisms into 1042 on a distance-5, two-round rotated surface code. That second reading is a different distribution from the line rather than an equivalent statement of it, and it is measurably so: against stim's own sampler on the same text the default reading's worst marginal misses by 0.0016, inside the 0.004 tolerance, while the expanded reading misses the observable marginals by 0.048, twelve times outside it, which is what makes the tolerance evidence rather than decoration. A component that cancels to nothing is refused by the expanded reading alone, with the default reading named as the route that states the line. The circuit route states the same kind of named, lossy second reading of its own. DetectorErrorModel.from_memory_circuit takes decompose_composite_faults, which enumerates a composite data fault -- the Y family, an X flip and a Z flip at one location -- as those two parts, each forced through the same injector at the parent's round and qubit and read by the same signature reader the single-Pauli families use, rather than as one mechanism whose signature is their exclusive-or. It exists because a composite fault is the one hyperedge a memory circuit states: on a distance-three rotated surface code at two rounds the combined model states four mechanisms of three detectors and one of four and the matching decoder refuses it, while the decomposed model states none above two and the decoder builds on it. The claim it makes is bounded and stated with it: a part is graphlike exactly where the corresponding single-Pauli fault at that location is and no further, the two readings are the same joint law only in the marginals -- each detector's and each observable's rate is unchanged to floating-point rounding, measured at 5.6e-17 worst case, while the mechanism sets are asserted to differ -- and the default is the combined reading, so no earlier caller's model changes and a repetition code or a one-round surface experiment, where the parts are already separate, reaches the same model either way. The code-capacity route deliberately takes no such keyword: its detector bands make one fault span two of them, so a part there still reaches four detectors at two rounds on rotated surface codes at distances three, five and seven, and the keyword would promise a graphlike model that route cannot deliver. The text writer is exact on this side and stim's width is the platform's: stim prints at numeric_limits<long double>::digits10 + 1, so nineteen significant digits where long double is the x86 80-bit extended type (the Linux CI runners, where a reprint returned every swept probability unchanged) and sixteen where it is a double (arm64 macOS, where about a quarter of the same sample came back changed); seventeen digits name a double uniquely, so a round trip through stim must compare against a re-read of the text rather than against the in-memory model exactly where the width is the narrower one, and the drift there is bounded by one part in 10**15 and measured at 5.4e-16 worst case, while tests/qec/test_dem_stim_text_precision.py reads the width off stim's own output and pins the digit count, the direction of the loss and the bound against it. A CodeCheck states one ancilla and one CNOT direction fixed by the check's type, so a code with both check types is expressible while a mixed X-and-Z stabilizer is refused; the detector grammar is therefore the readout basis' own class contributing rounds + 1 and the other rounds - 1 -- z_checks * (rounds + 1) + x_checks * (rounds - 1) in the default Z basis -- rather than one detector per check per round, and a code family needing a second ancilla per stabilizer still requires that record to grow first. dem_sampling reports a DEM-sampled rate and is labelled as one wherever it is reported; no decoder, no threshold, no logical-suppression, no real-time or hardware-feedback, and no performance claim follows from a detector error model or from any rate it reports. DemSample carries tensors and is deliberately unhashable. The merge is a stated operation and not only a construction step: DemMergeRule names its two rules for what they compute, INDEPENDENT_PARITY being the probability that an odd number of a duplicated group fires and CLAMPED_LINEAR_SUM the sum of the group clamped at one, mechanisms_are_unique and require_unique_mechanisms are the predicate and the refusal, and the parity rule is exact rather than approximate because a detector's rate is a product of 1 - 2p factors over the mechanisms touching it, so a group's combined prior is the single p whose factor is that product and regrouping the factors cannot change any detector or observable rate; the sum rule does not preserve them and is offered only for a caller who means it. A model may also state that mechanisms are alternatives rather than independent, which is the one statement its parity matrices cannot carry, because two columns of a parity matrix are independent by construction: DemError.error_id is an optional non-negative label, the mechanisms sharing one are mutually exclusive, and DetectorErrorModel.error_ids projects upstream's optional vector back out, None when no mechanism states an id, which is upstream's nullopt and the state stim's text always describes. Exclusivity is given a distribution rather than left as a bare flag: the members of a group are disjoint pieces of one shot and each keeps the probability it states, the left-over mass is the group firing none of them, and a group whose probabilities sum above one is refused rather than renormalized, because renormalizing would change every rate the caller read; a group summing to exactly one is admitted, and a lone id excludes nothing and behaves as if it were unstated. The model's own arithmetic honours the groups, so the marginal rate of a target sums the group members that touch it instead of composing them by parity -- 0.26 for two independent mechanisms of 0.1 and 0.2 against 0.30 for the same two stated as alternatives -- and sampling draws one uniform per group and lets at most one member fire, so a model with no ids, which is every model the construction routes here produce, keeps the arithmetic and the draws it had before the field existed. DetectorErrorModel.error_rates is the parallel rate column the matrices are read against: entry i is the rate mechanism i itself states rather than a marginal, its length is num_errors and therefore the column count of detector_error_matrix and observables_flips_matrix, and its order is the model's own normalized mechanism order rather than the order a caller stated its mechanisms in, so a reader takes a column's support and that column's weight from one index. It is deliberately not a distribution, so a grouped model reports each member's own rate and the folding stays in detector_rates and observable_rates, which are different quantities again. The statement is not transcribable, and the operations that would silently drop it refuse instead: to_stim_text names the ids it would lose rather than printing an independent model under the same probabilities, and merge_duplicate_mechanisms names them because either rule combines mechanisms by assuming independence and would invent a shot in which two alternatives both fired. What remains absent is an operation that folds a group under its exclusivity rather than merging by independence, which is the gap the canonicalize field row records. A decoder is handed both halves of what it needs, not only the model. detector_context_from_memory_circuit builds the model once and returns a DecoderContext whose full_component, x_component and z_component each return a DecoderInputs -- the model together with both maps -- and whose num_measurements states the width those maps index. A MeasurementMap is one row per detector or observable holding the measurements whose parity it is: dense() projects to the (rows, measurements) orientation upstream stores as D and O, and flattened() to the -1-terminated sparse form a realtime decoder configuration takes, the terminator being what keeps a row that reads nothing visible to a sparse reader. The map is closed rather than conventional -- a row is sorted because a parity is a set, it may not name one measurement twice because two reads of one measurement cancel, and an index outside the buffer is refused. The basis split is a projection of the model as built rather than a second construction: a detector belongs to the check whose ancilla it reads, so the component of the experiment's own readout basis carries the terminal detectors and the union is the model itself, with no boundary-aware variant needed because the layout states its own boundary detectors. Two refusals keep the projection a reading rather than a rewrite: a component of a model that states error ids is refused, because projecting a group of alternatives would either drop the correlation or merge two of its members, and a component whose basis has no detector is refused rather than returned empty. The numbering the maps use is derived from the circuit's declaration and asserted equal to the numbering the sampler derives from the lowered program, so the two readings of one record convention are pinned to each other by measurement rather than by a shared constant. The context does not execute the circuit, costs one construction and no simulation, and adds no canonicalization and no chunk or seam helper of its own. test_dem_signatures.py, test_dem_sampling.py, test_dem_cross_check.py, test_dem_from_memory_circuit.py, test_dem_public_surface.py, test_dem_merge.py, test_dem_error_ids.py, test_dem_rate_overrides.py, test_dem_rates.py, test_decoder_context.py, and tests/qec/test_dem_code_matrices.py, whose stim cross-check is tests/qec/test_dem_code_matrices_stim.py."
