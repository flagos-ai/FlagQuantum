documentation = "docs/guides/ALGORITHMS.md"
level = "development_evidence"
owner = "Algorithms maintainers"
limitations = "Clifford data regression whose training set is a rewrite, not a device run, and whose premise is the affine relation and only that relation. The ideal values are read from exact density simulation of each training circuit rather than from the stabilizer representation, so Clifford membership is enforced -- every training circuit is accepted by require_clifford_program before it is measured -- but never exploited, and no simulation-cost, capacity or scaling claim follows from the fact that the training circuits are Clifford. Nothing here is cheaper than the target it corrects. The method's one assumption is that the ideal expectation is affine in the noisy one over the region the training circuits span; nothing checks it and it is not checkable from the measurements alone. The diagnostic that exposes a violated premise is the largest absolute residual the fit left, and a two-point fit's residual is reported as absent rather than as an arithmetic zero, because two points determine a line and the zero would be an arithmetic identity presented as a check. The estimate carries no error bound and no confidence interval, and no improvement over the unmitigated value is guaranteed: the residual is the only warning. Only the five single-wire theta rotations are snappable -- phase, rx, ry, rz and u1 -- and each is rewritten exactly on the quarter-turn grid, to 1.8e-16 over all twenty entries in complex128, up to a single global phase that leaves the program's density matrix unchanged; a program containing no such rotation is refused by name rather than trained on itself, and cphase, crx, cry, crz, rxx, ryy, rzz, u2 and u3 have no named-Clifford word at all, so a program built from them is refused by the stabilizer engine rather than snapped approximately. A rotation whose angle is an unbound parameter has no nearest turn and is refused. Residue zero rewrites to the empty word, so a rotation already on the grid is dropped rather than emitted as an identity. A noise model keys its channels on gate names, so a model that names an operation the rewrite removes is refused, because every training point would then be measured under less noise than the target and the line would fit a difference the rewrite created; a caller who needs such a model supplies the training circuits explicitly and owns that claim. A model that declares a readout rule is refused for the same reason the extrapolation and cancellation units refuse one: the estimate is Tr(O rho) and classical readout confusion is applied after measurement. Readout-error mitigation is a separate unit beside this one, flagquantum.algorithms.plan_readout_mitigation, which corrects a measured distribution rather than fitting a value that was never read out through a confusion. A program that declares a measurement or observable request is refused too, because this unit reads Tr(O rho) from the state and consumes no request, and returning an estimate while a declared request stayed unused would report a measurement that never happened. The training set is capped at 64 circuits, which is 128 exact simulations, and a caller-supplied set is capped at the same number. A training set whose noisy values do not separate is refused rather than fitted on rounding, at a declared floor of 1e-9 of the span rather than at a value reached by tuning. Measured: for h(0); ry(0, 0.7); ry(1, 0.4); cx(0, 1) observed as Z0 + X1, with two-qubit depolarizing noise at 0.06 on the cx and one-qubit depolarizing noise at 0.03 on the h, the three training points read ideal 0.0, -1.0, 1.0 against noisy 0.0, -0.898560, 0.936000, the fit reads slope 1.090028330 and intercept -1.360e-02 with a residual of 1.360355e-02 over one degree of freedom, and the target's exact value -0.254799345 is read as -0.214372678 unmitigated and -0.247275845 mitigated, so the correction closes 4.043e-02 of the 4.043e-02 gap to 7.524e-03 and the residual is what says the closure is incomplete; on the same target with only the cx noise, the same three training circuits fall on a line to 1.110e-16 and the mitigated value is on the exact one to 1.665e-16, so the residual separates a premise that held from one that did not rather than being decorative. On h(0); ry(0, 0.6); cx(0, 1) observed as Z0 with two-qubit depolarizing noise at 0.06 on the cx and one-qubit depolarizing noise at 0.03 on the h, the two training points read ideal 0.0 and -1.0 against noisy -5.6e-17 and -0.936000001, so the fitted slope is the reciprocal of the shrinkage the model applied, 1.068376067, and the target's exact -0.564642473 is read as -0.528505356 unmitigated and recovered to 4.4e-16 mitigated -- a two-point fit, so that agreement is an arithmetic identity and the residual is reported as absent rather than as evidence. Demonstration scale: two-wire circuits on the CPU density-matrix path with at most three training points in these measurements. No performance, scaling, hardware or fault-tolerance claim follows from it, and no advantage over sampling the target directly is claimed."
