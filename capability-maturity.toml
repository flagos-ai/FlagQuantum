[capabilities.program_compilation]
title = "Program optimization and target-aware compilation"
summary = "Transform one FlagQuantum IR program without executing it: canonical optimization, logical layer scheduling, and lowering onto an explicit coupling topology."
category = "build_and_compile"
user_goals = ["Optimize a program without changing its numerical result", "Compile a program onto a constrained connectivity", "Inspect schedule layers and routing decisions before execution"]
public_apis = ["flagquantum.compiler.optimize", "flagquantum.compiler.compile", "flagquantum.compiler.route_to_topology", "flagquantum.compiler.schedule_layers", "flagquantum.compiler.CouplingMap", "flagquantum.compiler.plan_trivial_layout", "flagquantum.compiler.plan_dense_layout"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "not_applicable"
quick_start = "examples/compiler_optimize.py"
documentation = "flagquantum/compiler/README.md"
level = "production_supported"
owner = "compiler maintainers"
limitations = "In-process transformation of one FlagQuantum IR v1 program on CPU; the compiler never executes a program or certifies hardware behavior. optimize() removes identity gates, merges self-inverse runs, and merges adjacent rotations to a fixed point. compile() runs that same fixed point, optionally routes onto one explicit CouplingMap, optimizes again, and records post-routing optimization. Routing offers four caller-selected strategies: restore_after_each_gate, persistent_layout, sabre, and sabre_layout. All four restore the identity logical order at the program output, so a caller cannot ask for an unrestored final permutation, and the cost-estimate automatic selection covers only restore_after_each_gate and persistent_layout because the two SABRE strategies plan SWAPs instead of estimating them; the topology is always caller-supplied and never discovered. Initial placement is planned separately: plan_trivial_layout places logical wire i on physical wire i, and plan_dense_layout places the program on the most densely connected window of device wires a breadth-first walk from every physical wire finds, which is the only placement that can help on a device with unequal connectivity and the only one of the two that can reach a program the lowest wires cannot hold at all. That walk is a heuristic and not an exact optimum: over 55 device and program-width combinations it matched an exhaustive search of every connected window 45 times and returned a window with one fewer internal connection the other 10 times. Both return a placement as a tuple of physical wires, one per logical wire, which is what route_to_directed_topology takes as initial_layout; final_layout reports the assignment a routed program ended on as a Layout, and a route that allocates workspace on a device wider than the program reports the device width there with its idle slots as None in physical_to_logical. Both placements collapse to the identity on a device no wider than the program. Neither reaches route_to_topology, which refuses an initial_layout because a plain CouplingMap routes only over wires the program owns; a non-identity placement requires a DirectedCouplingMap, whose physical workspace owns the idle slots and is cleaned by the inverse routing SWAPs, and it is passed to route_to_directed_topology or to legalize_circuit_topology. remove_layout_restore drops the appended logical-restore phase from a program that was already routed, halving the SWAP count over a batch of random programs for persistent_layout because that strategy's restore is a full reverse replay of its forward SWAPs and leaving restore_after_each_gate unchanged because its restores are interleaved with the program, and its result is a program for a local simulator or a provider that accepts per-physical-wire results rather than deployable routing evidence: the deployment routing contract rejects it and the deployment entry points treat it as unrouted and route it again. Window selection is greedy over device connectivity and never estimates routing cost, so it can cost more SWAPs than the trivial placement on a program whose interactions prefer a sparser window, and it is not noise- or calibration-aware. Scheduling constructs deterministic logical ASAP layers with explicit wire and classical-data dependencies; it is not target timing or pulse scheduling. There is no directed acyclic graph intermediate, no composable pass manager, no pass analysis or preservation metadata, and no in-repository pass extension point: canonicalization functions are pipeline internals, and an installed external compiler is selected by name through the extension SDK rather than composed as a pass. Pulse-level, calibration-aware, and parameter-aware compilation, dynamic-circuit control flow, and noise-aware optimization beyond lower_noise_model are unsupported. The structured hybrid program slice under flagquantum/compiler/_hybrid is private and absent from public exports. Compilation is single-process; no distributed or multi-device compilation path exists."
focused_tests = "tests/integration/test_compiler_optimize_golden_path.py"
integration_tests = "tests/integration/test_target_aware_compilation_golden_path.py"
hardware_evidence = ".github/workflows/ci.yml"
operational_runbook = "flagquantum/compiler/README.md"

