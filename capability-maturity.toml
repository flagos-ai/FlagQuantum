[capabilities.two_node_mps_training]
title = "Two-node MPS training"
summary = "Shard one logical matrix product state by site across two hosts and keep gradient, optimizer, and checkpoint semantics that a single host would produce."
category = "distributed_execution"
user_goals = ["Train one MPS workload across two nodes", "Resume a multi-node MPS run from its checkpoint", "Inspect inter-node site-boundary communication and rank placement"]
public_apis = ["plan", "flagquantum.experimental.distributed.train_distributed_mps"]
runtime_modes = ["distributed_mps"]
hardware = ["multi_node", "nvidia_a800_sxm4_80gb"]
gradient_support = "exact"
distribution_semantics = "sharded_across_ranks"
quick_start = "docs/guides/MULTINODE_RUNBOOK.md"
documentation = "docs/development/TESTING.md"
level = "production_supported"
owner = "MPS maintainers"
limitations = "Scope is the recorded pair: two A800 hosts with one device per host, one six-wire complex128 circuit, and a bond limit that truncates nothing. Site-boundary exchange, an exact reverse gradient with the layer halo prefetched over the inter-node transport, an owner-sharded optimizer step, and a checkpoint resumed by a restarted run all executed on that pair, and the run reports scalability_claim_allowed and release_gate_allowed false with two blockers attached. The route was observed on the RoCE fabric and five synchronized forward samples were recorded after two warmups, so the fabric and a repeated measurement are evidence rather than assumptions; congestion and capacity were still not measured. The cut width was swept rather than declared: the recorded workload's Schmidt profile is flat at rank two, so the sweep binds a circuit of its own whose profile is not, and re-runs the same reverse under every site plan the launched shape can hold with a boundary moved, comparing each leg with the exact complex128 expectation and gradient. At two ranks that is five placements across widths two and four, each of which carried bytes over the inter-node transport; at a wider shape the same leg walks each rank boundary in turn, but a plan at more than two ranks carries several boundaries at once and is named by the heaviest of them, so no wider shape is recorded here and no leg claims a bond it did not carry. The whole MPS is exported as the product of a leg of its own, through the runtime's own gather, and each gathered state is compared with the single-device reference as it is taken, so the export is a materialization the workload needs rather than a gather taken to check an answer; that observation closed the full-state-gather blocker. The profiled measurement region contains explicit host transfers that keep a blocker of their own, and that blocker was re-measured rather than restated: every one of the region's thirty-six explicit transfers was attributed to the call site that issued it, and none of them stages a rank payload -- fourteen are the load-balancing cost probe, five are the point-to-point control descriptor read back to size a receive buffer, four are the truncation record exchange the global error budget policy reads, and five are end-of-forward reporting, while the one rank-payload staging site this text used to name, the per-site host-to-device lift in _device_footprint, was repaired before the measurement was taken. The profiler classifies an explicit transfer by event name and count, so a one-scalar readback is one event exactly as a staged tensor is, and the blocker stands for a control-plane readback profile rather than for staging; freezing ownership by setting rebalance_threshold to infinity removes all fourteen of the load-balancing reads and is not a fix, because the same measurement shows it raising the boundary gate count from three to four and the boundary message count from six to eight, so it would report a cleaner profile while moving more bytes over the fabric. Topologies wider than one device per host run on the lane but are not recorded, so this evidence does not establish behaviour as nodes are added. The layer halo crosses the host boundary only on the compiled site-kernel path, which the checkpointed training legs deliberately do not take,  A separate release campaign then measured the construction this capability would have to certify, and its outcome is recorded here rather than promoted. The frozen matched-speed ladder was timed at revision 653b85ce3b25b3eda8b75bfb0d5a861416e9c579 with a single-device leg at world one and a sharded leg at world eight over four devices on each host, and the sealed candidate under benchmarks/results/smoke/release_candidates/mps_matched_speed_4x2 reports speedups of 1.0624, 1.0705, 1.0879, 1.0940 and 1.1060 across the ladder's 512-site to 8192-site rungs, with the acceptance rung's interval [1.0836, 1.1096] wholly above one. Because the gate refuses it, that candidate is sealed as provenance evidence rather than as a release payload: its signed envelope names revision 653b85ce, the device each rank ran on and the raw log's digest, and its payload carries the whole measured ladder, but it sets no scalability claim, so a reader finds a measurement the release contract refused rather than a claim it accepted. The gate reads that set and refuses it with six blockers: missing_release_world_sizes, because the frozen release world is sixteen devices, six and seven devices were idle on the two hosts, and no evidence scope admits the twelve-device deployment that would fit, so the widest leg this pair can seal is eight; missing_statistically_significant_speedup_artifact, because the ratio clears the frozen minimum of 1.05 and its interval [1.0836, 1.1096] excludes one, while the measured scaling efficiency of 0.138 falls short of the frozen 0.5 at these rung sizes; that shortfall is arithmetic rather than incidental, because the producer defines scaling_efficiency as the speedup divided by the world size and the gate requires at least the frozen 0.5 of it, so the acceptance rung has to run at least twice as fast per rank as one device; at the frozen release world of sixteen that is a speedup of 8.0 over one device, against the 1.1060 the widest leg this pair sealed actually reports at eight. Closing a 7.2x gap is a requirement on the workload's parallel content, which the ladder does not have: every rung fits inside one device's memory at the frozen bond, so adding ranks divides neither the states nor the arithmetic the way the frozen acceptance efficiency assumes, and the eight-device leg already spends most of its time on work no rank can share; missing_multinode_correctness_artifact and missing_sharded_training_ownership, which read the production set and find it empty; capacity_premise_not_established, which needs a sixteen-rank completion; and capacity_premise_evidence_not_verifiable, which the frozen premise itself discloses because two of its sources are absent. The production set is empty by construction, so local_world_size_mismatch, which an earlier seal reported from four devices per host against the frozen eight, is also unbound rather than retracted: what the gate cannot read in a provenance-only seal is a claim, not the measurement, and the four-devices-per-host reading stands in the payload's own local_world_size and rank_placement. Each blocker above is a residual of this hardware or of the frozen protocol rather than a reading a later run could retract. The single-device capacity baseline that premise rests on was re-measured and re-sealed at the same revision and is carried in the checkout under benchmarks/results/smoke/release_candidates/mps_single_gpu_capacity, so the frozen workload body, the parameter count and the recorded peak all bind to the construction that was actually exhausted rather than to a toy one. A second refuser disagrees about why the same candidate is inadmissible, and the disagreement is recorded here because it is a contract conflict rather than a measurement. The seal that carried a release claim, committed at revision 75fc1ad5, was read by the strict claim audit and reported four defects: optimizer_update_semantics absent from the payload; a mps_backward_memory_plan that carries measured per-rank peaks but not the six per-rank byte vectors and rank_memory records the readiness gate reads; a mps_backward_communication_plan whose boundary_edges carry bond, owner_ranks, payload_bytes and transport rather than the boundary_edge_id, left_rank, right_rank, communication_bytes, communication_primitive, topology_tier and topology_route record shape, and no boundary_edge_count; and a fallback_semantics of native_matrix_product_state_path_only, which the release policy's allowlist of none, no_fallback and not_used rejected while the frozen release manifest requires that exact string. That fourth defect was vocabulary rather than measurement: the frozen declaration names the path that ran where the audit's list denies an unnamed one, so the two said the same thing in two words. The audit now reads the frozen declaration as a negation, which is the only resolution that leaves the manifest's own reasoning intact; the three plan-shape defects stand. Re-sealing the same measurements at the same revision without --release-payload left every defect in the payload and removed only the route the default audit took into it: the general scan over benchmarks/results now reports the candidate as valid evidence that allows no scalability claim, because a payload that claims nothing is not a claim to audit. The defects are not gone and they are reachable today: the strict scan reads every payload it is given through validate_distributed_claim_evidence whatever the payload claims, so auditing a directory holding only this candidate with --require-scalability now reports it invalid with five errors -- the absent claim and the missing claim type, then optimizer_update_semantics, the backward memory plan and the backward communication plan, which are the three defects the fallback declaration was never part of. The backward memory and communication plan shapes are additionally pinned by tests/benchmark_contract/test_mps_release_gate.py, which asserts the mps_backward record shapes the payload does not carry. Those three are a producer and consumer mismatch rather than a protocol conflict: the audit demands the per-rank vectors a planner emits, and the native PyTorch MPS path this capability's frozen manifest names emits measured peaks instead. Building the native plan is unstarted work, and it would not move the gate on its own, because the sixteen-rank world remains out of reach on this pair."
focused_tests = "tests/unit/test_mps_reverse_contracts.py"
integration_tests = "tests/team/runtime/test_cuda_multinode_mps_probe.py"
hardware_evidence = "artifacts/cuda_multinode_mps_a800_jp171_jp172_20260930.json"
operational_runbook = "docs/guides/MULTINODE_RUNBOOK.md"

