[capabilities.two_node_statevector_training]
title = "Two-node statevector training"
summary = "Shard one logical statevector workload across two hosts and keep gradient, optimizer, and checkpoint semantics that a single host would produce."
category = "distributed_execution"
user_goals = ["Train one statevector workload across two nodes", "Resume a multi-node statevector run from its checkpoint", "Inspect inter-node statevector communication and rank placement"]
public_apis = ["plan", "flagquantum.experimental.distributed.train_distributed_statevector"]
runtime_modes = ["distributed_statevector"]
hardware = ["multi_node", "nvidia_a800_sxm4_80gb"]
gradient_support = "exact"
distribution_semantics = "sharded_across_ranks"
quick_start = "docs/guides/MULTINODE_RUNBOOK.md"
documentation = "docs/development/TESTING.md"
level = "release_certified"
owner = "PyTorch distributed maintainers"
limitations = "Certified scope is the recorded pair: two A800 hosts, up to four devices per host, and a matched statevector training workload of 22, 24 and 26 wires at depths 8, 12 and 16 with cross-shard gate fractions up to one half. The release gate evaluates the payloads promoted into benchmarks/results/scalability alongside the declared single-device baseline, and the checked-in result audit verifies their signatures and claim evidence; each promoted payload reports release_gate_allowed and scalability_claim_allowed true with an empty error list, and the matched pair leg reports a 5.73x speedup whose 0.95 confidence interval lies wholly above one. Inter-node shard exchange, the exact adjoint gradient, an owner-sharded optimizer step, a checkpoint resumed by a restarted run, and a full-state export all executed on that pair and are recorded by the hardware artifact. The whole amplitude vector is exported as the product of a leg of its own, reassembled by the runtime's own gather, so the readout is a materialization the workload needs rather than a gather taken to check an answer; that observation closed the validation-only full-state-gather blocker. The staging audit profiles the measured region and finds no explicit host transfer in it, which closed the host-staging blocker by measurement rather than by relabelling the region. What the certificate does not cover: the pair is the widest topology any measurement here reaches, and no third host was available, so two_node_pair_only_no_wider_topology stands as the pair's own scope and no measurement on this hardware can retract it; the hardware artifact's own latency leg is recorded at the narrowest rung of the workload this certificate freezes -- twenty-two wires over eight layers, one hundred and seventy-six bound parameters, read from the manifest the artifact names -- so the toy-circuit blocker that once applied to that leg is retired by that observation rather than by withdrawing the word; and GPU clocks, power state, temperature, host memory and fabric congestion are unrecorded, so the numbers describe this pair at the recorded revision and nothing wider. The pair's release world sizes are two, four and eight, all single-host except the matched pair leg, so behaviour as further hosts are added is not established."
focused_tests = "tests/unit/test_statevector_forward.py"
integration_tests = "tests/team/runtime/test_cuda_multinode_statevector_probe.py"
hardware_evidence = "artifacts/cuda_multinode_statevector_a800_jp171_jp172_20260930.json"
operational_runbook = "docs/guides/MULTINODE_RUNBOOK.md"
release_gate = "benchmarks/internal/evidence/statevector_release_gate.py"
release_artifact = "benchmarks/results/scalability"

[[capabilities.two_node_statevector_training.performance_claims]]
id = "multinode-statevector-matched-speed-release-20261003"
title = "Two-node statevector matched-speed release"
artifact = "benchmarks/results/scalability/statevector_matched_speed_pair.json"
artifact_sha256 = "17c80b5b655c990c4fe7ff40fa54706c67a2d6b77a9f7a1a161b5b0a57d849a9"
code_version = "e339c225bd1b246c63994bb17d015b36f0106908"
maturity = "release_certified"

scope = "One logical sharded statevector training workload -- 26 wires, depth 16, one half of the gates crossing a shard boundary -- run as a matched pair on two A800 hosts with four devices per host, against the same workload on a single device. Speedup is the geometric mean over the matched configurations the manifest freezes, timed for one full forward-and-reverse training step, and the 0.95 confidence interval must exclude 1.0. The released set also carries world 2, world 4 and world 8 single-host legs and a capacity-completion leg; the declared single-device baseline is provenance for those legs and is never itself a release payload, because one device has no ranks to shard across."
environment_limitations = "Each sealed payload records the revision it was produced from, the command, the rank-to-device mapping with device UUIDs, the collective backend, the topology fingerprint, the warmup and measured iteration counts, the seeds, the raw log digest and any fallback events, plus world, local world and node counts, per-rank ownership, memory and communication. It does not record GPU clocks, power state, temperature, host CPU or memory, fabric congestion, or the driver version. The recorded fabric is RoCE over mlx5_101 through mlx5_108 on ens22f0 with the NCCL backend, so the numbers describe this pair at this revision and nothing wider."

