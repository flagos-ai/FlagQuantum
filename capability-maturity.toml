[capabilities.circuit_composition]
title = "Construction-time program composition"
summary = "Build a larger program out of smaller ones in place: place one program on chosen qubits, and invert a program, without introducing a second IR."
category = "build_and_compile"
user_goals = ["Place a reusable block on chosen qubits of a wider circuit", "Undo a program by taking its inverse", "Build a subroutine library and compose it into one circuit"]
public_apis = ["flagquantum.Circuit.compose", "flagquantum.Circuit.adjoint"]
runtime_modes = ["not_applicable"]
hardware = ["cpu"]
gradient_support = "not_applicable"
distribution_semantics = "not_applicable"
quick_start = "docs/reference/API.md"
documentation = "docs/reference/API.md"
level = "development_evidence"
owner = "FlagQuantum core maintainers"
limitations = "Both methods are Stable Core additions to the fq.Circuit type, approved by docs/api-changes/FQ-CIRCUIT-COMPOSITION-20261002.md and docs/api-changes/FQ-CIRCUIT-ADJOINT-20261003.md, and the surrounding family is incomplete. Circuit.compose accepts a Circuit or a CircuitIR and appends the other program's instructions to the receiver, rewritten onto the qubits the caller names; with neither argument the placement is the identity over the source width. Composing appends rather than assigns, so a target qubit that already carries instructions is legal and is not overwritten, while two source qubits may not share one target. Placement is explicit and fail-closed: qubits and qubit_map are mutually exclusive, a map must name every source qubit, a repeated, negative or out-of-range target is refused, and mixing batch sizes is refused rather than broadcast. Circuit.adjoint returns a new circuit that undoes one by reversing the instruction order and inverting each instruction from the rule its opcode declares, so an angle is negated, a self-inverse gate is copied, and s, sdg, sx, sxdg, t and tdg pair with their partners. An instruction that carries a matrix is inverted by conjugate transpose of that matrix, and that route is read before the opcode rule because the matrix is what executes; 31 of the 35 registered opcodes invert, the four that do not are the noise channels. A noise channel, a dynamic operation, a classically conditioned instruction, a matrix without a conjugate transpose and an unknown opcode without a matrix are each refused with CapabilityError rather than copied forward. Composition is a rewrite of qubit labels and not a second program description: neither method changes IR_VERSION, both emit instructions the IR already describes, and neither adds a root export, so no existing program changes meaning. control and power belong to this family and are absent: neither has an approved API change proposal, so a multi-controlled or exponentiated form is an owned gap rather than an unimplemented detail. The surface is single-process CPU work on one program with no execution, compilation, routing, noise handling, or scalability claim, and it is not differentiable by itself because composition records instructions rather than evaluating them. contracts/circuit-composition-contract.toml is the authoritative list of these guarantees and of every refusal, and tests/unit/test_circuit_composition_contract.py reads it back against the implementation."
focused_tests = "tests/unit/test_circuit_composition_contract.py"
development_artifact = "contracts/circuit-composition-contract.toml"

