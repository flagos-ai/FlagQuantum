user_goals = ["Sample detection events from a noisy memory experiment", "Reproduce a sampling run from a seed", "Decode a sampled syndrome with the model built from the same circuit"]
public_apis = ["flagquantum.qec.sample_memory_circuit", "flagquantum.simulation.stabilizer.sample_noisy_measurements"]
runtime_modes = ["stabilizer"]
hardware = ["cpu"]
gradient_support = "unsupported"
distribution_semantics = "single_process"
quick_start = "flagquantum/qec/README.md"
documentation = "flagquantum/qec/README.md"
level = "development_evidence"
owner = "QEC maintainers"
limitations = "One experiment shape and one noise grammar. The circuit must be a MemoryCircuit, so the sampler is reachable from a code record and not from an arbitrary annotated circuit; the noise must be a PhenomenologicalNoise, so a data fault at a round boundary and a measurement flip at a check's readout are the only two locations that exist, and each of those two locations can be given its own rate through the record's per-qubit and per-check vectors, so a quiet wire between two noisy ones is sampled as stated. All three data fault families are placed, and they are placed as three locations at one instruction rather than one location named three times: an X fault, a Z fault and a Y fault are three Pauli channels, and the Y fault is one channel whose single non-identity branch carries the Y operator rather than an X fault placed beside a Z fault, because two independent faults fire independently and that is a different mechanism -- the Y replay is exact against the model per family and per wire, the marginal rates agree for both the one-channel and the two-channel reading, and the pair rates are what separate them, so a regression that merged the three would be reported by a comparison the record itself supplies. The Z fault propagating to the X-type checks the way the X fault propagates to the Z-type ones is a property of the circuit the sampler executes and not of the placement, so a code that declares one check type reports no detection event for the other basis's fault and the model agrees. What has no location to be placed at is a channel placed after a named gate, and a depolarizing or damping channel, and the per-check vector is resolved against the code's check count before any placement is derived, so a profile that names the wrong number of checks is refused rather than silently read against the wrong one. Placement is derived from the lowered program rather than written into the experiment, because the bounded hybrid capture refuses a channel call in the source; the derivation requires the program to lower to `rounds` identical round blocks that measure every check once in the code's declared check order, and refuses a program that does not, so an experiment whose round structure differs is declined rather than sampled. The sampler executes on the stabilizer engine, so it requires the optional `stim` distribution and inherits the engine's opcode set: exactly the thirteen Clifford opcodes, with a non-Clifford gate refused by name. It shares the code record's Z-memory limit, so an X-type logical observable has no route here. Sampling is not differentiable and returns no gradients. The result is a DemSample like the model's own sampler returns, and the two are deliberately different code paths: the model derives a mechanism's signature from the source while this sampler derives its instruction position from the lowered program, and the tests pin the two to each other rather than having one call the other. A seed reproduces a run on one engine version and one machine instruction set; it does not pin a bit pattern across machines or engine versions. No threshold, no logical-suppression, no fault-tolerance, no real-time and no performance claim follows. The rate this sampler reports is a circuit-sampled rate, and the model's own sampler reports a DEM-sampled one; neither may be reported as the other. What the route produces is checked on the axis a decoding claim needs: tests/benchmark_contract/test_qec_memory_logical_error_rate.py decodes the logical error rate of a repetition code and a rotated surface patch at distances 3, 5 and 7 at three physical rates, on this sampler's detection events against a stim transcription of the same circuit, with one decoding algorithm on both sides and a five-standard-error tolerance asserting the difference of two independently sampled rates. The rate falls from distance 3 to 5 to 7 in all twelve configurations on both sides, and that monotonicity is the whole claim: three distances at three rates estimate no threshold and support no logical-suppression, fault-tolerance or performance claim. The comparison is on aggregate rates rather than on per-shot labels, because both models carry mechanisms of equal weight and a minimum-weight matcher is then free to name different observables for one syndrome at the same weight -- measured at distance three as 38 and 91 disagreeing shots in twenty thousand on the repetition code and 46 in five thousand on the surface patch, with the weight itself agreeing on every shot. The in-tree matcher is not on that path: it enumerates the pairings of a syndrome's defective detectors and refuses more than twenty of them outright, so the reference decoder decodes both sides, and that ceiling is an owned gap rather than a property of this route."
focused_tests = "tests/qec/test_sampling_memory_circuit.py"
integration_tests = "tests/benchmark_contract/test_qec_memory_logical_error_rate.py"
development_artifact = "flagquantum/qec/sampling.py"

