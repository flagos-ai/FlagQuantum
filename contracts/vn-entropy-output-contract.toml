# The two mixed rows. A noisy execution produces the only state in this contract whose
# selection and complement carry different entropies, which is what makes a swapped selection
# a measurable defect rather than a mathematical identity. The rate is 0.25 because the noise
# module stores it as a float32 and then widens it, so a rate that is not exactly representable
# in float32 arrives at the Kraus operators already rounded; at 0.25 the recorded value is
# reproduced bit for bit.
[[baseline]]
name = "damped superposition, the damped qubit"
n_qubits = 2
state = "mixed"
hadamard = [0]
rotations = []
entanglers = []
damping = 0.25
damped_qubit = 0
qubits = [0]
value = 0.19646697846469818
complement_value = 2.2204460492503126e-16

