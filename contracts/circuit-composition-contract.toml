# A controlled form is a different program from the instruction it replaces, so metadata
# that records how that instruction was placed, routed, or optimized does not describe
# the replacement. Dropping it silently would leave a program claiming provenance it does
# not have, so the refusal is the fail-closed reading rather than a copy-forward.
reachable = true
trigger = "an instruction carrying metadata other than is_channel, is_dynamic, or conditions"

[[refusals]]
entry_point = "control"
code = "control_of_opcode_without_a_controlled_form"
exception = "CapabilityError"
message_phrase = "no controlled form is declared for it"
message_source = "flagquantum/core/_composition.py"
# Two spellings reach this one refusal, and they are the same absence: an opcode the
# registry does not know, and an opcode whose declaration names no controlled form. The
# first cannot be built at all -- `Instruction.__post_init__` refuses an unknown opcode
# with no matrix, and one with a matrix takes the refusal above -- so the reachable
# spelling is the second, through an opcode that declares `not_available` while carrying
# no `is_channel` metadata. `from_ir` and a hand-built instruction both produce one; the
# noise channels are the only opcodes that declare `not_available`, which is why the
# census above is the measurement behind this row.
reachable = true
trigger = "a noise-channel opcode recorded without its is_channel metadata"

[[refusals]]
entry_point = "power"
code = "exponent_not_an_integer"
exception = "TypeError"
# The whole opening of the refusal, argument name included, rather than the fragment the
# count arguments of `Circuit(...)` and `Circuit.control` share: two refusals may not be
# frozen to one phrase, and this is the phrase a caller of `power` matches on.
message_phrase = "Circuit power must be an integer, got"
message_source = "flagquantum/circuit.py"
reachable = true
trigger = "power(2.5), power('2'), or power(True)"

[[refusals]]
entry_point = "power"
code = "power_exceeds_instruction_limit"
exception = "ValueError"
message_phrase = "the supported limit is"
message_source = "flagquantum/circuit.py"
# Measured, not assumed: the same 4096 bound is read from
# `flagquantum/core/operator_schema.py::MAX_POWER_REPEATS`, and the contract's
# `max_emitted_instructions` is compared against it, so a message that drifts from the
# constant it reports is a failure here.
reachable = true
trigger = "a program and exponent whose product is more than 4096 instructions"
