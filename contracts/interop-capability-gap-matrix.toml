[[frameworks.capabilities]]
name = "custom_unitary"
status = "unsupported"
evidence = ["custom_unitary_contract", "unsupported.cirq_features"]
reason = "A bounded static MatrixGate mapping is contract_only; the adapter still rejects arbitrary matrix gates until implementation evidence lands."

[[frameworks.capabilities]]
name = "autograd_bridge"
status = "out_of_scope"
evidence = ["autograd_bridge_allowed"]
reason = "Autograd bridging is explicitly outside the static adapter."

[[frameworks.capabilities]]
name = "runtime_execution"
status = "out_of_scope"
evidence = ["runtime_execution_allowed"]
reason = "Runtime execution is explicitly outside the Cirq adapter."

