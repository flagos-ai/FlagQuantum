# Repository contract; see contracts/README.md for ownership and stability.
schema = "flagquantum_interop_capability_gap_matrix_v1"
maturity = "experimental"
source_of_truth = "adapter_contracts"
status_values = ["supported", "partial", "unsupported", "out_of_scope"]
capability_order = [
    "circuit_conversion",
    "operation_coverage",
    "bound_parameters",
    "symbolic_parameters",
    "measurements",
    "noise_channels",
    "dynamic_control",
    "custom_unitary",
    "autograd_bridge",
    "runtime_execution",
]

[[frameworks]]
name = "qiskit"
contract = "contracts/qiskit-interop-contract.toml"
direction = "bidirectional"
next_gap = "Preserve the supported symbolic parameter algebra while expanding dynamic-control conformance beyond one-bit export conditions."

[[frameworks.capabilities]]
name = "circuit_conversion"
status = "supported"
evidence = ["semantics.loss_policy", "verification.integration"]
reason = "Static import and export are implemented with explicit fail-closed conversion reports."

[[frameworks.capabilities]]
name = "operation_coverage"
status = "partial"
evidence = ["operations", "unsupported.flagquantum_opcodes"]
reason = "The mapped gate set excludes aliases and noise-channel opcodes recorded by the adapter contract."

[[frameworks.capabilities]]
name = "bound_parameters"
status = "supported"
evidence = ["semantics.parameter_identity", "operations"]
reason = "Mapped parameterized gates preserve their named scalar parameters."

[[frameworks.capabilities]]
name = "symbolic_parameters"
status = "partial"
evidence = ["semantics.parameter_identity", "unsupported.qiskit_features"]
reason = "Named add, multiply, and negation expressions are supported; other expression operations fail closed."

[[frameworks.capabilities]]
name = "measurements"
status = "partial"
evidence = ["semantics.classical_bit_mapping", "unsupported.issue_codes"]
reason = "Measurement instructions round-trip, while execution measurement requests stay outside circuit conversion."

[[frameworks.capabilities]]
name = "noise_channels"
status = "unsupported"
evidence = ["unsupported.flagquantum_opcodes"]
reason = "FlagQuantum noise-channel opcodes are excluded from the Qiskit circuit mapping."

[[frameworks.capabilities]]
name = "dynamic_control"
status = "partial"
evidence = ["unsupported.qiskit_features", "unsupported.issue_codes"]
reason = "One-bit Boolean export conditions are supported, but control-flow import and broader conditions fail closed."

[[frameworks.capabilities]]
name = "custom_unitary"
status = "partial"
evidence = ["semantics.custom_unitary_scope", "unsupported.qiskit_features"]
reason = "Custom unitaries are limited to one through three qubits."

[[frameworks.capabilities]]
name = "autograd_bridge"
status = "out_of_scope"
evidence = ["verification.policy"]
reason = "The adapter owns format conversion and does not define a training bridge."

[[frameworks.capabilities]]
name = "runtime_execution"
status = "partial"
evidence = ["verification.conformance"]
reason = "Local Qiskit Aer conformance helpers exist, but execution is not the adapter's general runtime contract."

