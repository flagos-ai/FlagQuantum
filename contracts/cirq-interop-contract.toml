cirq_form = "rads=theta"
flagquantum = "ry"
[[operations]]
cirq_symbol = "rz"
cirq_gate_type = "Rz"
cirq_form = "rads=theta"
flagquantum = "rz"
[[operations]]
cirq_symbol = "CNOT"
cirq_gate_type = "CXPowGate"
cirq_form = "exponent=1;global_shift=0"
flagquantum = "cx"
[[operations]]
cirq_symbol = "CZ"
cirq_gate_type = "CZPowGate"
cirq_form = "exponent=1;global_shift=0"
flagquantum = "cz"
[[operations]]
