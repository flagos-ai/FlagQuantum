# Repository contract; see contracts/README.md for ownership and stability.
schema = "flagquantum_cirq_interop_contract_v1"
ir_version = "1.0"
maturity = "experimental"
implementation_status = "implemented"
public_api_available = true
dependency_extra = "cirq"
cirq_core_versions = ["1.6.1", "1.7.0"]
python_minimum = "3.11"
core_import_allowed = false
runtime_execution_allowed = false
autograd_bridge_allowed = false

[semantics]
artifact = "cirq.Circuit"
qubit_mapping = "contiguous_line_qubit_index_equals_flagquantum_wire"
operation_order = "stable_moment_then_operation_order"
moment_packing = "flattened_and_not_preserved"
statevector_order = "explicit_line_qubit_order_with_wire_zero_most_significant"
dtype = "complex128"
parameters = "bound_real_scalars_or_v1_symbolic_arithmetic"
global_phase = "not_represented"
measurements = "execution_plan_not_in_ir"
loss_policy = "fail_closed_unless_allow_lossy_true"

[symbolic_parameter_contract]
implementation_status = "implemented"
public_api_change = false
source_protocol = "cirq_parameter_protocol_with_sympy_expressions"
symbol_discovery = "cirq.parameter_symbols"
binding_reference = "cirq.resolve_parameters"
target_representation = "flagquantum_parameter_or_parameter_expression"
parameter_identity = "unique_name"
supported_nodes = ["symbol", "real_constant", "add", "mul", "neg"]
unsupported_nodes = ["complex_constant", "function", "power", "division_by_unbound_parameter", "unknown_symbol"]
canonicalization = "deterministic_left_fold_after_sympy_canonicalization"
import_failure = "reject_before_instruction_enters_ir"
export_failure = "reject_before_cirq_operation_creation"
issue_code = "unsupported_parameter_expression"
binding_equivalence = "cirq_resolve_parameters_matches_flagquantum_bind_parameters"
external_object_retention = false

[measurement_contract]
implementation_status = "implemented"
public_api_change = false
runtime_execution = "out_of_scope"
capability_gap_status = "partial"
current_rejection_issue_code = "measurement_not_represented"
source_artifact = "cirq.MeasurementGate"
target_instruction = "flagquantum_measure_instruction"
target_encoding = "one_measure_instruction_per_measured_qubit_with_shared_key_metadata"
supported_form = "terminal_measurement_gates_with_distinct_non_empty_keys"
quantum_to_classical_cardinality = "one_classical_bit_per_measured_qubit"
measurement_key_source = "cirq.MeasurementGate.key"
measurement_key_identity = "non_empty_exact_string_without_rewrite"
measurement_key_uniqueness = "required_per_circuit_across_measurement_gates"
measurement_key_owner = "flagquantum_ecosystem_cirq_adapter_preserving_the_cirq_key"
qubit_order_source = "cirq.MeasurementGate.qubits"
qubit_order_target = "per_key_instruction_sequence_in_source_qubit_order"
classical_bit_assignment = "contiguous_block_per_key_in_source_qubit_order"
classical_bit_counter_scope = "circuit_global_monotonic"
classical_bit_index_base = 0
classical_bit_reuse = "forbidden"
classical_bit_owner = "flagquantum_ecosystem_cirq_adapter"
metadata_owner = "flagquantum_ir_instruction_metadata"
metadata_fields = ["classical_bit", "measurement_key"]
terminal_requirement = "every_measurement_follows_all_non_measurement_operations"
external_object_retention = false
rejected_forms = ["mid_circuit_measurement", "measurement_invert_mask", "measurement_confusion_map", "duplicate_measurement_key", "empty_measurement_key", "measured_qid_dimension_above_two", "unrecognized_measurement_gate_form"]
rejection_issue_codes = ["measurement_not_terminal", "measurement_invert_mask_not_representable", "measurement_confusion_map_not_representable", "duplicate_measurement_key", "measurement_key_empty", "measurement_qid_dimension_not_representable", "measurement_not_representable"]
acceptance_criteria = ["terminal_only_measurement_rejection_is_enforced", "measurement_key_qubit_order_and_classical_bits_round_trip", "multi_qubit_gate_expands_to_one_instruction_per_qubit_in_source_order", "classical_bit_counter_is_circuit_global_and_never_reused", "cirq_and_sympy_objects_remain_outside_core_ir", "no_second_registry_or_public_api_is_introduced"]

[custom_unitary_contract]
implementation_status = "contract_only"
public_api_change = false
runtime_execution = "out_of_scope"
capability_gap_status = "unsupported"
current_rejection_issue_code = "unsupported_operation"
source_artifact = "cirq.MatrixGate"
source_matrix_protocol = "cirq.unitary"
target_instruction = "flagquantum_instruction_with_matrix"
target_opcode = "unitary"
supported_width_qubits = [1, 2, 3]
qid_shape = "all_dimensions_equal_two"
matrix_shape = "two_dimensional_square_2_pow_n"
matrix_target = "detached_cpu_torch_complex128_owned_copy"
matrix_basis_order = "identity_first_operation_qubit_is_most_significant"
wire_order = "cirq_operation_qubits_source_order"
global_phase = "preserved_in_matrix"
unitarity_check = "u_dagger_u_equals_identity"
unitarity_rtol = 1e-5
unitarity_atol = 1e-8
finite_values_required = true
cirq_name_handling = "non_semantic_and_not_preserved"
external_object_retention = false
rejected_forms = ["custom_unitary_above_three_qubits", "custom_unitary_qid_dimension_above_two", "invalid_custom_unitary_shape", "invalid_custom_unitary_values", "non_unitary_custom_matrix", "unavailable_custom_unitary_matrix"]
rejection_issue_codes = ["custom_unitary_width_exceeds_limit", "custom_unitary_qid_dimension_not_representable", "invalid_custom_unitary_shape", "invalid_custom_unitary_values", "non_unitary_custom_matrix", "custom_unitary_not_representable"]
acceptance_criteria = ["one_two_and_three_qubit_matrix_gates_round_trip", "asymmetric_two_and_three_qubit_matrices_preserve_local_basis_order", "reordered_sparse_wires_preserve_operation_qubit_order", "each_rejected_form_fails_closed_with_its_recorded_issue_code", "imported_matrix_is_an_owned_detached_cpu_complex128_tensor", "cirq_and_numpy_objects_remain_outside_core_ir", "no_second_registry_or_public_api_is_introduced"]

[unsupported]
flagquantum_opcodes = ["sdg", "tdg", "sx", "sxdg", "phase", "u1", "u2", "u3", "cy", "crx", "cry", "crz", "cphase", "rxx", "ryy", "bit_flip", "phase_flip", "depolarizing", "amplitude_damping"]
cirq_features = ["arbitrary_qid_dimensions", "circuit_operations", "classical_controls", "global_phase_operations", "matrix_gates", "noise_channels", "non_contiguous_line_qubits", "non_line_qubits", "operation_tags"]
issue_codes = ["duplicate_measurement_key", "global_phase_not_represented", "idle_wire_extent_not_represented", "measurement_confusion_map_not_representable", "measurement_invert_mask_not_representable", "measurement_key_empty", "measurement_not_representable", "measurement_not_represented", "measurement_not_terminal", "measurement_qid_dimension_not_representable", "moment_structure_flattened", "non_contiguous_line_qubits", "non_line_qubit", "unsupported_operation", "unsupported_parameter_expression", "unsupported_parameter_value"]

[verification]
policy = "tests/unit/test_cirq_interop_contract.py"
sdk_lane = ".github/workflows/ci.yml"
integration = "tests/test_cirq_interop.py"
conformance = "tests/test_cirq_interop_conformance.py"
core_isolation = "tests/unit/test_cirq_interop_boundary.py"

