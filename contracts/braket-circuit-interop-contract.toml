# Repository contract; see contracts/README.md for ownership and stability.
schema = "flagquantum_braket_circuit_interop_contract_v1"
ir_version = "1.0"
maturity = "experimental"
implementation_status = "implemented"
public_api_available = true
dependency_extra = "braket"
amazon_braket_sdk_versions = ["1.117.0", "1.127.1"]
python_minimum = "3.11"
core_import_allowed = false
runtime_execution_allowed = false
cloud_submission_allowed = false
autograd_bridge_allowed = false

[semantics]
artifact = "braket.circuits.Circuit"
direction = "bidirectional_static_circuit"
qubit_mapping = "braket_integer_qubit_index_equals_flagquantum_wire"
wire_extent = "explicit_identity_preserves_unreferenced_flagquantum_wires"
operation_order = "braket_instruction_order"
statevector_order = "ascending_braket_qubits_with_wire_zero_most_significant"
dtype = "complex128"
parameters = "bound_finite_real_scalars_only"
global_phase = "not_represented"
measurements = "execution_plan_not_in_static_circuit_ir"
loss_policy = "fail_closed_unless_allow_lossy_true"

[unsupported]
flagquantum_opcodes = ["u1", "u2", "crx", "cry", "crz", "bit_flip", "phase_flip", "depolarizing", "amplitude_damping"]
braket_features = ["compiler_directives", "free_parameters", "gate_calibrations", "global_phase", "measurement_instructions", "noise_instructions", "pulse_gates", "result_types", "verbatim_boxes"]
issue_codes = ["gate_calibration_not_represented", "measurement_not_represented", "non_finite_parameter", "non_real_parameter", "result_type_not_represented", "symbolic_parameter_not_supported", "unsupported_instruction", "unsupported_operation", "wire_extent_not_represented"]

[verification]
policy = "tests/unit/test_braket_interop_contract.py"
integration = "tests/test_braket_interop.py"
conformance = "tests/test_braket_interop_conformance.py"
core_isolation = "tests/unit/test_braket_interop_boundary.py"

[[operations]]
braket_gate_type = "I"
braket_form = "Circuit().i(target)"
flagquantum = "i"
[[operations]]
braket_gate_type = "X"
braket_form = "Circuit().x(target)"
flagquantum = "x"
[[operations]]
braket_gate_type = "Y"
