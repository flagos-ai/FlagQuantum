# Coverage policy enforced by tools/check_coverage.py.
#
# Modules excluded from measurement entirely (optional-dependency kernels and
# the benchmark CLI) are omitted in .coveragerc instead; this file only carries
# floors for packages that are measured.
#
# [global].min        — overall line-coverage floor (percentage).
# [packages.<name>]   — per-directory floor, enforced on top of the global floor.
#                       The key is the package name as coverage.xml reports it,
#                       which is one directory's **own** files (subdirectories
#                       carry their own entry) relative to the measured source
#                       root (`flagquantum/`), so it carries no `flagquantum.`
#                       prefix and a misspelling fails closed rather than
#                       clearing its own floor.
#
# Every measured directory at 60 or above carries a floor. Directories below 60
# are deliberately left unfloored: their gaps stay visible as outstanding work
# rather than being written into the policy as an accepted level. A directory
# floor below the global floor still earns its place, because the global floor is
# an aggregate that a well-covered directory can carry on its own.
#
# The floors were last set on 2026-09-17 at five points below the measured value,
# which the coverage job reported as 81.7% globally, so an unrelated refactor has
# room to move while a real regression fails. Raise a floor when the measured
# coverage grows past it; a floor may not be lowered without replacing the
# coverage it gave up.
#
# The `jax` subpackages are covered only while their tests stay selected by the
# `jax` marker (see the coverage job's marker expression), so their floors also
# guard the marker wiring itself: a test file that loses its marker drops the
# package below its floor instead of quietly leaving the measurement. The same
# holds for every entry: a test that loses its marker, or is added without one,
# leaves the measurement — `tests/unit/test_test_reachability_policy.py` rejects
# that, and these floors are the second line of defence.

schema = "flagquantum_coverage_policy_v1"

[global]
min = 76

[packages]

[packages."."]
min = 85

