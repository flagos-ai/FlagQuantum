# Coverage policy enforced by tools/check_coverage.py.
#
# Modules excluded from measurement entirely (optional-dependency kernels and
# the benchmark CLI) are omitted in .coveragerc instead; this file only carries
# floors for packages that are measured.
#
# [global].min        — overall line-coverage floor (percentage).
# [packages.<name>]   — per-directory floor, enforced on top of the global floor.
#                       The key is the package name as coverage.xml reports it,
#                       which is one directory's **own** files (subdirectories
#                       carry their own entry) relative to the measured source
#                       root (`flagquantum/`), so it carries no `flagquantum.`
#                       prefix and a misspelling fails closed rather than
#                       clearing its own floor.
#
# Every measured directory at 60 or above carries a floor. Directories below 60
# are deliberately left unfloored: their gaps stay visible as outstanding work
# rather than being written into the policy as an accepted level. A directory
# floor below the global floor still earns its place, because the global floor is
# an aggregate that a well-covered directory can carry on its own.
#
# `ecosystem.qiskit` is the one exception to that reading. At 31.6% it is not
# outstanding work: the coverage job excludes the `qiskit` marker because
# Qiskit's native libraries cannot be loaded in that process at all (see the
# note in `docs/development/TESTING.md`), so the measurement only ever sees the
# module import and a floor here would be measuring the exclusion, not the code.
# Its tests run in full in the `qiskit-optional` job, which does not measure
# coverage.
#
# The floors were last set on 2026-09-17 at five points below the measured value,
# which the coverage job reported as 81.9% globally, so an unrelated refactor has
# room to move while a real regression fails. Raise a floor when the measured
# coverage grows past it; a floor may not be lowered without replacing the
# coverage it gave up.
#
# The `jax` and `pennylane` subpackages are covered only while their tests stay
# selected by the coverage job (see its install line and marker expression), so
# their floors also guard that wiring: a test file that loses its marker, or an
# extra dropped from the install line, lets every one of its tests skip and drops
# the package below its floor instead of quietly leaving the measurement. The
# same holds for every entry: a test that loses its marker, or is added without
# one, leaves the measurement — `tests/unit/test_test_reachability_policy.py`
# rejects that, `tests/unit/test_lane_dependency_policy.py` rejects the
# install-line half, and these floors are the second line of defence.

schema = "flagquantum_coverage_policy_v1"

[global]
min = 76

[packages]

[packages."."]
min = 85

# A new directory whose every line the matrix-level tests above exercise. The floor starts
# where the first PR measured it and may only be raised from here.
