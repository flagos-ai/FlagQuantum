# Repository contract; see contracts/README.md for ownership and stability.
#
# Purpose: one machine-readable registration of FlagQuantum's native gradient
# capability, in place of the three separate places that described it.
#
# The three places are the split real/imag statevector profiles (which report
# `gradient_method = parameter_shift`), the P5 autograd bridge (which reports
# `backward_method = parameter_shift`), and the reversible adjoint behind the
# distributed statevector reverse executor (which reports `gradient_method =
# statevector_adjoint`). None of the three could see the other two, and none of
# them was compared with the vocabulary the public entry point accepts.
#
# Reading all of them together is what makes the real defect visible. The
# identifier `gradient_method` carries two unrelated concepts: the
# differentiation route, and the backward rule of a tensor-factorization split
# (`projected_stop_subspace` / `none`). Within the differentiation route the
# vocabularies disagree three ways:
#
#   * `parameter_shift` is the only name the executors, the benchmark table and
#     the public API all agree on.
#   * `statevector_adjoint` is declared by the reverse executor, by twenty rows
#     of the benchmark table and twice by the hybrid compilation contract -- and
#     it is not a public method name. Asking for it is refused as `unknown
#     gradient method`, so the message a caller gets says the method does not
#     exist while the capability is implemented and reachable as autograd's
#     backward pass. Asking for `adjoint` instead gets the honest refusal below.
#   * the route the public API calls `autograd` is declared twice more under two
#     other names, and one of them is a sentence rather than an identifier.
#
# Four of the five public method names are declared by no capability block at
# all, and every one of them is served. The asymmetry runs both ways -- a
# declared name that no caller can request, and a served name that nothing
# declares -- and neither direction is checked by anything today. This file
# checks both, which is the part that was missing rather than the registration
# itself.
#
# `[[alias]]` is the single registration of the correspondence, and it is what
# makes the gate fail closed. Every differentiation-route value that appears in
# the declaration census or in the engine table must have an alias row, so a new
# declaration -- in code, in the benchmark table or in a contract -- turns the
# gate red until it is registered here. An empty `public_method` is the record
# that the declared value is not a method any caller can request.
#
# This file changes no implementation and no public surface. It registers what is
# declared, and the gate re-derives each declaration rather than trusting it.
