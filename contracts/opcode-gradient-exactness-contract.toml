# Repository contract; see contracts/README.md for ownership and stability.
#
# Purpose: the per-opcode exactness of the `parameter_shift` route across every
# execution mode that can serve an expectation value.
#
# `contracts/gradient-methods-contract.toml` fixes the *method* axis and
# `contracts/parameter-shift-coverage-contract.toml` fixes the remote-safe *batch*
# profile. Neither answers the question this file answers, which is the one the plan
# actually asks for: for every opcode whose derivative rule is declared, is the
# analytic rule the one the implementation applies, in every mode the caller can
# reach, and not just in the default one. A rule can be right in `statevector` and
# wrong in `mps` because the modes are separate executors, so an exactness claim
# that covers one mode is a claim about one executor.
#
# Three routes are compared per cell, and the third is not decoration. `autograd`
# and `parameter_shift` can agree while both being wrong, because they can share the
# same analytic rule -- measured agreement between them is not evidence that the
# rule is right. The tie-breaker is a Richardson-extrapolated central difference
# built from `fq.run` alone, which reads the derivative out of the loss surface and
# shares no code with either route. `[difference_scheme]` records the scheme and
# states that its step is a probe choice rather than a declared quantity.
#
# The opcode set is derived from `OperatorSchema.differentiable`, which is itself
# derived from the declared frequency sets, so an opcode that gains a rule joins this
# contract by existing and fails the gate until it is measured here. The mode
# vocabulary is read from `flagquantum/runtime/options.py::_MODES` for the same
# reason: a new mode is a new column this file has to account for.
#
# `stabilizer` is not a column. It refuses every differentiable opcode, with one
# message, before any derivative is attempted: it samples measurement outcomes and
# `parameter_shift` is driven by an expectation value. That is a property of the
# measurement kind and not of any opcode, so it is recorded once as a refusal with
# the file its phrase comes from, instead of fourteen times as an absence.
#
# The batch profile's split is recorded per opcode because it is a real cross-file
# fact with a real consequence: every differentiable opcode is admitted by the
# profile except the three whose declared rule needs two evaluation pairs and the
# profile's `max_evaluation_pairs` is one. Reading the two files side by side is how
# that is found; neither file says it alone.
schema = "flagquantum_opcode_gradient_exactness_contract_v1"
maturity = "development_evidence"
implementation = "flagquantum/gradients.py"
declaration_source = "flagquantum/core/operator_schema.py"
mode_source = "flagquantum/runtime/options.py"
batch_profile = "contracts/parameter-shift-coverage-contract.toml"
authorization = [
    "docs/api-changes/FQ-GRADIENT-OPCODE-EXACTNESS-20261028.md",
]

# Read from the implementation rather than copied, so the gate can prove it read the
# same declaration this file records.
declaration_vocabulary = [
    "OPERATOR_SCHEMAS",
    "OperatorSchema.parameters",
    "OperatorSchema.parameter_frequencies",
    "OperatorSchema.differentiable",
    "OperatorSchema.shift_rule",
]

declared_methods = ["auto", "autograd", "finite_difference", "parameter_shift", "spsa"]
declared_modes = ["auto", "density_matrix", "mps", "stabilizer", "statevector", "tensor_network"]
# Every differentiable opcode is measured in these five modes. `auto` is a real
# column because it resolves separately, and the four named ones are the modes that
# can serve an expectation value at all.
measured_modes = ["auto", "density_matrix", "mps", "statevector", "tensor_network"]
# Modes that serve an expectation value and are nevertheless not columns, with the
# reason. A mode that starts serving must be moved out of this list, which is why the
# list is here rather than a comment.
excluded_modes = [
    { mode = "stabilizer", reason = "samples_measurement_outcomes" },
]

[reference]
# A differentiated gate is only observable through the circuit around it. Every qubit
# is prepared with a fixed rotation, the two entanglers join them, the differentiated
# gate follows, and a closing entangler and rotation turn the measurement basis onto
# the differentiated parameter. Without the closing rotation a phase-type opcode acts
# on a state that differs from `|0...0>` by a scalar phase only, and every
# phase-opcode derivative measures as zero -- which reads as agreement and is not.
qubits = 3
dtype = "complex128"
fixed_rotations = [0.7, 1.1, 0.4, 0.9]
entanglers = ["cx(0, 1)", "cx(1, 2)", "cx(2, 0)"]
# Parameter `i` of a differentiated opcode is evaluated at `evaluation_points[i]`.
evaluation_points = [0.3, 0.7, 1.1]
observable = "expectation(Z(0))"
tolerance = 1e-12
cell_count = 70
observability_floor = 3.360360652996e-02
max_parameter_shift_vs_autograd = 3.925231146709e-16
max_autograd_vs_richardson = 1.606145771937e-13
max_parameter_shift_vs_richardson = 1.605798827242e-13
max_cross_mode_spread = 1.221245327088e-15

[difference_scheme]
# The third route. `levels` displacements are halved in turn and `order` Richardson
# levels remove the leading truncation terms, so the scheme is exact to
# `O(base_step ** (2 * (levels - order)))` on a smooth loss and its remaining error
# is round-off in the loss evaluations rather than truncation.
kind = "richardson_extrapolated_central_difference"
levels = 3
order = 2
base_step = 0.01
# The step is chosen by the probe, not declared by the implementation, so it is a
# measured-comparison parameter and not a contract of the derivative rule.
base_step_is_a_probe_choice = true
shares_no_code_with_the_compared_routes = true

[[refusal]]
mode = "stabilizer"
exception = "CapabilityError"
message_phrase = "samples measurement outcomes"
message_source = "flagquantum/runtime/planner/__init__.py"
second_message_source = "flagquantum/runtime/executors/stabilizer/sampling.py"
measured_opcodes_refused = 14
trigger = "any differentiable opcode differentiated through a loss that runs in mode='stabilizer'"
reachable_from = "fq.gradient(..., method='parameter_shift') over a fq.run call with ExecutionOptions(mode='stabilizer')"

[batch_profile_relation]
max_evaluation_pairs = 1
differentiable_opcodes = 14
admitted_differentiable_opcodes = 11
refused_differentiable_opcodes = ["crx", "cry", "crz"]
split_reason = "pair_limit"
refused_only_because_of_the_pair_limit = true

[rules]
one_row_per_differentiable_opcode = true
no_row_for_an_opcode_without_a_declared_rule = true
every_measured_mode_is_a_cell = true
every_cell_re_measured_by_the_gate = true
three_routes_per_cell_with_the_third_independent = true
agreement_between_two_routes_is_not_evidence_alone = true
observability_floor_is_measured_not_assumed = true
excluded_modes_carry_their_reason = true
a_new_opcode_rule_fails_the_gate_until_measured = true
a_new_execution_mode_fails_the_gate_until_measured = true
cross_mode_spread_is_measured_per_opcode = true
no_silent_fallback = true

[verification]
contract = "tests/unit/test_opcode_gradient_exactness_contract.py"
gate = "tools/check_opcode_gradient_exactness.py"
every_cell_is_remeasured_by_the_gate = true
every_opcode_row_is_derived_from_the_declaration = true
refusal_phrase_occurs_in_its_message_source = true
vocabularies_are_compared_with_the_implementation = true
batch_profile_relation_is_remeasured = true

