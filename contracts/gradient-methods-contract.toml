[noise]
channel = "depolarizing"
channel_probability = 0.05
# The precision the noisy axis is measured at, which is the reference program's own. A
# channel's Kraus coefficients are rounded once, when the channel is built, and every
# downstream number inherits that rounding. Built at `complex64` -- the runtime default --
# they are float32, and the noisy gradient moves by 5.2e-08 even where the platform's
# float32 square root rounds like this one, which is 5e04 times the 1e-12 the reference
# gradient is compared at. That is how this block first failed: a float32 channel on a
# platform whose `sqrt(1 - p)` landed one ulp high produced a gradient 7.6e-08 from the
# float64 answer, on the other side of it, and the disagreement reached all four CI jobs
# that read this block. At `complex128` the coefficients carry float64 rounding, 1e-16
# relative, so this block measures the program rather than a platform's float32
# arithmetic. The gate builds its channel at exactly this dtype and holds this field
# against the dtype it actually built.
channel_dtype = "complex128"
attached_to_gate = "cx"
reference_mode = "density_matrix"
reference_method = "parameter_shift"
noisy_reference_gradient = [-1.9430509291292702e-01, -5.290712686660374e-01, 2.6557144774835423e-01]
# `autograd` and `parameter_shift` are both exact, so their agreement under noise is a
# precision claim rather than an accuracy claim, and the gate holds it to the same 1e-12
# it holds the unnoisy reference gradient to. One rounding on the reference program.
noisy_exact_methods_max_spread = 1.6653345369377348e-16
# The largest disagreement between any two of the three deterministic noisy methods, in
# the noisy reference cell (`density_matrix`), which includes `finite_difference`. The two
# exact methods agree to one rounding, so this number is the difference quotient's own
# roundoff and not a disagreement about the derivative, nor an accuracy claim for the
# shift rule. Its natural scale is `2 * eps * |L| / step` -- the two evaluations and
# their difference, divided by the 6.055454452393343e-06 step, which is 4.6e-11 for this
# program's 0.628-magnitude loss -- and the gate allows twice that, 9.2e-11, for the
# arithmetic around the evaluations. The consequence is deliberate: the gate re-measures
# the spread and requires both the measurement and this recording to fall inside that
# floor, so a spread stated orders of magnitude away from what the methods do is a
# failure, while a spread that moved by a few 1e-12 between platforms is not. Comparing
# this number bit-exactly, as an earlier revision of the gate did at 1e-14, measures a
# platform's arithmetic rather than the program's behaviour.
noisy_cross_method_max_spread = 1.6954215809050766e-11
# The measured difference between the two axes at the same mode and method. Recorded so
# that a reader cannot mistake the noisy rows for a repeat of the unnoisy ones.
noisy_minus_unnoisy_gradient = [1.387893520806624e-02, 3.779080490471731e-02, -1.8969389124882496e-02]
noise_narrows_the_reachable_mode_set = true
noise_does_not_change_the_reported_method = true

# Every refusal a caller can reach through `fq.gradient`'s documented surface, with the
# exception class and the phrase its message must contain. There is no issue-code field
# in the implementation, so the phrase is the machine-readable handle and the delivery
# is `exception_class_and_message_phrase` -- the vocabulary
# `contracts/circuit-composition-contract.toml` already uses. Adding a code to the
# implementation would change this field, not add a second one.
[[refusals]]
code = "stabilizer_serves_no_expectation"
exception = "CapabilityError"
message_phrase = "samples measurement outcomes; it cannot serve"
message_source = "flagquantum/runtime/executors/stabilizer/sampling.py"
trigger = "a loss that runs the circuit with options=ExecutionOptions(mode='stabilizer') and asks for an expectation"
reachable_from = ["auto", "autograd", "parameter_shift", "finite_difference", "spsa"]

[[refusals]]
code = "noisy_execution_needs_auto_or_density_matrix"
exception = "ValidationError"
message_phrase = "stable noisy execution supports mode='auto' or mode='density_matrix'"
message_source = "flagquantum/runtime/planner/__init__.py"
trigger = "a loss that passes a noise model to fq.run with a mode other than 'auto' or 'density_matrix'"
reachable_from = ["auto", "autograd", "finite_difference", "spsa"]

[[refusals]]
code = "no_standalone_adjoint"
exception = "CapabilityError"
message_phrase = "no standalone adjoint gradient"
message_source = "flagquantum/gradients.py"
trigger = "fq.gradient(program, parameters, loss, method='adjoint')"
reachable_from = ["method='adjoint'"]

[[refusals]]
code = "unknown_method"
exception = "ValidationError"
message_phrase = "unknown gradient method"
message_source = "flagquantum/gradients.py"
trigger = "fq.gradient(program, parameters, loss, method=<anything outside the declared vocabulary>)"
reachable_from = ["any method outside declared_methods"]

[[refusals]]
code = "method_scoped_arguments"
exception = "ValidationError"
message_phrase = "apply only to method='spsa'"
message_source = "flagquantum/gradients.py"
trigger = "directions != 1 or generator is not None, with a method other than 'spsa'"
reachable_from = ["auto", "autograd", "parameter_shift", "finite_difference"]

[[refusals]]
code = "parameter_shift_needs_the_loss"
exception = "CapabilityError"
message_phrase = "needs the circuit behind the loss"
message_source = "flagquantum/gradients.py"
trigger = "fq.gradient(program, parameters, method='parameter_shift') without loss="
reachable_from = ["parameter_shift"]

[[refusals]]
code = "autograd_needs_a_graph"
exception = "CapabilityError"
message_phrase = "requires the loss to be built from the parameters"
message_source = "flagquantum/gradients.py"
trigger = "fq.gradient(program, parameters, loss, method='autograd') where the loss carries no graph"
reachable_from = ["autograd"]

[[refusals]]
code = "step_must_be_a_positive_displacement"
exception = "ValidationError"
message_phrase = "step must be a positive finite displacement"
message_source = "flagquantum/gradients.py"
trigger = "step <= 0, or a non-finite step, with any method"
reachable_from = ["any method"]

[[refusals]]
code = "directions_must_be_at_least_one"
exception = "ValidationError"
message_phrase = "directions must be at least 1"
message_source = "flagquantum/gradients.py"
trigger = "method='spsa' with directions < 1"
reachable_from = ["spsa"]

[[refusals]]
code = "mode_is_not_reachable_from_the_loss"
exception = "ValidationError"
# The rendered message is f"{name} must be one of: {rendered}", so the phrase recorded
# here is the literal fragment the source contains, not the interpolated sentence.
message_phrase = "must be one of"
message_source = "flagquantum/runtime/options.py"
trigger = "ExecutionOptions(mode=<a name in unreachable_modes>)"
reachable_from = ["any method"]

# One measured asymmetry the matrix would otherwise hide. `_shifted_gradient` catches
# `ValueError` to reframe a program the shift rule cannot answer, and `ValidationError`
# is a `ValueError` while `CapabilityError` is not. So a `ValidationError` raised inside
# a `parameter_shift` loss is reported as "the parameter-shift rule does not apply to
# this program", which names the rule, and the same error inside an `autograd` loss is
# reported as the error it is. The diagnosis is imprecise in the first case: the rule
# does apply, and the loss's arguments are what is wrong. It is recorded here, not
# corrected, because correcting it changes documented exception behaviour in a protected
# module and needs its own authorization.
[[reframings]]
code = "parameter_shift_reframes_a_validation_error"
outer_exception = "CapabilityError"
outer_phrase = "the parameter-shift rule does not apply to this program"
inner_exception = "ValidationError"
applies_to = ["parameter_shift"]
not_applied_to = ["autograd", "finite_difference", "spsa"]
reason = "ValidationError is a ValueError, so the shift-rule wrapper absorbs it; CapabilityError is not, so a stabilizer refusal propagates unchanged"
verdict = "recorded_not_corrected"

[[reframings.instances]]
trigger = "an execution mode name the option layer refuses"
inner_phrase = "must be one of"
measured_refusing_modes = ["distributed_mps", "distributed_statevector", "distributed_tensor_network", "jax_sharded_mps", "jax_sharded_tensor_network"]

[[reframings.instances]]
trigger = "a noise model with a mode other than auto or density_matrix"
inner_phrase = "stable noisy execution supports mode='auto' or mode='density_matrix'"
measured_refusing_modes = ["mps", "statevector", "tensor_network"]

[verification]
contract = "tests/unit/test_gradient_methods_contract.py"
gate = "tools/check_gradient_methods_contract.py"
# The gate re-measures every cell in both axes and refuses a file that no longer
# describes the implementation. The test owns the file's internal consistency and the
# refusal vocabulary. Neither substitutes for the other: the gate answers "is the matrix
# still true", the test answers "is the matrix still well formed".
cell_matrix_is_remeasured_by_the_gate = true
noise_axis_is_remeasured_by_the_gate = true
every_refusal_phrase_occurs_in_its_message_source = true
vocabularies_are_compared_with_the_implementation = true
