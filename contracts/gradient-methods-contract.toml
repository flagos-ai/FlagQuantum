# Repository contract; see contracts/README.md for ownership and stability.
#
# Purpose: the gradient method x execution mode availability matrix of `fq.gradient`,
# in two axes -- an unnoisy program and the same program under a noise model.
#
# `fq.gradient` takes no execution mode. The mode is a property of the caller's loss,
# because the loss is what calls `fq.run`. A matrix shaped like this one would
# therefore be misleading if it were read as a dispatch table: the mode does not select
# a gradient method and the gradient method does not select a mode. What the matrix
# records is which combinations produce a derivative, which refuse, and why.
# `mode_is_not_a_gradient_argument` states that, and this file is where a reader is
# told it.
#
# The method vocabulary is read from `flagquantum/gradients.py::_GRADIENT_METHODS` and
# the mode vocabulary from `flagquantum/runtime/options.py::_MODES`, rather than
# restated, so adding a method or a mode fails the gate until this file is revisited.
#
# `adjoint` is not a row. It is refused before any program is touched, by name, with a
# message explaining the adjoint sweep is reachable only as autograd's backward pass --
# so it is not a per-mode availability question at all. It is recorded in
# `refused_methods` and as a refusal with its own phrase.
#
# `auto` is a row, but not because it has per-mode behaviour: it resolves by measuring
# the loss at the given parameters and reports what it resolved to. `[resolution]`
# records the three measurements it makes.
#
# Accuracy is not uniform across a row and the number is not the signal: `exact` is.
# `parameter_shift` and `autograd` report `exact = true`; `finite_difference` and
# `spsa` report `exact = false` with the displacement they used. `[accuracy]` records a
# measured deviation for each, and for `spsa` a range over seeds, because a single seed
# can land far from the median in either direction.
#
# The noise axis is a separate set of rows rather than a column, because noise is a
# `fq.run` argument and not an `ExecutionOptions` field: a noisy program is a different
# program, not a different mode. Its measured shape is narrower than the unnoisy one --
# only `auto` and `density_matrix` serve -- and that is the most consequential fact this
# file carries, so it is recorded per cell rather than summarized.
#
# Every number in `[noise]` is a measurement at a stated precision and a stated step,
# because those two things are what make it reproducible. A channel's Kraus coefficients
# are rounded once, when the channel is built, so a `complex64` channel moves the noisy
# gradient by 5.2e-08 and a float32 probability moves it by 5.6e-10 -- both far outside
# the 1e-12 this block is compared at. The exact methods' agreement is therefore a
# precision claim and is held to 1e-12; the spread that includes `finite_difference` is
# the step's own roundoff, and is held to a floor derived from that step and from the
# measured loss scale rather than to a literal.

schema = "flagquantum_gradient_methods_contract_v1"
maturity = "development_evidence"
implementation = "flagquantum/gradients.py"
mode_source = "flagquantum/runtime/options.py"
authorization = [
    "docs/api-changes/FQ-GRADIENT-METHODS-MATRIX-20261027.md",
]

# Read from the implementation rather than copied: the gate compares both lists.
declared_methods = ["auto", "autograd", "parameter_shift", "finite_difference", "spsa"]
refused_methods = ["adjoint"]
serving_modes = ["auto", "density_matrix", "mps", "stabilizer", "statevector", "tensor_network"]
# These five names are accepted by the runtime's own mode tables and refused by
# `ExecutionOptions`, so no `fq.gradient` loss can select them. They are listed because
# a reader looking for a distributed gradient row should find the reason it is absent
# rather than conclude the combination was never considered.
unreachable_modes = [
    "distributed_mps",
    "distributed_statevector",
    "distributed_tensor_network",
    "jax_sharded_mps",
    "jax_sharded_tensor_network",
]

[taxonomy]
method_vocabulary = "flagquantum/gradients.py::_GRADIENT_METHODS"
mode_vocabulary = "flagquantum/runtime/options.py::_MODES"
mode_is_not_a_gradient_argument = true
mode_enters_through_the_loss = true
noise_enters_through_fq_run = true
noise_is_not_a_mode = true
reported_method_is_the_method_that_ran = true
exact_flag_is_the_only_accuracy_signal = true
cell_count = 30
serving_cell_count = 25
refusing_cell_count = 5
noise_cell_count = 30
noise_serving_cell_count = 10
noise_refusing_cell_count = 20

[rules]
# Every flag below is a claim this file makes about itself. A flag the gate does not
# read is a flag nobody checks, so each is named in the gate explicitly.
no_silent_fallback = true
refusal_names_the_reason = true
refusal_is_fail_closed = true
approximate_methods_report_their_step = true
statistical_method_reports_a_range_not_a_value = true
step_is_ignored_by_the_exact_methods = true
distributed_modes_are_absent_rather_than_fallback = true
noise_axis_is_a_second_measured_axis = true
vocabulary_is_read_from_the_implementation = true

[reference]
# The one program and one parameter vector every cell in this file was measured with.
qubit_count = 2
parameters = [0.3, 0.7, -0.4]
parameter_dtype = "float64"
program_steps = ["ry(0, theta=p0)", "rx(0, theta=p1)", "ry(1, theta=p2)", "cx(1, 0)"]
observable = "Z(0)"
reference_method = "parameter_shift"
reference_mode = "statevector"
reference_gradient = [-2.081840281210e-01, -5.668620735708e-01, 2.845408368732e-01]

[resolution]
# `auto` is a policy, not a method: it measures the loss at `parameters` and reads the
# result. These three rows are the whole policy, and each was measured.
graph_present = "autograd"
no_graph_with_loss = "parameter_shift"
no_graph_without_loss = "finite_difference"
resolution_is_measured_not_declared = true

[accuracy]
# Deviation from `reference_gradient`, at the reference program. `relative_tolerance`
# is the bound the gate enforces; the measured value is recorded next to it so a silent
# accuracy regression is visible before it trips the bound.
relative_tolerance = 1e-09
autograd_max_deviation = 2.220e-16
parameter_shift_max_deviation = 1.110e-16
finite_difference_max_deviation = 3.749e-11
finite_difference_is_deterministic = true
# `spsa` is an estimator over Rademacher directions, so one seed is not a measurement.
# These rows are the deviation range over 64 seeds, per direction count, and the median
# is the mean of the two central order statistics of an even-sized sample. The reading
# rule is the `exact` flag, not the small number a lucky seed produces: at directions=1
# the median is 8.514e-01, and spending 65 loss evaluations on directions=32 only
# brings the median to 1.147e-01 and the best of 64 seeds to 2.242e-02, while the
# deterministic finite_difference method reaches 3.749e-11 for 7 loss evaluations.
# Nothing measured here makes `spsa` competitive with it on this program, and no cell
# above claims that it is.
spsa_seed_count = 64
spsa_default_directions = 1
spsa_reading_rule = "read the exact flag; a low deviation from one seed is not an accuracy claim"

[[accuracy.spsa]]
directions = 1
loss_evaluations = 3
min_deviation = 4.927e-01
median_deviation = 8.514e-01
max_deviation = 8.514e-01

[[accuracy.spsa]]
directions = 2
loss_evaluations = 5
min_deviation = 2.845e-01
median_deviation = 5.669e-01
max_deviation = 8.514e-01

[[accuracy.spsa]]
directions = 4
loss_evaluations = 9
min_deviation = 3.448e-11
median_deviation = 2.845e-01
max_deviation = 8.514e-01

[[accuracy.spsa]]
directions = 8
loss_evaluations = 17
min_deviation = 3.448e-11
median_deviation = 2.458e-01
max_deviation = 6.380e-01

[[accuracy.spsa]]
directions = 32
loss_evaluations = 65
min_deviation = 2.242e-02
median_deviation = 1.147e-01
max_deviation = 3.018e-01

[cost]
# Measured loss-evaluation counts for the reference program's three parameters, not
# formulas. `one_direction_of_spsa_costs_two_loss_evaluations` is the only cost rule
# that is structural rather than incidental.
one_direction_of_spsa_costs_two_loss_evaluations = true
[[cost.methods]]
method = "autograd"
loss_evaluations = 1
scales_with = "one forward and one backward pass, independent of the parameter count"
[[cost.methods]]
method = "parameter_shift"
loss_evaluations = 6
scales_with = "two loss evaluations per declared shift-rule term"
[[cost.methods]]
method = "finite_difference"
loss_evaluations = 7
scales_with = "two loss evaluations per parameter"
[[cost.methods]]
method = "spsa"
loss_evaluations = 9
directions = 4
scales_with = "two loss evaluations per direction, independent of the parameter count"

