next_action = "The X half the previous revision of this row recorded as dropped is now read. flagquantum.qec.css_code_matrices lifts a code record into flagquantum.qec.CssCodeMatrices, which carries hz, hx, lz and lx together instead of a Z-type pair, so a code with both bases reaches both detector bands and both observable blocks, and flagquantum.qec.SteaneCode is the first record that exercises them. The drop was silent, so it is replaced by a refusal: a logical observable that is neither pure X nor pure Z stops the read with the offending index named rather than being read as one of the two. The colour code has since landed as the first record here whose matrices are not transcribed: flagquantum.qec.triangular_colour_code builds the three-face-colourable triangular patch from its distance alone and returns the same CssCode record, so the family is declared from a rule about its lattice rather than copied out of another framework's source, and its two check families are one matrix because every face carries both stabilizers. The toric code has since landed on the same derivation route, and it widens the route in one direction the patch could not: flagquantum.qec.toric_code identifies the opposite sides of a square grid, so no check is cut down, the linear size is the distance the build must prove, and for the first time in this record set the matrices leave two logical qubits rather than one -- so css_code_matrices reports four logical operators and a default memory experiment declares two observables, which is a change in the shape of the layout rather than in the contents of a row. Both derived families reach a matrix route the other way round as well: examples/qec/css_code_from_matrices.py writes the torus down by hand with a different edge numbering and holds the two descriptions against each other on everything the numbering cannot change, including the full mechanism-weight histogram of the detector error model. The ZXXZ surface has since closed the protocol's own last refusal, and the way it closed is worth recording. A check used to have to be pure, on this row's own earlier reading that a mixture would need a second ancilla and a second CNOT direction; half of that was wrong and the row now states the corrected rule. The second CNOT direction is needed and the second ancilla is not, because the X-factor pairs are controlled by the declared ancilla while the Z-factor pairs control it, so one ancilla measures the product of the two. flagquantum.qec.CodeCheck therefore states one coupling order -- the Z-factor pairs first, then the X-factor pairs -- and flagquantum.qec.ZxxzSurfaceCode is the record built on it: the rotated patch's own wires, ancillas and check weights with every check conjugated by a Hadamard on the data checkerboard, so every check is mixed, none is pure, and the matrix route cannot state the family at all. What running it found is the limit this row records beside the capability: a mixed check's outcome is deterministic neither at the all-zero preparation nor at a Z-basis readout, so no check of the Z-basis experiment is anchored in either place, the experiment carries no detector from a syndrome round to the data, and a mechanism that fires no detector and flips the observable exists at every distance with probability (1 - (1 - 2p) ** d) / 2. Its probability grows with the distance and no pairing decoder can suppress it, so the ZXXZ patch's decoded rate stays above raw / 1.5 at distances three and five while the rotated patch's falls below raw / 4 through the identical harness. That is recorded as a limitation of the record's memory experiment rather than as a decoding result. One of the two family gaps the previous revision of this row recorded has since closed, and the way it closed is why the evidence list grew. flagquantum.qec.bivariate_bicycle_code builds the bivariate-bicycle family from its two polynomials over two cyclic coordinates: one check of each family per group element, so 2 * l * m data qubits and the same number of ancillas, with each check's weight bounded by its polynomial's number of terms rather than by the periods. It is the first record here that derives its logical operators as well as its checks, because a pair of polynomials names no curve a reader could write down; the derivation is a null space taken modulo the stabilizer span, which is why flagquantum.qec.gf2 gained that elimination instead of the family carrying a second copy of one. Two properties of it are worth this row's attention. The logical count is the matrices' rank and not their row count, so a construction that subtracted checks would report no logical qubit at all and refuse the smallest instance. And the derivation returns each family in the order the symplectic pairing puts it, so the record's own lz[i] and lx[i] are partners rather than merely paired in some order. The family was held to a published instance before it was added: over Z_6 * Z_6 with A = x^3 + y + y^2 and B = y^3 + x + x^2 the record reports [[72, 12, 6]], the parameters the literature states for that pair, and the distance search that reports them took about eighteen seconds against no measurable time for the eighteen-qubit member of the same family. The gap that was left was a name rather than a family, and the name has since arrived: flagquantum.qec.qldpc_code takes the two parity-check matrices and returns the record they define, with the logical operators computed out of them. It is the general case of what the bicycle family was already doing for its own pair, so the reading moved rather than doubled: flagquantum/qec/qldpc.py owns the null space taken modulo the stabilizer span and the symplectic elimination after it, and the family calls those two helpers instead of carrying a second copy of them. The route was held to codes whose logical operators are declared elsewhere before it was added, and the parameters alone would not have held it, because a complement of the stabilizer span is not unique: the test requires every derived operator to differ from its declared partner by a check of its own type, which is the claim that the two are the same class rather than merely the same count. Two further properties of it are worth this row's attention. The count is the rank of the matrices and not their row count, so a check written twice adds an ancilla and no logical qubit -- the one place the caller's input and the record's numbers disagree. And the distance is searched over the whole code rather than read off the derived operators, so a representative far heavier than the code's cheapest logical operator still reports the cheaper number: on the distance-three torus one derived Z-type operator spans seven data qubits and the record reports three. What is left on this row's own surface is therefore no longer a route. It is that a named family outside the library still arrives as matrices the caller writes, and the record set has since taken that down to one name: the dynamic-code record has landed, so the two families this sentence used to name are a record each rather than an absence. The dynamic-code record is the second record here that is not a stabilizer code, and the way it differs from the first is the reason it is a third class rather than a field on either. The tesseract's group is one group reached by a different reading of the checks; a dynamic code's group is not fixed at all, because the code is the period of measurements that defines it and its instantaneous stabilizer group changes from round to round while the information it protects does not. flagquantum.qec.MeasurementPhase is a named round of commuting operators, flagquantum.qec.FloquetCode is a period of such rounds together with the settled period the sequence reaches, and flagquantum.qec.ring_floquet_code is the smallest schedule this package publishes. Two rules carry it and both are measured rather than assumed. The first is the propagation rule: the group a round stabilizes is the part of the previous round's group that commutes with every measured operator, and that subgroup is solved for -- one linear equation per measured operator in the old group's coordinates -- rather than read off the old basis one generator at a time, because a product of two generators can commute with a measurement although neither factor does; the smallest witness of the difference is a two-generator group whose product survives a measurement both generators anticommute with, and it is pinned in a test rather than described. The second is that a period is not one group, so both numbers the record reports are read at every round of the period: the count has to be the same number at all of them or the period is refused as not a code, and the least logical weight stated is the lightest of the readings, because a claim about a period has to hold where the period is weakest. The ring's arithmetic is derived rather than stated and it is small: the two-phase ring on n wires settles at period two after one transient round, holds n / 2 + 1 checks, protects n / 2 - 1 qubits and has least logical weight two, and the family was swept to measure the bound instead of asserting it -- five hundred and eighty-five ring schedules of two, three and four phase classes over widths four to twelve all settle, all protect at least one qubit, all read the same count at every round of their period, no member beats weight two, and the three- and four-class rings reach weight one. A schedule that settles protecting nothing is refused by name, which on rings of alternating families is what a period of four does, and the refusal is held beside the accepted schedule of the same width so it is read as a property of the schedule rather than of the letters. What that leaves open is stated rather than implied: the weight this record reports is a settled round's code distance and not a spacetime fault distance, because no detector model is carried here and a fault that is a measurement error in one round and a data error in the next is not one operator. The baseline's own Floquet module carries exactly that gap -- its measurement phases, gauge-measurement maps and record-defined logicals are an authoring surface for such a model -- so what this record answers is the code, and the fault distance is the piece of that module still unclaimed. The rate side of the code-capacity input is no longer a gap either: the noise record carries a per-qubit and per-check override for every fault family, read against the vectors the noise accessors take a count for, so a code reaches a per-location noise profile and not only a uniform one. Note in the same pass that upstream encodes a code as a set of kernels, so aligning to that shape is a decision about this repository's circuit model, not a small addition. The tesseract has since landed as the first record here that is not a stabilizer code, and the reading is what makes it a second record rather than two extra fields on the first: flagquantum.qec.SubsystemCode takes the same four blocks flagquantum.qec.CssCode takes and two more, and the two more change what the four mean, because the tesseract's ten check rows leave six classes and the two gauge pairs claim two of them, so the record reports four protected qubits beside two gauge qubits where the Calderbank-Shor-Steane reading of the very same matrices refuses the family's four declared logical operators for declaring four of a code it counts six of. The protected count is derived from the rank of the check blocks rather than stated, and three conditions are measured against deliberately damaged records: every gauge generator commutes with every check, no gauge generator lies in its own family's check span, and the two gauge blocks pair up non-degenerately. The distance is dressed -- a declared logical operator has to lie outside its own family's checks *and* gauge -- and that is a measured claim rather than one the tesseract's four happens to satisfy either way, because the file carries a second family, the 3x3 Bacon-Shor, whose bare reading finds a weight-two operator while the record reports its dressed distance of three. The family's use is the free logical gate it carries: the sixteen-wire permutation of arXiv:2412.14256 maps the whole gauge group onto itself as a set, over all 16384 of its elements rather than on the generators alone, and on the declared path4: L1, L0, L2, L5 order it moves the two four-weight families exactly as CNOT(0 -> 1) * CNOT(2 -> 3) does, which is measured against the Calderbank-Shor-Steane span a class is read modulo. What that leaves open is named rather than implied: this package has no round structure and no detector model in which a gauge generator is measured,  The free-CNOT gadget is no longer held by the test alone: flagquantum.qec.tesseract_column_swap derives the permutation from the hypercube layout -- a wire whose lowest coordinate is clear exchanges the column above it -- and flagquantum.qec.tesseract_free_cnot_pairs states the action it is held to, so the claim that the permutation implements two CNOTs compares two published facts instead of restating one. What that leaves open is unchanged and is why the pairs are declared rather than derived from the permutation: a caller that wants more than the two-qubit action on the protected order still has to read the record's own logical order, which this record reports only as the order its operator list is in."
fail_closed = "symbols_absent names the two matrix-level records and the operation-registration name, so the row stops claiming a matrix-level gap the day one appears; the negative search names the one name this record set still has neither a record nor a matrix route for, and it is a measurement of this package rather than of the baseline: the name is absent from the exported namespace, and the family is not a pair of CSS matrices, so the matrix route cannot answer it either; the colour, toric, ZXXZ, bivariate-bicycle, punctured Reed-Muller and generic qLDPC routes are now among the families the record set or that route does carry, and the checklist does not carry a capture of the baseline catalog that pair was read from, so the pair is a survey record rather than a reproducible count. tests/qec/test_bicycle_code.py holds the bicycle family to the rank of its own matrices rather than to a stated logical count, to an identity pairing between the two declared families rather than to the full-rank pairing the record certifies, to the published instance, and to both memory frames built on the operators the derivation produced rather than on operators the test states, and tests/qec/test_gf2.py holds the new null-space elimination to the width it was asked about -- a row carrying a bit above that width is read within it, so the answer neither leaks the out-of-range bit nor miscounts the free columns. tests/qec/test_qldpc_code.py holds the generic route to four codes whose logical operators are declared elsewhere -- the Steane record, the torus at two sizes and the bicycle family -- and requires of every derived operator that it differ from its declared partner by a check of its own type rather than merely agreeing with it on the count and the distance, which is what separates a route that picked a different representative of the right class from one that picked the wrong class; it also requires the route and the family to return the same record, so a second copy of the elimination would show up as a disagreement rather than as two green suites, and it measures the rank-versus-row-count distinction as a pair of records that differ by one ancilla and by no logical qubit. Its pairing check runs over the three oracles that leave more than one logical qubit rather than over one of them, because the bicycle is the case that observes the elimination: the basis its derivation computes before the elimination pairs as a matrix with six ones off the diagonal, so a route that swapped columns until the diagonal was clear and stopped there passes the record's own full-rank certificate and fails here, while the two tori are the contrast that holds the elimination to leaving an already-clean pairing alone. tests/qec/test_zxxz_code.py holds the patch to a conjugation it re-derives rather than a claim it repeats -- the board and the conjugation rule are written out in the test, the rotated patch's own checks are the input, and the record's checks are required to be exactly that image, index by index, with weights and the whole commutation table preserved -- and it measures the family's distance on the record itself by exhausting every pure operator below d, and it shows the choice of checkerboard parity is load-bearing by exhibiting no pure-Z representative of the declared observable's coset under the other one. tests/qec/test_zxxz_memory_execution.py measures the readout limit from both sides: no detector of the Z-basis experiment references the data while the X-basis experiment's do, the blind mechanism's probability is asserted against its closed form at three distances and three rates, every syndrome the model samples is reproduced exactly, and the decoded-against-raw contrast is asserted against the rotated patch at the same distance, rate, budget and seed rather than against a threshold. tests/qec/test_colour_code.py holds the derived patch to the closed forms its distance implies, to self-duality, and to the three-colourability the parity-check matrices do not state, and tests/qec/test_colour_memory_execution.py takes the same record through its memory circuit, its non-graphlike model, the sampler comparison and a decode. tests/qec/test_toric_code.py holds the torus to the rank of its own rows rather than to a stated k -- the logical-qubit count is measured from the matrices, and the anticommutation matrix between the declared families is required to be a permutation matrix so that two logical qubits is not read off a repeated operator -- and tests/qec/test_toric_memory_execution.py measures both sides of the decoder call at one code, round count and fault rate, so the family's graphlikeness is recorded as a property of the noise declaration rather than as a property of the code, and hands every name the registry holds both sides of that declaration so that which names take the hyperedge model is read from the decoder each name returns rather than from a list in the test. The same file takes the side the matcher refuses all the way to a rate: every one of three hundred draws of the two-round declared model is decoded by the hyperedge decoder, every answer is required to reproduce its syndrome and to select no mechanism for the empty syndrome, and the observables it predicts are compared per index against the model's exact raw rate. It also records the exact matcher's own bound -- at six rounds and two percent a sampled syndrome carries twenty-two detectors against its default budget of twenty -- and compares the exact matcher, the windowed matcher and the hyperedge decoder on that same set of draws, so a refusal is a measured difference between three decoders rather than one decoder's limit. The surface patch is exercised by tests/qec/test_surface_code.py, and tests/qec/test_dem_code_matrices.py holds the matrix record to reading every declared block rather than a Z-type subset: a code declaring both readouts produces both observable blocks, an X-only code still produces a model, a mixed-type observable is refused with its index named, and a check acting outside the declared data wires is refused rather than silently widened. The subsystem record fails closed in the same way and for the same reason: it refuses a gauge generator that does not commute with a check, a gauge generator that lies in its own family's check span, a gauge block that does not pair up non-degenerately, a declared logical operator that lies in its own family's checks or gauge, and a logical family whose length is not the protected count the rank arithmetic leaves -- and flagquantum.qec.css_code_matrices refuses the record outright with the protocol named instead of building matrices the gauge generators would be dropped from, which is what makes the deliberate absence of the stabilizer-code protocol a measured property rather than an oversight. The one thing the record does not refuse is a caller's search bound: a tesseract-shaped record built with a bound of three stops with the family named,  The row's negative search is a statement about this package and it has been re-measured rather than kept: symbol:flagquantum.qec.reichardt_code still does not resolve, because this package names the family tesseract_code, but the family behind that name is not absent and the earlier reading of this entry as a missing family was wrong. The framework this row is measured against binds its Reichardt module to the very record this package publishes: cudaq/logical/qec/reichardt.py links Tesseract, and cudaq/logical/codes/catalog.py writes that family with the same five check rows, the same four Z-type and four X-type logical rows, the same two gauge pairs, k=4, r=2, d=4 and the same path4:L1,L0,L2,L5 protected order that flagquantum.qec.tesseract_code declares, so the family has a record here and the absence this entry records is a naming difference rather than a capability gap. The second entry this row used to carry, symbol:flagquantum.qec.floquet_code, has been retired rather than kept, and the retirement is the point: the absence it recorded is over -- the dynamic code has a record here -- but the entry could never have gone red, because the baseline's module name is not a name this package would ever export and a negative search on it would have stayed green while the capability landed. A negative search that cannot resolve is not an absence being measured, so the entry was replaced by three names in symbols_present and by the reading the record publishes. The suite is what holds the closure in place: the propagation rule is compared against a brute-force walk of the old group's every element rather than against itself, the basis-wise shortcut is exhibited losing a surviving product on a two-generator witness, the whole ring family is built through the record and required to settle, protect at least one qubit and read one count per period, the four-phase ring is required to be refused while the same width's two-phase ring is accepted, and the search bound is required to refuse rather than return the held basis. tests/qec/ and the docstring-example gate are where that lives, and the row names both."

[[rows]]
id = "qec_detector_annotations"
status = "partial"
floor = "now"
floor_override_reason = "The quantum_error_correction domain has no capability row of its own for detector annotations; the surface items are listed under cudaq_surface and the construction half is folded into qec_code_library, whose priority is now. The floor follows the row this feeds."
domain_items = [
    "detector, detectors, and logical_observable annotations in a kernel",
    "extract_syndrome",
]
dependency_class = "none"
maturity_ref = "stabilizer_code_memory_circuit"
baseline = "In a CUDA-Q kernel body: detector(m0, ...) declares one detector as a parity constraint over measurement handles, detectors(prev, curr) pairs two equal-length handle vectors element-wise into cross-round detectors, and logical_observable(m0, ...) declares an observable. Handles come from mz/mx/my and are discriminated with to_bools or to_integer; the compiler intercepts the annotations, so calling them at host scope raises."
target = "Detector and observable identity derived from the code and carried by the circuit record, so a decoder is configured by the detection events it consumes rather than by an asserted count."
symbols_present = [
    "flagquantum.qec.build_memory_circuit",
    "flagquantum.qec.DetectorLayout",
    "flagquantum.qec.ObservableLayout",
    "flagquantum.qec.Detector",
    "flagquantum.qec.LogicalObservable",
    "flagquantum.qec.MeasurementRef",
]
symbols_absent = [
    "flagquantum.qec.detector",
    "flagquantum.qec.detectors",
    "flagquantum.qec.logical_observable",
    "to_bools",
    "to_integer",
]
evidence = [
    "flagquantum/qec/circuit.py",
    "tests/qec/test_memory_circuit.py",
    "tests/qec/test_memory_circuit_execution.py",
]
next_action = "Decide the annotation form deliberately. This layer sets detector and observable identity in a layout object beside a source string; CUDA-Q sets it in the kernel body, where the compiler needs the annotation to survive into IR. If the kernel-annotation form is adopted it needs a handle type, an interception rule and a host-scope refusal, and the layout object has to survive as the record of what the annotations meant. The measurement-handle half is the harder one: to_bools and to_integer are what make a mid-circuit measurement usable in host logic, and nothing here has an equivalent."
fail_closed = "Five named absences, so the row cannot silently drift into claiming a kernel-level annotation surface; the layouts are validated dense and ordered by the records themselves, and the terminal-readout-only rule on LogicalObservable is a construction-time refusal rather than a convention. The three annotation names are checked as dotted paths because `detectors` and `detector` occur here as field and parameter names, where a bare-name search would be noise."

