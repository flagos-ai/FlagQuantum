next_action = "Both halves of the cudaq-qec extraction route are here now, and the row records the choice that put it on that route. `sample_memory_circuit` is cudaq-qec's name for the sampler, which is why this repository is on the cudaq-qec route and not on the preview layer's `extract_syndrome`; and `decoder_context_from_memory_circuit` is the helper that hands a decoder the model together with the maps that say where each detector's parity is read, so a caller no longer assembles the pieces beside the sampler. Nothing remains on either half. The matrix's surface item still reads `extract_syndrome`, and that is the right text for it: the item is a record of what a live CUDA-Q install lists, and the `extract_syndrome` entry in `baseline.surface_ownership` names its owner as the logical preview layer and states that the layer emits no detector error model, so the item no longer reads as a cudaq-qec surface to migrate to. Renaming it would make the inventory disagree with the install it records. The two per-basis sampler names stay absent on purpose: a basis is a component of the context here rather than a second entry point, so adopting them would be a second way to ask for one thing. The negative that held this row at `partial` was the provenance of the absence, not the absence itself, and the tree read above is what settles it."
