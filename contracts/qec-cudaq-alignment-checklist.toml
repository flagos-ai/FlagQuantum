note = "No matrix-level entry point: a model can only be built from a circuit record plus a noise record. This is the cheapest of the absent entry points to add, because the parity matrices the path consumes are already derivable here, and it is the one that makes the code family question concrete (an arbitrary parity-check matrix is exactly what CssCodes accepts upstream)."

[[fields]]
id = "dem_from_memory_circuit"
cudaq_symbol = "x_dem_from_memory_circuit / z_dem_from_memory_circuit (code, operation, numRounds, noise_model, decompose_errors=False), with decoder_context_from_memory_circuit returning a context that executes dem_from_kernel once and exposes x, z and full components"
flagquantum_symbol = "flagquantum.qec.DetectorErrorModel.from_memory_circuit"
verdict = "reshaped"
note = "Both build a T-round model of a code's memory experiment. Upstream takes a code, an operation, a round count and a whole noise model, and is split by basis; here the circuit carries the round count and the basis, and the noise record is two uniform scalars. The context object is the part with no local counterpart: upstream hands back the model plus the maps a decoder needs, where here the caller assembles the pieces."

[[fields]]
id = "dem_code_capacity_noise"
cudaq_symbol = "CssNoise(px, py, pz, pm, px_per_qubit, py_per_qubit, pz_per_qubit, pm_per_check) -- scalar rates uniform, per-element vectors overriding, per-check rates with Z checks first"
flagquantum_symbol = "flagquantum.qec.PhenomenologicalNoise"
verdict = "reshaped"
note = "Both are phenomenological rate records over a memory experiment, and this is the widest single gap in the construction contract. Upstream expresses independent X, Y and Z data rates plus a measurement rate, each also per qubit or per check; here it is one data-flip scalar and one measurement-flip scalar. Per-location rates are therefore not expressible, and neither is an asymmetric X/Z channel, which the Y rate implies."

[[fields]]
id = "dem_canonicalize"
cudaq_symbol = "DetectorErrorModel.canonicalize_for_rounds(num_syndromes_per_round, remove_zero_syndrome_errors=False) and canonicalize_for_rounds_with_boundary(num_syndromes_per_round, num_boundary_syndromes, ...), both refusing a zero per-round count and a boundary larger than per-round"
flagquantum_symbol = ""
