verdict = "reshaped"
note = "Same role, different carrier. Upstream it is an opaque constructed object with read-write attributes, internal sparse projections (detector matrix held CSC, observable matrix CSR), stitching and canonicalization operations, and the DEM-text source recorded inside it. Here it is a frozen record of (num_detectors, num_observables, DemError tuple) validated at construction and immutable afterwards, with no recorded provenance."

