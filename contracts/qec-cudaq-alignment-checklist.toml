next_action = "Keep the orientation pinned to (detectors, errors) and (observables, errors): it is the same orientation as upstream and the same as stim's ecosystem. The code-capacity input side carries every block a code declares now: css_code_matrices reads hz, hx, lz and lx into one CssCodeMatrices record and DetectorErrorModel.from_code_matrices turns it into the same (detectors, errors) orientation, so a caller whose matrices come from a code rather than from a recorded circuit reaches a model without building a circuit, on either readout basis. The error-id column is the first of the three additions the previous revisions of this row listed and it has landed: DemError.error_id states that a group of mechanisms are alternatives, DetectorErrorModel.error_ids projects upstream's parallel vector, and the marginal rates and the sampling path read a group as one fault, so a detector's rate over a group is the sum of the members touching it. The rate statement is no longer one of the additions: the noise record this input is read with carries the four fault families as four scalars and the same four overrides per qubit and per check, resolved against these matrices' own column and row order through the same accessors both construction routes use, so a per-location profile reaches a code-capacity model rather than only a uniform one. The context object is no longer one of the additions either: upstream carries the DEM and the maps together through decoder_context_from_memory_circuit, and here a context does the same, with MeasurementMap standing for the sparse D and O -- one row per detector or observable, the measurements whose parity it is -- and projecting to both the dense (rows, measurements) matrix upstream stores and the -1-terminated sparse vector a realtime decoder configuration takes for its detector list. The one remaining addition is a rates vector, because a matcher wants the one column vector upstream keeps as error_rates while this model stores a record per error and exposes the marginals separately. The id also made dem_canonicalize more load-bearing rather than less: folding a group under exclusivity is an operation this row does not own, and four call sites refuse an id-carrying model by naming the ids rather than discarding them -- the three named before, plus a basis component, because a projection would either drop the correlation or merge two members of one group."
fail_closed = "The orientation is asserted by tests/qec/test_dem_rates.py, and the sampling path is the model's own arithmetic rather than the circuit simulator, so a DEM-sampled rate can never be reported as a circuit-sampled one. The matrix route asserts the same orientation on its own inputs rather than reusing the circuit route's geometry: tests/qec/test_dem_code_matrices.py pins the code-capacity detector count at num_rounds times num_checks, which deliberately differs from the memory-circuit count, so neither geometry can be reported as the other's, and pins the column order the X block takes after the Z block and the X observable rows after the Z rows, so a caller cannot read one block's columns as the other's. The id column is fail-closed on both sides of its own change: a group whose probabilities sum above one is refused rather than renormalized, so no member's stated rate is quietly changed, and the three operations that assume independence refuse an id-carrying model instead of dropping the structure, which is what to_stim_text (the format cannot state it), merge_duplicate_mechanisms (either rule would invent a shot in which two alternatives both fired) and the decoding graph (one weight per mechanism is the weight of a fault that fires alone) each do by naming the ids. tests/qec/test_dem_error_ids.py pins the refusal messages, the exact rates, the sampled rates against the exact ones at a stated standard-error bound, and the absence of any shot in which two members of one group fire. The last remaining addition is still a named absence, so the row moves when it lands rather than staying quietly stale."

