next_action = "The X half the previous revision of this row recorded as dropped is now read. flagquantum.qec.css_code_matrices lifts a code record into flagquantum.qec.CssCodeMatrices, which carries hz, hx, lz and lx together instead of a Z-type pair, so a code with both bases reaches both detector bands and both observable blocks, and flagquantum.qec.SteaneCode is the first record that exercises them. The drop was silent, so it is replaced by a refusal: a logical observable that is neither pure X nor pure Z stops the read with the offending index named rather than being read as one of the two. One gap remains and it is not a declaration limit: the record set is one code per family, so a colour code has no record even though the CSS shape now admits one; symbol:flagquantum.qec.color_code states that absence. The rate side of the code-capacity input is no longer a gap either: the noise record carries a per-qubit and per-check override for every fault family, read against the vectors the noise accessors take a count for, so a code reaches a per-location noise profile and not only a uniform one. Note in the same pass that upstream encodes a code as a set of kernels, so aligning to that shape is a decision about this repository's circuit model, not a small addition."
fail_closed = "symbols_absent names the two matrix-level records and the operation-registration name, so the row stops claiming a matrix-level gap the day one appears; the negative search names the colour code, which is the family the record set still does not carry. The surface patch is exercised by tests/qec/test_surface_code.py, and tests/qec/test_dem_code_matrices.py holds the matrix record to reading every declared block rather than a Z-type subset: a code declaring both readouts produces both observable blocks, an X-only code still produces a model, a mixed-type observable is refused with its index named, and a check acting outside the declared data wires is refused rather than silently widened."

