next_action = "Two of the three gaps the previous revision of this row listed are closed and the third is pinned elsewhere. The X and Z detector bands that an hx/lx pair implies are reachable now: the matrix route reads both parity blocks and both logical blocks, and the phase and Y fault families alongside the data-flip one, so a mechanism carries the observable rows of either basis. The rate record is the remaining limit -- it states uniform scalars, so an independent px/py/pz/pm split and per-location rates are still out of reach -- and dem_code_capacity_noise carries that rather than this row. What is left in construction itself is a context object that carries the model plus the maps a decoder needs (upstream decoder_context_from_memory_circuit is exactly that), and a model that comes out of a kernel's own annotations, which this repository cannot do until the annotation row moves."
fail_closed = "A non-Pauli channel is refused with a stated reason rather than decomposed, and construction is bounded by the statevector ceiling, which is why the modelled rotated-surface distance stops at three; the matrix route is not bounded by it at all, because it reads a support rather than executing a program. The per-error observable of a mechanism is not asserted from the source but read off the layout after the flip on the circuit route, and derived from the logical matrix on the matrix route. The two routes describe different experiments and the difference is pinned rather than glossed: the matrix route has no terminal data readout, so its detector count is num_rounds * num_checks while a memory circuit's is one band per round plus a terminal detector per Z-type check, and tests/qec/test_dem_code_matrices_stim.py asserts both geometries against the assumption each one states. The same file hands the matrix route's declared shape and every mechanism rate to stim's own error analysis one readout basis at a time, and pins the single place where a persisting data fault makes the model claim a band the experiment does not, as the exact relation between the two mechanism sets rather than as a tolerance, so the divergence cannot widen unnoticed. A matrix that is not binary, is not two-dimensional, or disagrees with another block about the number of data qubits is refused rather than coerced."

