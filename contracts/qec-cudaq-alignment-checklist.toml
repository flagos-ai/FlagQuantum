fail_closed = "The row's own surface is closed and the five absences are what keep it from closing further than it can. Detector and observable identity is derived and validated: the layout count is the code's checks and rounds rather than a caller's number, every reference is tied to a declared wire and round, and the observable readout is refused unless it is terminal and matches the declared support exactly. The handle layer is closed against the layout layer rather than beside it: MemoryCircuit.measurement_refs is read off the code and the round count, so a handle is a name the experiment declares and never a column a caller guessed, and tests/qec/test_measurement_handles.py recomputes every detector's parity and every observable's flip from the handles that detector and observable name and requires the two readings of one run to agree shot for shot, so the record and the events cannot drift into two stories about one shot. A reading is refused rather than clamped when it does not fit: a handle the experiment does not record raises with the handle named, an empty reading raises, a reading addressed by anything but a MeasurementRef raises as a type error, and a record whose tensor is not two-dimensional or whose column count does not match its handle vector raises, so a mis-shaped reading cannot be silently truncated to the shorter of the two. The order a caller asks in is the order it gets -- vector is one boolean per handle per shot in the order named and integer packs that same order with the first handle least significant -- and the tests pin the packing against the bit vector rather than against a second call of the same method, so two orders name two integers and neither can be read as the other's. What the handle layer does not do is decide which handles are deterministic, and the tests say so by measurement rather than by convention: in a noiseless run the readout basis' own check class reads 0 in every round and the other class reads unbiased, the two swapping places when the experiment is prepared and read out in the other basis, and an individual terminal data wire reads unbiased, while every detector and every observable reads 0 -- so a handle-level rate can never be reported as a channel rate, and the round-zero X-type bits the layouts drop are readable without being mistaken for pinned ones. The three annotation names stay checked as dotted paths because `detectors` and `detector` occur here as field and parameter names, where a bare-name search would be noise, and the two handle-reading names stay absent because this layer reads a handle on the record that holds it rather than through a per-measurement conversion call."

