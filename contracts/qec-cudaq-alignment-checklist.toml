next_action = "Every gap the previous revisions of this row listed is closed and what is left is stated rather than implied. The X and Z detector bands that an hx/lx pair implies are reachable now: the matrix route reads both parity blocks and both logical blocks, and the phase and Y fault families alongside the data-flip one, so a mechanism carries the observable rows of either basis. The rate record is no longer one of them: it carries the four fault families as four scalars and the same four overrides per qubit and per check, and both construction routes read an element through the same accessor, so a location can be given its own rate while its neighbours keep theirs and a quiet location between two noisy ones enumerates no mechanism at all. The context object is no longer one of them either: `decoder_context_from_memory_circuit` builds the model once and the context returns it a basis at a time together with the maps that say which measurements compose each detector and each observable, so a decoder is handed both halves instead of the caller threading them by hand. The readout basis is no longer a gap at all: the circuit route reads it off the memory record, and the memory record checks it against the logical observables the code declares rather than assuming it, so an X-basis experiment and a Z-basis one are two readings of one route -- the terminal detectors belong to the check class of the basis the data qubits are prepared and read in, and the model's observable rows follow the observable that basis reads. Upstream's x_ and z_ entry points stay absent by name rather than by omission, because a basis is a field of the record here rather than a second way to ask for one thing. What is left in construction itself is one route: a model that comes out of a kernel's own annotations, which this repository cannot do until the annotation row moves, because the parity is stated in a layout beside the source rather than in the kernel body a compiler would have to carry it out of. The baseline's `decompose_errors=False` argument is no longer a bare gap and is not claimed as a match either. `DetectorErrorModel.from_memory_circuit` now takes `decompose_composite_faults`, which reads the circuit route's one composite fault -- the Y family, an X flip and a Z flip at one location -- as its two parts at the parent's rate rather than as one mechanism whose signature is their XOR, and which is what widens the minimum-weight matcher's domain to the models that composite reading produced. Upstream's flag is documented as handing the model to Stim so that hyperedge mechanisms become pairs of two-detector edges, and no such rule exists in its own sources to read; the rule here is derived from the program instead, so the two flags are the same shape of decision reached by different means, which is why this row records the argument as reachable rather than as aligned. The default is unchanged, the reading is documented as a different joint law over the same marginals rather than as an equivalent statement, and the code-capacity route states no such keyword on purpose, because there a part still spans two detector bands."
