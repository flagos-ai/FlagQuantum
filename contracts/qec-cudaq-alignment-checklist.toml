    "extract_syndrome",
]
dependency_class = "none"
maturity_ref = "stabilizer_code_memory_circuit"
baseline = "In a CUDA-Q kernel body: detector(m0, ...) declares one detector as a parity constraint over measurement handles, detectors(prev, curr) pairs two equal-length handle vectors element-wise into cross-round detectors, and logical_observable(m0, ...) declares an observable, so detector and observable identity is a statement in the kernel rather than in a table beside it. Handles come from mz/mx/my and are values rather than column indices: the same handle is what to_bools turns into a boolean vector on one line and what to_integer packs into one integer on another, and both readings take the measurement that was taken, not a second one. The compiler intercepts the annotations, so calling them at host scope raises."
target = "Detector and observable identity derived from the code and carried by the circuit record rather than asserted beside it, and every measurement the experiment records addressable by a handle whose outcome a caller reads off as a boolean vector or as an integer, so a decoder is configured by the detection events it consumes and host logic over a mid-circuit measurement does not need a column index."
