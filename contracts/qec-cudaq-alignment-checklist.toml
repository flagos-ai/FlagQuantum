note = "Merging exists here only as an implicit step of construction and only with the parity rule (1 - 2p products); there is no operation, no mode argument and no sum-combine equivalent. The distinction matters because the two modes are not interchangeable: the parity rule is right for independent mechanisms that coincide and wrong for mechanisms that exclude each other."

[[fields]]
id = "dem_seam_and_chunk_api"
cudaq_symbol = "chunks with named seams: SeamId, seam_name.prev_round/next_round, phase_name.init/bulk/final, DemChunkSpec, dem_chunk_from_spec, dem_chunks_from_spec, expand_dem_chunks, dem_stitch / dem_stitch_all / dem_stitch_merged, dem_close / dem_close_all"
