next_action = "The interchange is present in both directions and independently checked: stim's own error analysis builds the model from a gate-for-gate transcription and agrees on shape, mechanism count and pair rates. What the two entry points share is narrowness at the input end rather than the absence of one: a model comes either from one circuit record plus one noise record or from the two matrices the matrix route reads, and a stimulus for neither is accepted, so an arbitrary annotated circuit still has no route to a model. The text half is now pinned rather than described. stim's writer prints at numeric_limits<long double>::digits10 + 1 -- a measured width that follows the platform rather than a constant of stim: nineteen significant digits where long double is the x86 80-bit extended type, which is the Linux CI platform, and sixteen where it is a double, which is arm64 macOS. Seventeen digits name a double uniquely, so at nineteen digits a probability that leaves through stim's own printer returns as the identical double and at sixteen it can return as a different one, while the same probability written by this package cannot on either. The drift a stim round trip introduces at the narrower width is bounded by one part in 10**15, which follows from the format and is confirmed against the pinned sweep at a 5.4e-16 worst case, so the caveat is a tolerance a caller can carry rather than a warning. Both readings of a `^` separator are now offered rather than one, under upstream's own flag name: the default states the line stim wrote, and `use_decomp_suggestions=True` expands each component at the line's probability, which is the graphlike decomposition a matcher consumes. The difference between them is measured against stim's own sampler rather than asserted, and only the default one passes the tolerance. What remains is the input side: a model still comes either from one circuit record plus one noise record or from the matrices the matrix route reads, and a stimulus for neither is accepted, so an arbitrary annotated circuit has no route to a model."
