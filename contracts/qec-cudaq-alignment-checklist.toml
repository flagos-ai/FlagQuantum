# ---------------------------------------------------------------------------
# Field rows: the same discipline one level down, over the detector error model
# itself. Verdicts read as: equivalent (same information, same orientation, same
# sign convention), renamed (same information, different name), reshaped (same
# information, different layout or container), absent (upstream has it, this
# repository has nothing to point at), extra (this repository has it, the
# upstream surface read here has no counterpart).
# ---------------------------------------------------------------------------

[[fields]]
id = "dem_carrier"
cudaq_symbol = "DetectorErrorModel (bound from cudaq::qec::detector_error_model; the object a decoder is attached to)"
flagquantum_symbol = "flagquantum.qec.DetectorErrorModel"
verdict = "reshaped"
note = "Same role, different carrier. Upstream it is an opaque constructed object with read-write attributes, internal sparse projections (detector matrix held CSC, observable matrix CSR), stitching and canonicalization operations, and the DEM-text source recorded inside it. Here it is a frozen record of (num_detectors, num_observables, DemError tuple) validated at construction and immutable afterwards, with no recorded provenance."

[[fields]]
id = "dem_detector_matrix"
cudaq_symbol = "DetectorErrorModel.detector_error_matrix -- dense uint8 copy, one row per detector, one column per error mechanism"
flagquantum_symbol = "flagquantum.qec.DetectorErrorModel.detector_error_matrix"
verdict = "equivalent"
note = "Same orientation and the same 0/1 entries. The containers differ (numpy uint8 upstream, torch int8 here), which is a representation choice rather than a semantic one; the orientation is the one stim's ecosystem uses and is asserted by tests/qec/test_dem_rates.py."

[[fields]]
id = "dem_observable_matrix"
cudaq_symbol = "DetectorErrorModel.observables_flips_matrix -- dense uint8, one row per observable, one column per error mechanism"
flagquantum_symbol = "flagquantum.qec.DetectorErrorModel.observables_flips_matrix"
verdict = "equivalent"
note = "Same orientation, same entries, same container difference as the detector matrix. Upstream also documents the consumer idiom directly (observable predictions are the observable matrix times the decoded error vector, modulo two), which is worth mirroring in this repository's documentation rather than only supporting the matrix."

[[fields]]
id = "dem_error_rates"
cudaq_symbol = "DetectorErrorModel.error_rates -- one rate per error mechanism, length equal to the number of columns"
flagquantum_symbol = "flagquantum.qec.DemError.probability"
verdict = "reshaped"
note = "The rates are the same quantity, stored per column upstream and per error record here. A caller that wants the vector must project it out of the error tuple; nothing exposes it as a vector, and the local detector_rates and observable_rates are different quantities again (marginals over detector and over observable, not per mechanism)."

[[fields]]
id = "dem_error_ids"
cudaq_symbol = "DetectorErrorModel.error_ids -- optional; errors sharing an id are mutually exclusive (correlated), a documented loss of the stim-text path where it is always empty"
flagquantum_symbol = "flagquantum.qec.DemError.error_id"
verdict = "reshaped"
note = "The correlation is now stated, in the record rather than in a parallel vector. Upstream keeps an optional vector parallel to error_rates whose entry i is the id of mechanism i; here the id is a field of the mechanism's own record and flagquantum.qec.DetectorErrorModel.error_ids projects the same vector back out, None when no mechanism states one, which is upstream's nullopt and the state stim's text always describes. Three things the upstream declaration does not fix are fixed here and are the reason this is `reshaped` rather than `renamed`. Exclusivity needs a distribution to be a statement at all, so the members of a group are read as disjoint pieces of one shot: each keeps the probability it states, the left-over mass is the group firing none of them, and a group whose probabilities sum above one is refused rather than renormalized because renormalizing would change every rate the caller read. The marginal rates and the sampling path honour the groups, so a detector's rate over a group is the sum of the members touching it instead of their parity. And the two operations that assume independence refuse an id-carrying model instead of silently discarding the structure: stim text cannot state the correlation, so to_stim_text names the ids it would lose, merge_duplicate_mechanisms names them because combining by either rule invents a shot in which two alternatives both fired, and the decoding graph refuses because one weight per mechanism is the weight of a fault that fires alone. What is still absent is an operation that folds a group under exclusivity, which is what dem_canonicalize records."

[[fields]]
id = "dem_counts"
cudaq_symbol = "DetectorErrorModel.num_detectors(), num_error_mechanisms(), num_observables() -- methods"
flagquantum_symbol = "flagquantum.qec.DetectorErrorModel.num_errors"
verdict = "reshaped"
note = "Same three counts, reached differently: methods upstream against a property here, and num_error_mechanisms against num_errors. The local num_detectors and num_observables are stored fields of the record rather than derived, which is why they are not listed separately as their own row."

[[fields]]
id = "dem_sampling_function"
cudaq_symbol = "cudaq_qec.dem_sampling(check_matrix, num_shots, error_probabilities, seed=None, backend='auto') -> (syndromes[num_shots x num_checks] uint8, errors[num_shots x num_mechanisms] uint8)"
flagquantum_symbol = "flagquantum.qec.DetectorErrorModel.dem_sampling"
verdict = "reshaped"
note = "Both sample a model without a simulator, and the contracts differ on both axes. Upstream is a free function over a check matrix plus a rate vector that returns sampled check syndromes and, separately, the sampled error mechanisms; here it is a method on the model that returns detectors and observables and no mechanism vector. So the upstream error output is absent here and the local observable output is extra there. Upstream also rejects PyTorch CPU tensors, which is a full-precision-versus-uint8 boundary worth knowing before an adapter is written."

[[fields]]
id = "dem_sampling_backend"
cudaq_symbol = "DemSamplingBackend {Auto, Cpu, Gpu}, with backend='auto' falling back to CPU and backend='gpu' raising when unavailable"
flagquantum_symbol = ""
verdict = "absent"
negative_search = ["symbol:flagquantum.qec.DemSamplingBackend"]
note = "No execution-target selection on the sampling path here. The alignment decision to record is that the position exists upstream and is a separate argument rather than a second function, so adopting it later does not change the call signature's shape."

[[fields]]
id = "dem_from_stim_text"
cudaq_symbol = "cudaq_qec.dem_from_stim_text(dem_text, use_decomp_suggestions=False) -> DetectorErrorModel, via stim's own parser and iter_flatten_error_instructions; only relative D* and L* targets, probability in [0,1]"
flagquantum_symbol = "flagquantum.qec.DetectorErrorModel.from_stim_text"
verdict = "renamed"
note = "Same operation, same parser choice (stim's text is the format, and both sides let stim define what is legal), reached as a free function upstream and a classmethod here. Both readings of a `^` separator are offered under upstream's own flag name, and the default is the one stim itself means: the signature is the symmetric difference of the line's targets, and `use_decomp_suggestions=True` returns one mechanism per component at the probability the line states, which is the graphlike decomposition a matcher consumes. What remains of upstream's two stated losses is the error-id one, and it is a property of the record rather than of the reader: upstream leaves error ids null on this path too. The rest of the refusals differ in kind, not in spirit -- upstream hands the text to stim and states what it loses, where this repository refuses the constructs its own record cannot hold (repeat blocks, comments, skipped indices, malformed lines) rather than dropping them."

