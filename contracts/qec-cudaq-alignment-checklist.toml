status = "partial"
floor = "now"
domain_row = "qec_stim_integration"
domain_items = ["Stim integration", "circuit-to-DEM round trip"]
dependency_class = "B_open_neutral"
maturity_ref = "detector_error_model"
baseline = "Read: cudaq_qec.dem_from_stim_text(dem_text, use_decomp_suggestions) parses stim text into a DetectorErrorModel through stim's own DetectorErrorModel plus iter_flatten_error_instructions, accepting only relative D* and L* targets and a probability in [0,1], and documenting two losses (error_ids always null, ^ separators ignored unless decomposition suggestions are requested). C++ decoder_init::from_stim_dem(text, measurement_to_detectors=None) is the sibling path, and DEM-native decoders take the text directly. Write: no writer was found in the fetched cudaq-qec bindings or libraries; the produced stim text in the CUDA-Q stack comes from cudaq.DEMResult.dem (core) and from qlx-translate --fabric-to-stim (Logical preview)."
target = "Read and write the stim detector error model text, so a model can leave and return without a package dependency, and so a model produced elsewhere can be consumed."
symbols_present = [
    "flagquantum.qec.DetectorErrorModel.to_stim_text",
    "flagquantum.qec.DetectorErrorModel.from_stim_text",
]
evidence = [
    "flagquantum/qec/dem.py",
    "tests/qec/test_dem_stim_text.py",
    "tests/qec/test_dem_stim_interop.py",
    "tests/qec/test_dem_stim_reference_rates.py",
    "tests/qec/test_dem_stim_text_precision.py",
