next_action = "The five counts, the per-basis split, the name-keyed record set and the matrices route are all read now. flagquantum.qec.StabilizerCode declares num_ancilla_x_qubits and num_ancilla_z_qubits beside num_ancilla_qubits, and num_x_stabilizers and num_z_stabilizers beside those, which is the full accessor list upstream's own code record carries: cudaq::qec::code declares get_num_data_qubits, get_num_ancilla_qubits, get_num_ancilla_x_qubits, get_num_ancilla_z_qubits, get_num_x_stabilizers and get_num_z_stabilizers as pure virtuals, and this protocol answers all six. The two bands are derived from the checks by flagquantum.qec.ancilla_bands rather than declared beside them, so a record cannot report a split its checks contradict: the builder compares the stated counts against the derived bands and refuses a record where they disagree, while a flag or idle ancilla stays in neither band and is unaffected. The two stabilizer counts are that same derived quantity rather than a second derivation: in each of the three code classes upstream ships one ancilla measures one stabilizer, so a stabilizer count and the band count of the same basis are one number, and stating it twice would be two answers to one question. flagquantum.qec.get_code builds a record by name, flagquantum.qec.code_names lists the names, and flagquantum.qec.register_code puts one there with the members checked at registration, so the factory half of upstream's get_code and get_available_codes pair is reached the way the decoder registry already was. The colour code is withdrawn from this row rather than left as its gap: upstream's headers declare no colour code and no concrete code type at all, only the abstract cudaq::qec::code, the css_code_matrices and css_noise_params records, and the three families its own factory names -- Steane, repetition and surface -- of which this repository now carries one of each. flagquantum.qec.CssCode is the matrix half of the same row, and it is the half this row recorded as missing: a caller who holds hz, hx, lz and lx builds a record with no class for it, and the data qubits, the two bands, the checks with their CNOT direction, the stabilizers and the logical observables are all read off those four blocks. The record takes the distance from its caller rather than deriving it, which is upstream's own division: cudaq::qec::code declares no distance accessor at all, and libs/qec/lib/codes/repetition.cpp and surface_code.cpp each read one out of the options they were built with and throw when it is absent, while upstream's css_code_matrices carries no distance to read. Deriving it here would be worse than copying that shape, because a minimum-weight-codeword search is exponential in general and would refuse exactly the large matrices this route exists for. What the record adds is the one direction of proof a stated logical operator can give: an operator of weight w proves the distance is at most w, so a record claiming more than the lightest operator it states is refused, and a record that understates its distance is accepted. It also holds the matrices to the algebra upstream does not check -- libs/qec/lib/dem_construction_utils.cpp validates a common column count, rate-vector lengths and a probability range, and never commutation, orthogonality, logical non-triviality or independence -- so two check blocks that do not commute, a logical operator meeting the opposite basis' checks on an odd number of qubits, a logical operator inside its own checks' span, two dependent rows in one logical block, and a check or logical row with no support are each refused with the row and the reason named. One gap remains, and it is the one this row already recorded as a decision about this repository's circuit model rather than a limit: a code here is a record that builds one source, where upstream's code is a map from an operation to the kernel that performs it, so a code carrying its own preparation, measurement or logical-operation kernels would need a second shape; symbol:flagquantum.qec.operation_encodings states that absence. Upstream's second get_code overload is still not mirrored, deliberately: it builds the named record and then overwrites its stabilizer list, and a record whose stabilizer list was swapped under it would report one split while its checks stated another, so the matrices route is CSS-shaped by construction and an arbitrary non-CSS stabilizer list stays out of scope even though an arbitrary parity-check matrix no longer does."
fail_closed = "symbols_absent names the two matrix-level upstream records, upstream's stabilizer-round kernel type and the per-operation kernel map, so the row stops claiming a kernel-set gap the day one of those names appears; the negative search names the colour code, which neither this record set nor upstream's factory carries. The accessor list is held by tests/qec/test_code_registry.py, which reads the derived split against the stated counts for every shipped record, reads the two stabilizer counts against the number of checks of each basis and against the two bands, refuses an ancilla that measures both bases, and exercises the registry's duplicate, unknown-name, unknown-option and missing-member refusals; tests/qec/test_dem_code_matrices.py holds the matrix record to reading every declared block rather than a Z-type subset: a code declaring both readouts produces both observable blocks, an X-only code still produces a model, a mixed-type observable is refused with its index named, and a check acting outside the declared data qubits is refused rather than silently widened. tests/qec/test_css_code.py holds the matrices route: every shipped record is rebuilt from its own blocks and compared on the counts, the checks and the logical observables; a rebuilt record's detector error model is compared against the declared record's under the relabelling the check order forces, mechanism by mechanism and rate by rate rather than within a tolerance, and the file also pins where the two do not agree without a relabelling, so the difference stays the check order and cannot widen; a code no class here declares, the nine-qubit Shor code, is built from four blocks alone and taken all the way to a memory circuit and a detector error model; the matrix route is exercised at a distance the circuit route cannot execute, so the ceiling of the one is not read as the ceiling of the other; and each refusal is named -- a matrices record that is not a CssCodeMatrices, a distance that is not an integer, below one, or larger than the lightest stated logical operator, blocks with no check or no logical observable, an empty check or logical row, a logical operator that anticommutes with the opposite basis, a logical operator that is a product of its own checks, and two dependent rows in one logical block."

[[rows]]
id = "qec_detector_annotations"
status = "aligned"
floor = "now"
floor_override_reason = "The quantum_error_correction domain has no capability row of its own for detector annotations; the surface items are listed under cudaq_surface and the construction half is folded into qec_code_library, whose priority is now. The floor follows the row this feeds."
