[[fields]]
id = "dem_from_css_matrices"
cudaq_symbol = "dem_from_css_matrices(code: CssCodes | cudaq_qec.Code, noise: CssNoise, num_rounds=1) and extended_dem_from_css_matrices"
flagquantum_symbol = "flagquantum.qec.DetectorErrorModel.from_code_matrices"
verdict = "reshaped"
negative_search = [
    "symbol:flagquantum.qec.extended_dem_from_code_matrices",
]
note = "Both build a model of a code-capacity experiment -- num_rounds bands of one detector per check, each round compared with the round before it, and no terminal data readout -- from matrices rather than from a simulated circuit. The detector bands and the observable rows are no longer a difference: both sides carry the four CSS blocks, so both report the X and Z detector bands and the lz and lx observable rows, and a logical observable that is neither pure X nor pure Z is refused here with its index named rather than half-read as one of the two. Two differences remain. Upstream takes one object carrying all four parity matrices plus a CssNoise; here flagquantum.qec.css_code_matrices builds the four blocks into flagquantum.qec.CssCodeMatrices and that record is the argument while the rates arrive as a separate flagquantum.qec.PhenomenologicalNoise, where upstream hands one CssNoise in beside the matrices; that split is what dem_code_capacity_noise records, and it is now a difference in the carrier rather than in the rates, because the four families and their per-qubit and per-check overrides are stated on both sides. And upstream returns a detector_error_model alongside an extended_dem_from_css_matrices sibling carrying a sparse H and O, for which there is no counterpart here; that is the absence the negative search names."

[[fields]]
id = "dem_from_memory_circuit"
cudaq_symbol = "x_dem_from_memory_circuit / z_dem_from_memory_circuit (code, operation, numRounds, noise_model, decompose_errors=False), with decoder_context_from_memory_circuit returning a context that executes dem_from_kernel once and exposes x, z and full components"
flagquantum_symbol = "flagquantum.qec.DetectorErrorModel.from_memory_circuit"
verdict = "reshaped"
note = "Both build a T-round model of a code's memory experiment. Upstream takes a code, an operation, a round count and a whole noise model, and is split by basis; here the circuit carries the round count and the basis, and the noise record states the four families with an optional per-qubit and per-check override each. The context object is no longer a difference: upstream hands back the model plus the maps a decoder needs through decoder_context_from_memory_circuit, and here flagquantum.qec.decoder_context_from_memory_circuit does the same, returning a flagquantum.qec.DecoderContext whose full_component, x_component and z_component each return a flagquantum.qec.DecoderInputs -- the model together with both maps -- and whose num_measurements states the width those maps index. What differs inside the context is where the basis split comes from. Upstream needs a boundary-aware canonicalization variant because its D matrix is laid out in uniform per-round blocks, so a memory experiment's narrower first and last detector layers have to be described to it separately; here the layout states the boundary detectors itself, so the Z component is a projection and the union is the model as built, with no separate bookkeeping. And upstream's context is lazy because it stores raw circuit analysis and canonicalizes on demand, where this one builds its model eagerly, because the analysis it would defer is the construction the context exists to do once."

[[fields]]
id = "dem_code_capacity_noise"
cudaq_symbol = "CssNoise(px, py, pz, pm, px_per_qubit, py_per_qubit, pz_per_qubit, pm_per_check) -- scalar rates uniform, per-element vectors overriding, per-check rates with Z checks first"
flagquantum_symbol = "flagquantum.qec.PhenomenologicalNoise"
verdict = "reshaped"
note = "Both are phenomenological rate records over a memory experiment, and the four fault families now line up one for one. Upstream states independent X, Y and Z data rates plus a measurement rate, each also expressible per qubit or per check; here the four scalars are data_flip, phase_flip, both_flip and measurement_flip, which are upstream's px, pz, py and pm by fault rather than by position -- the X fault is px, the Z fault pz and the Y fault py, while upstream declares px, py, pz and pm, so its Z and Y fields change places. The per-element vectors line up the same way: data_flip_per_qubit / phase_flip_per_qubit / both_flip_per_qubit against px_per_qubit / pz_per_qubit / py_per_qubit, indexed by the code's own data_wires order, and measurement_flip_per_check against pm_per_check, indexed by matrix row with the Z-type checks first. The override rule is upstream's as well: a stated vector replaces its scalar wholesale rather than element by element, which is why a vector that does not name every element is refused instead of partially applied, and an element whose effective rate is zero enumerates no mechanism on either construction route. Both routes and the sampler resolve an element through the same accessors, so the three cannot read one vector three ways, and the two per-check orders -- the matrix row and the code's declaration order, which the rotated surface code interleaves -- are related by one named translation rather than by a convention each route re-states. One difference remains and it is the carrier rather than the rates: upstream folds the record into the argument its matrix entry point takes, so the record and the matrices it is read against arrive together and the vector lengths are known to the record, where here the record is a standalone frozen dataclass whose vectors are validated against a code the caller supplies at read time."

[[fields]]
id = "dem_canonicalize"
cudaq_symbol = "DetectorErrorModel.canonicalize_for_rounds(num_syndromes_per_round, remove_zero_syndrome_errors=False) and canonicalize_for_rounds_with_boundary(num_syndromes_per_round, num_boundary_syndromes, ...), both refusing a zero per-round count and a boundary larger than per-round"
flagquantum_symbol = ""
verdict = "absent"
negative_search = [
    "symbol:flagquantum.qec.DetectorErrorModel.canonicalize_for_rounds",
    "symbol:flagquantum.qec.DetectorErrorModel.canonicalize",
]
note = "No canonicalization operation. This is the operation a matcher needs when the same model has to be read round by round, so it sits between the construction rows and the decoder rows rather than being a nicety: upstream the round structure is an explicit argument with validated bounds, and here the round structure exists only implicitly in detector ordering."

[[fields]]
id = "dem_merge_operation"
cudaq_symbol = "dem_merge_duplicate_columns(dem, mode) with PriorCombineMode.or_combine and PriorCombineMode.sum_combine"
flagquantum_symbol = "flagquantum.qec.DetectorErrorModel.merge_duplicate_mechanisms"
verdict = "renamed"
negative_search = [
    "symbol:flagquantum.qec.DetectorErrorModel.merge_duplicate_errors",
    "flagquantum/qec/merge.py",
]
note = "Same operation, same two rules, different nouns and a different carrier. Upstream it is a free function over a dem with a mode enum; here it is a method on the model whose rule is an enum of its own, because this model has no columns to merge and the thing a shared signature is a property of is the mechanism record. The formulas are the upstream ones rather than approximations of them: or_combine is 1/2(1 - prod(1 - 2p_i)), which for two mechanisms is p1 + p2 - 2 p1 p2, sum_combine is min(1, sum(p_i)), and a group of one is passed through bit for bit rather than run through either. The mode is named for what it computes here: or_combine names a GF(2) column OR, while the quantity it produces is the probability that an odd number of the mechanisms fire, and that quantity is what the caller is choosing between. Upstream's are_dem_columns_unique and assert_dem_columns_unique have counterparts in mechanisms_are_unique and require_unique_mechanisms, and the assert is load-bearing rather than unused: the matcher calls it before it weights the model, because a signature stated twice would otherwise become two parallel edges and a decoder would take the cheaper weight. The default rule is exact and not merely tidy, which is the second thing this row records: a detector's rate is a product of 1 - 2p factors over the mechanisms that touch it, so a group's combined prior is the single p whose factor is that product, and every detector and observable rate is therefore unchanged; tests/qec/test_dem_merge.py asserts that as an equality and denies it of the sum rule in the same file."

[[fields]]
id = "dem_seam_and_chunk_api"
cudaq_symbol = "chunks with named seams: SeamId, seam_name.prev_round/next_round, phase_name.init/bulk/final, DemChunkSpec, dem_chunk_from_spec, dem_chunks_from_spec, expand_dem_chunks, dem_stitch / dem_stitch_all / dem_stitch_merged, dem_close / dem_close_all"
flagquantum_symbol = ""
verdict = "absent"
negative_search = [
    "symbol:flagquantum.qec.ExtendedDem",
    "flagquantum/qec/chunks.py",
    "flagquantum/qec/seams.py",
]
note = "Upstream a model is a sequence of chunks with named seams that can be stitched and closed, which is what a sliding-window decoder slides over; the seam names are values derived from a name string, so a seam identity is stable across processes. Here a model is monolithic and one round-window of it cannot be named."

[[fields]]
id = "dem_measurement_to_detector_map"
cudaq_symbol = "decoder_init.measurement_to_detectors() (D, detectors by raw measurements), the d_sparse helper, and dem_chunks_to_d_sparse / dem_chunks_to_o_sparse / dem_chunks_to_pcm"
flagquantum_symbol = "flagquantum.qec.MeasurementMap"
verdict = "reshaped"
note = "The same information -- which measurements compose each deterministic parity -- is one row per detector or observable of the measurements whose parity it is. Upstream reaches it two ways: a stored dense (detectors, raw measurements) matrix on decoder_init, and free-function sparse helpers for a realtime decoder configuration. Here flagquantum.qec.MeasurementMap is one record that does both, because the row structure is what it stores: dense() projects to upstream's orientation and flattened() to the -1-terminated sparse form d_sparse produces, with the terminator being what makes a row that reads nothing visible to a sparse reader. The composition is closed on both sides: a row is a parity, so it is sorted, it may not name one measurement twice because two reads of one measurement cancel, and an index outside the buffer the map states is refused. Two differences remain and neither is a mismatch of meaning. The carrier: here the map is handed to a decoder beside the model through flagquantum.qec.DecoderInputs, where upstream it hangs off decoder_init, which is the same pairing reached from the other end. And the chunk-scoped helpers -- dem_chunks_to_d_sparse, dem_chunks_to_o_sparse, dem_chunks_to_pcm, with their seam convention and their whole-round-interior-rows refusal -- have no counterpart, because a model here is monolithic and dem_seam_and_chunk_api records that absence. The relation on the circuit side is still a separate reading: what construction is driven by is the layout's ordered flagquantum.qec.DetectorLayout records, and the map is derived from them rather than the other way round, which is the direction difference the previous revision of this row recorded and which the map makes explicit rather than implicit."

[[fields]]
id = "kernel_annotation_surface"
cudaq_symbol = "cudaq.detector(m0, ...) / cudaq.detectors(prev, curr) / cudaq.logical_observable(m0, ...) inside a kernel body, over handles from mz/mx/my, discriminated with cudaq.to_bools and cudaq.to_integer; compiler-intercepted, host-scope call raises"
flagquantum_symbol = "flagquantum.qec.DetectorLayout"
verdict = "reshaped"
note = "Both say which measurement parities are deterministic and which logical operator the readout realizes. Upstream says it in the kernel body over measurement handles, and the annotations plus the handle-discrimination helpers are what a compiler needs to carry the structure into IR; here it is said in a layout record beside the source, which is enough for a builder and not enough for a compiler pass. The handle half (to_bools, to_integer) has no local equivalent and is the part that makes mid-circuit measurement usable."

[[fields]]
id = "kernel_dem_from_kernel"
cudaq_symbol = "cudaq.dem_from_kernel -- runs a kernel once with its annotations and returns a cudaq.DEMResult whose .dem property is stim text, with detector, observable and measurement counts and m2d (detectors x measurements) / m2o by default"
flagquantum_symbol = ""
verdict = "absent"
negative_search = ["symbol:flagquantum.qec.dem_from_kernel", "flagquantum/qec/dem_from_kernel.py"]
note = "The record this row exists for: dem_from_kernel and DEMResult are CUDA-Q core, not cudaq-qec, and the parity matrix attributes them to the quantum_error_correction domain because that is where a QEC user meets them. The local analogue is build_memory_circuit plus from_memory_circuit plus the layouts, which is the same information assembled by hand rather than derived from annotations. Its stated limitations are worth mirroring when the local path is documented: Clifford-only, no measurement-conditional control flow, independent Pauli noise, pre-decomposition."

[[fields]]
id = "decoder_registry"
cudaq_symbol = "qec.get_decoder(name, H_or_dem_text_or_sparse_matrix, **options) and the @qec.decoder('name') registration decorator, which requires a decode method and refuses to register a class without one"
flagquantum_symbol = "flagquantum.qec.get_decoder"
verdict = "reshaped"
note = "The local counterpart is flagquantum.qec.get_decoder(name, source, **options) over flagquantum.qec.register_decoder(name, *, replace=False), with flagquantum.qec.decoder_names() naming what is registered; those three plus flagquantum.qec.DetectorErrorModelDecoder are the registry's whole surface. Both sides are a name-keyed factory plus a registration decorator that refuses a class without a decode method, and the local one is deliberately narrower in two places. Its source argument takes the three carriers a caller can hold a model in -- the detector error model, stim's text for one, and the decoding graph the model defines -- where upstream takes H_or_dem_text_or_sparse_matrix; a parity-check matrix is not a carrier here because lifting one would also mean choosing the noise model and round count that DetectorErrorModel.from_code_matrices reads rather than defaults, so the caller who holds the matrix and the noise together does the lifting. Its registry holds the detector-error-model family alone, where upstream's holds lookup, matching, belief-propagation and qLDPC decoders side by side; the repetition-code decoders here take an ordered syndrome history rather than detection events, and one name space over two input protocols would make a name mean one of two things. Registration is checked at registration time rather than at the first call, which is the upstream behaviour too: a class missing decode or from_detector_error_model is refused while the registering module is being imported, and a second registration of one name is refused unless the caller says replace. The optional implementation is registered unconditionally and imported lazily, so the name is part of this package's surface rather than the extra's, and asking for it without PyMatching raises the error naming the extra instead of a name that silently is not there."

[[fields]]
id = "decoder_result_record"
cudaq_symbol = "DecoderResult(converged: bool, result: ndarray, opt_results), BatchDecoderResult(result 2d, converged 1d, opt_results, batch_opt_results) with an empty batch yielding shape (0,0), and AsyncDecoderResult"
flagquantum_symbol = "flagquantum.qec.DecodeResult"
verdict = "reshaped"
note = "The local result record is a single-shot outcome; upstream carries a convergence flag and an optional-results channel, and has separate batch and async records whose empty-batch shape is pinned so a caller can iterate without a special case. Convergence is the substantive difference: this repository's decoders are deterministic lookups where conversion is not a question, and a matcher will have to answer it."

[[fields]]
id = "decoder_base_methods"
cudaq_symbol = "decode, decode_batch, decode_async, get_block_size, get_syndrome_size, get_version, with a C++ decode_result_type {errors, observables} selecting whether the decoder is asked for corrections or for observable flips"
flagquantum_symbol = "flagquantum.qec.Decoder"
verdict = "reshaped"
note = "Both are a small protocol over a syndrome, and the local one is deliberately narrower: decode on a syndrome history, plus a streaming protocol with decode_round. Upstream's decode_result_type is the interesting field: it makes 'give me the observable flips' a request rather than a derived step, which is the interface position to align on even when the implementation is a matcher."

[[fields]]
id = "decoder_plugin_precedent"
cudaq_symbol = "in-tree plugin sources under libs/qec/lib/decoders/plugins for chromobius, pymatching and an example lookup decoder, plus a sliding-window decoder implemented in-tree over an inner decoder"
flagquantum_symbol = ""
verdict = "absent"
negative_search = ["flagquantum/qec/plugins"]
note = "Not a capability to copy but a precedent that is direct evidence for this repository's plan: the framework being aligned to integrates open matching and matching-adjacent decoders behind a plugin boundary rather than reimplementing them, while its own closed decoder ships as a binary. That is the same split the parity matrix's qec_decoder_family reason records (integrate Apache-2.0, accelerate later through the FlagOS kernel path). The integrating half of that split is now realized for one library -- flagquantum/qec/adapters.py is the PyMatching cross-check behind the pymatching extra -- and the field stays `absent` because the boundary is the field: the adapter is a concrete class over a decoding graph rather than a decoder registered under a name, so it proves integrating is the route without being the plugin protocol itself."
