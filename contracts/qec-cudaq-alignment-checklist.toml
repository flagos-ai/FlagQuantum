r cannot is unreachable. The baseline's x_ and z_ variants are no longer a gap: the sampler reads the record's readout basis, so the rotation the basis adds to the lowered program is a stated offset beside the round block rather than a round of its own, the round blocks after it are compared to each other rather than to the rotation, and every location is placed relative to that offset -- which is what puts an X-basis experiment's data faults and readout flips where its own model puts them. The remaining work is therefore the arbitrary annotated circuit at the input end rather than the placement grammar: a stimulus still has no route to either the model or a sample."
