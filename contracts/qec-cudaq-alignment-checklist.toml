next_action = "Every gap the previous revisions of this row listed is closed and what is left is stated rather than implied. The X and Z detector bands that an hx/lx pair implies are reachable now: the matrix route reads both parity blocks and both logical blocks, and the phase and Y fault families alongside the data-flip one, so a mechanism carries the observable rows of either basis. The rate record is no longer one of them: it carries the four fault families as four scalars and the same four overrides per qubit and per check, and both construction routes read an element through the same accessor, so a location can be given its own rate while its neighbours keep theirs and a quiet location between two noisy ones enumerates no mechanism at all. The context object is no longer one of them either: `decoder_context_from_memory_circuit` builds the model once and the context returns it a basis at a time together with the maps that say which measurements compose each detector and each observable, so a decoder is handed both halves instead of the caller threading them by hand. What is left in construction itself is one route: a model that comes out of a kernel's own annotations, which this repository cannot do until the annotation row moves, because the parity is stated in a layout beside the source rather than in the kernel body a compiler would have to carry it out of."
fail_closed = "A non-Pauli channel is refused with a stated reason rather than decomposed, and construction is bounded by the statevector ceiling, which is why the modelled rotated-surface distance stops at three; the matrix route is not bounded by it at all, because it reads a support rather than executing a program. A context is built from the same construction route rather than a second one, so it cannot state a model the construction route would not, and it refuses a model whose detector or observable count disagrees with the circuit it is read over. A basis component refuses an id-carrying model rather than dropping the correlation or merging two members of a group of alternatives, and refuses an empty basis rather than returning a model with no detector. The per-error observable of a mechanism is not asserted from the source but read off the layout after the flip on the circuit route, and derived from the logical matrix on the matrix route. The two routes describe different experiments and the difference is pinned rather than glossed: the matrix route has no terminal data readout, so its detector count is num_rounds * num_checks while a memory circuit's is one band per round plus a terminal detector per Z-type check, and tests/qec/test_dem_code_matrices_stim.py asserts both geometries against the assumption each one states. The same file hands the matrix route's declared shape and every mechanism rate to stim's own error analysis one readout basis at a time, and pins the single place where a persisting data fault makes the model claim a band the experiment does not, as the exact relation between the two mechanism sets rather than as a tolerance, so the divergence cannot widen unnoticed. A matrix that is not binary, is not two-dimensional, or disagrees with another block about the number of data qubits is refused rather than coerced."

