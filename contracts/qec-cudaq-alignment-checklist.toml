# Repository contract; see contracts/README.md for ownership and stability.
#
# This checklist is the fine-grained reading behind one domain of
# cudaq-parity-matrix.toml. The matrix answers "which capability does CUDA-Q
# have, at what priority, with what evidence"; this answers "which upstream
# surface does the row line up with, symbol by symbol, and what is missing". It
# is checked by tools/check_qec_cudaq_alignment.py, which resolves every claim
# against this checkout rather than trusting the prose, and it is read through
# docs/development/QEC_CUDAQ_ALIGNMENT.md, which must mention every row here.
schema = "flagquantum_qec_cudaq_alignment_checklist_v1"
checked_by = "tools/check_qec_cudaq_alignment.py"

# ---------------------------------------------------------------------------
# The alignment target, stated once and in two halves, because the two halves
# are two different artifacts and the parity matrix records them as one.
# ---------------------------------------------------------------------------

# Product surface: the cudaq-qec library (NVIDIA/cudaq-qec, which is where
# libs/qec lives; the repository was named NVIDIA/cudaqx when this checklist was
# written and the old name now redirects to the new one).
baseline = "CUDA-Q QEC (the cudaq-qec library, NVIDIA/cudaq-qec libs/qec)"
baseline_versions = ["0.15.1", "0.16.0.post1"]
baseline_versions_source = "contracts/cudaq-parity-matrix.toml:cudaq_versions"
baseline_docs = "https://nvidia.github.io/cudaq-qec/ (documented as v0.8.0)"

# The component version, and the line it sits on. The pin above describes CUDA-Q
# core; cudaq-qec releases independently, so the rows here were read at a
# component version the pin does not reach. These three keys are checked against
# the parity contract's baseline.version_provenance, so the limit recorded below
# is the contract's limit and not a second, drifting copy of it.
baseline_component_version = "0.8.0"
baseline_component_source = "https://pypi.org/pypi/cudaq-qec/json"
baseline_component_release_line = ["0.1.0", "0.2.0", "0.2.1", "0.3.0", "0.4.0", "0.4.0.post1", "0.5.0", "0.5.0.post1", "0.6.0", "0.7.0", "0.8.0"]

# Kernel-level surface: CUDA-Q core, not cudaq-qec. The parity matrix folds
# `dem_from_kernel`, `DEMResult` and the detector annotations into the
# quantum_error_correction domain because that is where a QEC user meets them,
# and this split is the first thing the checklist has to keep straight.
kernel_surface = "CUDA-Q core (cudaq.detector / detectors / logical_observable / dem_from_kernel / DEMResult)"

# Format standard for interchange, which is not the alignment target but does
# fix the bytes: stim 1.16.0 detector error model text.
format_standards = [
    "Stim detector error model text, stim 1.16.0, for DEM interchange",
    "CUDA-Q QEC for the product surface (objects, entry points, code families, decoders)",
    "PyMatching for decoder correctness evidence, never as the authority",
]

# Provenance, and the limit of it. Row baselines quote the recorded CUDA-Q
# surface of the quantum_error_correction domain, measured from a live CUDA-Q
# 0.16.0 install. Field baselines were re-read from the cudaq-qec source tree
# (libs/qec/python, libs/qec/lib, docs/sphinx) and from the CUDA-Q core API docs
# when this checklist was written.
#
# The tree that source read names has been renamed since: the API answers 301
# for NVIDIA/cudaqx and the git remote resolves it to NVIDIA/cudaq-qec, which is
# where libs/qec lives now, so the source read is recorded against the name that
# serves it. The revision read is
# 8df583e621ed39c3af08e0373aa3d51a6c0b9d21, the tree the checkout resolved to
# when the negatives below were settled; a later reader reproduces the reading
# by taking that revision rather than a branch name that moves.
provenance = "rows: contracts/cudaq-parity-matrix.toml (live 0.16.0 install reading); fields: cudaq-qec source tree (NVIDIA/cudaq-qec, formerly NVIDIA/cudaqx) at 8df583e621ed39c3af08e0373aa3d51a6c0b9d21 + CUDA-Q core API docs (source re-read)"
provenance_limit = "No cudaq-qec release maps to the pinned CUDA-Q versions in this repository (the component's release line runs 0.1.0 to 0.8.0, the repository pins 0.15.1 and 0.16.0.post1, and the two lines are disjoint), so a field row proves the upstream surface exists today, not that it exists at the pinned baseline. The same limit is recorded as provenance_limit in contracts/cudaq-parity-matrix.toml, and the component version and release index above are checked against that contract rather than asserted here. A row carries provenance_unverified when its upstream side is a search result the row does not pin to a revision, because such a negative cannot be repeated from what the row states; naming the revision the search was taken at is what removes the mark, so no row carries it at this revision of the contract and the rule stays enforced by the tool rather than by an example."

status_values = ["aligned", "partial", "absent", "out_of_scope"]
verdict_values = ["equivalent", "renamed", "reshaped", "absent", "extra"]

# ---------------------------------------------------------------------------
# Alignment rows: one per surface item that has to line up, at the granularity
# of "what would have to exist for the row to move up".
# ---------------------------------------------------------------------------

