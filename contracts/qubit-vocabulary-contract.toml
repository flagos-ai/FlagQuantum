# Repository contract; see contracts/README.md for ownership and stability.
#
# Ledger for the qubit-vocabulary migration: no parameter, attribute, or
# module-level definition on the package's public surface may be spelled with
# `wire` once every slice below has landed.
# `tools/check_qubit_vocabulary.py` compares this file against a live scan of the
# package, so the ledger - not a document, and not a reviewer's memory - is the
# progress record. The parameters are authorized by
# docs/api-changes/FQ-QUBIT-VOCABULARY-INTEGRAL-20261005.md and decided by
# docs/development/API_CHANGE_PROPOSAL_065_QUBIT_VOCABULARY.md; the attribute and
# definition names are authorized by
# docs/api-changes/FQ-QUBIT-VOCABULARY-ATTRIBUTES-20261006.md and decided by
# docs/development/API_CHANGE_PROPOSAL_067_QUBIT_VOCABULARY_ATTRIBUTES.md.
schema = "flagquantum_qubit_vocabulary_contract_v1"
maturity = "development_evidence"
census_tool = "tools/census_wire_vocabulary.py"
gate_tool = "tools/check_qubit_vocabulary.py"
proposal = "docs/development/API_CHANGE_PROPOSAL_065_QUBIT_VOCABULARY.md"
authorization = "docs/api-changes/FQ-QUBIT-VOCABULARY-INTEGRAL-20261005.md"
naming_reference = "docs/reference/QUBIT_NAMING_MIGRATION.md"
predecessor = "docs/api-changes/FQ-QUBIT-TERMINOLOGY-COMPLETION-20261002.md"
ir_version = "1.0"
ir_version_unchanged = true

# The boundary is the whole package, not a documented subset. A documented subset
# cannot be drawn reproducibly: matching module names in docs/** turns
# `flagquantum.compiler` into its entire subtree and yields a number that looks
# precise but is decided by prefix matching. The whole-package boundary needs no
# judgement, so it is the one the gate can enforce.
[boundary]
surface = "public_function_surface"
definition = "every function or method declared in a module reachable from the flagquantum package whose name does not start with an underscore or is a dunder, nested inside code that is likewise public"
packages_included = ["flagquantum"]
private_excluded = true
dunders_public = true
dunder_note = "a dunder is Python's public protocol, so `Circuit.__init__` is a user entry point: `fq.Circuit(n_wires=3)` is the single most user-visible call in the package. An underscore-only rule hid it, and every other public constructor, in the excluded bucket"
measured_canonical = 341
measured_deprecated_aliases = 11
measured_private = 331
private_note = "private code keeps `wire` names; it is measured so the exclusion stays honest, and the gate requires this bucket to stay non-empty so the boundary cannot silently become vacuous"

[naming]
# One rule, applied by root substitution. A hand-written list per slice would
# become a second source of truth about the naming, which is what this section
# exists to prevent.
root_wire = "qubit"
root_wires = "qubits"
variadic_prefix_preserved = true
forbidden = ["qubit_indices", "qubit_ids", "qubit_labels", "logical_qubits"]
forbidden_note = "Circuit already says `qubits`, compose already says `qubits`; a second spelling would turn one rename into two vocabularies"

[exclusions]
# Values the gate must accept even though they contain `wire`. Each is an
# external format contract, not a FlagQuantum name.
serialized_keys = ["CircuitIR.n_wires", "Instruction.wires", "MeasurementNode.wires", "ObservableNode.wires"]
serialized_reason = "IR_VERSION is an exact-match pin; renaming a payload key would force a version bump"
environment_variables = ["FQ_STATEVECTOR_PERSISTENT_WIRE_LAYOUT"]
environment_reason = "published deployment switch"
vendor_payload_keys = "translated at the adapter boundary; an external schema does not take our vocabulary"
benchmark_parameters = "renamed with the package, but carry no compatibility obligation because they are not reachable from fq.*"

[other_surfaces]
# Named gaps this contract does not yet ledger, each recorded with its measured
# size so the migration cannot be declared finished while it is unmoved, and each
# naming the slice that must extend the gate first.
#
# The attribute and definition surfaces used to be the only entries here. `WQ-2`
# has ledgered both, so the totals stay recorded while the sections near the end
# carry the detail: a reader can still see that 144 names exist across the
# three declaration kinds and 10 definition names exist, and the gate
# reconciles both splits against these numbers on every run.
public_attribute_names = 144
public_attribute_ledgered = 122
public_attribute_persisted = 22
public_attribute_reproduce = "python -c \"from tools.census_wire_vocabulary import attribute_census as f; c = f(); print(len(c.ledgered), len(c.excluded))\""
public_attribute_owner = "WQ-2"
public_attribute_condition = "ledgered: [attribute_ledger] and [attribute_exclusions] are reconciled against the census on every run, so the split cannot drift and a name cannot be renamed while it is still a payload key"
public_attribute_aliased = 3
public_attribute_alias_condition = "aliases: a name here is renamed and still reachable through a deprecated forwarder until [attribute_aliases] removal_version; it is counted as remaining, so a slice cannot bank an alias as finished work"
public_definition_names = 10
public_definition_reproduce = "python -c \"from tools.census_wire_vocabulary import definition_census as f; print(len(f().ledgered))\""
public_definition_owner = "WQ-2"
public_definition_condition = "ledgered: every module-level public name is reconciled against [definition_ledger] on every run"
message_strings = 1291
message_strings_reproduce = "python -c \"from tools.census_wire_vocabulary import message_strings as f; print(len(f()))\""
message_strings_owner = "WQ-8"
message_strings_condition = "message strings are reported by the census but not ledgered: a string-literal scan cannot separate a serialized key from a refusal sentence, and a ledger built on that heuristic would fail on legitimate rewording"
# Canonical sites still spelled `wire`, one per line, keyed by module,
