# An export the rule refused. The rule's first measured finding was a protocol that no module,
# test, or example consumed; the repair is a deletion, and a deletion that is not written down
# is indistinguishable from an accident.
[[retired_export]]
name = "StatePreparationOperator"
was_ground = "public_unit, on the assumption that third-party state-preparation operators would implement it"
reason = "the measurement found no consumer anywhere: no algorithm module, no test, no example, and no benchmark named it, so the assumption was the whole of its support"
replaced_by = "nothing: a caller prepares a state with `arbitrary_state` or `append_arbitrary_state`, and a class that wants a protocol implements the existing `ControlledUnitary` or `AmplitudeOperator` instead"
