# Repository contract; see contracts/README.md for ownership and stability.
#
# `flagquantum.algorithms.primitives` is the one package in the repository whose public surface
# is admitted by a stated rule rather than by a public-API decision. The rule has three
# dimensions -- distribution semantics, differentiability, and the consumer that admits each
# export -- and this contract is the measured record of all three for every export.
#
# The rule is stated for contributors in three places at three lengths. That is deliberate: the
# one-sentence version lives where an importer reads it, the full version where the package is
# documented, and the algorithm guide states it where a user asks why a unit is or is not in the
# package. Three statements of one rule can drift, so this contract names the files and the
# marker each one has to contain, and the gate checks the markers rather than trusting them.
schema = "flagquantum_primitives_admission_contract_v1"
maturity = "development_evidence"
package = "flagquantum/algorithms/primitives"
implementation = "flagquantum/algorithms/primitives/__init__.py"
# The vocabulary is owned by `flagquantum/core/contracts.py` and read from there by the gate;
# this list has to equal its `DistributionSemantics` arguments, in order.
semantics_source = "flagquantum/core/contracts.py"
default_semantics = "single_device_fast_path"
authorization = [
    "docs/api-changes/FQ-ALGORITHMS-PRIMITIVES-ADMISSION-20261019.md",
]

distribution_semantics_vocabulary = [
    "single_device_fast_path",
    "sharded_across_ranks",
    "rank_local_replicated_kernel",
    "manual_sliced_tensor_contraction",
    "observable_term_parallel",
    "data_parallel_replicated",
    "replicated_per_rank",
]

# The files that state the rule for contributors, and the phrase each dimension is stated with.
# One list, because it is one rule: a file that states two of the three dimensions is stating a
# different rule, and the gate requires every marker in every file below.
stated_in = [
    "flagquantum/algorithms/primitives/__init__.py",
    "flagquantum/algorithms/primitives/README.md",
    "docs/guides/ALGORITHMS.md",
]

# The three dimensions of the rule.
[[dimension]]
name = "distribution_semantics"
marker = "distribution semantics"

[[dimension]]
name = "differentiability"
marker = "differentiability"

[[dimension]]
name = "consumers"
marker = "consumer"

# The three answers the differentiability dimension accepts. `no_tensor_argument` and
# `classical_tensor_input` are the two that hold today; `differentiable_tensor_input` has no row
# yet, and it is declared rather than left unexpressible so that the first export to claim a
# gradient has to name the test that proves it instead of asserting one.
[differentiability]

[[differentiability.shape]]
name = "no_tensor_argument"
statement = "The export takes no torch.Tensor, so there is no tensor path and nothing is claimed."
[[differentiability.shape]]
name = "classical_tensor_input"
statement = "The export takes a torch.Tensor and reads it as classical data: the values are consumed by a classical computation and emitted as fixed gate angles, so no gradient flows back to the argument and the contract records the command that showed it."
[[differentiability.shape]]
name = "differentiable_tensor_input"
statement = "The export takes a torch.Tensor and the gradient flows back through it; the contract names the existing test that proves it, function by function."

# One row per export of the package, ordered as the package orders its `__all__`. Every field
# below except the differentiability judgement is measured from the tree by
# `tools/check_primitives_admission_contract.py --measure`; the judgement is stated per export
# and the gate requires the two to agree.

