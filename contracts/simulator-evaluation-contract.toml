schema = "flagquantum_simulator_evaluation_contract_v1"
runner = "simulator_compare"
result_schema = "flagquantum.simulator_comparison.v1"
engines = ["flagquantum_native", "qiskit_aer"]
workload = "same_flagquantum_ir_exact_statevector"
dtype = "complex128"
device = "cpu"
hidden_fallback_allowed = false
scalability_claim_allowed = false
release_gate_allowed = false

[matrix]
standard_n_wires = [10, 14, 18, 22, 24]
small_latency_n_wires = [10, 14]
transition_n_wires = [18, 22]
memory_pressure_n_wires = [24]
capacity_probe_minimum_n_wires = 26
capacity_probe_release_gating = false
small_width_only_claims_whole_simulator_performance = false

[correctness]
required = true
metric = "max_abs_error"
absolute_tolerance = 1e-10
wire_order_normalization_required = true

[measurement]
conversion_reported_separately = true
compilation_reported_separately = true
cold_execution_reported_separately = true
steady_state_order = "alternating_within_one_process"
minimum_iterations = 3
minimum_calls_per_sample = 1
stability_metric = "relative_median_absolute_deviation"
maximum_relative_median_absolute_deviation = 0.10
result_retrieval_included = true
output_basis_normalization_included = false

[claims]
ratio = "qiskit_aer_seconds / flagquantum_native_seconds"
ratio_above_one = "flagquantum_native_faster"
benchmark_evidence_class = "comparison_non_release"
claim_evidence_type = "unknown"
scalability_blocker = "comparison_result_not_release_scalability_evidence"
