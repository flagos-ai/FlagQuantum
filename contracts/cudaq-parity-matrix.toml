reason = "Three members of the family are implemented natively and the rest are absent. Trotter time evolution landed as flagquantum.algorithms.trotter: a weighted Pauli sum becomes an ordinary Circuit through a product formula of order 1 or 2, with the exact circuit for one Pauli word's exponential as its primitive. Block encoding landed next as flagquantum.algorithms.primitives.block_encoding, promoted out of the private helper flagquantum.algorithms.svd held, and it carries the qubitization walk step with it: the reflection is emitted as one dense matrix, the flagged block is the matrix over the caller's subnormalisation, and one walk step is a rotation whose eigenphases are the arccosines of the encoded eigenvalues. The fermion-qubit transform family already had jordan_wigner at flagquantum.observables.fermion. A third member landed as flagquantum.algorithms.primitives.linear_combination, the Pauli linear-combination encoding: a Hamiltonian given as a weighted sum of Pauli words is encoded from its coefficients rather than from a matrix, at the sum of the coefficient magnitudes as the stated subnormalisation, and it satisfies the same two protocols the spectral encoding satisfies, so one consumer reads either without being told which it holds. Still absent: qubitization as a public walk object carrying a moment count, QSVT, double factorization, and the Bravyi-Kitaev, parity and ternary-tree transforms. The row names three registry entries because the shipped members are separate capabilities with separate surfaces and separate evidence: the product formula, the spectral block encoding, and the Pauli linear-combination encoding that is a second implementation behind the spectral encoding's own two protocols. The plan's original route -- adapt Qualtran, Apache-2.0, which covers the same mathematics -- was ruled out by the repository owner: Qualtran 0.7.0 carries 27 transitive dependencies and is not declared in dependency-policy.toml, so the mathematics is implemented natively instead and no third-party quantum-algorithm library is a dependency."

