[[domains.capabilities]]
id = "commutation_aware_rewrite"
cudaq = "CommutationAwareRewrite pass"
status = "partial"
priority = "next"
dependency_class = "none"
maturity_ref = "ir"
reason = "The analysis and one rewrite consumer are implemented. `flagquantum/compiler/commutation.py` answers the two questions a reduction needs -- whether two instructions commute, and which instructions form one commuting block on a wire -- and its rule source is a source of proof rather than of record: it reads the two instructions' operator schemas and proves the commutation, with disjoint support unconditional and a gate the rule source has no rule for treated as a barrier. `flagquantum/compiler/commutation_cancellation.py` is the consumer: `cancel_commuting_self_inverse` removes parameter-free, matrix-free members of the self-inverse set in proven pairs, keeping the last member of an odd group so what the block preserves is applied as late as it was before, and it is scheduled inside the pipeline's fixed-point loop, so `cx(0, 1) rz(0) cx(0, 1)` reduces to `rz(0)` where the wire-local self-inverse merge could not see it. What is absent is the part CUDA-Q's row is named for. CUDA-Q's pass is a driver: `CommutationAwareRewriteMatcher` searches backward from an anchor operation for the nearest earlier endpoint that a consumer will accept, crossing a frontier only where pairwise commutation or disjoint support is proven, and the consumer owns the endpoint's algebraic identity. FlagQuantum has one consumer hard-coded against the analysis instead of a matcher a second rewrite can plug into, so no pass can reorder a gate past a commuter to expose a cancellation that a different pass then takes. There is also no per-block analysis invalidation, because there is no pass manager to invalidate through, and no linear-use-def guard, because `CircuitIR` is a straight-line instruction list in which nothing can branch: the same fact that makes the guard unnecessary here is what makes the search unnecessary, which is why the two are one gap rather than two."
