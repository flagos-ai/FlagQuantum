reason = "Zero-noise extrapolation, probabilistic error cancellation and Clifford data regression. An observable is measured at several error strengths by scaling the one error-probability parameter each noise channel declares, and the curve is continued to zero by polynomial least squares or Richardson extrapolation, which reports the residual it left and the variance amplification of its weights. The channel families whose parameters are not error probabilities are refused by name, and a model that declares a readout rule is refused rather than measured without it, because the estimate is Tr(O rho) and classical readout confusion is applied after measurement. Beside that, a channel the model declares as a Pauli channel is inverted exactly by decomposing its inverse into a signed combination of Pauli words read off its Pauli transfer matrix, one location at a time, which reports the sampling overhead gamma squared that a sampled implementation would pay and refuses by measured magnitude the channel families whose transfer matrix is not diagonal and the channels whose transfer eigenvalue reaches zero. The third member landed last as flagquantum.algorithms.cdr: each phase, rx, ry, rz and u1 rotation of the target is snapped to its nearest quarter turn and rewritten into the named Clifford word for that turn, those training circuits' ideal values are read from exact density simulation and their noisy values from the same simulation of the declared model, and the affine relation between the two is fitted and applied to the target. Every training circuit is accepted by flagquantum.simulation.stabilizer.require_clifford_program before it is measured, so the membership that would make the training set cheap on hardware is enforced and never exploited: this path pays the target's own simulation cost and claims no capacity advantage from it, and it says so where the estimate is. A model that names an operation the rewrite removes is refused, because the model keys its channels on gate names and every training point would otherwise receive less noise than the target, and a program that declares a measurement or observable request is refused because the path reads Tr(O rho) and consumes no request. The fit's largest residual is the only diagnostic of the affine premise and is reported as absent rather than as an arithmetic zero when no degree of freedom was left, so a two-point fit's agreement is an identity rather than a check. Readout-error mitigation is absent."

