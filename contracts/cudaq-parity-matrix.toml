reason = "Routing, topology legalization, and directional topology modules exist as a skeleton, but there is no published-quality router comparable to a SABRE-class algorithm."

[[domains.capabilities]]
id = "commutation_aware_rewrite"
cudaq = "CommutationAwareRewrite pass"
status = "partial"
priority = "next"
dependency_class = "none"
maturity_ref = "ir"
reason = "The analysis and one rewrite consumer are implemented. `flagquantum/compiler/commutation.py` answers the two questions a reduction needs -- whether two instructions commute, and which instructions form one commuting block on a wire -- and its rule source is a source of proof rather than of record: it reads the two instructions' operator schemas and proves the commutation, with disjoint support unconditional and a gate the rule source has no rule for treated as a barrier. `flagquantum/compiler/commutation_cancellation.py` is the consumer: `cancel_commuting_self_inverse` removes parameter-free, matrix-free members of the self-inverse set in proven pairs, keeping the last member of an odd group so what the block preserves is applied as late as it was before, and it is scheduled inside the pipeline's fixed-point loop, so `cx(0, 1) rz(0) cx(0, 1)` reduces to `rz(0)` where the wire-local self-inverse merge could not see it. What is absent is the part CUDA-Q's row is named for. CUDA-Q's pass is a driver: `CommutationAwareRewriteMatcher` searches backward from an anchor operation for the nearest earlier endpoint that a consumer will accept, crossing a frontier only where pairwise commutation or disjoint support is proven, and the consumer owns the endpoint's algebraic identity. FlagQuantum has one consumer hard-coded against the analysis instead of a matcher a second rewrite can plug into, so no pass can reorder a gate past a commuter to expose a cancellation that a different pass then takes. There is also no per-block analysis invalidation, because there is no pass manager to invalidate through, and no linear-use-def guard, because `CircuitIR` is a straight-line instruction list in which nothing can branch: the same fact that makes the guard unnecessary here is what makes the search unnecessary, which is why the two are one gap rather than two."
evidence = ["flagquantum/compiler/commutation.py", "flagquantum/compiler/commutation_cancellation.py", "flagquantum/compiler/pipeline.py", "tests/unit/test_compilation_commutation.py", "tests/unit/test_compilation_inverse_cancellation.py", "search:no commutation-aware rewrite driver that lets an arbitrary rewrite cross a commuting gap, and no pass manager to invalidate a block-local analysis through"]

[[domains.capabilities]]
id = "dead_code_elimination"
cudaq = "DeadQuantumElimination and general dead code elimination"
status = "unsupported"
priority = "next"
dependency_class = "none"
maturity_ref = "ir"
reason = "Absent, and the earlier reason this row gave -- that it depends on the pass infrastructure -- does not survive measurement, because the neighbouring commutation row was reconciled without any pass infrastructure at all. CUDA-Q's pass does two things, and neither has a representation here. It removes a `quake.null_wire` whose only use is `quake.sink`, and a `quake.alloca` whose only use is its matching `quake.dealloc` or which has no use at all. `CircuitIR` declares its width once as `n_wires` and the operator schema table holds no allocation, release, null-wire, or sink opcode, so a wire that was never allocated cannot exist and the object this elimination removes is not denotable. What is left is the general half -- a gate whose result no later reader observes -- and that is where the semantics first have to be settled, because the answer differs by output class. `fq.run` returns the whole statevector, so a gate on a wire nothing else touches is observable in the returned state and eliminating it would change the result; a program that declares `measurements` or `observables` has named its outputs, and only there can a wire with no reader be dead. A pass written against one reading would be wrong for the other, and no such declaration of output class is a property of `CircuitIR` today: an empty measurements tuple means both `the caller wants no measurement` and `the state is the answer`. That distinction is the work this row is actually waiting on, and it is recorded rather than implied."
evidence = ["flagquantum/core/ir.py", "flagquantum/core/operator_schema.py", "flagquantum/compiler/pipeline.py", "search:no allocation, release, null-wire, or sink opcode in the operator schema table, and no declared output class that would make an unread wire dead"]

[[domains.capabilities]]
id = "qir_code_generation"
cudaq = "QIR and Profile-QIR code generation to LLVM"
status = "partial"
priority = "now"
dependency_class = "B_open_neutral"
maturity_ref = "compiler_qir_emission"
