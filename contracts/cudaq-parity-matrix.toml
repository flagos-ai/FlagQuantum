# Repository contract; see contracts/README.md for ownership and stability.
#
# Purpose: the machine-readable CUDA-Q parity matrix. One row per capability that
# CUDA-Q offers, with FlagQuantum's status, the flagquantum dependency class that
# capability sits on, and the next concrete gap.
#
# This contract does NOT restate FlagQuantum maturity. When a capability has an
# entry in `capability-maturity.toml`, its `level`, `owner`, `limitations`,
# `hardware`, and evidence paths live there and are read from there. This file
# records only what that registry cannot: the CUDA-Q baseline, the dependency
# class, the comparison verdict, and the priority.
schema = "flagquantum_cudaq_parity_matrix_v1"
maturity = "experimental"
source_of_truth = "capability-maturity.toml"
cudaq_versions = ["0.15.1", "0.16.0.post1"]
related_contracts = [
    "contracts/cudaq-export-contract.toml",
    "contracts/interop-capability-gap-matrix.toml",
]
related_contract_rule = "These contracts also describe CUDA-Q and answer different questions: the export contract owns the adapter surface, and the gap matrix owns that adapter's per-format coverage. This matrix owns the product capability comparison and deliberately does not restate either. What is shared is the version pin, so tools/parity_matrix.py fails when the three disagree about which CUDA-Q they describe."
python_minimum = "3.11"
status_values = ["supported", "partial", "unsupported", "out_of_scope"]
priority_values = ["now", "next", "later", "excluded"]
dependency_classes = [
    "A_nvidia_proprietary",
    "B_open_neutral",
    "C_flagos_replacement",
    "none",
]
domain_order = [
    "language_and_programming_model",
    "compiler_and_ir",
    "simulation_backends",
    "noise_and_error_models",
    "operator_algebra_and_domain_libraries",
    "algorithm_layer",
    "quantum_error_correction",
    "logical_and_ftqc_layer",
    "hardware_and_cloud_targets",
    "realtime_control",
    "engineering_ecosystem_and_abi",
    "performance_and_scalability",
]

[baseline]
instrument = "docs/development/CUDAQ_PARITY_BASELINE.md"
capture_method = "documented_capability_survey_with_probes"
scope = "CUDA-Q capabilities observable from the public Python API, the documented backend roster, and the shipped repository tree of the pinned versions."
probe_rule = "A probe is a runnable repository script whose JSON payload can be landed as evidence. `runnable` means the probe starts and emits its schema. `measured` means a payload from a named machine is landed under benchmarks/results with the source revision, container image, environment, and methodology recorded next to it, and that benchmarks/audit_results.py accepts it. Every probe must declare a versioned schema identifier and a source identity."

[[baseline.probes]]
path = "benchmarks/cudaq_gradient_capability_probe.py"
status = "measured"
measures = "Which gradient strategies the installed CUDA-Q exposes through cudaq.gradients, by runtime public-symbol inspection."
first_capture = "CUDA-Q 0.16.0.post1 exported ParameterShift, CentralDifference, ForwardDifference, and gradient, and exposed no adjoint, reverse, or backprop symbol. On 2026-09-30 the same survey ran three times on each of jp-a800-172 and jp-a800-171, against cuda-quantum-cu12 and cuda-quantum-cu13 respectively, and returned a byte-identical capability record on both hosts, so the statement is a property of the release rather than of one installed wheel."
payload = "benchmarks/results/comparison/cudaq_gradient_capability_a800_20260930.json"
report = "benchmarks/results/comparison/CUDAQ_BACKEND_COMPARE_A800_20260930.md"

[[baseline.probes]]
path = "benchmarks/cudaq_backend_compare.py"
status = "measured"
measures = "Wall-clock and precision comparison of one FlagQuantum JAX kernel against one CUDA-Q target on a matched circuit, observable, dtype, gradient method, warmup, and iteration count."
first_capture = "On 2026-09-30 on jp-a800-172 and jp-a800-171, one A800-SXM4-80GB per host and CUDA-Q 0.16.0.post1 on both, the FlagQuantum JAX kernel matched CUDA-Q numerically on every configuration measured on both hosts: the largest loss deviation was 1.2e-05 and the largest gradient deviation 1.8e-05 against a 1e-4 tolerance, and every FlagQuantum timing agreed across hosts to within 10 percent. CUDA-Q's nvidia target was faster for forward-only execution at every width, widening from 1.4x at 8 wires to 89x at 22 wires, and that conclusion was insensitive to the warmup count. The FlagQuantum fused value-and-gradient program was faster per call, but its 18-wire ratio moved monotonically from 13.6x to 16.3x between one and five warmups, so an earlier 7.9x reading of the same configuration is withdrawn as under-warmed rather than reproduced."
payload = "benchmarks/results/comparison/cudaq_backend_compare_a800_20260930.json"
report = "benchmarks/results/comparison/CUDAQ_BACKEND_COMPARE_A800_20260930.md"

[baseline.surface_ownership]
default_owner = "cudaq-qec"
owners = ["cudaq-qec", "cudaq-core", "cudaq-logical-preview"]
rule = "A domain `cudaq_surface` list is an inventory of the surface a QEC user meets, and an inventory is not an attribution: three components of one product appear in those lists. Most items belong to cudaq-qec, which is the component this domain compares against. The entries below are the items whose owner is a different component, or whose owner is worth stating, and each records what that ownership means for the row it feeds. An attributed item must appear verbatim in exactly one domain surface list, so the table cannot drift from the inventory it explains, and an item owned by another component must state its consequence, so a reader cannot follow the inventory to the wrong owner. Only contested or non-obvious items are listed; the absence of an entry is not a claim about ownership."

[[baseline.surface_ownership.items]]
item = "detector, detectors, and logical_observable annotations in a kernel"
owner = "cudaq-core"
consequence = "These annotations are CUDA-Q core kernel syntax rather than a cudaq-qec API, and core's dem_from_kernel is what reads them back. The row the annotations feed therefore belongs to the core capability set, and whether FlagQuantum grows a kernel annotation surface is a language-level decision rather than a QEC library one."

[[baseline.surface_ownership.items]]
item = "dem, dem_from_kernel, and DEMResult"
owner = "cudaq-core"
consequence = "One surface item, two owners, so it must be read as two. dem_from_kernel and DEMResult are CUDA-Q core: both are documented on the core Python API page and neither appears in the cudaq-qec Python API, which exposes no dem_from_kernel and no DEMResult anchor at all. cudaq-qec's own construction entries are dem_from_stim_text, dem_from_memory_circuit with its x_ and z_ variants, and dem_from_css_matrices, and cudaq-qec consumes the core record rather than declaring it. Construction is only a cudaq-qec row when it is read against those entries; the core record is a dependency of the row, not its baseline."

[[baseline.surface_ownership.items]]
item = "extract_syndrome"
owner = "cudaq-logical-preview"
consequence = "extract_syndrome belongs to the CUDA-Q Logical preview layer, not to cudaq-qec: it appears in that layer's Stim emission material as the encoded operation a fabric call expands into, it is absent from the cudaq-qec Python API, and it is absent from the core Python API page. cudaq-qec's own extraction route is sample_memory_circuit with its x_ and z_ variants, feeding decoder_context_from_memory_circuit. Aligning to the preview layer would not deliver the detector error model this domain is built around, because that layer states of itself that it does not simulate, sample, or decode and emits no detector error models. Either the surface item is misattributed here, or the preview layer is a second target with a different deliverable."

[[baseline.surface_ownership.items]]
item = "the logical.* preview namespace"
owner = "cudaq-logical-preview"
consequence = "The namespace is preview-layer scope, not a cudaq-qec surface. The semantic core inside it -- lattice surgery, product rotation, distillation -- is what the qec_logical_operations row tracks through the Qualtran adaptation, while the namespace's patch, gadget, protocol, and program records are that layer's own shape and not a FlagQuantum target."

[[baseline.surface_ownership.items]]
item = "for-stim-users migration"
owner = "cudaq-logical-preview"
consequence = "cudaq-qec ships no for-Stim-users page. The only page with that title in the CUDA-Q documentation belongs to the logical preview layer, and it states there that the layer does not simulate, sample, or decode, emits no detector annotations and no detector error models, and that those studies belong to the Stim ecosystem. It is therefore not a cudaq-qec counterpart, and the qec_stim_user_migration document has to be written against cudaq-qec's own surface -- dem_from_stim_text, dem_sampling, the decoder framework, and decoding from Stim DEM text -- rather than translated from that page."

[[baseline.surface_ownership.items]]
item = "Stim integration"
owner = "cudaq-qec"
consequence = "Stim appears on both sides of the product split, so the item needs its cudaq-qec half named. Reading Stim detector error model text, and decoding from Stim DEM text, are cudaq-qec's: dem_from_stim_text and the decoder framework's Stim entry point are in the cudaq-qec Python API. Emitting Stim from a verified gadget is the preview layer's and is not a cudaq-qec capability. A row that reads only the second half would compare this repository against a component that does not decode."

[baseline.version_provenance]
rule = "The top-level cudaq_versions pin describes CUDA-Q core, which is the product both the export contract and this matrix describe. The QEC component ships on its own release line, so a quantum_error_correction row is only as strong as the component version it was read at, and this table records that version separately rather than implying that the pin reaches it. The tool fails closed in both directions: a pin that overlaps the component release line needs a mapping entry, and a mapping entry across two lines that do not overlap is refused as a correspondence nothing supports."
pinned_component = "CUDA-Q core"
component = "cudaq-qec, also shipped as libs/qec inside NVIDIA/cudaqx"
component_release_line = ["0.1.0", "0.2.0", "0.2.1", "0.3.0", "0.4.0", "0.4.0.post1", "0.5.0", "0.5.0.post1", "0.6.0", "0.7.0", "0.8.0"]
component_version_recorded = "0.8.0"
component_source = "https://pypi.org/pypi/cudaq-qec/json"
provenance_limit = "No cudaq-qec release maps to either pinned CUDA-Q version: the component's release line runs from 0.1.0 to 0.8.0 while the pin is 0.15.1 and 0.16.0.post1, and the two lines are disjoint. Every quantum_error_correction row therefore records the component surface as it stands at 0.8.0. That the same surface exists at the pinned CUDA-Q baseline is not established by this contract, so a QEC row must not be read as a statement about CUDA-Q 0.15.1 or 0.16.0.post1, and a row that needs to be is a new capture rather than a new reading."

[baseline.limitations]
items = [
    "A capability absent from this matrix is not evidence that CUDA-Q lacks it; it is evidence that the survey did not record it.",
    "The pinned versions are the ones the repository already targets in contracts/cudaq-export-contract.toml. A CUDA-Q release outside that range requires a new capture.",
    "No row in this file is a performance comparison. Measured numbers belong in benchmarks/results and require an audited payload.",
    "A `runnable` probe is not a recorded measurement. CUDA-Q is not installable from the pinned public index as a binary wheel: the PyPI `cudaq` release is an sdist whose build hook resolves a platform binary distribution at install time. No CI lane in this repository runs either probe, so a payload is only ever captured by hand on a machine that reaches a working CUDA-Q index.",
    "A landed payload describes only the machines, revision, and workload it names. It is not scalability evidence and it does not generalise to other widths, observables, targets, or CUDA-Q releases.",
    "A gradient-path ratio is not a simulation-throughput ratio. The two sides do not execute the same schedule, so a value-and-gradient comparison measures host call structure as well as arithmetic.",
    "The recorded protocol has not been shown to reach steady state for the gradient configurations. A gradient ratio is only meaningful together with the warmup count that produced it, and a settled protocol needs a per-configuration convergence check rather than a fixed warmup count.",
]

[policy]
status_rules = [
    "supported: FlagQuantum has an equivalent capability and that capability has a registry entry in capability-maturity.toml. The parity status asserts presence, not production readiness; maturity is read from the registry and published next to every row.",
    "partial: an equivalent implementation exists but covers less than the CUDA-Q baseline, or a registry entry covers only part of the row.",
    "unsupported: the capability is absent and no accepted decision places it outside the parity scope.",
    "out_of_scope: the capability is absent by explicit decision, and `reason` names the decision.",
]
maturity_ref_rule = "`maturity_ref` names the capability-maturity.toml entry that establishes the FlagQuantum side of the row, or the entry the row's implementation would extend. It is required for a `supported` row and optional elsewhere. It is traceability, not a maturity claim: the generated document prints the registered level beside it, and no parity status may be inferred from that level."
maturity_refs_rule = "`maturity_refs` is the plural form, for a row whose implementation genuinely spans more than one registry entry, and a row names its entries through one form or the other and never both. It is not a way to strengthen a weak row: the entries must each cover a distinct part of the row's scope, and a row that needs two entries because one capability was split across two registry entries should say so in `reason` instead. Where a row's parts meet is what the row is about, so splitting the row to avoid the plural form would leave the meeting point in neither row."
evidence_rule = "Every row carries evidence. An item is either a repository-relative path that must exist, or a `search:` token recording the negative search that established absence. A claim without evidence is a plan, not parity."
dependency_class_rule = "A_nvidia_proprietary is the replacement battlefield: the CUDA-Q implementation depends on an NVIDIA-proprietary component and FlagQuantum must not. B_open_neutral marks a dependency FlagQuantum may use directly under a permissive licence. C_flagos_replacement marks a dependency FlagQuantum satisfies through a FlagOS-family component. none means the capability is not dependency-bearing."
scalability_rule = "No row in this matrix may assert scalability. Scalability claims are read from capability-maturity.toml and require an audited benchmark payload naming a verified integration commit."
baseline_gap_rule = "`baseline_gap` records a narrower scope at the same parity status, such as a smaller measured scale or an unverified accelerator. It is prose for a human reader and is not a machine-checked claim; scale claims still require an audited benchmark payload."
update_rule = "Refreshing this matrix is a generated-diff change: tools/parity_matrix.py renders docs/reference/CUDAQ_PARITY_MATRIX.md from this contract, and hand-editing that document is a defect. Run tools/parity_matrix.py --check in CI."

[[domains]]
id = "language_and_programming_model"
title = "Language and programming model"
cudaq_surface = ["nvq++", "@cudaq.kernel", "kernel arguments", "classical control flow", "cudaq.control", "cudaq.adjoint", "register_operation", "qudit and photonic operations"]
evidence = ["flagquantum/circuit.py", "flagquantum/operators", "search:no C++ translation unit, no AST bridge, and no function or call construct in the CircuitIR 1.0 schema"]

[[domains.capabilities]]
id = "cpp_kernel_frontend"
cudaq = "C++ front end nvq++ compiling Clang AST into the Quake dialect"
status = "unsupported"
priority = "later"
dependency_class = "B_open_neutral"
reason = "No C++ product surface exists. A domestic C++ front end would reuse the same LLVM/MLIR upstream as the Python path, so it is deferred rather than excluded."

[[domains.capabilities]]
id = "python_ast_kernel"
cudaq = "@cudaq.kernel decorator compiling a Python function body through an AST bridge"
status = "partial"
priority = "now"
dependency_class = "none"
reason = "FlagQuantum builds circuits through an explicit builder API. There is no AST layer, so a user cannot write a Python function body as a kernel."

[[domains.capabilities]]
id = "kernel_first_class_functions"
cudaq = "Kernels are typed callables with parameters, composition, and nested calls"
status = "unsupported"
priority = "now"
dependency_class = "none"
maturity_ref = "ir"
reason = "The public CircuitIR schema 1.0 has no function or call construct. The internal levels designed in MULTI_LEVEL_IR_ARCHITECTURE.md 5.2 do, and are the planned home."

[[domains.capabilities]]
id = "classical_control_flow"
cudaq = "if, for, and while over classical values inside a kernel"
status = "unsupported"
priority = "now"
dependency_class = "none"
maturity_ref = "ir"
reason = "CircuitIR 1.0 expresses a straight-line instruction list. Classical values with def-use, blocks, branches, and bounded loops are designed but not implemented."

[[domains.capabilities]]
id = "runtime_qubit_allocation"
cudaq = "Qubit allocation and release at kernel runtime with qubit lifetime"
status = "unsupported"
priority = "next"
dependency_class = "none"
maturity_ref = "ir"
reason = "Wire count is fixed at circuit construction. Runtime allocation is designed in the QuantumIR level and is not implemented."

[[domains.capabilities]]
id = "control_adjoint_modifiers"
cudaq = "cudaq.control and cudaq.adjoint applied to arbitrary operations"
status = "partial"
priority = "now"
dependency_class = "none"
maturity_ref = "circuit_composition"
reason = "The adjoint half is present on the Stable Core type: Circuit.adjoint() inverts a program by reversing its instruction order and inverting each instruction from the rule its opcode declares, inverting an instruction that carries a matrix by conjugate transpose, and refusing a noise channel, a dynamic operation, a classically conditioned instruction, a matrix without a conjugate transpose and an unknown opcode without a matrix with CapabilityError instead of copying them forward. 31 of the 35 registered opcodes invert. The control half is absent: only the named gates ccx and cswap provide multi-controlled forms, no controlled-modifier constructor exists, and a unitary passed through Circuit.any is not a modifier. `power` is absent for the same reason. Neither gap has an approved API change proposal, so both are owned rather than partially built."
evidence = ["contracts/circuit-composition-contract.toml", "tests/unit/test_circuit_composition_contract.py"]

[[domains.capabilities]]
id = "type_system_qubit_register_view"
cudaq = "qubit, qvector, and qview types with linearity rules"
status = "unsupported"
priority = "now"
dependency_class = "none"
maturity_ref = "ir"
reason = "CircuitIR 1.0 addresses wires by integer index and has no type system. The designed QuantumIR type system and its reference-versus-value linearity rules are not implemented."

[[domains.capabilities]]
id = "dynamic_kernel_measurement_feedback"
cudaq = "Mid-circuit measurement and measurement-result-driven branching inside a kernel"
status = "partial"
priority = "now"
dependency_class = "none"
maturity_ref = "dynamic_circuits"
reason = "FlagQuantum implements this through runtime/dynamic with a candidate-stable public namespace. The registered level is below production, and the surface is narrower than the CUDA-Q baseline."

[[domains.capabilities]]
id = "custom_operation_registration"
cudaq = "register_operation for user-defined operations with backend capability negotiation"
status = "partial"
priority = "now"
dependency_class = "none"
reason = "Circuit.any accepts a raw unitary but there is no operation registry, no schema, and no backend degradation contract for a user-defined operation."
evidence = ["flagquantum/circuit.py", "flagquantum/operators"]

[[domains.capabilities]]
id = "qudit_and_photonic_operations"
cudaq = "Qudit levels and photonic operations such as create, annihilate, and beam_splitter"
status = "unsupported"
priority = "later"
dependency_class = "none"
reason = "No qudit or photonic operation exists. Deferred as a distinct product line rather than a parity gap for the qubit runtime."

[[domains.capabilities]]
id = "pauli_tracking_sbe"
cudaq = "Pauli tracking stabilizer-basis expansion for noisy simulation"
status = "unsupported"
priority = "next"
dependency_class = "none"
reason = "The sampling engine and the detector error model module both exist, so the condition this row was deferred on is met, and the row is now blocked on one narrower thing: the engine refuses a circuit carrying any noise instruction rather than tracking a Pauli frame through it. Pauli tracking is what would let a noisy Clifford circuit be sampled without a dense state."
evidence = ["flagquantum/simulation/stabilizer/engine.py", "search:the sampling engine declines a noise instruction instead of tracking its frame"]

[[domains.capabilities]]
id = "asynchronous_execution"
cudaq = "run_async, sample_async, observe_async, and evolve_async with their result handles"
status = "unsupported"
priority = "later"
dependency_class = "none"
reason = "Absent. Every FlagQuantum entry point returns a completed result, so there is no handle an outer loop could poll and no overlap between host work and a device run."
evidence = ["search:no asynchronous entry point and no in-flight result handle"]

[[domains.capabilities]]
id = "global_seed_control"
cudaq = "set_random_seed for a process-wide sampling and noise seed"
status = "partial"
priority = "next"
dependency_class = "none"
reason = "Seeding is per call rather than process wide. `ExecutionOptions` carries a seed and the training path carries its own seeder, so a user reproduces a run by threading a seed through each entry point instead of stating one seed for the session."
evidence = ["flagquantum/runtime/options.py", "flagquantum/runtime/training_state.py", "search:no process-wide seed entry point"]

