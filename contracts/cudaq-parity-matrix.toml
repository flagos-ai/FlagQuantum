reason = "Zero-noise extrapolation and probabilistic error cancellation, not Clifford data regression. An observable is measured at several error strengths by scaling the one error-probability parameter each noise channel declares, and the curve is continued to zero by polynomial least squares or Richardson extrapolation, which reports the residual it left and the variance amplification of its weights. The channel families whose parameters are not error probabilities are refused by name, and a model that declares a readout rule is refused rather than measured without it, because the estimate is Tr(O rho) and classical readout confusion is applied after measurement. Beside that, a channel the model declares as a Pauli channel is inverted exactly by decomposing its inverse into a signed combination of Pauli words read off its Pauli transfer matrix, one location at a time, which reports the sampling overhead gamma squared that a sampled implementation would pay and refuses by measured magnitude the channel families whose transfer matrix is not diagonal and the channels whose transfer eigenvalue reaches zero. Readout-error mitigation and Clifford data regression are absent."

