maturity_ref = "detector_error_matching_decoder"
reason = "Matching is now self-implemented rather than absent: the detector error model becomes a weighted decoding graph whose edge weight is log((1 - p) / p), and a syndrome is decoded exactly by enumerating the ways to pair its defective detectors and to route any of them to the graph's boundary. The row stays partial on scope, not on correctness. Matching needs a graphlike model and refuses a hyperedge rather than projecting it onto a pair, so a code whose mechanisms flip three or more detectors is outside this row's matching half. The pairing is enumerated, so a syndrome is bounded by a defect budget instead of decoded at scale. Belief propagation with ordered statistics decoding is absent, so the LDPC codes the baseline serves with it are not served here; the sliding-window decoder for a long-lived experiment is absent; and there is no decoder registry or plugin protocol, so a decoder is constructed directly rather than requested by name. The baseline's GPU decoders are deliberately not chased, because the CUDA-Q qLDPC decoder is a closed-source shared library, so only its interface position is a target and an Apache-2.0 implementation is the route if that scope is ever reached. The row fails closed on a second gap of its own: because the graph keeps one edge per mechanism, a model that states one detector-and-observable signature twice would become two parallel edges and the matcher would take the cheaper, so the decoder requires a unique signature before it weights anything and refuses a duplicate with the merge that resolves it named in the refusal. It fails closed on the neighbouring statement for the neighbouring reason: a model that says two mechanisms are alternatives is refused and the groups are named, because one weight per mechanism is the weight of a fault that fires alone while a group of alternatives is one fault whose weight is the negative log-likelihood of the group, so weighting the members separately would charge the model more than the fault costs. The cross-check half has landed and it is a comparison of two selections rather than an equality of two instruments: PyMatching is behind the `pymatching` extra and is never the authority, and because its own accumulator reports 3.9020747171643912 for a mechanism this row states as 3.9020746947749574 the graph it minimizes over is not exactly this one. The row therefore asserts the cheapest weight on every syndrome, the observables wherever the cheapest explanation is unique, and the two refusals as the same set, with a pinned tie on the distance-three repetition code so the tie clause is demonstrated. The registry, the two decoder families the matcher does not cover, and the hyperedge front end were the work this row still named; of those, the registry has landed and is described above. A decoder registry has since landed, and it is the factory half of the baseline's decoder surface rather than the whole of it: flagquantum.qec.get_decoder(name, source, **options) reaches a decoder by name and flagquantum.qec.register_decoder(name, *, replace=False) puts one there, with registration checked while the registering module is imported so a class missing decode or from_detector_error_model is refused there rather than at the first caller. The registry is deliberately narrower than upstream's. Its source argument takes the three carriers a caller can hold a model in -- the detector error model, stim's text for one, and the decoding graph the model defines -- and not H_or_dem_text_or_sparse_matrix, because lifting a parity-check matrix would also mean choosing the noise model and round count that from_code_matrices reads rather than defaults. It holds the detector-error-model family alone, because the repetition-code decoders here take an ordered syndrome history rather than detection events and one name space over two input protocols would make a name mean one of two things. It fails closed rather than falling back: an unregistered name raises and lists the registered names, a source that is not one of the three carriers is refused by type, and no name is preferred over another, so the authority is returned for its own name wherever the optional extra happens to be installed. The remaining work inside this row is therefore the two decoder families the matcher does not cover, the hyperedge front end, and the plugin boundary the baseline ships -- the registered adapter is a concrete class under a name rather than a plugin loaded across a version boundary."
