default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(benchmarks/results/|assets/readme/.*\.svg$)
      - id: end-of-file-fixer
        exclude: ^benchmarks/results/
      - id: check-docstring-first
      - id: check-yaml
      - id: debug-statements
      - id: check-ast
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.12.7"
    hooks:
      - id: ruff
        files: ^(flagquantum|tests|tools)/.*\.py$
        args: ["--fix"]
  - repo: local
    hooks:
      - id: english-repository-content
        name: English repository content
        entry: python tools/check_repository_language.py
        language: system
      - id: architecture-boundaries
        name: architecture boundaries
        entry: python tools/check_architecture.py
        language: system
        pass_filenames: false
      - id: repository-hygiene
        name: repository hygiene
        entry: python tools/check_repository_hygiene.py
        language: system
        pass_filenames: false
      - id: operator-manifest
        name: operator manifest
        entry: python -m tools.operator_manifest --check
        language: system
        pass_filenames: false
      - id: runtime-contract-schema
        name: runtime contract schema
        entry: python -m tools.runtime_contract_schema --check
        language: system
        pass_filenames: false
      - id: documentation-source-of-truth
        name: documentation source of truth
        entry: python -m tools.docs_source_of_truth --check
        language: system
        pass_filenames: false
      - id: public-api-baseline
        name: public API migration baseline
        entry: python -m tools.public_api_snapshot
        language: system
        pass_filenames: false
      - id: legacy-root-api-usage
        name: legacy root API usage
        entry: python tools/check_legacy_root_api_usage.py
        language: system
        pass_filenames: false
      - id: correctness-certification
        name: correctness certification matrix
        entry: python -m tools.correctness_certification --check
        language: system
        pass_filenames: false
      - id: black-production-surface
        name: black production and test surface
        entry: black --check
        language: system
        files: ^(flagquantum|tests|tools)/.*\.py$
      - id: mypy-package
        name: strict type check of the whole package
        # Target 3.12 because numpy's bundled stubs use PEP 695 `type`
        # statements, which mypy only parses at 3.12. A developer environment
        # installs numpy through the jax extra, so the pyproject target of 3.10
        # fails before checking a file. Same commands as the CI quality job.
        entry: >-
          mypy --strict --python-version 3.12 --ignore-missing-imports
          flagquantum
        language: system
        pass_filenames: false
        files: ^flagquantum/.*\.py$
      - id: mypy-ci-tooling
        name: strict type check of the CI tooling
        entry: >-
          mypy --strict --python-version 3.12 --ignore-missing-imports
          --follow-imports skip
          tools/ci_tier.py
        language: system
        pass_filenames: false
        files: ^tools/.*\.py$
      - id: pre-push-ci
        name: FlagQuantum CPU pre-push gate
        entry: python tools/pre_push.py
        language: system
        pass_filenames: false
        stages: [pre-push]
