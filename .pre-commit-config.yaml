default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(benchmarks/results/|assets/readme/.*\.svg$)
      - id: end-of-file-fixer
        exclude: ^benchmarks/results/
      - id: check-docstring-first
      - id: check-yaml
      - id: debug-statements
      - id: check-ast
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.12.7"
    hooks:
      - id: ruff
        files: ^(flagquantum|tests|tools)/.*\.py$
        args: ["--fix"]
  - repo: local
    hooks:
      - id: architecture-boundaries
        name: architecture boundaries
        entry: python tools/check_architecture.py
        language: system
        pass_filenames: false
      - id: repository-hygiene
        name: repository hygiene
        entry: python tools/check_repository_hygiene.py
        language: system
        pass_filenames: false
      - id: operator-manifest
        name: operator manifest
        entry: python -m tools.operator_manifest --check
        language: system
        pass_filenames: false
      - id: runtime-contract-schema
        name: runtime contract schema
        entry: python -m tools.runtime_contract_schema --check
        language: system
        pass_filenames: false
      - id: documentation-source-of-truth
        name: documentation source of truth
        entry: python -m tools.docs_source_of_truth --check
        language: system
        pass_filenames: false
      - id: public-api-baseline
        name: public API migration baseline
        entry: python -m tools.public_api_snapshot
        language: system
        pass_filenames: false
      - id: legacy-root-api-usage
        name: legacy root API usage
        entry: python tools/check_legacy_root_api_usage.py
        language: system
        pass_filenames: false
      - id: correctness-certification
        name: correctness certification matrix
        entry: python -m tools.correctness_certification --check
        language: system
        pass_filenames: false
      - id: black-production-surface
        name: black production and test surface
        entry: black --check
        language: system
        files: ^(flagquantum|tests|tools)/.*\.py$
      - id: mypy-foundation
        name: mypy typed foundation subset
        entry: >-
          mypy --no-site-packages --ignore-missing-imports --follow-imports skip
          flagquantum/version.py flagquantum/core/ir.py
          flagquantum/core/parameters.py flagquantum/runtime/execution_plan.py
          flagquantum/runtime/execution_plan_contract.py
          tools/ci_tier.py
        language: system
        pass_filenames: false
      - id: mypy-runtime-contracts
        name: mypy strict runtime contracts
        entry: >-
          mypy --strict --no-site-packages --follow-imports skip
          flagquantum/core/contracts.py flagquantum/runtime/records.py
          flagquantum/runtime/audit/contracts.py
          flagquantum/runtime/executors/statevector/checkpointing.py
          flagquantum/runtime/executors/statevector/gradient_reduction.py
        language: system
        pass_filenames: false
        files: ^(flagquantum|tools)/.*\.py$
      - id: pre-push-ci
        name: FlagQuantum CPU pre-push gate
        entry: python tools/pre_push.py
        language: system
        pass_filenames: false
        stages: [pre-push]
