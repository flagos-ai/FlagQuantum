schema = "flagquantum.evidence_revision_origins.v1"

# Every revision recorded under `artifacts/` that this repository does not
# contain, with the origin a reader can obtain it from.
#
# `tools/check_evidence_revisions.py` walks that directory and requires each of
# these revisions to be listed here. Before this table existed, only the six
# checked-in validators resolved a revision, and each had its artifact path
# written into it, so an artifact no validator named was never asked: nineteen
# artifacts recorded a dead pin and thirteen of them said nothing about it.
#
# `producing_host_history` states that the run happened in a history this
# repository never held. It covers two populations, and the difference matters to
# a reader:
#
#   * fourteen revisions are commits of the pre-release personal repository
#     `FlagQuantum/FlagQuantum`, which is public and still serves them. The
#     evidence checked in here was produced from that line of development before
#     this repository's history existed, and `main` was subsequently re-authored,
#     so the same commit subjects appear here under different object names with
#     different trees. Re-pointing a pin at the look-alike object would present a
#     run as having executed code it never executed, so the recorded revision is
#     kept and its absence from this repository is stated instead.
#   * seven revisions are present in no repository published to GitHub. The
#     artifact's own payload and the archive hash recorded beside the pin are the
#     only record of those runs, and nothing here can make them reproducible.
#
# `external_dependency` states that the revision belongs to the external Torch-FL
# runtime the run recorded, which this repository does not vendor; `repository`
# says where to obtain it. Two revisions are recorded this way:
#
#   1b19383c24d9aa54637dd23557a5a20ef6d52ec5
#       flagos-ai/Torch-FL -- "fix(flaggems): make codegen vendor-agnostic (#72)"
#   2e00b393cf80088706b460a187aef185d3a283f4
#       flagos-ai/Torch-FL -- "feat: validate AMP support on MetaX (#146)"
#
# Add an entry only for a revision this repository does not contain. A revision
# that resolves here needs no origin, and declaring one for it fails the gate.


