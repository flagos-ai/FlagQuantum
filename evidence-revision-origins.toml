schema = "flagquantum.evidence_revision_origins.v1"

# Every revision a checked-in evidence artifact records that a reader of this
# repository cannot obtain, with the origin that accounts for it.
#
# `tools/check_evidence_revisions.py` walks `artifacts/`, `benchmarks/results/` and
# `docs/development/evidence/`, and requires each of these revisions to be listed
# here. It asks two questions
# about every full-length revision a walked artifact records, at any depth and
# under any field name: whether this repository holds the commit, and whether a ref
# of this repository reaches it. A reader obtains a revision only when both answers
# are yes, because a clone and a plain fetch obtain exactly the commits the refs
# they fetch reach. Before this table existed, six checked-in validators asked the
# first question and each had its artifact path written into it, so an artifact no
# validator named was never asked: nineteen artifacts under `artifacts/` recorded a
# revision this repository does not contain, and thirteen of them said nothing
# about it. No validator read `benchmarks/results/` at all, which is where seventeen
# further revisions and the fifty-one artifacts recording them were found.
# `docs/development/evidence/` was found by asking which tracked JSON outside those
# two roots records a revision at all, rather than by waiting for a claim about it:
# four of the records there held five revisions between them, which are the evidence
# `docs/guides/JIUDING.md` and the release notes cite. Three more records under that
# root were reached only because this change writes their citations out in full, so
# the walk now asks about seven records rather than four and about the same five
# revisions; the paragraph on citations at the end of this comment explains why.
#
# Forty-eight distinct revisions are recorded under the three walked roots, and one of
# them -- a commit on `main` -- is obtainable. The other forty-seven appear below in
# one of three states.
#
# `unreferenced_object` (twenty-five revisions) means no branch and no tag reaches
# the commit, so a clone or a plain fetch does not obtain it. This is the state a check
# for whether the object exists cannot see: the producing checkout still held the
# commit after the branch that introduced it was deleted or force-updated, so the
# pin resolved there while being unobtainable for every reader. The public remote
# does serve all twenty-five to `git fetch origin <revision>` by name, each
# confirmed by three counted fresh fetches under the method stated below, but
# retaining an unreferenced object is server
# policy rather than a promise, and one of the twenty-five is the head of a closed
# pull request. No ref of this repository reaches any of the twenty-five, so a
# complete clone obtains none of them; twenty are absent from this checkout's object
# database as well, and the remaining five linger here without a ref, which is what an
# answer read from the checkout rather than from the declaration would depend on. Two
# of the twenty-five entered this table from a different direction than the rest. The
# twenty-fourth is
# `5cfcd765a72bb8007b5c6f07e9adc4337fc63b10`, and it entered only after
# the citation that named it was written out in full: the Quafu artifact recorded it
# as `5cfcd765`, which is too short for the gate to read as a revision, so an
# unobtainable pin sat inside a walked artifact unasked. The twenty-fifth,
# `0e2d57204cb4fdd3f002de94367346923f7d1b33`, was published after this table was
# first written by `benchmarks/results/local/mps_two_site_dispatch_a800.json`, and
# the branch that introduced it was deleted when its pull request merged, so the
# object is exactly as unobtainable as the rest of the class: three counted `git fetch`
# attempts served it by name, and no ref of this repository reaches it.
#
# The fetch confirmation is only worth its method, because a probe that reads a
# failed fetch as a refusal cannot tell a deleted object from a dropped connection or
# a transient error, and these probes run from a host that loses connectivity to
# `github.com` for minutes at a time. A failed attempt carries no information either
# way: revision `05154c4b89758150c3bcee958135bd62f3b1ad8c`, recorded by
# `benchmarks/results/smoke/release_candidates/mps_boundary_transport/summary.json`,
# failed one attempt while the remote's ref advertisement was succeeding, and then
# served twenty of twenty further attempts, so one failure is not evidence about the
# object. What supports the origin above is therefore the successes. The remote's ref
# advertisement is checked immediately before and after every attempt, an attempt is
# counted only when both checks and the fetch succeed, and all twenty-five reached
# three counted fetches that way. The uncounted method is what the first pass used,
# and it recorded four of the twenty-five below three successes -- three as two of
# three and one as one of two when the run was stopped -- which reads as a server that
# may already have dropped them. A count that cannot separate the state it measures
# from the one it does not is the defect this table exists to remove, so the method is
# stated here rather than left in the shell history of whoever ran it.
#
# `producing_host_history` (eighteen revisions) means the run happened in a history
# this repository does not contain. Seventeen are commits of
# `FlagQuantum/FlagQuantum`, whose history was re-created from a product baseline on
# 2026-07-27 rather than cloned from this one and which has been a separate line of
# development since. That repository is private, so a reader of this repository
# cannot obtain those seventeen from it, and this repository's public history
# carries look-alike commits with the same subjects whose objects, trees, and
# parents all differ. Re-pointing a pin at such a commit would present a run as
# having executed code it never executed, so each recorded revision is kept and its
# unavailability stated instead.
#
# The eighteenth, `6cfc4c3708227a4bb2c6e35c9f71e502239a2e63`, is published in no
# repository: no ref of this repository names it, and this repository and
# `FlagQuantum/FlagQuantum` both refuse to serve the object by name, so no origin
# repository can be named for it. Two cross-framework comparison artifacts record it
# as `source_revision_full`, and their `source_revision_note` explains why: the
# runtime containers ship no git binary, so each probe recorded a null commit and the
# link from payload to source is a `runner_sha256` read back inside the container.
# That digest is then the whole of the evidence tying the measurement to the code,
# and it is checkable only against a revision a reader cannot obtain.
#
# `external_dependency` (four revisions) means the revision is a commit of code this
# repository does not vendor, and `repository` names where a reader obtains it. Each
# repository below is the one the checked-in documentation already names for that
# component:
#
#   1b19383c24d9aa54637dd23557a5a20ef6d52ec5  flagos-ai/Torch-FL
#   2e00b393cf80088706b460a187aef185d3a283f4  flagos-ai/Torch-FL
#   a5142274c6730e718e56708e7cfe9165cb6f6485  FlagQuantum/FlagQuantum-Compiler-QSteed
#   46584efde731aea9eec27b5466919b76fe5f3184  BAQIS-Quantum/qsteed
#
# A `path` names an artifact, or a directory that contains the artifacts recording
# the revision, which is how `benchmarks/results/local` states one origin for the
# thirty-one files that record the same run state. Declaring an origin for a
# revision a clone obtains fails the gate, so this table cannot be used to hide a
# checkable pin behind a claim.
#
# An artifact may account for its own revisions instead, by stating
# `<field>_origin` beside any field that records one -- `source.revision_origin`
# beside `source.revision`, `base_commit_origin` beside `base_commit`. Six
# artifacts under `artifacts/` do, and appear below as well. Both records are read,
# and a revision whose two records disagree fails the gate, so this table is one of
# two records of the same fact rather than a replacement for the other.
#
# The walk reads a revision only when the artifact writes all forty characters of it,
# so a shortened citation is invisible to it however large the roots become. The same
# run therefore asks, of the roots that cite a revision as the grounds for a claim,
# whether a shortened hexadecimal run names exactly one revision this repository gives
# in full and whether the file citing it gives that revision in full too. Eighteen
# citations failed the second question -- one in the Quafu artifact, nine in three
# Jiuding records, one in a CUDA-Q comparison record, one in the Quafu
# live-execution document, one in the split real/imag contract, and five in
# `docs/roadmap/CAPABILITY_MATURITY.md` -- and each was completed
# rather than the question relaxed. The rule is what makes a citation checkable by a
# reader: a prefix is obtainable only if the reader can expand it, and a revision a
# reader cannot name is one a reader cannot fetch. The null-commit placeholder is
# exempt because it names no commit at all, and a run that prefixes no revision this
# repository records is left alone, which is why task identifiers and dates beside a
# real revision do not trip it.
#
# That rule reports only a prefix this repository can expand, so it states a limit as
# well as a check: a shortened value nothing here spells out is invisible to both
# halves of the gate. Counting every JSON string scalar of 7 to 39 hexadecimal
# characters under the three walked roots gives 969, mostly digests and task or
# container identifiers, of which 14 sit in a field named for a revision -- such as
# `base_commit`, `host_commit` or `implementation_commit` -- that nothing in the
# repository expands. Completing those needs the full revision read out of a clone
# that holds the commit, which is the declared-revision-field work rather than this
# change. The two CUDA-Q comparison records show the convention the check accepts
# instead: `source_revision` records what the run wrote and `source_revision_full`
# beside it gives the revision, so the citation is checkable without editing recorded
# output.


