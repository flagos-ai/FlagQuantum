schema = "flagquantum.evidence_revision_origins.v1"

# Every revision a checked-in evidence artifact records that a reader of this
# repository cannot obtain, with the origin that accounts for it.
#
# `tools/check_evidence_revisions.py` walks `artifacts/`, `benchmarks/results/` and
# `docs/development/evidence/`, and requires each of these revisions to be listed
# here. It asks two questions about every full-length revision a walked artifact
# records, at any depth and under any field name or in prose: whether this repository
# holds the commit, and whether a ref of this repository reaches it. A reader obtains
# a revision only when both answers are yes, because a clone and a plain fetch obtain
# exactly the commits the refs they fetch reach. A revision a walked artifact records
# in fewer than forty characters is asked a third question instead, on the field name
# rather than on the value: whether the artifact states the revision in full beside
# the value, or states the origin that accounts for it. A value that answers neither
# appears below as a reported diagnostic rather than as a silent omission, and the
# paragraph on revision-named fields near the end of this comment states the rule.
# Before this table existed, six checked-in validators asked the
# first question and each had its artifact path written into it, so an artifact no
# validator named was never asked: nineteen artifacts under `artifacts/` recorded a
# revision this repository does not contain, and thirteen of them said nothing
# about it. No validator read `benchmarks/results/` at all, which is where seventeen
# further revisions and the fifty-one artifacts recording them were found.
# `docs/development/evidence/` was found by asking which tracked JSON outside those
# two roots records a revision at all, rather than by waiting for a claim about it:
# four of the records there held five revisions between them, which are the evidence
# `docs/guides/JIUDING.md` and the release notes cite. Three more records under that
# root were reached only because this change writes their citations out in full, so
# the walk now asks about seven records rather than four and about the same five
# revisions; the paragraph on citations at the end of this comment explains why.
#
# Sixty-nine distinct revisions are recorded under the three walked roots, and two of
# them are obtainable because the `main` history contains them. The other sixty-seven
# appear below in one of three states.
#
# `unreferenced_object` (forty-five revisions) means no branch and no tag reaches
# the commit, so a clone or a plain fetch does not obtain it. This is the state a check
# for whether the object exists cannot see: the producing checkout still held the
# commit after the branch that introduced it was deleted or force-updated, so the
# pin resolved there while being unobtainable for every reader. The public remote still
# serves all forty-five by name, each confirmed by the counted measurement the method
# paragraph below states, but retaining an unreferenced object is server
# policy rather than a promise, and one of the forty-five is the head a pull request was
# opened from: `4d976abe5c415414846c857616ffce6cbadeeefc` headed #201, which merged as
# `4e52d18d`, and the head commit survives only as an object the remote retains. No ref
# of this repository reaches any of the forty-five, so a complete clone obtains none of
# them. How many of them a particular working copy happens to resolve is a reading of
# that working copy rather than a property of the repository -- a fetch of a since-deleted
# branch brings objects in and a `gc` takes them out again -- so the number is not written
# here. A check that answered the
# question from the checkout instead of from this table would be answering from
# exactly the quantity that moves, and would call a revision obtainable in the one
# working copy most likely to still hold it.
#
# Fourteen of the forty-five entered this table from a direction the first pass could
# not see, and they are the reason the check now reads a field by its name. The walk
# read a revision only when an artifact wrote all forty characters of it, and these
# fourteen were recorded in a field named for a revision but in fewer characters than
# that: three MPS environment and dispatch records and one projected-two-site record
# under `benchmarks/results/local`, the pool-workspace summary under
# `benchmarks/results/smoke/release_candidates`, and nine Jiuding records under
# `docs/development/evidence/`. Each of those artifacts now states the revision in
# full in the same artifact -- beside each run's value, or once for an aggregate whose
# runs carry it -- so the same two questions the walk asks of every other
# revision are asked of these, and the measured answer is `unreferenced_object` rather
# than the field the value sat in. A repository-scoped request for the commit object
# returns it for all fourteen, which places the object in this repository's database
# and not in a producing history outside it; the nine Jiuding values were confirmed a
# second way, by requesting the abbreviation itself and receiving the full revision
# named below. A fifteenth abbreviated value under the walked roots,
# `host_commit` in `docs/development/evidence/jiuding_workspace_credentials_20260910.json`,
# is not in this list and cannot be: the same request answers `404` for it, so no full
# revision is available to declare and the artifact states `producing_host_history`
# beside the value instead.
#
# Two more of the forty-five entered from the citation direction. The first is
# `5cfcd765a72bb8007b5c6f07e9adc4337fc63b10`, and it entered only after
# the citation that named it was written out in full: the Quafu artifact recorded it
# as `5cfcd765`, which is too short for the gate to read as a revision, so an
# unobtainable pin sat inside a walked artifact unasked. The second,
# `0e2d57204cb4fdd3f002de94367346923f7d1b33`, was published after this table was
# first written by `benchmarks/results/local/mps_two_site_dispatch_a800.json`, and
# the branch that introduced it was deleted when its pull request merged, so the
# object is exactly as unobtainable as the rest of the class: three counted `git fetch`
# attempts served it by name, and no ref of this repository reaches it.
#
# The fortieth, `aaa3a70c698dc629c37baa2719607444aa3b6381`, entered from a third
# direction, and it is the reason the walk now reads a revision written in prose. The
# walk opened `*.json` and nothing else, so a comparison record that named the
# revision its runner ran at in a sentence was read by no check at all even though it
# sat under a root the walk already covered:
# `benchmarks/results/comparison/FLAGQUANTUM_QISKIT_AER_CPU_ARM64_20260923.md` records
# this revision on line 29 and `4d976abe5c415414846c857616ffce6cbadeeefc` on lines 24
# and 30, the shorter-form sibling that this table already declared against the
# record's own JSON, and neither was asked about. A file that can cite a revision is a
# file that can record one, so the walk now reads every walked file type: a full-length
# revision in prose is asked the same two questions as one in a field. The roots are
# unchanged, so this widens what is read rather than where, and the three revisions are
# declared below against the files that record them. The request for the commit object
# answered with the object for this revision on two attempts, and no ref of this
# repository reaches it, which is `unreferenced_object` for the same reason as the rest
# of the class.
#
# `c0243cfdb7d8e1409a2fb655acada5528d2bb5a0` is recorded by
# `benchmarks/results/local/tn_layout_contraction_a800.json`. The artifact replaced
# its earlier `a28d9e1d0540a92743c9fcf6163578c57400c6d5` measurement when `#425`
# narrowed the dispatch window, so that displaced revision is no longer declared.
# Both repository-scoped commit API paths serve the replacement object by its full
# name, while the two merged source branches that once reached it have been deleted
# and no current branch or tag reaches it. It is therefore an `unreferenced_object`
# under the same rule as the preceding revisions.
#
# `184c9686e49e472a97988d931b6a7469710165ba` is recorded three times by
# `benchmarks/results/local/flagtree_tle_local_1q_a800.json`, added by `#430` when it
# merged as `3ff46f31` with the FlagTree TLE local gate provider. That pull request
# was squash-merged, so its branch is gone, no branch or tag reaches the revision, and
# it entered this table from the ordinary direction rather than from either direction
# the paragraphs above describe. Both repository-scoped commit API paths were asked
# for it by its full name and both answered with the object, which is what places it
# in `unreferenced_object` rather than in `producing_host_history`.
#
# `57f40ee6bfd1318ac98ab2d801216c958c168efe` is recorded three times by
# `benchmarks/results/local/flagtree_tle_control_transport_a800.json`, added by `#434`
# when it merged as `81e519ce` with the FlagTree TLE control transport provider. It is
# the same case as the revision above and one merge later: the pull request was
# squash-merged, so its branch is gone and no branch or tag reaches the revision, and
# the artifact arrived with the `quality` job failing on exactly this row, which is how
# it reached `main` with the gate red. Both repository-scoped commit API paths were
# asked for it by its full name, `gh api repos/flagos-ai/FlagQuantum/git/commits/<rev>`
# and the same path under `/commits/<rev>`, and both answered with the object on three
# attempts each, which places it in `unreferenced_object` rather than in a history this
# repository does not contain.
#
# `26eb2a138ad1a1f5e63bf7fd61abba74dceda4f2` is recorded three times by
# `benchmarks/results/local/flagtree_tle_transpose_1q_a800.json`, added by `#440`
# with the FlagTree TLE transpose-gate provider. The merged `main` history does not
# contain the benchmark revision, but both repository-scoped commit API paths serve
# the object by its full name. This is therefore another `unreferenced_object`, not
# evidence produced from an unavailable external history.
#
# `be1f315390fcbb017384bb0cc271f927c96f6f83` is recorded three times by
# `benchmarks/results/local/flagtree_tle_sharded_adjoint_a800.json`, added by
# `#446` with the FlagTree TLE sharded adjoint provider. It is the same case as the
# revision above and one merge later, so the declaration was missed for the same
# reason: the pull request was squash-merged, no branch or tag reaches the revision,
# and the artifact arrived with the `quality` job failing on exactly this row. Both
# repository-scoped commit API paths, `gh api repos/flagos-ai/FlagQuantum/commits/<rev>`
# and `repos/flagos-ai/FlagQuantum/git/commits/<rev>`, answered with the object by its
# full name, which places it in `unreferenced_object` rather than in a history this
# repository does not contain.

# The fetch confirmation is only worth its method, because a probe that reads a
# failed fetch as a refusal cannot tell a deleted object from a dropped connection or
# a transient error, and these probes run from a host that loses connectivity to
# `github.com` for minutes at a time. A failed attempt carries no information either
# way: revision `05154c4b89758150c3bcee958135bd62f3b1ad8c`, recorded by
# `benchmarks/results/smoke/release_candidates/mps_boundary_transport/summary.json`,
# failed one attempt while the remote's ref advertisement was succeeding, and then
# served twenty of twenty further attempts, so one failure is not evidence about the
# object. What supports the origin above is therefore the successes. The remote's ref
# advertisement is checked immediately before and after every attempt, an attempt is
# counted only when both checks and the fetch succeed, and all twenty-five revisions
# that the fetch method was applied to reached three counted fetches that way. The
# uncounted method is what the first pass used, and it recorded four of the twenty-five
# below three successes -- three as two of three and one as one of two when the run was
# stopped -- which reads as a server that may already have dropped them. A count that
# cannot separate the state it measures from the one it does not is the defect this
# table exists to remove, so the method is stated here rather than left in the shell
# history of whoever ran it.
#
# The fetch method does not answer any more, so the fifteen abbreviated values the
# field-name change reached were measured a different way. Fetching a revision by name
# from the public remote now hangs rather than failing: a bounded attempt on two of
# them ended in a timeout after ninety seconds, and a timeout is uninformative in
# either direction. The measurement used instead is a request for the commit object,
# scoped to
# the repository the revision is declared against --
# `gh api repos/flagos-ai/FlagQuantum/git/commits/<revision>`, and the same path under
# `/commits/<revision>` -- which answered with the object for all forty-five
# `unreferenced_object` revisions and with `404` for all eighteen
# `producing_host_history` revisions, two attempts each, and with `404` for the four
# `external_dependency` revisions, which are commits of other repositories and are
# declared with the `repository` that holds them. Three controls bound what a `200`
# means: the same request answered with the object for a commit on `main`, with `404`
# for a commit of `pytorch/pytorch`, and with `404` for a commit that exists only in the
# checkout that produced it. The request therefore separates the state this table
# distinguishes -- the remote still serving the object by name from a repository that
# never held it -- it is scoped to one repository rather than to GitHub's fork network,
# and any reader with repository access can repeat it, which is what the fetch method
# could not promise.
#
# `producing_host_history` (eighteen revisions) means the run happened in a history
# this repository does not contain. Seventeen are commits of
# `FlagQuantum/FlagQuantum`, whose history was re-created from a product baseline on
# 2026-07-27 rather than cloned from this one and which has been a separate line of
# development since. That repository is private, so a reader of this repository
# cannot obtain those seventeen from it, and this repository's public history
# carries look-alike commits with the same subjects whose objects, trees, and
# parents all differ. Re-pointing a pin at such a commit would present a run as
# having executed code it never executed, so each recorded revision is kept and its
# unavailability stated instead.
#
# The eighteenth, `6cfc4c3708227a4bb2c6e35c9f71e502239a2e63`, is published in no
# repository: no ref of this repository names it, and this repository and
# `FlagQuantum/FlagQuantum` both refuse to serve the object by name, so no origin
# repository can be named for it. Two cross-framework comparison artifacts record it
# as `source_revision_full`, and their `source_revision_note` explains why: the
# runtime containers ship no git binary, so each probe recorded a null commit and the
# link from payload to source is a `runner_sha256` read back inside the container.
# That digest is then the whole of the evidence tying the measurement to the code,
# and it is checkable only against a revision a reader cannot obtain.
#
# `external_dependency` (four revisions) means the revision is a commit of code this
# repository does not vendor, and `repository` names where a reader obtains it. Each
# repository below is the one the checked-in documentation already names for that
# component:
#
#   1b19383c24d9aa54637dd23557a5a20ef6d52ec5  flagos-ai/Torch-FL
#   2e00b393cf80088706b460a187aef185d3a283f4  flagos-ai/Torch-FL
#   a5142274c6730e718e56708e7cfe9165cb6f6485  FlagQuantum/FlagQuantum-Compiler-QSteed
#   46584efde731aea9eec27b5466919b76fe5f3184  BAQIS-Quantum/qsteed
#
# A `path` names an artifact, or a directory that contains the artifacts recording
# the revision, which is how `benchmarks/results/local` states one origin for the
# files under it that record one of the revisions declared for it. That number is a
# reading of this tree and is not pinned here: walking the evidence roots and asking
# which file under that directory records one of the revisions declared for it answers
# forty today, and it changes whenever an artifact recording one of those revisions is
# added. The number of declarations is left out of that sentence on purpose: it counts
# declarations rather than readings, so it moves whenever one is added, and a declaration
# edit has no other reason to touch prose two hundred lines above it. Declaring an origin
# for a revision a clone obtains fails the gate, so this table cannot be used to hide a
# checkable pin behind a claim.
#
# An artifact may account for its own revisions instead, by stating
# `<field>_origin` beside any field that records one -- `source.revision_origin`
# beside `source.revision`, `base_commit_origin` beside `base_commit`. Six
# artifacts under `artifacts/` do, and appear below as well. One more does for a
# value too short to read as a revision:
# `docs/development/evidence/jiuding_workspace_credentials_20260910.json` states
# `host_commit_origin` as `producing_host_history` beside its `host_commit`, which is
# the one abbreviated revision-named value under the walked roots whose full revision
# no measurement here produces, because the remote does not serve it. Both records are
# read, and a revision whose two records disagree fails the gate, so this table is
# one of two records of the same fact rather than a replacement for the other.
#
# The walk reads a revision only when the artifact writes all forty characters of it,
# so a shortened citation is invisible to it however large the roots -- and however
# many file types -- become. The same
# run therefore asks, of the roots that cite a revision as the grounds for a claim,
# whether a shortened hexadecimal run names exactly one revision this repository gives
# in full and whether the file citing it gives that revision in full too. Eighteen
# citations failed the second question -- one in the Quafu artifact, nine in three
# Jiuding records, one in a CUDA-Q comparison record, one in the Quafu
# live-execution document, one in the split real/imag contract, and five in
# `docs/roadmap/CAPABILITY_MATURITY.md` -- and each was completed
# rather than the question relaxed. The rule is what makes a citation checkable by a
# reader: a prefix is obtainable only if the reader can expand it, and a revision a
# reader cannot name is one a reader cannot fetch. The null-commit placeholder is
# exempt because it names no commit at all, and a run that prefixes no revision this
# repository records is left alone, which is why task identifiers and dates beside a
# real revision do not trip it.
#
# That rule reports only a prefix this repository can expand, so it states a limit as
# well as a check: a shortened value nothing here spells out is invisible to both
# halves of the gate. Counting every JSON string scalar of 7 to 39 hexadecimal
# characters under the three walked roots gives 979, mostly digests and task or
# container identifiers, of which sixteen sat in a field named for a revision --
# `base_commit`, `host_commit`, `implementation_commit`, `source_commit`,
# `source_revision`, `validation_driver_commit` -- that nothing in the repository
# expanded. One of the sixteen was already answered by the pair of CUDA-Q comparison
# records that state `source_revision_full` beside `source_revision`. Of the other
# fifteen, fourteen now write the revision out in full beside the value, which is what
# places them in this table, and the fifteenth keeps the value as the run recorded it
# and states the origin beside it because no measurement produces its full revision.
# The gate now asks about them for the first time: a value in a
# revision-named field must either have the revision stated in full beside it, as the
# two CUDA-Q comparison records do with `source_revision` and `source_revision_full`,
# or have an origin stated beside it. A field is read when its name ends in
# `revision` or in `commit` at any depth, so a field the repository has not reviewed
# is read and reported rather than ignored; the reviewed names are declared in
# `tools/check_evidence_revisions.py` for a reader. One origin accounts for every
# field holding the value it sits beside, because the origin belongs to the revision
# rather than to a repetition of it.
#
# A file that is not JSON holds no field, so it can account for a revision only by
# being named below. The two walked files of that kind that record a revision -- three
# revisions between them -- are each declared against the file itself, which is why the
# two markdown comparison records appear beside the JSON records they report on: the
# JSON records a run under a field name, and the prose reports the runner revision the
# run was produced with.


