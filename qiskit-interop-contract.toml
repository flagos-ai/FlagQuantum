schema = "flagquantum_qiskit_interop_contract_v1"
ir_version = "1.0"
maturity = "experimental"
dependency_extra = "qiskit"
qiskit_versions = ["2.0", "2.5"]
aer_versions = ["0.17"]
core_import_allowed = false

[semantics]
quantum_wire_mapping = "flat_qiskit_bit_index_equals_flagquantum_wire"
classical_bit_mapping = "flat_qiskit_bit_index_equals_flagquantum_classical_bit"
flagquantum_statevector_order = "wire_zero_most_significant"
qiskit_statevector_order = "qubit_zero_least_significant"
statevector_comparison = "reverse_qiskit_tensor_axes_before_comparison"
parameter_identity = "unique_name"
global_phase = "preserved"
loss_policy = "fail_closed_unless_allow_lossy_true"

[unsupported]
qiskit_features = [
    "control_flow_import",
    "arbitrary_parameter_expression_import",
    "nonstandard_register_layout_without_explicit_flattening",
    "multi_qubit_custom_unitary_without_basis_order_conversion",
]
flagquantum_opcodes = [
    "u1",
    "u2",
    "bit_flip",
    "phase_flip",
    "depolarizing",
    "amplitude_damping",
]
issue_codes = [
    "barrier_dropped",
    "circuit_metadata_dropped",
    "complex_gate_parameter",
    "invalid_measurement_shape",
    "measurement_requests_not_embedded",
    "multi_qubit_unitary_wire_order_unverified",
    "observables_not_embedded",
    "operation_label_dropped",
    "parameter_arity_mismatch",
    "register_layout_flattened",
    "unsupported_condition_value",
    "unsupported_control_flow",
    "unsupported_multi_bit_condition",
    "unsupported_operation",
    "unsupported_parameter_expression",
    "unsupported_parameter_value",
]

[verification]
policy = "tests/unit/test_qiskit_interop_contract.py"
integration = "tests/test_qiskit_interop.py"
conformance = "tests/test_qiskit_interop_conformance.py"
core_isolation = "tests/unit/test_qiskit_interop_boundary.py"

