schema = "flagquantum.team_ownership"
version = "1.0"

[policy]
integration_team = "integration"
protected_paths = [
    "AGENTS.md",
    "architecture.toml",
    "team-ownership.toml",
    "contracts/**",
    ".github/**",
    "pyproject.toml",
    "requirements*.txt",
    "flagquantum/__init__.py",
    "flagquantum/api.py",
    "flagquantum/core/_artifacts.py",
    "flagquantum/core/ir/**",
    "docs/architecture/LONG_HORIZON_ARCHITECTURE.md",
    "docs/architecture/decisions/**",
]
shared_paths = [
    "tests/**",
    "benchmarks/**",
    "examples/**",
    "docs/**",
]

[teams.integration]
branch = "codex/flagquantum-vnext-architecture"
worktree = "FlagQuantum-vNext"
owns = ["**"]

[teams.core]
branch = "codex/vnext-team-core"
worktree = "FlagQuantum-vNext-core"
owns = [
    "flagquantum/core/**",
    "flagquantum/circuit.py",
    "flagquantum/noise/**",
    "flagquantum/ops/**",
    "flagquantum/measurement/**",
]

[teams.compiler]
branch = "codex/vnext-team-compiler"
worktree = "FlagQuantum-vNext-compiler"
owns = [
    "flagquantum/compiler/**",
    "flagquantum/_compiler/**",
    "flagquantum/compilation/**",
    "flagquantum/drawer/**",
]

[teams.runtime]
branch = "codex/vnext-team-runtime"
worktree = "FlagQuantum-vNext-runtime"
owns = ["flagquantum/runtime/**"]

[teams.simulation]
branch = "codex/vnext-team-simulation"
worktree = "FlagQuantum-vNext-simulation"
owns = [
    "flagquantum/simulation/**",
    "flagquantum/runtime/backends/**",
]

[teams.platform]
branch = "codex/vnext-team-platform-providers"
worktree = "FlagQuantum-vNext-platform"
owns = [
    "flagquantum/providers/platform/**",
    "flagquantum/devices/**",
]

[teams.execution]
branch = "codex/vnext-team-execution-providers"
worktree = "FlagQuantum-vNext-execution"
owns = [
    "flagquantum/providers/execution/**",
    "flagquantum/deployment/**",
    "flagquantum/runtime/target_execution.py",
]

[teams.ecosystem]
branch = "codex/vnext-team-ecosystem"
worktree = "FlagQuantum-vNext-ecosystem"
owns = [
    "flagquantum/ecosystem/**",
    "flagquantum/encoding/**",
]

[teams.agent]
branch = "codex/vnext-team-agent-services"
worktree = "FlagQuantum-vNext-agent"
owns = [
    "flagquantum/agent_services/**",
    "flagquantum/agent.py",
]

[teams.docs]
branch = "codex/vnext-team-docs"
worktree = "FlagQuantum-vNext-docs"
owns = [
    "docs/roadmap/VNEXT_EXPERIENCE.md",
    "docs/development/DOCUMENTATION_STRATEGY.md",
    "docs/site/**",
]
