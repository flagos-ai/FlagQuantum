[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -p no:cacheprovider
markers =
    slow: tests that are intentionally slow; exclude from the fastest local loops with '-m "not slow"'
    gpu: tests that require a CUDA, vendor, or accelerator device and must not run in CPU-only defaults
    distributed: umbrella marker for tests involving distributed runtime, planning, or evidence semantics; use narrower distributed_* markers for CI policy
    smoke: minimal import, Circuit, expectation, and autograd confidence checks for every issue
    unit: pure-logic tests for IR, planner, audit, metadata, and helper behavior without subprocess, benchmark, GPU, or cluster requirements
    integration: local cross-module runtime/API tests that may touch multiple subsystems but remain single-process and developer-friendly
    distributed_cpu: CPU/local distributed semantics, planner, audit, fail-closed, or development-simulator coverage; not scalability evidence
    distributed_launch: tests that only execute when a launcher starts them with more than one rank on a single host; selected by a lane command that runs `torchrun`
    distributed_accel: real accelerator or multi-GPU distributed execution tests requiring explicit hardware setup
    distributed_multinode: real or scheduled multi-node distributed execution tests requiring cluster transport setup; no test carries it today, because the two-node evidence comes from a launched probe rather than from pytest
    benchmark_contract: fast tests for benchmark JSON schema, evidence fields, audit CLI contracts, and result hygiene; does not run performance benchmarks
    release_gate: fail-closed validation tests for promoted release payloads and fq.require_distributed_scalability behavior
    scalability: release-grade scalability evidence tests only; requires sharded_across_ranks plus accepted release evidence and benchmark audit
    qiskit: tests requiring the optional local Qiskit or Qiskit Aer integration
    pennylane: tests requiring the optional PennyLane QuantumScript integration
    cirq: tests requiring the optional Cirq circuit integration
    braket: tests exercising the Amazon Braket provider against fakes; no SDK or hardware submission implied
    jax: tests requiring the optional JAX integration
    triton: tests requiring the optional Triton kernel extra (cuda); a test that launches a kernel also needs a device and carries gpu
